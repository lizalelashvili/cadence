<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0A0C" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>CADENCE — Sign In</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
          colors: {
            obsidian: '#0A0A0C',
            surface: '#141418',
            surfaceHover: '#1B1B20',
            borderDark: '#232329',
            mutedText: '#8E8E93',
          },
        },
      },
    };
  </script>
</head>
<body class="bg-obsidian text-white font-sans min-h-screen flex flex-col items-center justify-center px-5 py-8 selection:bg-pink-500 selection:text-black">

  <main class="w-full max-w-sm space-y-6">
    <!-- Brand Header -->
    <div class="flex flex-col items-center text-center space-y-3">
      <div class="w-16 h-16 rounded-3xl bg-surface border border-borderDark flex items-center justify-center shadow-xl">
        <div class="grid grid-cols-2 gap-1.5 w-8 h-8">
          <span class="rounded-[4px] accent-dot" style="background-color: #FF4D94;"></span>
          <span class="rounded-[4px] bg-[#26262E]"></span>
          <span class="rounded-[4px] bg-[#26262E]"></span>
          <span class="rounded-[4px] accent-dot" style="background-color: #FF4D94;"></span>
        </div>
      </div>
      <div>
        <h1 class="text-2xl font-black tracking-tight text-white">CADENCE</h1>
        <p class="text-xs text-mutedText mt-0.5">Training Log & Progressive Overload Tracker</p>
      </div>
    </div>

    <!-- Auth Card -->
    <section class="bg-surface border border-borderDark rounded-3xl p-5 space-y-4 shadow-2xl">
      <!-- Mode Switcher -->
      <div class="grid grid-cols-2 gap-1.5 bg-obsidian border border-borderDark p-1 rounded-2xl">
        <button id="tabSignIn" type="button" onclick="setMode('signin')" class="py-2 rounded-xl text-xs font-extrabold transition text-obsidian" style="background-color: #FF4D94;">
          Sign In
        </button>
        <button id="tabSignUp" type="button" onclick="setMode('signup')" class="py-2 rounded-xl text-xs font-extrabold transition text-mutedText hover:text-white">
          Create Account
        </button>
      </div>

      <form id="authForm" onsubmit="handleSubmit(event)" class="space-y-3.5">
        <div>
          <label for="username" class="text-[11px] font-bold text-mutedText uppercase tracking-wider block mb-1.5">Username</label>
          <input id="username" type="text" required minlength="3" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="e.g. alexlifts" class="w-full bg-obsidian border border-borderDark rounded-2xl px-4 py-3 text-sm text-white focus:outline-none focus:border-[#FF4D94]" />
        </div>

        <div>
          <label for="password" class="text-[11px] font-bold text-mutedText uppercase tracking-wider block mb-1.5">Password</label>
          <input id="password" type="password" required minlength="4" autocomplete="current-password" placeholder="••••••••" class="w-full bg-obsidian border border-borderDark rounded-2xl px-4 py-3 text-sm text-white focus:outline-none focus:border-[#FF4D94]" />
        </div>

        <p id="errorBox" class="hidden text-xs font-semibold text-[#FF5E3A] bg-[#FF5E3A]/10 border border-[#FF5E3A]/30 rounded-xl px-3 py-2"></p>

        <button id="submitBtn" type="submit" class="w-full py-3.5 rounded-2xl text-xs font-extrabold text-obsidian transition active:scale-[0.98]" style="background-color: #FF4D94;">
          Sign In to Tracker
        </button>
      </form>

      <div class="pt-1 border-t border-borderDark flex items-center justify-between text-[11px]">
        <span class="text-mutedText">Want to train without an account?</span>
        <a id="guestLink" href="./index.html" class="font-bold hover:underline" style="color: #FF4D94;">Continue as Guest →</a>
      </div>
    </section>
  </main>

  <script>
    const ACCOUNT_SESSION_KEY = 'cadence_account_session_v1';
    const STORAGE_KEY = 'cadence_workout_tracker_v2';
    const ACCENT_HEX_MAP = {
      pink: '#FF4D94',
      lime: '#C6F432',
      coral: '#FF5E3A',
      lavender: '#B388FF',
      cyan: '#38BDF8'
    };
    let activeAccentHex = '#FF4D94';
    let currentMode = 'signin';

    // Sync accent color if the user previously picked one in index.html
    try {
      const savedApp = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      if (savedApp && savedApp.accent && ACCENT_HEX_MAP[savedApp.accent]) {
        activeAccentHex = ACCENT_HEX_MAP[savedApp.accent];
        document.querySelectorAll('.accent-dot').forEach(el => el.style.backgroundColor = activeAccentHex);
        const guestLink = document.getElementById('guestLink');
        if (guestLink) guestLink.style.color = activeAccentHex;
        setMode('signin');
      }
    } catch (_) {}

    // Redirect immediately if already signed in
    try {
      const existing = JSON.parse(localStorage.getItem(ACCOUNT_SESSION_KEY) || 'null');
      if (existing && existing.username) {
        window.location.replace('./index.html');
      }
    } catch (_) {}

    function setMode(mode) {
      currentMode = mode;
      const tabSignIn = document.getElementById('tabSignIn');
      const tabSignUp = document.getElementById('tabSignUp');
      const submitBtn = document.getElementById('submitBtn');
      const passInput = document.getElementById('password');
      const errBox = document.getElementById('errorBox');
      if (errBox) errBox.classList.add('hidden');

      if (mode === 'signin') {
        tabSignIn.style.backgroundColor = activeAccentHex;
        tabSignIn.className = 'py-2 rounded-xl text-xs font-extrabold transition text-obsidian';
        tabSignUp.style.backgroundColor = 'transparent';
        tabSignUp.className = 'py-2 rounded-xl text-xs font-extrabold transition text-mutedText hover:text-white';
        submitBtn.style.backgroundColor = activeAccentHex;
        submitBtn.textContent = 'Sign In to Tracker';
        passInput.autocomplete = 'current-password';
      } else {
        tabSignUp.style.backgroundColor = activeAccentHex;
        tabSignUp.className = 'py-2 rounded-xl text-xs font-extrabold transition text-obsidian';
        tabSignIn.style.backgroundColor = 'transparent';
        tabSignIn.className = 'py-2 rounded-xl text-xs font-extrabold transition text-mutedText hover:text-white';
        submitBtn.style.backgroundColor = activeAccentHex;
        submitBtn.textContent = 'Create Account & Open App';
        passInput.autocomplete = 'new-password';
      }
    }

    async function hashPassword(password, salt) {
      const raw = `${salt.toLowerCase().trim()}::${password}`;
      if (window.crypto && window.crypto.subtle) {
        const data = new TextEncoder().encode(raw);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
      }
      // Fallback deterministic hash for non-HTTPS local file previews
      let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
      for (let i = 0; i < raw.length; i++) {
        const ch = raw.charCodeAt(i);
        h1 = Math.imul(h1 ^ ch, 2654435761);
        h2 = Math.imul(h2 ^ ch, 1597334677);
      }
      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const errBox = document.getElementById('errorBox');
      errBox.classList.add('hidden');

      const rawUser = document.getElementById('username').value || '';
      const rawPass = document.getElementById('password').value || '';
      const username = rawUser.toLowerCase().trim().replace(/[^a-z0-9._-]/g, '');

      if (username.length < 3) {
        errBox.textContent = 'Username must be at least 3 characters (letters or numbers).';
        errBox.classList.remove('hidden');
        return;
      }
      if (rawPass.length < 4) {
        errBox.textContent = 'Password must be at least 4 characters.';
        errBox.classList.remove('hidden');
        return;
      }

      const passHash = await hashPassword(rawPass, username);
      localStorage.setItem(ACCOUNT_SESSION_KEY, JSON.stringify({
        username,
        displayName: rawUser.trim(),
        passHash,
        pendingVerification: true,
        pendingMode: currentMode
      }));

      window.location.href = './index.html';
    }
  </script>
</body>
</html>
