  <script>
    (function generateImmediateLoginIcons() {
      try {
        const THEME_MAP = {
          blue: '#3B82F6',
          pink: '#FF4D94',
          lime: '#C6FF00',
          coral: '#FF5E3A',
          violet: '#A855F7',
          cyan: '#22D3EE'
        };
        let hex = THEME_MAP.blue;
        try {
          const saved = JSON.parse(localStorage.getItem('cadence_workout_tracker_v1') || 'null');
          if (saved && saved.accent && THEME_MAP[saved.accent]) hex = THEME_MAP[saved.accent];
        } catch (_) {}

        function buildIconDataUrl(size) {
          const canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#0A0A0C';
          ctx.fillRect(0, 0, size, size);

          const pad = Math.round(size * 0.21);
          const gap = Math.round(size * 0.08);
          const sq = Math.round((size - pad * 2 - gap) / 2);
          const r = Math.round(sq * 0.24);

          function drawSq(x, y, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + sq - r, y);
            ctx.quadraticCurveTo(x + sq, y, x + sq, y + r);
            ctx.lineTo(x + sq, y + sq - r);
            ctx.quadraticCurveTo(x + sq, y + sq, x + sq - r, y + sq);
            ctx.lineTo(x + r, y + sq);
            ctx.quadraticCurveTo(x, y + sq, x, y + sq - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
            ctx.fill();
          }

          drawSq(pad, pad, hex);
          drawSq(pad + sq + gap, pad, '#27272E');
          drawSq(pad, pad + sq + gap, '#27272E');
          drawSq(pad + sq + gap, pad + sq + gap, hex);
          return canvas.toDataURL('image/png');
        }

        const icon180 = buildIconDataUrl(180);
        const icon512 = buildIconDataUrl(512);
        document.getElementById('appleTouchIcon').href = icon180;
        document.getElementById('appleTouchIcon512').href = icon512;
        document.getElementById('faviconIcon').href = icon180;

        let startUrl = './index.html';
        try {
          const sess = JSON.parse(localStorage.getItem('cadence_account_session_v1') || 'null');
          if (sess && sess.username && sess.passHash) {
            startUrl = `./index.html?u=${encodeURIComponent(sess.username)}&h=${encodeURIComponent(sess.passHash)}`;
          }
        } catch (_) {}

        const manifestObj = {
          name: 'CADENCE — 365-Day Workout Tracker',
          short_name: 'CADENCE',
          start_url: startUrl,
          display: 'standalone',
          background_color: '#0A0A0C',
          theme_color: '#0A0A0C',
          icons: [
            { src: icon180, sizes: '180x180', type: 'image/png' },
            { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
          ]
        };
        const blob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
        document.getElementById('appManifest').href = URL.createObjectURL(blob);
      } catch (_) {}
    })();
  </script>

        genderHtml: 'სქესი <span class="opacity-60">(BMR და კალორიებისთვის)</span>',
        female: 'ქალი',
        male: 'კაცი',

        usernamePh: 'მაგ. alex@example.com',
        password: 'პაროლი',

        submitSignUp: 'ანგარიშის შექმნა',
        connecting: 'დაკავშირება...',
        guestPrompt: 'ვარჯიში ანგარიშის გარეშე?',
        guestLink: 'სტუმრად გაგრძელება →',
        errFirst: 'გთხოვთ შეიყვანოთ სახელი.',
        errUser: 'ელ-ფოსტა ან მომხმარებელი უნდა იყოს მინიმუმ 3 სიმბოლო.',
        errPass: 'პაროლი უნდა იყოს მინიმუმ 4 სიმბოლო.',
        errExists: 'ანგარიში უკვე არსებობს — გადადით შესვლაზე.',
        errWrongPass: 'არასწორი პაროლი: ',
        errGeneric: 'შესვლა ვერ მოხერხდა. სცადეთ თავიდან.'
      }
    };

    function tl(key) {
      return (LOGIN_I18N[loginLang] || LOGIN_I18N.eng)[key] || LOGIN_I18N.eng[key] || key;
    }

    function setLoginLanguage(lang) {
      loginLang = lang === 'geo' ? 'geo' : 'eng';
      try {
        localStorage.setItem('cadence_language_v1', loginLang);
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        if (saved && typeof saved === 'object') {
          saved.language = loginLang;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
        }
      } catch (_) {}
      applyLoginTranslations();
    }

    function applyLoginTranslations() {
      const sel = document.getElementById('loginLangSelect');
      if (sel) sel.value = loginLang;
      const setTxt = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
      const setHtml = (id, val) => { const el = document.getElementById(id); if (el) el.innerHTML = val; };
      setTxt('loginSubtitle', tl('subtitle'));
      setTxt('activeProfileEyebrow', tl('activeProfile'));
      setTxt('resumeBtn', tl('openApp'));
      setTxt('tabSignIn', tl('signIn'));
      setTxt('tabSignUp', tl('createAccount'));
      setTxt('lblFirstName', tl('firstName'));
      setHtml('lblLastName', tl('surnameHtml'));
      setHtml('lblGender', tl('genderHtml'));
      setTxt('genderFemaleBtn', tl('female'));
      setTxt('genderMaleBtn', tl('male'));
      setTxt('lblUsername', tl('username'));
      setTxt('lblPassword', tl('password'));
      setTxt('guestPromptText', tl('guestPrompt'));
      setTxt('guestLink', tl('guestLink'));

      const fn = document.getElementById('loginFirstName');
      if (fn) fn.placeholder = tl('firstNamePh');
      const ln = document.getElementById('loginLastName');
      if (ln) ln.placeholder = tl('surnamePh');
      const un = document.getElementById('loginUsername');
      if (un) un.placeholder = tl('usernamePh');

      const submitBtn = document.getElementById('submitBtn');
      if (submitBtn && !submitBtn.disabled) {
        submitBtn.textContent = currentMode === 'signup' ? tl('submitSignUp') : tl('submitSignIn');
      }
    }

    function selectSignupGender(gender) {
      selectedSignupGender = gender === 'male' ? 'male' : 'female';
      const fBtn = document.getElementById('genderFemaleBtn');
      const mBtn = document.getElementById('genderMaleBtn');
      if (!fBtn || !mBtn) return;
      if (selectedSignupGender === 'female') {
        fBtn.style.backgroundColor = activeAccentHex;
        fBtn.className = 'py-2.5 rounded-2xl text-xs font-extrabold border border-borderDark text-obsidian transition';
        mBtn.style.backgroundColor = '#0A0A0C';
        mBtn.className = 'py-2.5 rounded-2xl text-xs font-extrabold bg-obsidian border border-borderDark text-mutedText hover:text-white transition';
      } else {
        mBtn.style.backgroundColor = activeAccentHex;
        mBtn.className = 'py-2.5 rounded-2xl text-xs font-extrabold border border-borderDark text-obsidian transition';
        fBtn.style.backgroundColor = '#0A0A0C';
        fBtn.className = 'py-2.5 rounded-2xl text-xs font-extrabold bg-obsidian border border-borderDark text-mutedText hover:text-white transition';
      }
    }

    function getSupabaseConfig() {
      try {
        const saved = JSON.parse(localStorage.getItem(SUPABASE_CONFIG_KEY) || 'null');
        if (saved && saved.url && saved.anonKey) {
          return { url: saved.url.trim().replace(/\/rest\/v1\/?$/, ''), anonKey: saved.anonKey.trim() };
        }
      } catch (_) {}
      if (DEFAULT_SUPABASE_URL && DEFAULT_SUPABASE_ANON_KEY) {
        return { url: DEFAULT_SUPABASE_URL.trim().replace(/\/rest\/v1\/?$/, ''), anonKey: DEFAULT_SUPABASE_ANON_KEY.trim() };
      }
      return null;
    }

    function initLoginSupabase() {
      const cfg = getSupabaseConfig();
      if (!cfg || !window.supabase || !window.supabase.createClient) {
        supabaseClient = null;
        return;
      }
      try {
        supabaseClient = window.supabase.createClient(cfg.url.trim(), cfg.anonKey.trim());
      } catch (_) {
        supabaseClient = null;
      }
    }

    function toggleSupabaseBox() {
      const box = document.getElementById('sbConfigBox');
      if (box) box.classList.toggle('hidden');
    }

    function saveLoginSupabaseConfig() {
      const url = (document.getElementById('loginSbUrl')?.value || '').trim();
      const anonKey = (document.getElementById('loginSbKey')?.value || '').trim();
      if (!url || !anonKey) return;
      localStorage.setItem(SUPABASE_CONFIG_KEY, JSON.stringify({ url, anonKey }));
      initLoginSupabase();
      toggleSupabaseBox();
    }

    try {
      const savedLang = localStorage.getItem('cadence_language_v1');
      if (savedLang === 'geo' || savedLang === 'eng') loginLang = savedLang;
      const savedState = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      if (savedState && savedState.language && !savedLang) {
        loginLang = savedState.language === 'eng' ? 'eng' : 'geo';
      }
      if (savedState && savedState.accent && THEME_HEX[savedState.accent]) {
        activeAccentHex = THEME_HEX[savedState.accent];
      }
      const existingSession = JSON.parse(localStorage.getItem(ACCOUNT_SESSION_KEY) || 'null');
      if (existingSession && existingSession.username) {
        const isExpired = existingSession.expiresAt && Date.now() >= existingSession.expiresAt;
        if (!isExpired) {
          if (!existingSession.expiresAt) {
            existingSession.expiresAt = Date.now() + SIXTY_DAYS_MS;
            localStorage.setItem(ACCOUNT_SESSION_KEY, JSON.stringify(existingSession));
          }
          const banner = document.getElementById('existingSessionBanner');
          const userLabel = document.getElementById('existingSessionUser');
          if (banner && userLabel) {
            userLabel.textContent = existingSession.firstName || existingSession.displayName || existingSession.username;
            banner.style.display = 'flex';
          }
        } else {
          localStorage.removeItem(ACCOUNT_SESSION_KEY);
        }
      }
    } catch (_) {}

    function applyAccentToLogin() {
      ['brandSq1', 'brandSq2', 'tabSignIn', 'submitBtn', 'resumeBtn'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.backgroundColor = activeAccentHex;
      });
      selectSignupGender(selectedSignupGender);
      const guest = document.getElementById('guestLink');
      if (guest) guest.style.color = activeAccentHex;
    }

    applyAccentToLogin();
    initLoginSupabase();
    applyLoginTranslations();

    function switchAuthMode(mode) {
      currentMode = mode;
      const btnIn = document.getElementById('tabSignIn');
      const btnUp = document.getElementById('tabSignUp');
      const signUpFields = document.getElementById('signUpProfileFields');
      const submitBtn = document.getElementById('submitBtn');
      const passInput = document.getElementById('loginPassword');
      const err = document.getElementById('loginError');
      if (err) err.classList.add('hidden');

      if (mode === 'signin') {
        btnIn.style.backgroundColor = activeAccentHex;
        btnIn.className = 'py-2 rounded-xl text-xs font-extrabold text-obsidian transition';
        btnUp.style.backgroundColor = 'transparent';
        btnUp.className = 'py-2 rounded-xl text-xs font-extrabold text-mutedText hover:text-white transition';
        if (signUpFields) signUpFields.classList.add('hidden');
        submitBtn.textContent = tl('submitSignIn');
        if (passInput) passInput.setAttribute('autocomplete', 'current-password');
      } else {
        btnUp.style.backgroundColor = activeAccentHex;
        btnUp.className = 'py-2 rounded-xl text-xs font-extrabold text-obsidian transition';
        btnIn.style.backgroundColor = 'transparent';
        btnIn.className = 'py-2 rounded-xl text-xs font-extrabold text-mutedText hover:text-white transition';
        if (signUpFields) signUpFields.classList.remove('hidden');
        submitBtn.textContent = tl('submitSignUp');
        if (passInput) passInput.setAttribute('autocomplete', 'new-password');
      }
    }

    async function hashPassword(password, salt) {
      const raw = `${salt.toLowerCase().trim()}::${password}`;
      if (window.crypto && window.crypto.subtle) {
        const data = new TextEncoder().encode(raw);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
      }
      let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
      for (let i = 0; i < raw.length; i++) {
        const ch = raw.charCodeAt(i);
        h1 = Math.imul(h1 ^ ch, 2654435761);
        h2 = Math.imul(h2 ^ ch, 1597334677);
      }
      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
    }

    function readUserFromIDB(userKey) {
      return new Promise((resolve) => {
        if (!window.indexedDB) return resolve(null);
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
        };
        req.onsuccess = () => {
          try {
            const tx = req.result.transaction(IDB_STORE, 'readonly');
            const getReq = tx.objectStore(IDB_STORE).get(userKey);
            getReq.onsuccess = () => resolve(getReq.result || null);
            getReq.onerror = () => resolve(null);
          } catch (_) {
            resolve(null);
          }
        };
        req.onerror = () => resolve(null);
      });
    }

    function enterAsGuest(event) {
      try {
        localStorage.setItem(GUEST_MODE_KEY, 'true');
      } catch (_) {}
      if (window.location.protocol === 'about:' || window.location.href.startsWith('blob:')) {
        event.preventDefault();
        goToMainApp();
      }
    }

    function goToMainApp() {
      if (window.location.protocol === 'about:' || window.location.href.startsWith('blob:')) {
        const err = document.getElementById('loginError');
        if (err) {
          err.style.color = activeAccentHex;
          err.style.borderColor = activeAccentHex;
          err.style.backgroundColor = 'rgba(255,255,255,0.04)';
          err.textContent = 'Session saved! Switch to the index.html tab in the editor to open the main tracker.';
          err.classList.remove('hidden');
        }
        return;
      }
      window.location.href = './index.html';
    }

    async function submitLoginForm() {
      const rawFirst = (document.getElementById('loginFirstName')?.value || '').trim();
      const rawLast = (document.getElementById('loginLastName')?.value || '').trim();
      const rawUser = document.getElementById('loginUsername')?.value || '';
      const rawPass = document.getElementById('loginPassword')?.value || '';
      const err = document.getElementById('loginError');
      const submitBtn = document.getElementById('submitBtn');
      const username = rawUser.toLowerCase().trim().replace(/[^a-z0-9@._-]/g, '');

      if (currentMode === 'signup' && rawFirst.length < 1) {
        err.textContent = tl('errFirst');
        err.classList.remove('hidden');
        return;
      }
      if (username.length < 3) {
        err.textContent = tl('errUser');
        err.classList.remove('hidden');
        return;
      }
      if (rawPass.length < 4) {
        err.textContent = tl('errPass');
        err.classList.remove('hidden');
        return;
      }

      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.textContent = tl('connecting');
      }

      try {
        const passHash = await hashPassword(rawPass, username);
        const userKey = `${ACCOUNT_VAULT_PREFIX}${username}`;

        let existingVault = null;
        try {
          existingVault = JSON.parse(localStorage.getItem(userKey) || localStorage.getItem(`${userKey}_backup`) || 'null');
        } catch (_) {}
        if (!existingVault) {
          existingVault = await readUserFromIDB(userKey);
        }

        if (supabaseClient) {
          try {
            const { data } = await supabaseClient
              .from('cadence_profiles')
              .select('username, pass_hash, state_json')
              .eq('username', username)
              .maybeSingle();
            if (data && data.state_json) {
              existingVault = data.state_json;
              if (data.pass_hash) existingVault._passHash = data.pass_hash;
            }
          } catch (_) {}
        }

        if (currentMode === 'signup' && existingVault && existingVault._passHash) {
          err.textContent = tl('errExists');
          err.classList.remove('hidden');
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.textContent = tl('submitSignUp');
          }
          return;
        }

        if (currentMode === 'signin' && existingVault && existingVault._passHash && existingVault._passHash !== passHash) {
          err.textContent = `${tl('errWrongPass')}${username}.`;
          err.classList.remove('hidden');
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.textContent = tl('submitSignIn');
          }
          return;
        }

        const resolvedFirstName = currentMode === 'signup'
          ? rawFirst
          : (existingVault?.firstName || existingVault?._displayName || username.split('@')[0]);
        const resolvedLastName = currentMode === 'signup'
          ? rawLast
          : (existingVault?.lastName || '');
        const resolvedGender = currentMode === 'signup'
          ? selectedSignupGender
          : (existingVault?.gender || 'female');

        if (currentMode === 'signup' && supabaseClient) {
          try {
            await supabaseClient.from('cadence_profiles').upsert({
              username,
              pass_hash: passHash,
              state_json: {
                accent: 'blue',
                firstName: resolvedFirstName,
                lastName: resolvedLastName,
                gender: resolvedGender,
                workouts: {},
                customExercises: [],
                _passHash: passHash,
                _displayName: resolvedFirstName,
                _updatedAt: Date.now()
              },
              updated_at: new Date().toISOString()
            }, { onConflict: 'username' });
          } catch (_) {}
        }

        localStorage.removeItem(GUEST_MODE_KEY);
        localStorage.setItem(ACCOUNT_SESSION_KEY, JSON.stringify({
          username,
          firstName: resolvedFirstName,
          lastName: resolvedLastName,
          gender: resolvedGender,
          displayName: resolvedFirstName,
          passHash,
          expiresAt: Date.now() + SIXTY_DAYS_MS,
          pendingMode: currentMode
        }));

        goToMainApp();
      } catch (e) {
        err.textContent = tl('errGeneric');
        err.classList.remove('hidden');
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.textContent = currentMode === 'signup' ? tl('submitSignUp') : tl('submitSignIn');
        }
      }
    }
  </script>
