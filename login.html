<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>CADENCE — Sign In</title>

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CADENCE" />
  <meta name="theme-color" content="#0A0A0C" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
          colors: {
            obsidian: '#0A0A0C',
            surface: '#141418',
            surfaceHover: '#1B1B20',
            borderDark: '#232329',
            coralAccent: '#FF5E3A',
            mutedText: '#8E8E93',
          },
        },
      },
    };
  </script>

  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    html, body {
      background-color: #0A0A0C;
      color: #F5F5F7;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100dvh;
    }
  </style>
</head>
<body class="bg-obsidian text-white antialiased flex items-center justify-center p-4 min-h-[100dvh]">

  <main class="w-full max-w-sm space-y-6">
    <!-- Brand Header -->
    <div class="flex flex-col items-center text-center space-y-2.5">
      <div class="w-14 h-14 rounded-2xl bg-surface border border-borderDark flex items-center justify-center shadow-2xl">
        <div class="grid grid-cols-2 gap-1.5">
          <span id="logoSq1" class="w-3.5 h-3.5 rounded-[4px]" style="background-color: #FF4D94;"></span>
          <span class="w-3.5 h-3.5 rounded-[4px] bg-borderDark"></span>
          <span class="w-3.5 h-3.5 rounded-[4px] bg-borderDark"></span>
          <span id="logoSq2" class="w-3.5 h-3.5 rounded-[4px]" style="background-color: #FF4D94;"></span>
        </div>
      </div>
      <div>
        <h1 class="text-2xl font-extrabold tracking-tight text-white">CADENCE</h1>
        <p class="text-xs text-mutedText mt-0.5">Sign in to sync your Year Grid &amp; progressive overloads</p>
      </div>
    </div>

    <!-- Auth Card -->
    <section class="bg-surface border border-borderDark rounded-3xl p-5 shadow-2xl space-y-4">
      <div class="grid grid-cols-2 gap-1.5 bg-obsidian border border-borderDark p-1 rounded-2xl">
        <button id="tabSignin" onclick="switchAuthMode('signin')" class="py-2 rounded-xl text-xs font-extrabold transition text-obsidian" style="background-color: #FF4D94;">
          Sign In
        </button>
        <button id="tabSignup" onclick="switchAuthMode('signup')" class="py-2 rounded-xl text-xs font-extrabold transition text-mutedText hover:text-white">
          Create Account
        </button>
      </div>

      <form onsubmit="event.preventDefault(); submitLoginForm();" class="space-y-3">
        <div>
          <label class="text-[11px] font-bold text-mutedText uppercase tracking-wider block mb-1">Username</label>
          <input id="usernameInput" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="e.g. alexlifts" class="w-full bg-obsidian border border-borderDark rounded-2xl px-3.5 py-3 text-sm text-white focus:outline-none" />
        </div>

        <div>
          <label class="text-[11px] font-bold text-mutedText uppercase tracking-wider block mb-1">Password</label>
          <input id="passwordInput" type="password" autocomplete="current-password" placeholder="••••••••" class="w-full bg-obsidian border border-borderDark rounded-2xl px-3.5 py-3 text-sm text-white focus:outline-none" />
        </div>

        <div id="errorBox" class="hidden text-xs font-semibold text-coralAccent bg-coralAccent/10 border border-coralAccent/30 rounded-xl px-3 py-2"></div>

        <button id="submitBtn" type="submit" class="w-full py-3.5 rounded-2xl text-xs font-extrabold text-obsidian transition active:scale-[0.98]" style="background-color: #FF4D94;">
          Sign In &amp; Open Tracker
        </button>
      </form>

      <div class="pt-2 border-t border-borderDark flex items-center justify-between text-[11px]">
        <span class="text-mutedText">Train without an account?</span>
        <a id="guestLink" href="./index.html" onclick="if(window.location.protocol==='about:'||window.location.href.startsWith('blob:')){event.preventDefault();goToMainApp();}" class="font-bold hover:underline" style="color: #FF4D94;">Continue as Guest →</a>
      </div>
    </section>
  </main>

  <script>
    const ACCOUNT_SESSION_KEY = 'cadence_account_session_v1';
    const STORAGE_KEY = 'cadence_workout_tracker_v1';
    const THEME_HEX = {
      pink: '#FF4D94',
      lime: '#C6FF00',
      coral: '#FF5E3A',
      violet: '#A855F7',
      cyan: '#22D3EE'
    };

    let currentMode = 'signin';
    let activeAccentHex = '#FF4D94';

    try {
      const savedState = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      if (savedState && savedState.accent && THEME_HEX[savedState.accent]) {
        activeAccentHex = THEME_HEX[savedState.accent];
      }
    } catch (_) {}

    function applyPageAccent() {
      ['logoSq1', 'logoSq2', 'submitBtn'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.backgroundColor = activeAccentHex;
      });
      const guest = document.getElementById('guestLink');
      if (guest) guest.style.color = activeAccentHex;
    }
    applyPageAccent();

    function goToMainApp() {
      if (window.location.protocol === 'about:' || window.location.href.startsWith('blob:')) {
        const errBox = document.getElementById('errorBox');
        if (errBox) {
          errBox.style.color = activeAccentHex;
          errBox.style.borderColor = activeAccentHex;
          errBox.style.backgroundColor = 'rgba(255, 77, 148, 0.1)';
          errBox.textContent = 'Signed in! Click the index.html tab at the top of the code editor to open the main workout tracker.';
          errBox.classList.remove('hidden');
        }
        return;
      }
      window.location.href = './index.html';
    }

    function switchAuthMode(mode) {
      currentMode = mode;
      const isSignup = mode === 'signup';
      const tabIn = document.getElementById('tabSignin');
      const tabUp = document.getElementById('tabSignup');
      const btn = document.getElementById('submitBtn');
      const err = document.getElementById('errorBox');
      err.classList.add('hidden');

      if (isSignup) {
        tabUp.style.backgroundColor = activeAccentHex;
        tabUp.className = 'py-2 rounded-xl text-xs font-extrabold transition text-obsidian';
        tabIn.style.backgroundColor = 'transparent';
        tabIn.className = 'py-2 rounded-xl text-xs font-extrabold transition text-mutedText hover:text-white';
        btn.textContent = 'Create Account & Open Tracker';
      } else {
        tabIn.style.backgroundColor = activeAccentHex;
        tabIn.className = 'py-2 rounded-xl text-xs font-extrabold transition text-obsidian';
        tabUp.style.backgroundColor = 'transparent';
        tabUp.className = 'py-2 rounded-xl text-xs font-extrabold transition text-mutedText hover:text-white';
        btn.textContent = 'Sign In & Open Tracker';
      }
    }

    async function hashPassword(password, salt) {
      const raw = `${salt.toLowerCase().trim()}::${password}`;
      if (window.crypto && window.crypto.subtle) {
        const data = new TextEncoder().encode(raw);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
      }
      let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
      for (let i = 0; i < raw.length; i++) {
        const ch = raw.charCodeAt(i);
        h1 = Math.imul(h1 ^ ch, 2654435761);
        h2 = Math.imul(h2 ^ ch, 1597334677);
      }
      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
    }

    async function submitLoginForm() {
      const rawUser = document.getElementById('usernameInput').value || '';
      const rawPass = document.getElementById('passwordInput').value || '';
      const errBox = document.getElementById('errorBox');
      const username = rawUser.toLowerCase().trim().replace(/[^a-z0-9._-]/g, '');

      if (username.length < 3) {
        errBox.textContent = 'Username must be at least 3 characters (letters or numbers).';
        errBox.classList.remove('hidden');
        return;
      }
      if (rawPass.length < 4) {
        errBox.textContent = 'Password must be at least 4 characters.';
        errBox.classList.remove('hidden');
        return;
      }

      errBox.classList.add('hidden');
      const passHash = await hashPassword(rawPass, username);

      localStorage.setItem(ACCOUNT_SESSION_KEY, JSON.stringify({
        username,
        displayName: rawUser.trim(),
        passHash,
        pendingVerification: true,
        pendingMode: currentMode
      }));

      goToMainApp();
    }
  </script>
</body>
</html>
