  <!-- Instant 60-Day Auth Gate (Redirects unauthenticated visitors to login.html before rendering) -->
  <script>
    (function enforceSixtyDaySessionGate() {
      try {
        // Skip redirect in sandboxed editor previews
        if (window.location.protocol === 'about:' || window.location.href.startsWith('blob:')) return;

        const SESSION_KEY = 'cadence_account_session_v1';
        const GUEST_KEY = 'cadence_guest_mode_v1';
        const SIXTY_DAYS_MS = 60 * 24 * 60 * 60 * 1000;

        const rawSession = localStorage.getItem(SESSION_KEY);
        if (rawSession) {
          const parsed = JSON.parse(rawSession);
          if (parsed && parsed.username) {
            // Check 60-day expiration (grant 60 days if legacy session lacked expiresAt)
            if (!parsed.expiresAt) {
              parsed.expiresAt = Date.now() + SIXTY_DAYS_MS;
              localStorage.setItem(SESSION_KEY, JSON.stringify(parsed));
            }
            if (Date.now() < parsed.expiresAt) {
              return; // Valid 2-month session — allow entry into tracker
            } else {
              // 2 months elapsed — clear expired session and require sign in
              localStorage.removeItem(SESSION_KEY);
            }
          }
        }

        // Allow explicit Guest mode if chosen on login.html
        if (localStorage.getItem(GUEST_KEY) === 'true') {
          return;
        }

        window.location.replace('./login.html');
      } catch (_) {}
    })();
  </script>

    function getSupabaseConfig() {
      try {
        const saved = JSON.parse(localStorage.getItem(SUPABASE_CONFIG_KEY) || 'null');
        if (saved && saved.url && saved.anonKey) {
          return { url: saved.url.trim(), anonKey: saved.anonKey.trim() };
        }
      } catch (_) {}
      if (DEFAULT_SUPABASE_URL && DEFAULT_SUPABASE_ANON_KEY) {
        return { url: DEFAULT_SUPABASE_URL.trim(), anonKey: DEFAULT_SUPABASE_ANON_KEY.trim() };
      }
      return null;
    }

    function initSupabaseClient() {
      const cfg = getSupabaseConfig();
      if (!cfg || !window.supabase || !window.supabase.createClient) {
        supabaseClient = null;
        cloudSyncStatus = 'offline';
        return null;
      }
      try {
        supabaseClient = window.supabase.createClient(cfg.url, cfg.anonKey, {
          auth: { persistSession: true, autoRefreshToken: true }
        });
        cloudSyncStatus = 'synced';
        return supabaseClient;
      } catch (_) {
        supabaseClient = null;
        cloudSyncStatus = 'error';
        return null;
      }
    }

      if (!supabaseClient || !username) return false;
      try {
        cloudSyncStatus = 'syncing';
        updateAccountHeaderUI();
        const { error } = await supabaseClient
          .from('cadence_profiles')
          .upsert({
            username: username.toLowerCase().trim(),
            pass_hash: passHash || snapshot._passHash || '',
            state_json: snapshot,
            updated_at: new Date().toISOString()
          }, { onConflict: 'username' });

        if (error) {
          cloudSyncStatus = 'error';
          updateAccountHeaderUI();
          return false;
        }
        cloudSyncStatus = 'synced';
        updateAccountHeaderUI();
        return true;
      } catch (_) {
        cloudSyncStatus = 'error';
        updateAccountHeaderUI();
        return false;
      }
    }

      if (!supabaseClient || !username) return null;

          .from('cadence_profiles')
          .select('username, pass_hash, state_json, updated_at')
          .eq('username', username.toLowerCase().trim())
          .maybeSingle();

        if (error || !data) return null;
        cloudSyncStatus = 'synced';
        return {
          passHash: data.pass_hash || '',
          state: data.state_json || null

    // IndexedDB Helper
    function openVaultDB() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) return reject(new Error('IndexedDB unavailable'));
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) {
            db.createObjectStore(IDB_STORE);
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function readFromIDB(key) {
      try {
        const db = await openVaultDB();
        return await new Promise((resolve) => {
          const tx = db.transaction(IDB_STORE, 'readonly');
          const req = tx.objectStore(IDB_STORE).get(key);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      } catch (_) {
        return null;
      }
    }

    function enqueueIDBWrite(entries) {
      idbWriteQueue = idbWriteQueue.then(async () => {
        try {
          const db = await openVaultDB();
          await new Promise((resolve) => {
            const tx = db.transaction(IDB_STORE, 'readwrite');
            const store = tx.objectStore(IDB_STORE);
            entries.forEach(([k, v]) => store.put(v, k));
            tx.oncomplete = () => resolve(true);
            tx.onerror = () => resolve(false);
          });
        } catch (_) {}
      });
      return idbWriteQueue;
    }

    function safeJSONParse(raw) {
      try {
        return raw ? JSON.parse(raw) : null;
      } catch (_) {
        return null;

    function mergeLoadedState(rawObj) {
      if (!rawObj || typeof rawObj !== 'object') return;
      if (rawObj.accent && THEMES[rawObj.accent]) {
        appState.accent = rawObj.accent;

      if (rawObj.workouts && typeof rawObj.workouts === 'object') {
        appState.workouts = rawObj.workouts;

      if (Array.isArray(rawObj.templates)) {
        appState.templates = rawObj.templates;
      }
      if (Array.isArray(rawObj.customExercises)) {
        appState.customExercises = rawObj.customExercises;
      }
      if (typeof rawObj._updatedAt === 'number') {
        appState._updatedAt = rawObj._updatedAt;
      }
      if (rawObj._passHash) {
        appState._passHash = rawObj._passHash;
      }
      if (rawObj._displayName) {
        appState._displayName = rawObj._displayName;
      }
    }

    async function saveState(stampTime = true) {
      if (!isStateHydrated) return;
      if (stampTime) {
        appState._updatedAt = Date.now();
      }
      const snapshot = JSON.parse(JSON.stringify(appState));
      const serialized = JSON.stringify(snapshot);
      const idbEntries = [];

      if (accountSession && accountSession.username) {
        snapshot._passHash = accountSession.passHash || snapshot._passHash || '';
        snapshot._displayName = accountSession.displayName || accountSession.username;
        const userSerialized = JSON.stringify(snapshot);
        const userKey = `${ACCOUNT_VAULT_PREFIX}${accountSession.username}`;
        const expiresAt = accountSession.expiresAt || (Date.now() + SIXTY_DAYS_MS);
        accountSession.expiresAt = expiresAt;
        try {
          localStorage.setItem(userKey, userSerialized);
          localStorage.setItem(`${userKey}_backup`, userSerialized);
          localStorage.setItem(ACCOUNT_SESSION_KEY, JSON.stringify({
            username: accountSession.username,
            displayName: accountSession.displayName || accountSession.username,
            passHash: snapshot._passHash,
            expiresAt
          }));
          localStorage.removeItem(GUEST_MODE_KEY);
        } catch (_) {}
        idbEntries.push([userKey, snapshot]);
      } else {
        try {
          localStorage.setItem(STORAGE_KEY, serialized);
          localStorage.setItem(MIRROR_STORAGE_KEY, serialized);
        } catch (_) {}
        idbEntries.push(['primary_state', snapshot]);
      }

      await enqueueIDBWrite(idbEntries);

      // Push to Supabase cloud if signed in & configured
      if (accountSession && accountSession.username && supabaseClient) {
        pushStateToSupabase(accountSession.username, snapshot._passHash, snapshot);
      }
    }

    async function loadUserVault(username) {
      const userKey = `${ACCOUNT_VAULT_PREFIX}${username}`;
      const idbUser = await readFromIDB(userKey);
      const lsUser = safeJSONParse(localStorage.getItem(userKey)) || safeJSONParse(localStorage.getItem(`${userKey}_backup`));
      let localBest = null;
      if (idbUser && lsUser) {
        localBest = (idbUser._updatedAt || 0) >= (lsUser._updatedAt || 0) ? idbUser : lsUser;
      } else {
        localBest = idbUser || lsUser || null;
      }

      // Also check Supabase cloud if connected
      if (supabaseClient) {
        const remote = await pullStateFromSupabase(username);
        if (remote && remote.state) {
          const remoteState = remote.state;
          if (remote.passHash && !remoteState._passHash) {
            remoteState._passHash = remote.passHash;
          }
          if (!localBest || (remoteState._updatedAt || 0) >= (localBest._updatedAt || 0)) {
            return remoteState;
          }
        }
      }

      return localBest;
    }

    async function hydrateStateFromVault() {
      initSupabaseClient();
      if (navigator.storage && navigator.storage.persist) {
        navigator.storage.persist().catch(() => {});
      }

      const savedSession = safeJSONParse(localStorage.getItem(ACCOUNT_SESSION_KEY));
      const idbPrimary = await readFromIDB('primary_state');
      const lsPrimary = safeJSONParse(localStorage.getItem(STORAGE_KEY)) || safeJSONParse(localStorage.getItem(MIRROR_STORAGE_KEY));
      const guestCandidate = (idbPrimary && lsPrimary)
        ? ((idbPrimary._updatedAt || 0) >= (lsPrimary._updatedAt || 0) ? idbPrimary : lsPrimary)
        : (idbPrimary || lsPrimary);

      if (savedSession && savedSession.username) {
        if (savedSession.expiresAt && Date.now() >= savedSession.expiresAt) {
          localStorage.removeItem(ACCOUNT_SESSION_KEY);
          accountSession = null;
          appState = getDefaultState();
          if (guestCandidate) mergeLoadedState(guestCandidate);
        } else {
          const uname = savedSession.username.toLowerCase().trim();
          const userVault = await loadUserVault(uname);
          const sessionExpiry = savedSession.expiresAt || (Date.now() + SIXTY_DAYS_MS);

          if (savedSession.pendingVerification) {
            if (savedSession.pendingMode === 'signup') {
              if (userVault && userVault._passHash && userVault._passHash !== savedSession.passHash) {
                localStorage.removeItem(ACCOUNT_SESSION_KEY);
                appState = getDefaultState();
                if (guestCandidate) mergeLoadedState(guestCandidate);
              } else {
                accountSession = {
                  username: uname,
                  displayName: savedSession.displayName || uname,
                  passHash: savedSession.passHash,
                  expiresAt: sessionExpiry
                };
                appState = getDefaultState();
                if (userVault) {
                  mergeLoadedState(userVault);
                } else if (guestCandidate && Object.keys(guestCandidate.workouts || {}).length > 0) {
                  mergeLoadedState(guestCandidate);
                }
                appState._passHash = savedSession.passHash;
                appState._displayName = accountSession.displayName;
              }
            } else {
              if (userVault && userVault._passHash && userVault._passHash !== savedSession.passHash) {
                localStorage.removeItem(ACCOUNT_SESSION_KEY);
                appState = getDefaultState();
                if (guestCandidate) mergeLoadedState(guestCandidate);
              } else {
                accountSession = {
                  username: uname,
                  displayName: savedSession.displayName || (userVault && userVault._displayName) || uname,
                  passHash: savedSession.passHash,
                  expiresAt: sessionExpiry
                };
                appState = getDefaultState();
                if (userVault) mergeLoadedState(userVault);
                appState._passHash = savedSession.passHash;
                appState._displayName = accountSession.displayName;
              }
            }
          } else {
            accountSession = {
              username: uname,
              displayName: savedSession.displayName || uname,
              passHash: savedSession.passHash || (userVault && userVault._passHash) || '',
              expiresAt: sessionExpiry
            };
            appState = getDefaultState();
            if (userVault) {
              mergeLoadedState(userVault);
            }
          }
        }
      } else {
        accountSession = null;
        appState = getDefaultState();
        if (guestCandidate) {
          mergeLoadedState(guestCandidate);
        }
      }

      isStateHydrated = true;
      applyTheme(appState.accent, false);
      updateAccountHeaderUI();
      await saveState(false);
    }

    function generateAppIconDataUrl(accentHex) {
      try {
        const size = 512;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#0A0A0C';
        ctx.fillRect(0, 0, size, size);

        const pad = 104, gap = 36, sq = (size - pad * 2 - gap) / 2, r = 34;
        const drawSq = (x, y, color) => {
          ctx.beginPath();
          ctx.moveTo(x + r, y);
          ctx.arcTo(x + sq, y, x + sq, y + sq, r);
          ctx.arcTo(x + sq, y + sq, x, y + sq, r);
          ctx.arcTo(x, y + sq, x, y, r);
          ctx.arcTo(x, y, x + sq, y, r);
          ctx.closePath();
          ctx.fillStyle = color;
          ctx.fill();
        };

        drawSq(pad, pad, accentHex);
        drawSq(pad + sq + gap, pad, '#232329');
        drawSq(pad, pad + sq + gap, '#232329');
        drawSq(pad + sq + gap, pad + sq + gap, accentHex);
        return canvas.toDataURL('image/png');
      } catch (_) {
        return '';
      }
    }

    async function hashPassword(password, salt) {
      const raw = `${salt.toLowerCase().trim()}::${password}`;
      if (window.crypto && window.crypto.subtle) {
        const data = new TextEncoder().encode(raw);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
      }
      let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
      for (let i = 0; i < raw.length; i++) {
        const ch = raw.charCodeAt(i);
        h1 = Math.imul(h1 ^ ch, 2654435761);
        h2 = Math.imul(h2 ^ ch, 1597334677);
      }
      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
    }

    async function handleInAppAuth(mode) {
      const rawUser = document.getElementById('modalAuthUser')?.value || '';
      const rawPass = document.getElementById('modalAuthPass')?.value || '';
      const errBox = document.getElementById('modalAuthError');
      const username = rawUser.toLowerCase().trim().replace(/[^a-z0-9._-]/g, '');

      if (username.length < 3) {
        if (errBox) {
          errBox.textContent = 'Username must be at least 3 characters.';
          errBox.classList.remove('hidden');
        }
        return;
      }
      if (rawPass.length < 4) {
        if (errBox) {
          errBox.textContent = 'Password must be at least 4 characters.';
          errBox.classList.remove('hidden');
        }
        return;
      }

      const passHash = await hashPassword(rawPass, username);
      const existingVault = await loadUserVault(username);

      if (mode === 'signup') {
        if (existingVault && existingVault._passHash) {
          if (errBox) {
            errBox.textContent = 'That username already exists — switch to Sign In.';
            errBox.classList.remove('hidden');
          }
          return;
        }
        await saveState(false);

        const guestHasData = Object.keys(appState.workouts || {}).length > 0;
        const freshState = getDefaultState();
        if (guestHasData) {
          freshState.workouts = JSON.parse(JSON.stringify(appState.workouts));
          freshState.templates = JSON.parse(JSON.stringify(appState.templates));
          freshState.customExercises = JSON.parse(JSON.stringify(appState.customExercises));
          freshState.accent = appState.accent;
        }

        accountSession = {
          username,
          displayName: rawUser.trim(),
          passHash,
          expiresAt: Date.now() + SIXTY_DAYS_MS
        };
        appState = freshState;
        appState._passHash = passHash;
        appState._displayName = rawUser.trim();
        activeDraft = null;
        await saveState(true);
        applyTheme(appState.accent, false);
        updateAccountHeaderUI();
        closeModal();
        renderHeaderStats();
        renderCurrentView();
        showToast(`Created profile @${username}`);
      } else {
        if (existingVault && existingVault._passHash && existingVault._passHash !== passHash) {
          if (errBox) {
            errBox.textContent = `Incorrect password for @${username}.`;
            errBox.classList.remove('hidden');
          }
          return;
        }

        await saveState(false);
        accountSession = {
          username,
          displayName: (existingVault && existingVault._displayName) || rawUser.trim(),
          passHash,
          expiresAt: Date.now() + SIXTY_DAYS_MS
        };
        appState = getDefaultState();
        if (existingVault) {
          mergeLoadedState(existingVault);
        }
        appState._passHash = passHash;
        appState._displayName = accountSession.displayName;
        activeDraft = null;
        await saveState(true);
        applyTheme(appState.accent, false);
        updateAccountHeaderUI();
        closeModal();
        renderHeaderStats();
        renderCurrentView();
        showToast(`Signed in as @${username}`);
      }
    }

    // =========================================================================
    // 7. ANALYTICS, STREAKS & PROGRESSIVE OVERLOAD ENGINE
    // =========================================================================
    function computeWorkoutIntensity(workout) {
      if (!workout || !Array.isArray(workout.exercises) || workout.exercises.length === 0) {
        return workout ? 1 : 0;
      }
      let totalSets = 0;
      let totalMinutes = 0;
      let hasPR = false;

      workout.exercises.forEach(ex => {
        const isCardio = isCardioExercise(ex.name);
        (ex.sets || []).forEach(s => {
          const w = parseFloat(s.weight) || 0;
          const r = extractNumericMetric(s.reps);
          if (w > 0 || r > 0) {
            totalSets++;
            if (isCardio) totalMinutes += w;
          }
          if (s.isPR) hasPR = true;
        });
      });

      if (hasPR || totalSets >= 14 || totalMinutes >= 40) return 4;
      if (totalSets >= 9 || totalMinutes >= 25) return 3;
      if (totalSets >= 4 || totalMinutes >= 10) return 2;
      return 1;
    }

    function calculateWeeklyStreak() {
      const dates = Object.keys(appState.workouts || {});
      if (dates.length === 0) return 0;

      const getMondayKey = (d) => {
        const copy = new Date(d.getFullYear(), d.getMonth(), d.getDate());
        const day = copy.getDay();
        const diff = (day === 0 ? -6 : 1) - day;
        copy.setDate(copy.getDate() + diff);
        return getLocalDateKey(copy);
      };

      const activeWeeks = new Set(dates.map(ds => getMondayKey(parseLocalDateKey(ds))));
      const today = new Date();
      let cursor = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      const thisWeekKey = getMondayKey(cursor);

      if (!activeWeeks.has(thisWeekKey)) {
        cursor.setDate(cursor.getDate() - 7);
        if (!activeWeeks.has(getMondayKey(cursor))) return 0;
      }

      let streak = 0;
      while (activeWeeks.has(getMondayKey(cursor))) {
        streak++;
        cursor.setDate(cursor.getDate() - 7);
      }
      return streak;
    }

    function getExerciseBenchmarks(exName, excludeDateStr) {
      const target = exName.toLowerCase().trim();
      const isCardio = isCardioExercise(exName);
      let maxWeight = 0;
      let maxRepsAtMaxWeight = 0;
      let bestSetVolume = 0;
      let maxSecondaryMetric = 0;
      let hasHistory = false;

      Object.entries(appState.workouts || {}).forEach(([dateStr, w]) => {
        if (excludeDateStr && dateStr === excludeDateStr) return;
        (w.exercises || []).forEach(ex => {
          if (ex.name.toLowerCase().trim() !== target) return;
          (ex.sets || []).forEach(s => {
            const wt = parseFloat(s.weight) || 0;
            const rp = extractNumericMetric(s.reps);
            if (wt <= 0 && rp <= 0) return;
            hasHistory = true;

            if (isCardio) {
              if (wt > maxWeight) maxWeight = wt;
              if (rp > maxSecondaryMetric) maxSecondaryMetric = rp;
            } else {
              const vol = wt * (rp || 1);
              if (wt > maxWeight) {
                maxWeight = wt;
                maxRepsAtMaxWeight = rp;
              } else if (wt === maxWeight && rp > maxRepsAtMaxWeight) {
                maxRepsAtMaxWeight = rp;
              }
              if (vol > bestSetVolume) bestSetVolume = vol;
            }
          });
        });
      });

      return { hasHistory, isCardio, maxWeight, maxRepsAtMaxWeight, bestSetVolume, maxSecondaryMetric };
    }

    function evaluateSetOverload(exName, weightVal, repsVal, excludeDateStr) {
      const wt = parseFloat(weightVal) || 0;
      const rp = extractNumericMetric(repsVal);
      if (wt <= 0 && rp <= 0) return { status: 'neutral', label: '' };

      const bench = getExerciseBenchmarks(exName, excludeDateStr);
      if (!bench.hasHistory) {
        return { status: 'baseline', label: 'NEW' };
      }

      if (bench.isCardio) {
        if (wt > 0 && wt > bench.maxWeight) {
          return { status: 'pr', label: 'TIME PR' };
        }
        if (rp > 0 && rp > bench.maxSecondaryMetric) {
          return { status: 'pr', label: 'LEVEL PR' };
        }
        if ((wt > 0 && wt === bench.maxWeight) || (rp > 0 && rp === bench.maxSecondaryMetric)) {
          return { status: 'matched', label: 'MATCHED' };
        }
        return { status: 'neutral', label: '' };
      }

      const vol = wt * (rp || 1);
      if (wt > bench.maxWeight) {
        return { status: 'pr', label: 'WEIGHT PR' };
      }
      if (wt === bench.maxWeight && rp > bench.maxRepsAtMaxWeight) {
        return { status: 'pr', label: 'REP PR' };
      }
      if (vol > bench.bestSetVolume) {
        return { status: 'overload', label: '+VOL' };
      }
      if (wt === bench.maxWeight && rp === bench.maxRepsAtMaxWeight) {
        return { status: 'matched', label: 'MATCHED' };
      }
      return { status: 'neutral', label: '' };
    }

    // =========================================================================
    // 8. HEADER & 7-DAY WEEKLY STRIP RENDERING

    function renderWeeklyStrip() {
      const container = document.getElementById('weeklyStrip');
      if (!container) return;

      const today = new Date();
      const todayKey = getLocalDateKey(today);
      const dayOfWeek = today.getDay(); // 0=Sun..6=Sat
      const mondayOffset = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
      const monday = new Date(today.getFullYear(), today.getMonth(), today.getDate() + mondayOffset);
      const dayLetters = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];

      let html = '';
      for (let i = 0; i < 7; i++) {
        const d = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
        const key = getLocalDateKey(d);
        const hasWorkout = Boolean(appState.workouts && appState.workouts[key]);

        html += `

            isSelected
              ? 'bg-surface border-accent text-white shadow-sm'
              : 'bg-surface/60 border-borderDark/80 text-mutedText hover:text-white'
          }">
            <span class="text-[10px] font-bold ${isToday ? 'text-accent' : ''}">${dayLetters[i]}</span>
            <span class="text-xs font-extrabold mt-0.5 ${isSelected || isToday ? 'text-white' : ''}">${d.getDate()}</span>

    }

      openDayDetailModal(dateKey);

    // =========================================================================
    // 9. 365-DAY YEAR GRID & FULL-SCREEN MATRIX ENGINE
    // =========================================================================
    function buildYearMatrixData() {
      const today = new Date();
      const todayClean = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      const todayKey = getLocalDateKey(todayClean);

      // Start 52 full weeks prior to the Monday of the current week (53 columns x 7 rows = 371 cells, last 365 active)
      const dow = todayClean.getDay();
      const mondayOffset = dow === 0 ? -6 : 1 - dow;
      const currentWeekMonday = new Date(todayClean.getFullYear(), todayClean.getMonth(), todayClean.getDate() + mondayOffset);
      const gridStart = new Date(currentWeekMonday.getFullYear(), currentWeekMonday.getMonth(), currentWeekMonday.getDate() - 52 * 7);
      const cutoff365 = new Date(todayClean.getFullYear(), todayClean.getMonth(), todayClean.getDate() - 364);

      const weeks = [];
      let rollingActiveCount = 0;

      for (let w = 0; w < 53; w++) {
        const col = [];
        for (let r = 0; r < 7; r++) {
          const cellDate = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + w * 7 + r);
          const key = getLocalDateKey(cellDate);
          const isFuture = cellDate > todayClean;
          const isBeforeWindow = cellDate < cutoff365;
          const workout = !isFuture && !isBeforeWindow ? appState.workouts[key] : null;
          const intensity = workout ? computeWorkoutIntensity(workout) : 0;

          if (workout) rollingActiveCount++;

          col.push({
            date: cellDate,
            key,
            isToday: key === todayKey,
            isFuture,
            isBeforeWindow,
            workout,
            intensity
          });
        }
        weeks.push(col);
      }

      // Compute clean non-overlapping month labels across the 53 columns
      const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      const monthLabels = new Array(53).fill('');
      let lastShownMonth = -1;
      let lastLabelCol = -4;

      for (let w = 0; w < 53; w++) {
        // Count dominant month in this week column
        const counts = {};
        weeks[w].forEach(c => {
          if (!c.isFuture && !c.isBeforeWindow) {
            const m = c.date.getMonth();
            counts[m] = (counts[m] || 0) + 1;
          }
        });
        let dominantMonth = -1;
        let maxC = 0;
        Object.entries(counts).forEach(([m, cnt]) => {
          if (cnt > maxC) {
            maxC = cnt;
            dominantMonth = Number(m);
          }
        });

        if (dominantMonth !== -1 && dominantMonth !== lastShownMonth && w - lastLabelCol >= 3) {
          monthLabels[w] = monthNames[dominantMonth];
          lastShownMonth = dominantMonth;
          lastLabelCol = w;
        }
      }

      return { weeks, monthLabels, rollingActiveCount };
    }

    function renderMatrixHTML(matrixData, isFullScreen = false) {
      const { weeks, monthLabels } = matrixData;
      const dayLabels = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
      const cellSizeClass = isFullScreen
        ? 'w-3.5 h-3.5 sm:w-4 sm:h-4 rounded-[4px]'
        : 'w-[11px] h-[11px] rounded-[3px]';
      const gapClass = isFullScreen ? 'gap-1' : 'gap-[3px]';

      let headerRow = `<div class="flex items-center ${gapClass} mb-1.5 pl-4">`;
      for (let w = 0; w < weeks.length; w++) {
        const lbl = monthLabels[w];
        headerRow += `<div class="${isFullScreen ? 'w-3.5 sm:w-4' : 'w-[11px]'} shrink-0 text-[9px] font-bold text-mutedText overflow-visible whitespace-nowrap">${lbl}</div>`;
      }
      headerRow += `</div>`;

      let rowsHtml = '';
      for (let r = 0; r < 7; r++) {
        rowsHtml += `<div class="flex items-center ${gapClass}">`;
        rowsHtml += `<span class="w-3 text-[9px] font-bold text-mutedText shrink-0 text-left">${dayLabels[r]}</span>`;
        for (let w = 0; w < weeks.length; w++) {
          const cell = weeks[w][r];
          if (cell.isFuture || cell.isBeforeWindow) {
            rowsHtml += `<div class="${cellSizeClass} shrink-0 bg-transparent"></div>`;
            continue;
          }

          let bgStyle = '';
          let extraCls = 'bg-obsidian border border-borderDark/90';
          if (cell.intensity === 1) {
            bgStyle = 'background-color: var(--grid-l1);';
            extraCls = 'border border-transparent';
          } else if (cell.intensity === 2) {
            bgStyle = 'background-color: var(--grid-l2);';
            extraCls = 'border border-transparent';
          } else if (cell.intensity === 3) {
            bgStyle = 'background-color: var(--grid-l3);';
            extraCls = 'border border-transparent';
          } else if (cell.intensity >= 4) {
            bgStyle = 'background-color: var(--grid-l4);';
            extraCls = 'border border-transparent';
          }

          if (cell.isToday) {
            extraCls += ' ring-1 ring-white';
          }

          rowsHtml += `
            <button type="button"
              onclick="openDayDetailModal('${cell.key}')"
              title="${cell.key}${cell.workout ? ' • ' + escapeHtml(cell.workout.title) : ''}"
              style="${bgStyle}"
              class="grid-cell ${cellSizeClass} shrink-0 ${extraCls}">
            </button>
          `;
        }
        rowsHtml += `</div>`;
      }

      return `
        <div class="inline-block min-w-full">
          ${headerRow}
          <div class="flex flex-col ${gapClass}">
            ${rowsHtml}
          </div>
        </div>
      `;
    }

    function renderMonthCalendarHTML() {
      const base = parseLocalDateKey(selectedDateStr);
      const year = base.getFullYear();
      const month = base.getMonth();
      const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

      const firstDay = new Date(year, month, 1);
      const startOffset = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const todayKey = getLocalDateKey(new Date());

      let cells = '';
      for (let i = 0; i < startOffset; i++) {
        cells += `<div class="h-10 rounded-xl bg-transparent"></div>`;
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const dt = new Date(year, month, d);
        const key = getLocalDateKey(dt);
        const w = appState.workouts[key];
        const intensity = w ? computeWorkoutIntensity(w) : 0;
        const isToday = key === todayKey;

        let style = '';
        let cls = 'bg-obsidian border border-borderDark text-mutedText';
        if (intensity > 0) {
          style = `background-color: var(--grid-l${Math.min(intensity, 4)});`;
          cls = 'border border-transparent text-white font-extrabold';
        }
        if (isToday) cls += ' ring-1 ring-white';

        cells += `
          <button type="button" onclick="openDayDetailModal('${key}')" style="${style}" class="h-10 rounded-xl flex flex-col items-center justify-center text-xs transition active:scale-95 ${cls}">
            <span>${d}</span>
            ${w ? `<span class="w-1 h-1 rounded-full bg-white mt-0.5"></span>` : ''}
          </button>
        `;
      }

      return `
        <div class="space-y-2.5">
          <div class="flex items-center justify-between">
            <button type="button" onclick="shiftCalendarMonth(-1)" class="w-8 h-8 rounded-xl bg-obsidian border border-borderDark text-xs font-bold text-white">‹</button>
            <span class="text-xs font-extrabold text-white">${monthNames[month]} ${year}</span>
            <button type="button" onclick="shiftCalendarMonth(1)" class="w-8 h-8 rounded-xl bg-obsidian border border-borderDark text-xs font-bold text-white">›</button>
          </div>
          <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-bold text-mutedText">
            <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
          </div>
          <div class="grid grid-cols-7 gap-1.5">
            ${cells}
          </div>
        </div>
      `;
    }

    function shiftCalendarMonth(delta) {
      const cur = parseLocalDateKey(selectedDateStr);
      const next = new Date(cur.getFullYear(), cur.getMonth() + delta, 1);
      selectedDateStr = getLocalDateKey(next);
      renderCurrentView();
    }

    function setGridMode(mode) {
      gridMode = mode;
      renderCurrentView();
    }

    function openFullScreenYearGrid() {
      const overlay = document.getElementById('fullScreenGridOverlay');
      const host = document.getElementById('fsGridHost');
      const badge = document.getElementById('fsGridActiveDays');
      if (!overlay || !host) return;

      const matrixData = buildYearMatrixData();
      if (badge) badge.textContent = `${matrixData.rollingActiveCount} / 365`;
      host.innerHTML = renderMatrixHTML(matrixData, true);
      overlay.classList.remove('hidden');
      setTimeout(() => {
        host.scrollLeft = host.scrollWidth;
      }, 20);
    }

    function closeFullScreenYearGrid() {
      const overlay = document.getElementById('fullScreenGridOverlay');
      if (overlay) overlay.classList.add('hidden');
    }

    // =========================================================================
    // 10. VIEW ROUTER & HOME VIEW
    // =========================================================================
    function switchTab(tabName) {
      currentTab = tabName;
      document.querySelectorAll('.nav-btn').forEach(btn => {
        const isActive = btn.dataset.tab === tabName;
        if (isActive) {
          btn.className = 'nav-btn flex flex-col items-center justify-center py-1.5 rounded-2xl text-accent bg-surface border border-borderDark transition';
        } else {
          btn.className = 'nav-btn flex flex-col items-center justify-center py-1.5 rounded-2xl text-mutedText hover:text-white transition';
        }
      });

      if (tabName === 'log' && !activeDraft) {
        initWorkoutDraft(selectedDateStr || getLocalDateKey(new Date()));
      }
      renderCurrentView();
    }

    function renderCurrentView() {
      const main = document.getElementById('appMain');
      if (!main) return;

      if (currentTab === 'home') {
        renderHomeView(main);
      } else if (currentTab === 'log') {
        renderLoggerView(main);
      } else if (currentTab === 'overload') {
        renderOverloadView(main);
      } else if (currentTab === 'templates') {
        renderTemplatesView(main);
      }
    }

    function renderHomeView(container) {
      const matrixData = buildYearMatrixData();
      const todayKey = getLocalDateKey(new Date());
      const todayWorkout = appState.workouts[todayKey];

      const recentDates = Object.keys(appState.workouts || {})
        .sort((a, b) => b.localeCompare(a))
        .slice(0, 4);

      const templatesHtml = (appState.templates || []).map(tpl => `
        <button type="button" onclick="startTemplateWorkout('${tpl.id}')" class="bg-surface hover:bg-surfaceHover border border-borderDark rounded-2xl p-3.5 text-left transition active:scale-[0.98] flex flex-col justify-between min-w-0">
          <div>
            <span class="inline-block text-[9px] font-extrabold uppercase tracking-wider px-2 py-0.5 rounded-md bg-accentDim text-accent mb-1.5">${escapeHtml(tpl.tag || 'ROUTINE')}</span>
            <h4 class="text-xs font-extrabold text-white truncate">${escapeHtml(tpl.name)}</h4>
          </div>
          <p class="text-[11px] text-mutedText mt-2">${tpl.exercises.length} exercise${tpl.exercises.length === 1 ? '' : 's'}</p>
        </button>
      `).join('');

      const recentHtml = recentDates.length === 0
        ? `<div class="bg-surface border border-borderDark rounded-2xl p-4 text-center text-xs text-mutedText">No workouts logged yet. Tap <span class="text-white font-bold">+ Log Today's Workout</span> to light up your first square.</div>`
        : recentDates.map(ds => {
            const w = appState.workouts[ds];
            let totalSets = 0;
            let totalVol = 0;
            let cardioMins = 0;
            (w.exercises || []).forEach(ex => {
              const cardio = isCardioExercise(ex.name);
              (ex.sets || []).forEach(s => {
                const wt = parseFloat(s.weight) || 0;
                const rp = extractNumericMetric(s.reps);
                if (wt > 0 || rp > 0) {
                  totalSets++;
                  if (cardio) cardioMins += wt;
                  else totalVol += wt * (rp || 1);
                }
              });
            });
            const summaryText = [
              `${(w.exercises || []).length} exercises`,
              totalSets ? `${totalSets} sets` : '',
              totalVol > 0 ? `${Math.round(totalVol).toLocaleString()} kg` : '',
              cardioMins > 0 ? `${cardioMins} min cardio` : ''
            ].filter(Boolean).join(' • ');

            return `
              <button type="button" onclick="openDayDetailModal('${ds}')" class="w-full bg-surface hover:bg-surfaceHover border border-borderDark rounded-2xl p-3.5 flex items-center justify-between gap-3 text-left transition active:scale-[0.99]">
                <div class="min-w-0">
                  <div class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-accent shrink-0"></span>
                    <h4 class="text-xs font-extrabold text-white truncate">${escapeHtml(w.title || 'Workout Session')}</h4>
                  </div>
                  <p class="text-[11px] text-mutedText mt-1 truncate">${ds} • ${summaryText || 'Quick Check-In'}</p>
                </div>
                <span class="text-xs font-bold text-mutedText shrink-0">›</span>
              </button>
            `;
          }).join('');

      container.innerHTML = `
        <!-- Year Grid Card -->
        <section class="bg-surface border border-borderDark rounded-3xl p-4 shadow-xl overflow-hidden min-w-0">
          <div class="flex items-center justify-between gap-2 mb-3">
            <div class="flex items-center gap-2 min-w-0">
              <h2 class="text-xs font-extrabold uppercase tracking-wider text-white">Year Grid</h2>
              <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-accentDim text-accent tabular-nums">${matrixData.rollingActiveCount} / 365</span>
            </div>

            <div class="flex items-center gap-1.5 shrink-0">
              <div class="bg-obsidian border border-borderDark p-0.5 rounded-full flex items-center text-[10px] font-bold">
                <button type="button" onclick="setGridMode('year')" class="px-2.5 py-1 rounded-full transition ${gridMode === 'year' ? 'bg-surface text-white shadow' : 'text-mutedText hover:text-white'}">365 Grid</button>
                <button type="button" onclick="setGridMode('month')" class="px-2.5 py-1 rounded-full transition ${gridMode === 'month' ? 'bg-surface text-white shadow' : 'text-mutedText hover:text-white'}">Month</button>
              </div>
              <button type="button" onclick="openFullScreenYearGrid()" title="Full-Screen Year Grid" class="w-7 h-7 rounded-full bg-obsidian border border-borderDark text-mutedText hover:text-white flex items-center justify-center transition active:scale-95">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4h4M20 8V4h-4M4 16v4h4M20 16v4h-4" />
                </svg>
              </button>
            </div>
          </div>

          <!-- Grid / Calendar Viewport -->
          <div id="yearGridScrollBox" class="w-full overflow-x-auto no-scrollbar pb-1">
            ${gridMode === 'year' ? renderMatrixHTML(matrixData, false) : renderMonthCalendarHTML()}
          </div>

          <!-- Legend -->
          <div class="mt-3 pt-2.5 border-t border-borderDark/70 flex items-center justify-between text-[10px] text-mutedText">
            <span>Tap any square to inspect or log</span>
            <div class="flex items-center gap-1">
              <span>Rest</span>
              <span class="w-2.5 h-2.5 rounded-[2px] bg-obsidian border border-borderDark"></span>
              <span class="w-2.5 h-2.5 rounded-[2px]" style="background-color: var(--grid-l1);"></span>
              <span class="w-2.5 h-2.5 rounded-[2px]" style="background-color: var(--grid-l2);"></span>
              <span class="w-2.5 h-2.5 rounded-[2px]" style="background-color: var(--grid-l3);"></span>
              <span class="w-2.5 h-2.5 rounded-[2px]" style="background-color: var(--grid-l4);"></span>
              <span>PR</span>
            </div>
          </div>

          <!-- Primary Action Row -->
          <div class="mt-3.5 grid grid-cols-2 gap-2.5">
            <button type="button" onclick="startOrResumeTodayWorkout()" class="py-3 px-3 rounded-2xl bg-accent text-obsidian font-extrabold text-xs tracking-tight shadow-lg active:scale-[0.98] transition">
              ${todayWorkout ? '✎ Edit Today’s Session' : '＋ Log Today’s Workout'}
            </button>
            <button type="button" onclick="quickCheckInToday()" class="py-3 px-3 rounded-2xl bg-obsidian border border-borderDark hover:border-white/20 text-white font-bold text-xs active:scale-[0.98] transition">
              ✓ Quick Check-In
            </button>
          </div>
        </section>

        <!-- 1-Tap Start Routine -->
        <section class="space-y-2.5">
          <div class="flex items-center justify-between px-0.5">
            <h3 class="text-[11px] font-extrabold uppercase tracking-wider text-mutedText">1-Tap Start Routine</h3>
            <button type="button" onclick="switchTab('templates')" class="text-[11px] font-bold text-accent hover:underline">Manage →</button>
          </div>
          <div class="grid grid-cols-2 gap-2.5">
            ${templatesHtml || `<div class="col-span-2 bg-surface border border-borderDark rounded-2xl p-3.5 text-xs text-mutedText text-center">No saved routines yet.</div>`}
          </div>
        </section>

        <!-- Recent Sessions -->
        <section class="space-y-2.5">
          <div class="flex items-center justify-between px-0.5">
            <h3 class="text-[11px] font-extrabold uppercase tracking-wider text-mutedText">Recent Sessions</h3>
            <button type="button" onclick="openInstallGuideModal()" class="text-[11px] font-bold text-mutedText hover:text-white">Add to Home Screen</button>
          </div>
          <div class="space-y-2">
            ${recentHtml}
          </div>
        </section>
      `;

      // Auto-scroll 365 grid to the most recent weeks on the right
      if (gridMode === 'year') {
        const scrollBox = document.getElementById('yearGridScrollBox');
        if (scrollBox) scrollBox.scrollLeft = scrollBox.scrollWidth;
      }
    }

    // =========================================================================
    // 11. WORKOUT LOGGER VIEW (STRENGTH + SMART CARDIO/MACHINE LOGGING)
    // =========================================================================
    function createEmptyExerciseEntry(name) {
      const cardio = isCardioExercise(name);
      if (cardio) {
        return {
          name,
          sets: [{ weight: '', reps: '', isPR: false }]
        };
      }
      return {
        name,
        sets: [
          { weight: '', reps: '', isPR: false },
          { weight: '', reps: '', isPR: false },
          { weight: '', reps: '', isPR: false }
        ]
      };
    }

    function initWorkoutDraft(dateStr, templateObj = null) {
      selectedDateStr = dateStr;
      const existing = appState.workouts[dateStr];
      if (existing && !templateObj) {
        activeDraft = JSON.parse(JSON.stringify(existing));
        if (!Array.isArray(activeDraft.exercises)) activeDraft.exercises = [];
        return;
      }

      if (templateObj) {
        activeDraft = {
          date: dateStr,
          title: templateObj.name,
          exercises: (templateObj.exercises || []).map(name => createEmptyExerciseEntry(name))
        };
      } else {
        activeDraft = {
          date: dateStr,
          title: 'Evening Strength Session',
          exercises: []
        };
      }
    }

    function startOrResumeTodayWorkout() {
      const todayKey = getLocalDateKey(new Date());
      initWorkoutDraft(todayKey);
      switchTab('log');
    }

    function startTemplateWorkout(templateId) {
      const tpl = (appState.templates || []).find(t => t.id === templateId);
      const targetDate = selectedDateStr || getLocalDateKey(new Date());
      initWorkoutDraft(targetDate, tpl || null);
      switchTab('log');
    }

    async function quickCheckInToday() {
      const todayKey = getLocalDateKey(new Date());
      if (!appState.workouts[todayKey]) {
        appState.workouts[todayKey] = {
          title: 'Active Check-In',
          exercises: [],
          updatedAt: Date.now()
        };
        await saveState(true);
        renderHeaderStats();
        renderCurrentView();
        showToast('Today’s square lit up!');
      } else {
        openDayDetailModal(todayKey);
      }
    }

    function renderSetStatusHtml(exName, setObj, dateStr) {
      const res = evaluateSetOverload(exName, setObj.weight, setObj.reps, dateStr);
      setObj.isPR = res.status === 'pr';
      if (!res.label) return '';
      if (res.status === 'pr') {
        return `<span class="text-[9px] font-extrabold px-1.5 py-0.5 rounded bg-accent text-obsidian tracking-tight">${res.label}</span>`;
      }
      if (res.status === 'overload') {
        return `<span class="text-[9px] font-extrabold px-1.5 py-0.5 rounded bg-accentDim text-accent tracking-tight">${res.label}</span>`;
      }
      return `<span class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-obsidian border border-borderDark text-mutedText">${res.label}</span>`;
    }

    function renderLoggerView(container) {
      if (!activeDraft) {
        initWorkoutDraft(selectedDateStr || getLocalDateKey(new Date()));
      }
      const dateStr = activeDraft.date || selectedDateStr;

      const exercisesHtml = (activeDraft.exercises || []).map((ex, exIdx) => {
        const cardio = isCardioExercise(ex.name);
        const cardioCfg = cardio ? getCardioConfig(ex.name) : null;
        const bench = getExerciseBenchmarks(ex.name, dateStr);

        let benchHint = 'First session — set your baseline';
        if (bench.hasHistory) {
          if (cardio) {
            const parts = [];
            if (bench.maxWeight > 0) parts.push(`Best: ${bench.maxWeight} min`);
            if (bench.maxSecondaryMetric > 0) parts.push(`Peak setting: ${bench.maxSecondaryMetric}`);
            benchHint = parts.join(' • ') || 'Previous cardio logged';
          } else {
            benchHint = `Best: ${bench.maxWeight} kg × ${bench.maxRepsAtMaxWeight || 1} reps`;
          }
        }

        const setsHtml = (ex.sets || []).map((s, sIdx) => {
          const badgeHtml = renderSetStatusHtml(ex.name, s, dateStr);
          const isPR = s.isPR;

          return `
            <div id="setRow_${exIdx}_${sIdx}" class="grid grid-cols-12 gap-2 items-center p-2 rounded-2xl bg-obsidian border ${isPR ? 'border-accent/60' : 'border-borderDark'}">
              <div class="col-span-2 text-center">
                <span class="text-[11px] font-extrabold text-mutedText">${cardio ? `Int ${sIdx + 1}` : `Set ${sIdx + 1}`}</span>
              </div>
              <div class="col-span-4">
                <input
                  type="number"
                  inputmode="decimal"
                  step="any"
                  placeholder="${cardio ? '20' : '0'}"
                  value="${s.weight !== '' && s.weight !== undefined ? escapeHtml(s.weight) : ''}"
                  oninput="updateDraftSet(${exIdx}, ${sIdx}, 'weight', this.value)"
                  class="w-full bg-surface border border-borderDark rounded-xl px-2.5 py-2 text-center text-base sm:text-xs font-extrabold text-white focus:outline-none focus:border-accent"
                />
              </div>
              <div class="col-span-4">
                <input
                  type="${cardio ? 'text' : 'number'}"
                  ${cardio ? '' : 'inputmode="numeric"'}
                  placeholder="${cardio ? escapeHtml(cardioCfg.placeholderSecondary) : '0'}"
                  value="${s.reps !== '' && s.reps !== undefined ? escapeHtml(s.reps) : ''}"
                  oninput="updateDraftSet(${exIdx}, ${sIdx}, 'reps', this.value)"
                  class="w-full bg-surface border border-borderDark rounded-xl px-2.5 py-2 text-center text-base sm:text-xs font-extrabold text-white focus:outline-none focus:border-accent"
                />
              </div>
              <div class="col-span-2 flex items-center justify-end gap-1">
                <span id="setBadge_${exIdx}_${sIdx}">${badgeHtml}</span>
                <button type="button" onclick="removeSetFromExercise(${exIdx}, ${sIdx})" class="w-6 h-6 rounded-lg text-mutedText hover:text-coralAccent text-xs flex items-center justify-center">✕</button>
              </div>
            </div>
          `;
        }).join('');

        return `
          <div class="bg-surface border border-borderDark rounded-3xl p-4 space-y-3">
            <div class="flex items-start justify-between gap-2">
              <div>
                <div class="flex items-center gap-2">
                  <h4 class="text-sm font-extrabold text-white">${escapeHtml(ex.name)}</h4>
                  ${cardio ? `<span class="text-[9px] font-extrabold uppercase px-2 py-0.5 rounded-full bg-accentDim text-accent">Cardio</span>` : ''}
                </div>
                <p class="text-[11px] text-mutedText mt-0.5">${benchHint}</p>
              </div>
              <button type="button" onclick="removeExerciseFromDraft(${exIdx})" class="text-xs font-bold text-mutedText hover:text-coralAccent px-2 py-1">Remove</button>
            </div>

            <!-- Column Headers -->
            <div class="grid grid-cols-12 gap-2 px-2 text-[10px] font-extrabold uppercase tracking-wider text-mutedText">
              <div class="col-span-2 text-center">${cardio ? 'Block' : 'Set'}</div>
              <div class="col-span-4 text-center">${cardio ? escapeHtml(cardioCfg.primaryLabel) : 'KG'}</div>
              <div class="col-span-4 text-center">${cardio ? escapeHtml(cardioCfg.secondaryLabel) : 'Reps'}</div>
              <div class="col-span-2 text-right">Status</div>
            </div>

            <div class="space-y-2">
              ${setsHtml}
            </div>

            <button type="button" onclick="addSetToExercise(${exIdx})" class="w-full py-2.5 rounded-2xl bg-obsidian border border-borderDark hover:border-white/20 text-xs font-bold text-white transition active:scale-[0.99]">
              ＋ Add ${cardio ? 'Interval' : 'Set'}
            </button>
          </div>
        `;
      }).join('');

      container.innerHTML = `
        <div class="space-y-3.5">
          <!-- Session Title & Date Card -->
          <div class="bg-surface border border-borderDark rounded-3xl p-4 space-y-3">
            <div class="flex items-center justify-between gap-2">
              <span class="text-[10px] font-extrabold uppercase tracking-wider text-accent">Session Log • ${dateStr}</span>
              <input type="date" value="${dateStr}" onchange="changeDraftDate(this.value)" class="bg-obsidian border border-borderDark rounded-xl px-2.5 py-1 text-xs font-bold text-white focus:outline-none" />
            </div>
            <input
              type="text"
              value="${escapeHtml(activeDraft.title || '')}"
              oninput="activeDraft.title = this.value"
              placeholder="Workout Title (e.g. Lower Body & Glutes)"
              class="w-full bg-obsidian border border-borderDark rounded-2xl px-3.5 py-2.5 text-base sm:text-sm font-extrabold text-white focus:outline-none focus:border-accent"
            />
          </div>

          <!-- Exercises List -->
          ${exercisesHtml || `
            <div class="bg-surface border border-borderDark rounded-3xl p-6 text-center space-y-2">
              <p class="text-sm font-extrabold text-white">Empty Session</p>
              <p class="text-xs text-mutedText">Add exercises or cardio machines below to start logging.</p>
            </div>
          `}

          <!-- Add Exercise Button -->
          <button type="button" onclick="openExercisePickerModal('draft')" class="w-full py-3.5 rounded-2xl bg-surface border border-dashed border-accent/60 text-accent font-extrabold text-xs tracking-tight hover:bg-accentDim transition active:scale-[0.99]">
            ＋ Add Exercise or Cardio Machine
          </button>

    // Updates set state and PR badge in-place WITHOUT rebuilding the input element (prevents mobile keyboard dismissal!)
    function updateDraftSet(exIdx, setIdx, field, value) {
      if (!activeDraft || !activeDraft.exercises[exIdx]) return;
      const setObj = activeDraft.exercises[exIdx].sets[setIdx];
      if (!setObj) return;
      setObj[field] = value;

      const exName = activeDraft.exercises[exIdx].name;
      const dateStr = activeDraft.date || selectedDateStr;
      const badgeEl = document.getElementById(`setBadge_${exIdx}_${setIdx}`);
      const rowEl = document.getElementById(`setRow_${exIdx}_${setIdx}`);
      if (badgeEl) {
        badgeEl.innerHTML = renderSetStatusHtml(exName, setObj, dateStr);
      }
      if (rowEl) {
        if (setObj.isPR) {
          rowEl.classList.remove('border-borderDark');
          rowEl.classList.add('border-accent/60');
        } else {
          rowEl.classList.remove('border-accent/60');
          rowEl.classList.add('border-borderDark');
        }
      }
    }

    function addSetToExercise(exIdx) {
      if (!activeDraft || !activeDraft.exercises[exIdx]) return;
      const sets = activeDraft.exercises[exIdx].sets;
      const prev = sets[sets.length - 1] || { weight: '', reps: '' };
      sets.push({ weight: prev.weight, reps: prev.reps, isPR: false });
      renderLoggerView(document.getElementById('appMain'));
    }

    function removeSetFromExercise(exIdx, setIdx) {
      if (!activeDraft || !activeDraft.exercises[exIdx]) return;
      activeDraft.exercises[exIdx].sets.splice(setIdx, 1);
      renderLoggerView(document.getElementById('appMain'));
    }

    function removeExerciseFromDraft(exIdx) {
      if (!activeDraft) return;
      activeDraft.exercises.splice(exIdx, 1);
      renderLoggerView(document.getElementById('appMain'));
    }

    function changeDraftDate(newDate) {
      if (!newDate || !activeDraft) return;
      activeDraft.date = newDate;
      selectedDateStr = newDate;
      renderWeeklyStrip();
      renderLoggerView(document.getElementById('appMain'));
    }

    async function saveActiveWorkout() {
      if (!activeDraft) return;
      const dateStr = activeDraft.date || selectedDateStr || getLocalDateKey(new Date());
      const cleanedExercises = (activeDraft.exercises || []).map(ex => {
        const cleanSets = (ex.sets || []).filter(s => {
          const wt = parseFloat(s.weight) || 0;
          const rp = String(s.reps || '').trim();
          return wt > 0 || rp !== '';
        });
        return {
          name: ex.name,
          sets: cleanSets.length > 0 ? cleanSets : ex.sets
        };
      });

      appState.workouts[dateStr] = {
        title: (activeDraft.title || '').trim() || 'Workout Session',
        exercises: cleanedExercises,
        updatedAt: Date.now()
      };

      activeDraft = null;
      await saveState(true);
      renderHeaderStats();
      switchTab('home');
      showToast('Workout saved to Year Grid!');
    }

    function filterExercisePickerList(query, targetMode) {
      pickerSearchQuery = query || '';
      renderPickerExerciseItems(targetMode);
    }

    function renderPickerExerciseItems(targetMode) {
      const listEl = document.getElementById('pickerExerciseList');
      if (!listEl) return;

      const q = pickerSearchQuery.toLowerCase().trim();
      const all = getAllExercises();
      const filtered = all.filter(ex => {
        const matchesQuery = !q || ex.name.toLowerCase().includes(q) || (ex.muscle || '').toLowerCase().includes(q);
        if (!matchesQuery) return false;
        if (pickerCategory === 'All') return true;
        if (pickerCategory === 'Arms') {
          return /bicep|tricep|curl|pushdown|skullcrusher/i.test(ex.muscle || ex.name);
        }
        return (ex.muscle || '').toLowerCase().includes(pickerCategory.toLowerCase());
      });

      let html = filtered.map(ex => {
        const cardio = isCardioExercise(ex.name);
        return `
          <button type="button" onclick="pickExerciseItem('${escapeHtml(ex.name).replace(/'/g, "\\'")}', '${targetMode}')" class="w-full p-3 rounded-2xl bg-obsidian hover:bg-surfaceHover border border-borderDark flex items-center justify-between text-left transition active:scale-[0.99]">

              <p class="text-xs font-extrabold text-white">${escapeHtml(ex.name)}</p>
              <p class="text-[10px] text-mutedText mt-0.5">${escapeHtml(ex.muscle || 'Custom')}${cardio ? ' • Tracks Minutes & Machine Setting' : ''}</p>
            </div>
            <span class="text-xs font-extrabold text-accent">＋ Add</span>
          </button>
        `;
      }).join('');

      if (q.length >= 2 && !all.some(e => e.name.toLowerCase() === q)) {
        const rawDisplay = pickerSearchQuery.trim();
        html = `
          <button type="button" onclick="createAndPickCustomExercise('${escapeHtml(rawDisplay).replace(/'/g, "\\'")}', '${targetMode}')" class="w-full p-3 rounded-2xl bg-accentDim border border-accent/40 flex items-center justify-between text-left mb-1.5">

              <p class="text-xs font-extrabold text-accent">＋ Create "${escapeHtml(rawDisplay)}"</p>
              <p class="text-[10px] text-mutedText mt-0.5">${isCardioExercise(rawDisplay) ? 'Detected as Cardio (Minutes + Machine Level)' : 'Save as custom strength exercise'}</p>
            </div>
            <span class="text-xs font-extrabold text-accent">Add</span>
          </button>

      listEl.innerHTML = html || `<p class="text-xs text-mutedText text-center py-6">No matching exercises found.</p>`;

    async function createAndPickCustomExercise(name, targetMode) {
      const clean = name.trim();
      if (!clean) return;
      const cardio = isCardioExercise(clean);
      appState.customExercises = appState.customExercises || [];
      if (!appState.customExercises.some(e => e.name.toLowerCase() === clean.toLowerCase())) {
        appState.customExercises.push({
          name: clean,
          muscle: cardio ? 'Cardio' : 'Custom',
          isCardio: cardio
        });
        await saveState(true);
      }
      pickExerciseItem(clean, targetMode);
    }

    function pickExerciseItem(name, targetMode) {
      if (targetMode === 'template') {
        if (!customTemplateDraftSelection.includes(name)) {
          customTemplateDraftSelection.push(name);
        }
        openCreateTemplateModal(true);
        return;
      }

      if (!activeDraft) {
        initWorkoutDraft(selectedDateStr || getLocalDateKey(new Date()));

      activeDraft.exercises.push(createEmptyExerciseEntry(name));
      closeModal();
      renderLoggerView(document.getElementById('appMain'));

    // =========================================================================
    // 13. PROGRESSIVE OVERLOAD CHARTS VIEW
    // =========================================================================
    function renderOverloadView(container) {
      const loggedNames = new Set();
      Object.values(appState.workouts || {}).forEach(w => {
        (w.exercises || []).forEach(ex => {
          if (ex && ex.name) loggedNames.add(ex.name);
        });
      });

      const exerciseList = Array.from(loggedNames);
      if (exerciseList.length === 0) {
        container.innerHTML = `
          <div class="bg-surface border border-borderDark rounded-3xl p-6 text-center space-y-2.5">
            <h2 class="text-sm font-extrabold text-white">Progressive Overload Analytics</h2>
            <p class="text-xs text-mutedText">Log at least one workout with exercises or cardio sessions to unlock strength and endurance progression curves.</p>
            <button type="button" onclick="startOrResumeTodayWorkout()" class="mt-2 px-4 py-2.5 rounded-2xl bg-accent text-obsidian text-xs font-extrabold">Log First Workout</button>
          </div>
        `;
        return;
      }

      if (!selectedOverloadExercise || !exerciseList.includes(selectedOverloadExercise)) {
        selectedOverloadExercise = exerciseList[0];
      }

      const cardio = isCardioExercise(selectedOverloadExercise);
      const sortedDates = Object.keys(appState.workouts || {}).sort((a, b) => a.localeCompare(b));
      const history = [];

      sortedDates.forEach(ds => {
        const w = appState.workouts[ds];
        let bestPrimary = 0;
        let bestSecondary = 0;
        let sessionVolume = 0;

        (w.exercises || []).forEach(ex => {
          if (ex.name.toLowerCase() !== selectedOverloadExercise.toLowerCase()) return;
          (ex.sets || []).forEach(s => {
            const wt = parseFloat(s.weight) || 0;
            const rp = extractNumericMetric(s.reps);
            if (wt > bestPrimary) bestPrimary = wt;
            if (rp > bestSecondary) bestSecondary = rp;
            if (!cardio) {
              sessionVolume += wt * (rp || 1);
            } else {
              sessionVolume += wt;
            }
          });
        });

        if (bestPrimary > 0 || bestSecondary > 0) {
          history.push({ date: ds, primary: bestPrimary, secondary: bestSecondary, volume: sessionVolume });
        }
      });

      const allTimePeak = history.reduce((m, h) => Math.max(m, h.primary), 0);
      const firstVal = history.length > 0 ? history[0].primary : 0;
      const latestVal = history.length > 0 ? history[history.length - 1].primary : 0;
      const deltaVal = +(latestVal - firstVal).toFixed(1);

      // Build clean SVG line chart
      let chartSvg = `<p class="text-xs text-mutedText text-center py-8">Log another session of ${escapeHtml(selectedOverloadExercise)} to plot your trend line.</p>`;
      if (history.length >= 1) {
        const w = 320, h = 130, padX = 20, padY = 20;
        const vals = history.map(item => item.primary || item.secondary);
        const minV = Math.min(...vals);
        const maxV = Math.max(...vals);
        const span = maxV - minV || 1;

        const pts = history.map((item, idx) => {
          const val = item.primary || item.secondary;
          const x = history.length === 1
            ? w / 2
            : padX + (idx / (history.length - 1)) * (w - padX * 2);
          const y = h - padY - ((val - minV) / span) * (h - padY * 2);
          return { x, y, val, date: item.date };
        });

        const polyline = pts.map(p => `${p.x},${p.y}`).join(' ');
        const circles = pts.map(p => `
          <circle cx="${p.x}" cy="${p.y}" r="4" fill="var(--accent)" stroke="#0A0A0C" stroke-width="2" />
        `).join('');

        chartSvg = `
          <svg viewBox="0 0 ${w} ${h}" class="w-full h-36 overflow-visible">
            <polyline fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${polyline}" />
            ${circles}
          </svg>
        `;
      }

      const unitLabel = cardio ? 'min' : 'kg';

      container.innerHTML = `
        <div class="space-y-3.5">
          <!-- Exercise Selector -->
          <div class="bg-surface border border-borderDark rounded-3xl p-4 space-y-2.5">
            <label class="text-[10px] font-extrabold uppercase tracking-wider text-mutedText block">Select Exercise / Machine</label>
            <select onchange="selectedOverloadExercise = this.value; renderCurrentView();" class="w-full bg-obsidian border border-borderDark rounded-2xl px-3.5 py-3 text-xs font-extrabold text-white focus:outline-none focus:border-accent">
              ${exerciseList.map(name => `<option value="${escapeHtml(name)}" ${name === selectedOverloadExercise ? 'selected' : ''}>${escapeHtml(name)}</option>`).join('')}
            </select>

            <div class="grid grid-cols-3 gap-2 pt-1">
              <div class="bg-obsidian border border-borderDark rounded-2xl p-3">
                <span class="text-[10px] text-mutedText font-bold block">${cardio ? 'Peak Duration' : 'All-Time PR'}</span>
                <span class="text-sm font-extrabold text-white mt-0.5 block">${allTimePeak} ${unitLabel}</span>
              </div>
              <div class="bg-obsidian border border-borderDark rounded-2xl p-3">
                <span class="text-[10px] text-mutedText font-bold block">Progression</span>
                <span class="text-sm font-extrabold ${deltaVal >= 0 ? 'text-accent' : 'text-coralAccent'} mt-0.5 block">${deltaVal >= 0 ? '+' : ''}${deltaVal} ${unitLabel}</span>
              </div>
              <div class="bg-obsidian border border-borderDark rounded-2xl p-3">
                <span class="text-[10px] text-mutedText font-bold block">Sessions</span>
                <span class="text-sm font-extrabold text-white mt-0.5 block">${history.length}</span>
              </div>
            </div>
          </div>

          <!-- Trend Chart -->
          <div class="bg-surface border border-borderDark rounded-3xl p-4">
            <div class="flex items-center justify-between mb-2">
              <h3 class="text-xs font-extrabold uppercase tracking-wider text-white">${cardio ? 'Duration Curve' : 'Top Weight Curve'}</h3>
              <span class="text-[10px] font-bold text-accent">${escapeHtml(selectedOverloadExercise)}</span>
            </div>
            ${chartSvg}
          </div>

          <!-- Session Breakdown -->
          <div class="space-y-2">
            <h3 class="text-[11px] font-extrabold uppercase tracking-wider text-mutedText px-1">Session History</h3>
            ${history.slice().reverse().map(item => `
              <div class="bg-surface border border-borderDark rounded-2xl p-3 flex items-center justify-between text-xs">
                <span class="font-bold text-white">${item.date}</span>
                <span class="font-extrabold text-accent">${item.primary} ${unitLabel}${cardio && item.secondary ? ` • Lvl ${item.secondary}` : (!cardio ? ` • Vol ${Math.round(item.volume).toLocaleString()} kg` : '')}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    async function saveNewTemplate() {
      const nameInput = document.getElementById('newTplName');
      const tagInput = document.getElementById('newTplTag');
      const errBox = document.getElementById('tplModalError');

      const name = ((nameInput ? nameInput.value : draftTemplateName) || '').trim();
      const tag = ((tagInput ? tagInput.value : draftTemplateTag) || 'ROUTINE').trim().toUpperCase();

      if (!name) {
        if (errBox) {
          errBox.textContent = 'Please enter a routine name first.';
          errBox.classList.remove('hidden');
        }
        showToast('Enter a routine name', true);
        return;
      }

      if (customTemplateDraftSelection.length === 0) {
        if (errBox) {
          errBox.textContent = 'Please add at least 1 exercise to this routine.';
          errBox.classList.remove('hidden');
        }
        showToast('Add at least 1 exercise', true);
        return;
      }

      appState.templates = appState.templates || [];
      appState.templates.push({
        id: `tpl_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
        name,
        tag: tag || 'ROUTINE',
        exercises: [...customTemplateDraftSelection]
      });

      customTemplateDraftSelection = [];
      draftTemplateName = '';
      draftTemplateTag = '';

      await saveState(true);
      closeModal();
      renderCurrentView();
      showToast(`Saved "${name}"`);
    }

    async function deleteTemplate(idx) {
      if (!Array.isArray(appState.templates)) return;
      const removed = appState.templates.splice(idx, 1);
      await saveState(true);
      renderCurrentView();
      if (removed[0]) showToast(`Deleted "${removed[0].name}"`);
    }

                ＋ Log Workout
              </button>
              <button type="button" onclick="quickLogDate('${dateStr}')" class="py-3 rounded-2xl bg-obsidian border border-borderDark text-white font-bold text-xs">
                ✓ Quick Check-In
              </button>
            </div>
          </div>
        `);
        return;
      }

      const exSummary = (workout.exercises || []).map(ex => {
        const cardio = isCardioExercise(ex.name);
        const setsStr = (ex.sets || []).map(s => {
          if (cardio) return `${s.weight || 0} min${s.reps ? ` (${escapeHtml(s.reps)})` : ''}`;
          return `${s.weight || 0}kg × ${s.reps || 0}`;
        }).join(', ');
        return `
          <div class="bg-obsidian border border-borderDark rounded-2xl p-3">
            <p class="text-xs font-extrabold text-white">${escapeHtml(ex.name)}</p>
            <p class="text-[11px] text-mutedText mt-0.5">${setsStr || 'Completed'}</p>
          </div>
        `;
      }).join('');

      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <span class="text-[10px] font-extrabold uppercase tracking-wider text-accent">${dateStr}</span>
              <h3 class="text-base font-extrabold text-white mt-0.5">${escapeHtml(workout.title || 'Workout Session')}</h3>
            </div>
            <button type="button" onclick="closeModal()" class="w-8 h-8 rounded-full bg-obsidian border border-borderDark text-mutedText hover:text-white flex items-center justify-center text-xs">✕</button>
          </div>

          <div class="space-y-2 max-h-[45dvh] overflow-y-auto">
            ${exSummary || `<p class="text-xs text-mutedText">Quick check-in completed for this day.</p>`}
          </div>

          <div class="grid grid-cols-2 gap-2.5">
            <button type="button" onclick="closeModal(); initWorkoutDraft('${dateStr}'); switchTab('log');" class="py-3 rounded-2xl bg-accent text-obsidian font-extrabold text-xs">
              ✎ Edit Session
            </button>
            <button type="button" onclick="deleteWorkoutForDate('${dateStr}')" class="py-3 rounded-2xl bg-coralAccent/15 border border-coralAccent/30 text-coralAccent font-bold text-xs">
              Delete Day
            </button>
          </div>
        </div>
      `);
    }

    async function quickLogDate(dateStr) {
      appState.workouts[dateStr] = {
        title: 'Active Check-In',
        exercises: [],
        updatedAt: Date.now()
      };
      await saveState(true);
      closeModal();
      renderHeaderStats();
      renderCurrentView();
      showToast(`Logged check-in for ${dateStr}`);
    }

    async function deleteWorkoutForDate(dateStr) {
      delete appState.workouts[dateStr];
      await saveState(true);
      closeModal();
      renderHeaderStats();
      renderCurrentView();
      showToast('Workout removed');
    }

    function openThemeModal() {
      const swatches = Object.entries(THEMES).map(([key, t]) => {
        const active = appState.accent === key;
        return `
          <button type="button" onclick="applyTheme('${key}', true); closeModal();" class="p-3 rounded-2xl bg-obsidian border ${active ? 'border-white' : 'border-borderDark'} flex items-center justify-between text-left transition">
            <div class="flex items-center gap-2.5">
              <span class="w-4 h-4 rounded-full" style="background-color: ${t.hex};"></span>
              <span class="text-xs font-extrabold text-white">${t.name}</span>
            </div>
            ${active ? `<span class="text-[10px] font-extrabold text-accent">ACTIVE</span>` : ''}
          </button>
        `;
      }).join('');

      openModal(`
        <div class="space-y-3.5">
          <div class="flex items-center justify-between">
            <h3 class="text-base font-extrabold text-white">Accent Color</h3>
            <button type="button" onclick="closeModal()" class="w-8 h-8 rounded-full bg-obsidian border border-borderDark text-mutedText hover:text-white flex items-center justify-center text-xs">✕</button>
          </div>
          <div class="space-y-2">
            ${swatches}
          </div>
        </div>
      `);
    }

    function openInstallGuideModal() {
      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <h3 class="text-base font-extrabold text-white">Add CADENCE to Home Screen</h3>
              <p class="text-[11px] text-mutedText">Launch full-screen with zero browser bars</p>
            </div>
            <button type="button" onclick="closeModal()" class="w-8 h-8 rounded-full bg-obsidian border border-borderDark text-mutedText hover:text-white flex items-center justify-center text-xs">✕</button>
          </div>

          <div class="bg-obsidian border border-borderDark rounded-2xl p-3.5 space-y-1.5 text-xs text-mutedText">
            <p class="text-accent font-extrabold">iOS (iPhone &amp; iPad — Safari)</p>
            <p>1. Open this link in <span class="text-white font-bold">Safari</span>.</p>
            <p>2. Tap the <span class="text-white font-bold">Share</span> icon at the bottom of your screen.</p>
            <p>3. Scroll down and tap <span class="text-white font-bold">Add to Home Screen</span>, then tap <span class="text-white font-bold">Add</span>.</p>
          </div>

          <div class="bg-obsidian border border-borderDark rounded-2xl p-3.5 space-y-1.5 text-xs text-mutedText">
            <p class="text-accent font-extrabold">Android (Chrome)</p>
            <p>1. Open this link in <span class="text-white font-bold">Chrome</span>.</p>
            <p>2. Tap the <span class="text-white font-bold">⋮ Menu</span> icon in the top-right corner.</p>
            <p>3. Tap <span class="text-white font-bold">Add to Home screen</span> or <span class="text-white font-bold">Install app</span>.</p>
          </div>

          <button type="button" onclick="closeModal()" class="w-full py-3 rounded-2xl bg-accent text-obsidian font-extrabold text-xs">
            Got It
          </button>
        </div>
      `);
    }

    function exportBackupJSON() {
      try {
        const blob = new Blob([JSON.stringify(appState, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `cadence-backup-${getLocalDateKey(new Date())}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('Backup file downloaded');
      } catch (_) {
        showToast('Could not export backup', true);
      }
    }

    // =========================================================================
    // 16. INITIALIZATION BOOTSTRAP
    // =========================================================================
    window.addEventListener('DOMContentLoaded', async () => {
      await hydrateStateFromVault();
      renderHeaderStats();
      renderCurrentView();

      if (window.location.hash === '#login') {
        openAccountModal('signin');
      } else if (window.location.hash === '#signup') {
        openAccountModal('signup');
      }
    });
  </script>
</body>
</html>
