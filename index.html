    function getActiveSession() {
      try {
        const params = new URLSearchParams(window.location.search);
        const uParam = params.get('u');
        const hParam = params.get('h');
        if (uParam && hParam) {
          const cleanU = uParam.toLowerCase().trim();
          const existing = JSON.parse(localStorage.getItem(ACCOUNT_SESSION_KEY) || 'null');
          if (!existing || existing.username !== cleanU) {
            const restored = {
              username: cleanU,
              firstName: cleanU.split('@')[0],
              displayName: cleanU.split('@')[0],
              passHash: hParam,
              expiresAt: Date.now() + SIXTY_DAYS_MS
            };
            localStorage.setItem(ACCOUNT_SESSION_KEY, JSON.stringify(restored));
            return restored;
          }
        }
        const sess = JSON.parse(localStorage.getItem(ACCOUNT_SESSION_KEY) || 'null');
        if (sess && sess.username) {
          if (sess.expiresAt && Date.now() >= sess.expiresAt) {
            localStorage.removeItem(ACCOUNT_SESSION_KEY);
            return null;
          }
          return sess;
        }
      } catch (_) {}
      return null;
    }

    function enforceLoginGate() {
      const sess = getActiveSession();
      const isGuest = localStorage.getItem(GUEST_MODE_KEY) === 'true';
      if (!sess && !isGuest) {
        if (window.location.protocol !== 'about:' && !window.location.href.startsWith('blob:')) {
          window.location.href = './login.html';
          return false;
        }
      }
      return true;
    }

    function getSupabaseConfig() {
      try {
        const saved = JSON.parse(localStorage.getItem(SUPABASE_CONFIG_KEY) || 'null');
        if (saved && saved.url && saved.anonKey) {
          return { url: saved.url.trim().replace(/\/rest\/v1\/?$/, ''), anonKey: saved.anonKey.trim() };
        }
      } catch (_) {}
      if (DEFAULT_SUPABASE_URL && DEFAULT_SUPABASE_ANON_KEY) {
        return { url: DEFAULT_SUPABASE_URL.trim().replace(/\/rest\/v1\/?$/, ''), anonKey: DEFAULT_SUPABASE_ANON_KEY.trim() };
      }
      return null;
    }

    function writeUserToIDB(key, val) {
      return new Promise((resolve) => {
        if (!window.indexedDB) return resolve();
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
        };
        req.onsuccess = () => {
          try {
            const tx = req.result.transaction(IDB_STORE, 'readwrite');
            tx.objectStore(IDB_STORE).put(val, key);
            tx.oncomplete = () => resolve();
            tx.onerror = () => resolve();
          } catch (_) { resolve(); }
        };
        req.onerror = () => resolve();
      });
    }

    function readUserFromIDB(key) {
      return new Promise((resolve) => {
        if (!window.indexedDB) return resolve(null);
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
        };
        req.onsuccess = () => {
          try {
            const tx = req.result.transaction(IDB_STORE, 'readonly');
            const getReq = tx.objectStore(IDB_STORE).get(key);
            getReq.onsuccess = () => resolve(getReq.result || null);
            getReq.onerror = () => resolve(null);
          } catch (_) { resolve(null); }
        };
        req.onerror = () => resolve(null);
      });
    }

    function mergeStateSnapshots(base, incoming) {
      if (!incoming || typeof incoming !== 'object') return base;
      const newer = (incoming._updatedAt || 0) >= (base._updatedAt || 0) ? incoming : base;
      const older = newer === incoming ? base : incoming;
      const merged = { ...getDefaultState(), ...older, ...newer };
      merged.workouts = { ...(older.workouts || {}), ...(newer.workouts || {}) };
      const allCalDates = new Set([...Object.keys(older.calorieLogs || {}), ...Object.keys(newer.calorieLogs || {})]);
      merged.calorieLogs = {};
      allCalDates.forEach(d => {
        const listA = Array.isArray(older.calorieLogs?.[d]) ? older.calorieLogs[d] : [];
        const listB = Array.isArray(newer.calorieLogs?.[d]) ? newer.calorieLogs[d] : [];
        const seen = new Set();
        const combined = [];
        [...listB, ...listA].forEach(item => {
          const sig = `${item.name}|${item.calories}|${item.meal}|${item.ts || ''}`;
          if (!seen.has(sig)) {
            seen.add(sig);
            combined.push(item);
          }
        });
        merged.calorieLogs[d] = combined;
      });
      const favMap = new Map();
      [...(older.favoriteFoods || []), ...(newer.favoriteFoods || [])].forEach(f => {
        if (f && f.name) favMap.set(f.name.toLowerCase(), f);
      });
      merged.favoriteFoods = Array.from(favMap.values());
      const customMap = new Map();
      [...(older.customExercises || []), ...(newer.customExercises || [])].forEach(c => {
        if (c && c.id) customMap.set(c.id, c);
      });
      merged.customExercises = Array.from(customMap.values());
      if (newer.pendingAiResult || older.pendingAiResult) {
        merged.pendingAiResult = newer.pendingAiResult || older.pendingAiResult;
      }
      return merged;
    }

    async function pushStateToSupabase(immediate = false) {
      const sess = getActiveSession();
      if (!sess || !sess.username) return;
      const cfg = getSupabaseConfig();
      if (!cfg) return;

      const badge = document.getElementById('syncBadge');
      const doUpload = async () => {
        try {
          if (badge) badge.textContent = 'Syncing...';
          const payload = {
            username: sess.username,
            pass_hash: sess.passHash || appState._passHash || '',
            state_json: appState,
            updated_at: new Date().toISOString()
          };
          if (immediate && navigator.sendBeacon) {
            const url = `${cfg.url}/rest/v1/cadence_profiles?on_conflict=username`;
            fetch(url, {
              method: 'POST',
              keepalive: true,
              headers: {
                'Content-Type': 'application/json',
                'apikey': cfg.anonKey,
                'Authorization': `Bearer ${cfg.anonKey}`,
                'Prefer': 'resolution=merge-duplicates'
              },
              body: JSON.stringify(payload)
            }).catch(() => {});
          }
          if (supabaseClient) {
            const { error } = await supabaseClient
              .from('cadence_profiles')
              .upsert(payload, { onConflict: 'username' });
            if (!error && badge) badge.textContent = 'Cloud ✓';
          }
        } catch (_) {
          if (badge) badge.textContent = 'Offline';
        }
      };

      if (immediate) {
        clearTimeout(syncTimer);
        await doUpload();
      } else {
        clearTimeout(syncTimer);
        syncTimer = setTimeout(doUpload, 450);
      }
    }

    function persistState(immediateCloud = false) {
      appState._updatedAt = Date.now();
      const sess = getActiveSession();
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
        if (sess && sess.username) {
          const userKey = `${ACCOUNT_VAULT_PREFIX}${sess.username}`;
          const serialized = JSON.stringify(appState);
          localStorage.setItem(userKey, serialized);
          localStorage.setItem(`${userKey}_backup`, serialized);
          writeUserToIDB(userKey, appState);
        }
      } catch (_) {}
      pushStateToSupabase(immediateCloud);
    }

    async function hydrateStateFromVault() {
      initSupabaseClient();
      const sess = getActiveSession();
      let candidate = getDefaultState();
      try {
        const localMain = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        if (localMain) candidate = mergeStateSnapshots(candidate, localMain);
      } catch (_) {}

      if (sess && sess.username) {
        const userKey = `${ACCOUNT_VAULT_PREFIX}${sess.username}`;
        try {
          const vaultLocal = JSON.parse(localStorage.getItem(userKey) || localStorage.getItem(`${userKey}_backup`) || 'null');
          if (vaultLocal) candidate = mergeStateSnapshots(candidate, vaultLocal);
        } catch (_) {}
        const vaultIdb = await readUserFromIDB(userKey);
        if (vaultIdb) candidate = mergeStateSnapshots(candidate, vaultIdb);

        if (supabaseClient) {
          try {
            const { data } = await supabaseClient
              .from('cadence_profiles')
              .select('state_json, pass_hash')
              .eq('username', sess.username)
              .maybeSingle();
            if (data && data.state_json) {
              candidate = mergeStateSnapshots(candidate, data.state_json);
              if (data.pass_hash) candidate._passHash = data.pass_hash;
            }
          } catch (_) {}
        }
        if (sess.firstName && (!candidate.firstName || candidate.firstName === 'Athlete')) {
          candidate.firstName = sess.firstName;
        }
        if (sess.gender) candidate.gender = sess.gender;
        if (sess.passHash) candidate._passHash = sess.passHash;
      }

      appState = candidate;
      updateHomeScreenManifest();
      persistState(false);
    }

    function updateHomeScreenManifest() {
      try {
        const hex = (THEME_MAP[appState.accent] || THEME_MAP.blue).hex;
        function buildIconDataUrl(size) {
          const canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#0A0A0C';
          ctx.fillRect(0, 0, size, size);
          const pad = Math.round(size * 0.21);
          const gap = Math.round(size * 0.08);
          const sq = Math.round((size - pad * 2 - gap) / 2);
          const r = Math.round(sq * 0.24);
          function drawSq(x, y, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + sq - r, y);
            ctx.quadraticCurveTo(x + sq, y, x + sq, y + r);
            ctx.lineTo(x + sq, y + sq - r);
            ctx.quadraticCurveTo(x + sq, y + sq, x + sq - r, y + sq);
            ctx.lineTo(x + r, y + sq);
            ctx.quadraticCurveTo(x, y + sq, x, y + sq - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
            ctx.fill();
          }
          drawSq(pad, pad, hex);
          drawSq(pad + sq + gap, pad, '#27272E');
          drawSq(pad, pad + sq + gap, '#27272E');
          drawSq(pad + sq + gap, pad + sq + gap, hex);
          return canvas.toDataURL('image/png');
        }
        const icon180 = buildIconDataUrl(180);
        const icon512 = buildIconDataUrl(512);
        const a1 = document.getElementById('appleTouchIcon');
        const a2 = document.getElementById('appleTouchIcon512');
        const f1 = document.getElementById('faviconIcon');
        if (a1) a1.href = icon180;
        if (a2) a2.href = icon512;
        if (f1) f1.href = icon180;

        let startUrl = './index.html';
        const sess = getActiveSession();
        if (sess && sess.username && sess.passHash) {
          startUrl = `./index.html?u=${encodeURIComponent(sess.username)}&h=${encodeURIComponent(sess.passHash)}`;
        }
        const manifestObj = {
          name: 'CADENCE — 365-Day Workout Tracker',
          short_name: 'CADENCE',
          start_url: startUrl,
          display: 'standalone',
          background_color: '#0A0A0C',
          theme_color: '#0A0A0C',
          icons: [
            { src: icon180, sizes: '180x180', type: 'image/png' },
            { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
          ]
        };
        const blob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
        const mEl = document.getElementById('appManifest');
        if (mEl) mEl.href = URL.createObjectURL(blob);
      } catch (_) {}
    }

    function getWeeklyStreakCount() {
      const d = new Date(TODAY_OBJ);
      const dow = d.getDay();
      const diffToMon = dow === 0 ? -6 : 1 - dow;
      const curMon = new Date(d);
      curMon.setDate(d.getDate() + diffToMon);
      let streak = 0;
      for (let w = 0; w < 52; w++) {
        const wkStart = new Date(curMon);
        wkStart.setDate(curMon.getDate() - w * 7);
        let hasWorkout = false;
        for (let i = 0; i < 7; i++) {
          const check = new Date(wkStart);
          check.setDate(wkStart.getDate() + i);
          if (isDayCompleted(toLocalDateStr(check))) {
            hasWorkout = true;
            break;
          }
        }
        if (hasWorkout) streak++;
        else if (w > 0) break;
      }
      return streak;
    }

      if (animType === 'ohp' || animType === 'lateral' || animType === 'front_raise' || animType === 'upright_row' || animType === 'shrug') {
        return baseSvg(`
          <circle cx="110" cy="34" r="8" fill="#E5E5EA"/>
          <line x1="110" y1="43" x2="110" y2="82" stroke="#F5F5F7" stroke-width="5.5" stroke-linecap="round"/>
          <line x1="104" y1="82" x2="102" y2="102" stroke="#8E8E93" stroke-width="4.5" stroke-linecap="round"/>
          <line x1="116" y1="82" x2="118" y2="102" stroke="#8E8E93" stroke-width="4.5" stroke-linecap="round"/>
          <g>
            <animateTransform attributeName="transform" type="rotate" values="0 98 48; -75 98 48; 0 98 48" dur="2.5s" repeatCount="indefinite"/>
            <line x1="98" y1="48" x2="72" y2="74" stroke="${accent}" stroke-width="4.5" stroke-linecap="round"/>
            <circle cx="70" cy="76" r="4.5" fill="${accent}"/>
          </g>
          <g>
            <animateTransform attributeName="transform" type="rotate" values="0 122 48; 75 122 48; 0 122 48" dur="2.5s" repeatCount="indefinite"/>
            <line x1="122" y1="48" x2="148" y2="74" stroke="${accent}" stroke-width="4.5" stroke-linecap="round"/>
            <circle cx="150" cy="76" r="4.5" fill="${accent}"/>
          </g>
        `);
      }

      if (animType === 'curl' || animType === 'tricep' || animType === 'overhead_tricep' || animType === 'skull_crusher') {
        return baseSvg(`
          <circle cx="104" cy="30" r="8" fill="#E5E5EA"/>
          <line x1="104" y1="39" x2="104" y2="84" stroke="#F5F5F7" stroke-width="5.5" stroke-linecap="round"/>
          <line x1="104" y1="44" x2="104" y2="66" stroke="#8E8E93" stroke-width="4.5" stroke-linecap="round"/>
          <g>
            <animateTransform attributeName="transform" type="rotate" values="0 104 66; -115 104 66; 0 104 66" dur="2.2s" repeatCount="indefinite"/>
            <line x1="104" y1="66" x2="104" y2="92" stroke="${accent}" stroke-width="4.5" stroke-linecap="round"/>
            <circle cx="104" cy="94" r="5" fill="${accent}"/>
          </g>
        `);
      }

      if (animType === 'core' || animType === 'hanging_raise' || animType === 'ab_wheel' || animType === 'twist' || animType === 'plank') {
        return baseSvg(`
          <line x1="68" y1="88" x2="152" y2="88" stroke="#8E8E93" stroke-width="5" stroke-linecap="round"/>
          <g>
            <animateTransform attributeName="transform" type="rotate" values="0 112 88; 34 112 88; 0 112 88" dur="2.4s" repeatCount="indefinite"/>
            <line x1="112" y1="88" x2="76" y2="76" stroke="${accent}" stroke-width="5.5" stroke-linecap="round"/>
            <circle cx="66" cy="72" r="7.5" fill="#E5E5EA"/>
          </g>
          <text x="150" y="22" fill="#8E8E93" font-size="8" font-weight="700">CORE BRACE</text>
        `);
      }

      if (animType === 'cardio' || animType === 'treadmill' || animType === 'bike' || animType === 'erg_row' || animType === 'jump_rope' || animType === 'swim' || animType === 'boxing') {
        return baseSvg(`
          <path d="M54 96 H82 V80 H110 V64 H138 V48 H166" fill="none" stroke="#2D2D36" stroke-width="4" stroke-linecap="round"/>
          <g>
            <animateTransform attributeName="transform" type="translate" values="0,0; 14,-8; 0,0" dur="1.4s" repeatCount="indefinite"/>
            <circle cx="102" cy="30" r="7.5" fill="#E5E5EA"/>
            <line x1="102" y1="38" x2="98" y2="62" stroke="#F5F5F7" stroke-width="5" stroke-linecap="round"/>
            <line x1="98" y1="62" x2="112" y2="78" stroke="${accent}" stroke-width="4.5" stroke-linecap="round"/>
            <line x1="98" y1="62" x2="84" y2="94" stroke="#8E8E93" stroke-width="4.5" stroke-linecap="round"/>
          </g>
        `);
      }

      // Default Squat / Leg Press / Calf / Abduction
      return baseSvg(`
        <g>
          <animateTransform attributeName="transform" type="translate" values="0,0; 0,24; 0,0" dur="2.6s" repeatCount="indefinite"/>
          <circle cx="110" cy="24" r="8" fill="#E5E5EA"/>
          <line x1="76" y1="34" x2="144" y2="34" stroke="${accent}" stroke-width="4" stroke-linecap="round"/>
          <line x1="110" y1="34" x2="104" y2="62" stroke="#F5F5F7" stroke-width="5.5" stroke-linecap="round"/>
          <line x1="104" y1="62" x2="124" y2="78" stroke="${accent}" stroke-width="5" stroke-linecap="round"/>
        </g>
        <line x1="124" y1="78" x2="114" y2="102" stroke="#F5F5F7" stroke-width="5" stroke-linecap="round"/>
        <text x="152" y="22" fill="#8E8E93" font-size="8" font-weight="700">FULL DEPTH</text>
      `);
    }

    // =========================================================
    // 8. TAB 1: YEAR / MONTHLY CONSISTENCY GRID
    // =========================================================
    function buildCurrentYearDays() {
      const year = TODAY_OBJ.getFullYear();
      const start = new Date(year, 0, 1);
      const end = new Date(year, 11, 31);
      const days = [];
      for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
        days.push({
          dateStr: toLocalDateStr(d),
          month: d.getMonth(),
          day: d.getDate(),
          dow: (d.getDay() + 6) % 7 // 0=Mon, 6=Sun
        });
      }
      return days;
    }

    function isDayCompleted(dateStr) {
      const w = appState.workouts?.[dateStr];
      if (!w) return false;
      if (w.completed) return true;
      return Array.isArray(w.entries) && w.entries.length > 0;
    }

    function toggleQuickCheckIn(dateStr = TODAY_STR) {
      if (!appState.workouts[dateStr]) {
        appState.workouts[dateStr] = { completed: true, entries: [], note: 'Quick Check-In' };
        showToast('Workout checked in for today!');
      } else {
        appState.workouts[dateStr].completed = !appState.workouts[dateStr].completed;
        showToast(appState.workouts[dateStr].completed ? 'Checked in!' : 'Check-in removed');
      }
      persistState(true);
      renderApp();
    }

    function setGridMode(mode) {
      gridMode = mode;
      renderApp();
    }

    function shiftGridMonth(delta) {
      selectedGridMonth = (selectedGridMonth + delta + 12) % 12;
      renderApp();
    }

    function openDayFromGrid(dateStr) {
      selectedWorkoutDate = dateStr;
      switchTab('workouts');
    }

    function renderCalorieSummaryWidgetHtml() {
      const logs = Array.isArray(appState.calorieLogs?.[TODAY_STR]) ? appState.calorieLogs[TODAY_STR] : [];
      const consumed = logs.reduce((s, x) => s + (Number(x.calories) || 0), 0);
      const protein = logs.reduce((s, x) => s + (Number(x.protein) || 0), 0);
      const target = Math.max(800, Number(appState.calorieTarget) || 2000);
      const pTarget = Math.max(40, Number(appState.proteinTarget) || 130);
      const left = Math.max(0, target - consumed);
      const pct = Math.min(100, Math.round((consumed / target) * 100));

      return `
        <section onclick="switchTab('calories')" class="bg-surface border border-borderDark hover:border-white/20 rounded-3xl p-4 space-y-2.5 cursor-pointer transition active:scale-[0.99]">
          <div class="flex items-baseline justify-between gap-2">
            <div>
              <span class="text-2xl font-extrabold text-white">${Math.round(consumed)}</span>
              <span class="text-xs font-bold text-mutedText"> / ${target} kcal</span>
            </div>
            <span class="text-xs font-extrabold accent-text">${Math.round(left)} kcal left</span>
          </div>
          <div class="w-full h-2 rounded-full bg-obsidian overflow-hidden">
            <div class="h-full rounded-full accent-bg transition-all duration-300" style="width: ${pct}%;"></div>
          </div>
          <div class="flex items-center justify-between text-[11px] font-semibold text-mutedText">
            <span>Protein: ${Math.round(protein)}g / ${pTarget}g</span>
            <span>${pct}% of daily target</span>
          </div>
        </section>
      `;
    }

    function renderGridView() {
      const year = TODAY_OBJ.getFullYear();
      const allDays = buildCurrentYearDays();
      const completedCount = allDays.filter(d => isDayCompleted(d.dateStr)).length;
      const todayDone = isDayCompleted(TODAY_STR);
      const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      const shortMonths = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

      let gridInnerHtml = '';
      if (gridMode === 'yearly') {
        const firstDow = allDays[0].dow;
        const padded = Array(firstDow).fill(null).concat(allDays);
        const weeks = [];
        for (let i = 0; i < padded.length; i += 7) {
          weeks.push(padded.slice(i, i + 7));
        }

        const monthLabelsHtml = weeks.map(wk => {
          const firstValid = wk.find(x => x && x.day === 1);
          return `<div class="w-3.5 text-[9px] font-bold text-mutedText">${firstValid ? shortMonths[firstValid.month] : ''}</div>`;
        }).join('');

        const colsHtml = weeks.map(wk => {
          const cells = Array.from({ length: 7 }, (_, r) => {
            const cell = wk[r];
            if (!cell) return `<div class="w-3.5 h-3.5"></div>`;
            const done = isDayCompleted(cell.dateStr);
            const isToday = cell.dateStr === TODAY_STR;
            return `<button type="button" title="${cell.dateStr}" onclick="openDayFromGrid('${cell.dateStr}')" class="w-3.5 h-3.5 rounded-[3px] transition ${done ? 'accent-bg' : 'bg-obsidian border border-borderDark/80'} ${isToday ? 'ring-1 ring-white' : ''}"></button>`;
          }).join('');
          return `<div class="flex flex-col gap-1 shrink-0">${cells}</div>`;
        }).join('');

        const weekdayMarks = ['M', 'T', 'W', 'T', 'F', 'S', 'S']
          .map(lbl => `<div class="h-3.5 flex items-center justify-center text-[9px] font-bold text-mutedText leading-none">${lbl}</div>`)
          .join('');

        gridInnerHtml = `
          <div class="flex items-start gap-2">
            <div class="flex flex-col gap-1 shrink-0 pt-[18px] pr-0.5 select-none">
              ${weekdayMarks}
            </div>
            <div class="overflow-x-auto no-scrollbar pb-1 flex-1" id="yearGridScroller">
              <div class="inline-flex flex-col gap-1 min-w-max">
                <div class="flex gap-1">${monthLabelsHtml}</div>
                <div class="flex gap-1">${colsHtml}</div>
              </div>
            </div>
          </div>
        `;
      } else {
        const mDays = allDays.filter(d => d.month === selectedGridMonth);
        const firstDow = mDays[0].dow;
        const blanks = Array(firstDow).fill('').map(() => `<div class="h-9"></div>`).join('');
        const cells = mDays.map(d => {
          const done = isDayCompleted(d.dateStr);
          const isToday = d.dateStr === TODAY_STR;
          return `
            <button type="button" onclick="openDayFromGrid('${d.dateStr}')"
              class="h-9 rounded-xl text-xs font-extrabold flex items-center justify-center transition ${done ? 'accent-bg' : 'bg-obsidian border border-borderDark text-white hover:border-white/30'} ${isToday ? 'ring-2 ring-white' : ''}">
              ${d.day}
            </button>`;
        }).join('');

        gridInnerHtml = `
          <div class="space-y-2.5">
            <div class="flex items-center justify-between">
              <button type="button" onclick="shiftGridMonth(-1)" class="px-3 py-1.5 rounded-xl bg-obsidian border border-borderDark text-xs font-bold text-white">‹</button>
              <span class="text-xs font-extrabold text-white">${monthNames[selectedGridMonth]} ${year}</span>
              <button type="button" onclick="shiftGridMonth(1)" class="px-3 py-1.5 rounded-xl bg-obsidian border border-borderDark text-xs font-bold text-white">›</button>
            </div>
            <div class="grid grid-cols-7 gap-1.5 text-center text-[10px] font-bold text-mutedText">
              <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
            </div>
            <div class="grid grid-cols-7 gap-1.5">
              ${blanks}${cells}
            </div>
          </div>
        `;
      }

      const routinesHtml = (appState.routines || []).map(r => `
        <button type="button" onclick="startRoutineToday('${r.id}')" class="w-full flex items-center justify-between bg-obsidian border border-borderDark hover:border-white/20 rounded-2xl p-3.5 text-left transition active:scale-[0.99]">
          <div class="min-w-0 pr-2">
            <p class="text-xs font-extrabold text-white truncate">${escapeHtml(r.name)}</p>
            <p class="text-[11px] text-mutedText mt-0.5">${(r.exercises || []).length} exercises</p>
          </div>
          <span class="px-3 py-1.5 rounded-xl text-[11px] font-extrabold accent-bg shrink-0">Start →</span>
        </button>
      `).join('');

      return `
        ${renderCalorieSummaryWidgetHtml()}

        <section class="bg-surface border border-borderDark rounded-3xl p-4 space-y-3.5 shadow-xl">
          <div class="flex items-center justify-between gap-2">
            <div>
              <p class="text-[10px] font-extrabold uppercase tracking-wider accent-text">Jan 1 – Dec 31 • ${year}</p>
              <h2 class="text-base font-extrabold text-white mt-0.5">${completedCount} / ${allDays.length} Days Active</h2>
            </div>
            <div class="flex items-center gap-1.5">
              <div class="bg-obsidian border border-borderDark p-0.5 rounded-xl flex text-[10px] font-extrabold">
                <button type="button" onclick="setGridMode('yearly')" class="px-2.5 py-1 rounded-lg transition ${gridMode === 'yearly' ? 'accent-bg' : 'text-mutedText'}">Yearly</button>
                <button type="button" onclick="setGridMode('monthly')" class="px-2.5 py-1 rounded-lg transition ${gridMode === 'monthly' ? 'accent-bg' : 'text-mutedText'}">Monthly</button>
              </div>
              <button type="button" onclick="openFullScreenGrid()" title="Full Screen Grid" class="w-8 h-8 rounded-xl bg-obsidian border border-borderDark flex items-center justify-center text-xs font-bold text-white">⤢</button>
            </div>
          </div>

          ${gridInnerHtml}

          <div class="pt-1 grid grid-cols-2 gap-2">
            <button type="button" onclick="toggleQuickCheckIn('${TODAY_STR}')"
              class="py-2.5 px-3 rounded-2xl text-xs font-extrabold transition active:scale-[0.98] ${todayDone ? 'bg-obsidian border accent-border accent-text' : 'bg-obsidian border border-borderDark text-white'}">
              ${todayDone ? '✓ Checked In' : '✓ Quick Check-In'}
            </button>
            <button type="button" onclick="openQuickLogToday()"
              class="py-2.5 px-3 rounded-2xl text-xs font-extrabold accent-bg transition active:scale-[0.98]">
              + Log Today's Workout
            </button>
          </div>
        </section>

        <section class="bg-surface border border-borderDark rounded-3xl p-4 space-y-2.5">
          <div class="flex items-center justify-between">
            <h3 class="text-xs font-extrabold uppercase tracking-wider text-mutedText">Quick Start Routine</h3>
            <button type="button" onclick="switchTab('plan')" class="text-[11px] font-bold accent-text">Edit Splits →</button>
          </div>
          <div class="space-y-2">${routinesHtml}</div>
        </section>
      `;
    }

    function formatPrettySessionDate(dateStr) {
      const parts = dateStr.split('-').map(Number);
      if (parts.length !== 3) return dateStr;
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      return `${days[d.getDay()]}, ${months[d.getMonth()]} ${d.getDate()}`;
    }

    function formatBadgeSessionDate(dateStr) {
      const parts = dateStr.split('-').map(Number);
      if (parts.length !== 3) return dateStr;
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
    }

    function selectSessionRoutineForDate(routineId) {
      if (!routineId) return;
      const routine = (appState.routines || []).find(r => r.id === routineId);
      if (!routine) return;
      if (!appState.workouts[selectedWorkoutDate]) {
        appState.workouts[selectedWorkoutDate] = { completed: false, entries: [], routineId: routine.id, sessionName: routine.name };
      }
      appState.workouts[selectedWorkoutDate].routineId = routine.id;
      appState.workouts[selectedWorkoutDate].sessionName = routine.name;
      const existingIds = new Set(appState.workouts[selectedWorkoutDate].entries.map(e => e.exerciseId));
      (routine.exercises || []).forEach(exId => {
        if (!existingIds.has(exId)) {
          appState.workouts[selectedWorkoutDate].entries.push({
            exerciseId: exId,
            sets: [{ weight: '', reps: '' }]
          });
        }
      });
      persistState(true);
      renderApp();
      showToast(`Loaded "${routine.name}"`);
    }

    function finishWorkoutAndFillSquare() {
      if (!appState.workouts[selectedWorkoutDate]) {
        appState.workouts[selectedWorkoutDate] = { completed: true, entries: [] };
      }
      appState.workouts[selectedWorkoutDate].completed = true;
      persistState(true);
      renderApp();
      showToast('Workout saved & square filled!');
    }

    function renderWorkoutsView() {
      if (!appState.workouts[selectedWorkoutDate]) {
        appState.workouts[selectedWorkoutDate] = { completed: false, entries: [] };
      }
      const dayObj = appState.workouts[selectedWorkoutDate];
      const entries = dayObj.entries || [];
      const routines = appState.routines || [];
      const activeRoutineId = dayObj.routineId || (routines[0]?.id || '');

      const routineOptionsHtml = routines.map(r => `
        <option value="${r.id}" ${activeRoutineId === r.id ? 'selected' : ''}>${escapeHtml(r.name)}</option>
      `).join('');

      const quickSplitButtonsHtml = routines.map(r => `
        <button type="button" onclick="selectSessionRoutineForDate('${r.id}')"
          class="px-3.5 py-2 rounded-full bg-obsidian border border-borderDark hover:border-white/25 text-xs font-extrabold text-white transition active:scale-95">
          + ${escapeHtml(r.name)}
        </button>
      `).join('');

      const entriesHtml = entries.length === 0
        ? `<div class="bg-surface border border-borderDark rounded-3xl p-6 text-center space-y-4">
             <div class="w-12 h-12 rounded-2xl bg-obsidian border border-borderDark flex items-center justify-center mx-auto text-2xl">
               🏋️
             </div>
             <div class="space-y-1">
               <h3 class="text-base font-extrabold text-white">No exercises added yet</h3>
               <p class="text-xs text-mutedText max-w-[260px] mx-auto leading-relaxed">
                 Load one of your saved workout splits or add individual exercises below.
               </p>
             </div>
             <div class="flex flex-wrap items-center justify-center gap-2 pt-1">
               ${quickSplitButtonsHtml}
             </div>
           </div>`
        : entries.map((ent, idx) => {
            const ex = getExerciseById(ent.exerciseId);
            const drawerKey = `wk_${idx}_${ex.id}`;
            const isFormOpen = !!expandedFormIds[drawerKey];
            const setsHtml = (ent.sets || []).map((s, sIdx) => `
              <div class="grid grid-cols-12 gap-2 items-center">
                <span class="col-span-2 text-[11px] font-extrabold text-mutedText text-center">#${sIdx + 1}</span>
                <input type="number" step="0.5" placeholder="kg / lbs" value="${escapeHtml(s.weight)}"
                  oninput="updateSetField(${idx}, ${sIdx}, 'weight', this.value)"
                  class="col-span-5 bg-obsidian border border-borderDark rounded-xl px-3 py-2 text-xs font-bold text-white text-center focus:outline-none" />
                <input type="number" placeholder="Reps" value="${escapeHtml(s.reps)}"
                  oninput="updateSetField(${idx}, ${sIdx}, 'reps', this.value)"
                  class="col-span-5 bg-obsidian border border-borderDark rounded-xl px-3 py-2 text-xs font-bold text-white text-center focus:outline-none" />
              </div>
            `).join('');

            const mistakesHtml = (ex.mistakes || []).map(m => `<li class="text-[11px] text-[#D1D1D6] leading-snug">• ${escapeHtml(m)}</li>`).join('');

            return `
              <div class="bg-surface border border-borderDark rounded-3xl p-4 space-y-3">
                <div class="flex items-start justify-between gap-2">
                  <div class="min-w-0">
                    <div class="flex items-center gap-2">
                      <span class="text-[10px] font-extrabold uppercase tracking-wider accent-text">${escapeHtml(ex.group)}</span>
                      <span class="text-[10px] font-bold text-mutedText">• ${getExercisePrText(ex.id)}</span>
                    </div>
                    <h3 class="text-sm font-extrabold text-white mt-0.5">${escapeHtml(ex.name)}</h3>
                  </div>
                  <div class="flex items-center gap-1.5 shrink-0">
                    <button type="button" onclick="toggleFormDrawer('${drawerKey}')"
                      class="px-2.5 py-1.5 rounded-xl text-[11px] font-extrabold border transition ${isFormOpen ? 'accent-bg border-transparent' : 'bg-obsidian border-borderDark accent-text'}">
                      ${isFormOpen ? 'Hide Form' : 'Form & Mistakes'}
                    </button>
                    <button type="button" onclick="removeEntryFromWorkout(${idx})" class="w-7 h-7 rounded-xl bg-obsidian border border-borderDark text-xs text-mutedText hover:text-coralAccent">✕</button>
                  </div>
                </div>

                ${isFormOpen ? `
                  <div class="bg-obsidian/80 border border-borderDark rounded-2xl p-3 space-y-2.5">
                    ${renderExerciseSvgAnimation(ex.anim)}
                    <div>
                      <p class="text-[10px] font-extrabold uppercase tracking-wider text-coralAccent mb-1">Common Form Mistakes to Avoid</p>
                      <ul class="space-y-1">${mistakesHtml}</ul>
                    </div>
                  </div>
                ` : ''}

                <div class="space-y-2">
                  <div class="grid grid-cols-12 gap-2 text-[10px] font-bold uppercase tracking-wider text-mutedText text-center">
                    <span class="col-span-2">Set</span>
                    <span class="col-span-5">Weight</span>
                    <span class="col-span-5">Reps</span>
                  </div>
                  ${setsHtml}
                </div>

                <button type="button" onclick="addSetToEntry(${idx})" class="w-full py-2 rounded-xl bg-obsidian border border-borderDark text-xs font-extrabold text-white hover:border-white/20">
                  + Add Set
                </button>
              </div>
            `;
          }).join('');

      return `
        <section class="bg-surface border border-borderDark rounded-3xl p-4 space-y-3">
          <div class="flex items-start justify-between gap-2">
            <div>
              <p class="text-[10px] font-extrabold uppercase tracking-wider accent-text">
                ${selectedWorkoutDate === TODAY_STR ? "TODAY'S SESSION" : 'WORKOUT SESSION'}
              </p>
              <h2 class="text-lg font-extrabold text-white mt-0.5">${formatPrettySessionDate(selectedWorkoutDate)}</h2>
            </div>
            <button type="button" onclick="openDarkDatePicker('workouts')"

    function estimateMealLocallyFallback(text) {
      const lower = text.toLowerCase();
      let totalCal = 0;
      let totalP = 0;
      let totalC = 0;
      let totalF = 0;
      const ingredients = [];

      const rules = [
        { kw: ['chicken breast', 'chicken'], name: 'Chicken Breast', cal100: 165, p100: 31, c100: 0, f100: 3.6, defaultG: 120 },
        { kw: ['brown rice', 'rice'], name: 'Boiled Rice', cal100: 112, p100: 2.6, c100: 23, f100: 0.9, defaultG: 120 },
        { kw: ['oil', 'olive oil', 'fried'], name: 'Cooking Oil', cal100: 884, p100: 0, c100: 0, f100: 100, defaultG: 8 },
        { kw: ['egg'], name: 'Eggs', cal100: 143, p100: 12.6, c100: 0.7, f100: 9.5, defaultG: 100 },
        { kw: ['salmon', 'fish'], name: 'Salmon / Fish', cal100: 208, p100: 20, c100: 0, f100: 13, defaultG: 140 },
        { kw: ['beef', 'steak'], name: 'Beef', cal100: 217, p100: 26, c100: 0, f100: 12, defaultG: 150 },
        { kw: ['oats', 'oatmeal'], name: 'Oats', cal100: 389, p100: 16.9, c100: 66, f100: 6.9, defaultG: 50 },
        { kw: ['banana'], name: 'Banana', cal100: 89, p100: 1.1, c100: 23, f100: 0.3, defaultG: 120 },
        { kw: ['bread', 'toast'], name: 'Bread', cal100: 265, p100: 9, c100: 49, f100: 3.2, defaultG: 60 },
        { kw: ['cheese', 'sulguni'], name: 'Cheese', cal100: 290, p100: 20, c100: 2, f100: 22, defaultG: 50 },
        { kw: ['yogurt', 'matsoni'], name: 'Yogurt', cal100: 65, p100: 8, c100: 4, f100: 1.5, defaultG: 170 },
        { kw: ['potato'], name: 'Potato', cal100: 93, p100: 2.5, c100: 21, f100: 0.1, defaultG: 150 },
        { kw: ['pasta', 'spaghetti'], name: 'Cooked Pasta', cal100: 158, p100: 5.8, c100: 31, f100: 0.9, defaultG: 150 }
      ];

      rules.forEach(r => {
        if (r.kw.some(k => lower.includes(k))) {
          let grams = r.defaultG;
          const gMatch = lower.match(new RegExp(`(\\d+)\\s*g\\s*(?:of\\s*)?(?:${r.kw.join('|')})`));
          const tbspMatch = lower.match(new RegExp(`(\\d+)\\s*(?:table\\s*spoons?|tbsp)\\s*(?:of\\s*)?(?:boiled\\s*)?(?:${r.kw.join('|')})`));
          if (gMatch) grams = parseInt(gMatch[1], 10);
          else if (tbspMatch) grams = parseInt(tbspMatch[1], 10) * 20;

          const cal = Math.round((r.cal100 * grams) / 100);
          const p = Math.round((r.p100 * grams) / 100);
          const c = Math.round((r.c100 * grams) / 100);
          const f = Math.round((r.f100 * grams) / 100);
          totalCal += cal;
          totalP += p;
          totalC += c;
          totalF += f;
          ingredients.push({ name: r.name, grams, calories: cal, protein: p });
        }
      });

      if (ingredients.length === 0) {
        totalCal = 380;
        totalP = 24;
        totalC = 38;
        totalF = 14;
        ingredients.push({ name: text.slice(0, 48), grams: 250, calories: 380, protein: 24 });
      }

      return {
        dishName: text.length > 52 ? text.slice(0, 52) + '...' : text,
        calories: totalCal,
        protein: totalP,
        carbs: totalC,
        fat: totalF,
        ingredients
      };
    }

    async function calculateMealWithAI() {
      const promptText = (aiMealInputText || '').trim();
      if (!promptText) {
        showToast('Describe your meal first');
        return;
      }
      if (getAiRemainingCount() <= 0) {
        showToast('Daily 3/3 AI limit reached · Resets at 00:00');
        return;
      }

      isAiCalculating = true;
      renderApp();

      try {
        let parsed = null;
        try {
          const apiKey = '';
          const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [{
                  text: `Calculate accurate calories and macros for this meal description: "${promptText}". Return strictly valid JSON with keys: dishName (string), calories (number), protein (number), carbs (number), fat (number), ingredients (array of {name, grams, calories, protein}).`
                }]
              }],
              generationConfig: { responseMimeType: 'application/json' }
            })
          });
          if (res.ok) {
            const data = await res.json();
            const raw = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
            if (raw) parsed = JSON.parse(raw);
          }
        } catch (_) {}

        if (!parsed || typeof parsed.calories !== 'number') {
          parsed = estimateMealLocallyFallback(promptText);
        }

        appState.aiCalorieUsage = {
          date: TODAY_STR,
          count: (appState.aiCalorieUsage?.date === TODAY_STR ? (appState.aiCalorieUsage.count || 0) : 0) + 1
        };
        appState.pendingAiResult = parsed;
        persistState(true);
        showToast('Meal calories calculated & saved!');
      } finally {
        isAiCalculating = false;
        renderApp();
      }
    }

    function getCurrentWeekMeals() {
      const d = new Date(TODAY_OBJ);
      const dow = d.getDay();
      const diffToMon = dow === 0 ? -6 : 1 - dow;
      const monday = new Date(d);
      monday.setDate(d.getDate() + diffToMon);
      monday.setHours(0, 0, 0, 0);

      const sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);
      sunday.setHours(23, 59, 59, 999);

      const results = [];
      Object.entries(appState.calorieLogs || {}).forEach(([dateStr, items]) => {
        const parts = dateStr.split('-').map(Number);
        if (parts.length !== 3 || !Array.isArray(items)) return;
        const dt = new Date(parts[0], parts[1] - 1, parts[2], 12, 0, 0);
        if (dt >= monday && dt <= sunday) {
          items.forEach(item => results.push({ ...item, dateStr }));
        }
      });
      return results.sort((a, b) => (b.ts || 0) - (a.ts || 0));
    }

                    class="px-3 py-1.5 rounded-xl text-[11px] font-extrabold accent-bg">+ Log</button>
                </div>
              </div>
            `).join('');
      } else {
        contentHtml = weekHistory.length === 0
          ? `<p class="text-xs text-mutedText text-center py-5">No meals logged this week yet.</p>`
          : weekHistory.map((h, idx) => {
              const isFav = favs.some(f => f.name.toLowerCase() === h.name.toLowerCase());
              return `
                <div class="flex items-center justify-between gap-2 p-3 rounded-2xl bg-obsidian border border-borderDark">
                  <div class="min-w-0">
                    <p class="text-xs font-extrabold text-white truncate">${escapeHtml(h.name)}</p>
                    <p class="text-[10px] text-mutedText">${Math.round(h.calories)} kcal · ${Math.round(h.protein || 0)}g Protein · ${h.meal || 'Meal'}</p>

                      class="w-7 h-7 rounded-xl bg-surface border border-borderDark text-xs ${isFav ? 'accent-text' : 'text-mutedText'}">${isFav ? '★' : '☆'}</button>
                    <button type="button" onclick="quickLogHistoryMeal(${idx})"
                      class="px-3 py-1.5 rounded-xl text-[11px] font-extrabold accent-bg">+ Log</button>
                  </div>
                </div>

      }

      return `
        <section class="bg-surface border border-borderDark rounded-3xl p-4 space-y-3">
          <div class="grid grid-cols-3 gap-1.5 bg-obsidian border border-borderDark p-1 rounded-2xl">
            <button type="button" onclick="unifiedLogSubTab='logs'; renderApp();"
              class="py-2 rounded-xl text-[11px] font-extrabold transition ${unifiedLogSubTab === 'logs' ? 'accent-bg' : 'text-mutedText'}">
              Daily Logs (${dayLogs.length})
            </button>
            <button type="button" onclick="unifiedLogSubTab='favorites'; renderApp();"
              class="py-2 rounded-xl text-[11px] font-extrabold transition ${unifiedLogSubTab === 'favorites' ? 'accent-bg' : 'text-mutedText'}">
              ★ Favorites (${favs.length})
            </button>
            <button type="button" onclick="unifiedLogSubTab='history'; renderApp();"
              class="py-2 rounded-xl text-[11px] font-extrabold transition ${unifiedLogSubTab === 'history' ? 'accent-bg' : 'text-mutedText'}">
              History (${weekHistory.length})
            </button>
          </div>
          <div class="space-y-2.5">${contentHtml}</div>
        </section>
      `;
    }

    function toggleFavoriteFromDayLogIdx(idx) {
      const item = appState.calorieLogs?.[selectedCalorieDate]?.[idx];
      if (item) toggleFavoriteMealObj(item);
    }

    function toggleFavoriteFromHistoryIdx(idx) {
      const item = getCurrentWeekMeals()[idx];
      if (item) toggleFavoriteMealObj(item);
    }

    function toggleFavoriteByFoodId(foodId) {
      const f = FOOD_DATABASE.find(x => x.id === foodId);
      if (f) toggleFavoriteMealObj({ name: f.name, calories: f.cal, protein: f.p });
    }

    function logFoodById(foodId) {
      const f = FOOD_DATABASE.find(x => x.id === foodId);
      if (f) logFoodItemDirect(f.name, f.cal, f.p);
    }

    function logFavoriteByIndex(idx) {
      const f = (appState.favoriteFoods || [])[idx];
      if (f) logFoodItemDirect(f.name, f.calories, f.protein || 0);
    }

    function quickLogHistoryMeal(idx) {
      const item = getCurrentWeekMeals()[idx];
      if (item) logFoodItemDirect(item.name, item.calories, item.protein || 0);
    }

    function renderCaloriesView() {
      const dayLogs = Array.isArray(appState.calorieLogs?.[selectedCalorieDate]) ? appState.calorieLogs[selectedCalorieDate] : [];
      const consumed = dayLogs.reduce((s, x) => s + (Number(x.calories) || 0), 0);
      const protein = dayLogs.reduce((s, x) => s + (Number(x.protein) || 0), 0);
      const target = Math.max(800, Number(appState.calorieTarget) || 2000);
      const pTarget = Math.max(40, Number(appState.proteinTarget) || 130);
      const left = Math.max(0, target - consumed);
      const pct = Math.min(100, Math.round((consumed / target) * 100));
      const aiLeft = getAiRemainingCount();

      const slotPills = ['Breakfast', 'Lunch', 'Dinner', 'Snacks'].map(slot => `
        <button type="button" onclick="activeMealSlot='${slot}'; renderApp();"
          class="py-2 rounded-xl text-[11px] font-extrabold transition ${activeMealSlot === slot ? 'accent-bg' : 'bg-obsidian border border-borderDark text-mutedText'}">
          ${slot}
        </button>
      `).join('');

      const aiRes = appState.pendingAiResult;
      const aiResultHtml = aiRes ? `
        <div class="bg-obsidian border accent-border rounded-2xl p-3.5 space-y-2.5">
          <div class="flex items-start justify-between gap-2">
            <div>
              <p class="text-[10px] font-extrabold uppercase tracking-wider accent-text">AI Estimate</p>
              <h4 class="text-sm font-extrabold text-white mt-0.5">${escapeHtml(aiRes.dishName)}</h4>
              <p class="text-xs font-bold text-mutedText mt-0.5">
                <span class="text-white font-extrabold">${Math.round(aiRes.calories)} kcal</span>
                · ${Math.round(aiRes.protein || 0)}g Protein · ${Math.round(aiRes.carbs || 0)}g Carbs · ${Math.round(aiRes.fat || 0)}g Fat
              </p>
            </div>
            <button type="button" onclick="appState.pendingAiResult=null; persistState(true); renderApp();" class="text-xs text-mutedText">✕</button>
          </div>
          ${Array.isArray(aiRes.ingredients) && aiRes.ingredients.length ? `
            <div class="bg-surface border border-borderDark rounded-xl p-2.5 space-y-1">
              ${aiRes.ingredients.map(ing => `
                <div class="flex items-center justify-between text-[11px]">
                  <span class="text-white">${escapeHtml(ing.name)} <span class="text-mutedText">(${ing.grams || 0}g)</span></span>
                  <span class="font-bold text-white">${Math.round(ing.calories || 0)} kcal · ${Math.round(ing.protein || 0)}g Protein</span>
                </div>
              `).join('')}
            </div>
          ` : ''}
          <div class="grid grid-cols-2 gap-2">
            <button type="button" onclick="savePendingAiToFavorites()" class="py-2.5 rounded-xl bg-surface border border-borderDark text-xs font-extrabold text-white">☆ Save to Favorites</button>
            <button type="button" onclick="logPendingAiMeal()" class="py-2.5 rounded-xl text-xs font-extrabold accent-bg">+ Log to ${activeMealSlot}</button>
          </div>
        </div>
      ` : '';

      const cats = ['All', 'Protein', 'Dairy', 'Carbs', 'Fruit', 'Veggies', 'Fats', 'Meals', 'Snacks', 'Drinks'];
      const catPills = cats.map(c => `
        <button type="button" onclick="selectedFoodCategory='${c}'; renderApp();"
          class="px-3 py-1.5 rounded-xl text-[11px] font-extrabold shrink-0 transition ${selectedFoodCategory === c ? 'accent-bg' : 'bg-obsidian border border-borderDark text-mutedText'}">
          ${c}
        </button>
      `).join('');

      const filteredFoods = FOOD_DATABASE.filter(f => {
        const matchCat = selectedFoodCategory === 'All' || f.cat === selectedFoodCategory;
        const matchQ = !foodSearchQuery || f.name.toLowerCase().includes(foodSearchQuery.toLowerCase());
        return matchCat && matchQ;
      });

      const foodListHtml = filteredFoods.map((f) => {
        const isFav = (appState.favoriteFoods || []).some(x => x.name.toLowerCase() === f.name.toLowerCase());
        return `
          <div class="flex items-center justify-between gap-2 p-3 rounded-2xl bg-obsidian border border-borderDark">
            <div class="min-w-0">
              <p class="text-xs font-extrabold text-white truncate">${escapeHtml(f.name)}</p>
              <p class="text-[10px] text-mutedText">${f.cal} kcal · ${f.p}g Protein · ${f.cat}</p>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
              <button type="button" onclick="toggleFavoriteByFoodId('${f.id}')"
                class="w-7 h-7 rounded-xl bg-surface border border-borderDark text-xs ${isFav ? 'accent-text' : 'text-mutedText'}">${isFav ? '★' : '☆'}</button>
              <button type="button" onclick="logFoodById('${f.id}')"
                class="px-3 py-1.5 rounded-xl text-[11px] font-extrabold accent-bg">+ Add</button>
            </div>
          </div>
        `;
      }).join('');

      return `
        <!-- Calorie Counter + Text AI Widget -->
        <section class="bg-surface border border-borderDark rounded-3xl p-4 space-y-3.5 shadow-xl">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-[10px] font-extrabold uppercase tracking-wider accent-text">Daily Intake</p>
              <button type="button" onclick="openDarkDatePicker('calories')"
                class="mt-1 inline-flex items-center gap-2 px-3 py-1.5 rounded-xl bg-obsidian border border-borderDark hover:border-white/25 text-xs font-extrabold text-white transition active:scale-95">
                <span>${formatBadgeSessionDate(selectedCalorieDate)}</span>
                <svg class="w-3.5 h-3.5 accent-text" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
              </button>
            </div>
            <div class="text-right">
              <p class="text-lg font-extrabold text-white">${Math.round(consumed)} <span class="text-xs font-bold text-mutedText">/ ${target} kcal</span></p>
              <p class="text-[11px] font-extrabold accent-text">${Math.round(left)} kcal left · ${Math.round(protein)}g / ${pTarget}g Protein</p>
            </div>
          </div>

          <div class="w-full h-2.5 rounded-full bg-obsidian overflow-hidden">
            <div class="h-full rounded-full accent-bg transition-all duration-300" style="width: ${pct}%;"></div>
          </div>

          <!-- Active Meal Slot -->
          <div class="grid grid-cols-4 gap-1.5">${slotPills}</div>

          <!-- AI Meal Calorie Calculator (Text-Only, 3/day reset 00:00) -->
          <div class="bg-obsidian/90 border border-borderDark rounded-2xl p-3 space-y-2.5">
            <div class="flex items-center justify-between">
              <span class="text-xs font-extrabold text-white">✨ AI Meal Calorie Calculator</span>
              <span class="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-surface border border-borderDark accent-text">
                ${aiLeft} / 3 left · resets 00:00
              </span>
            </div>
            <textarea rows="2" placeholder="e.g. 100g of chicken breast, fried in a bit of oil and 4 table spoons of boiled brown rice"
              oninput="aiMealInputText=this.value"
              class="w-full bg-surface border border-borderDark rounded-xl px-3 py-2 text-xs text-white focus:outline-none resize-none">${escapeHtml(aiMealInputText)}</textarea>
            <button type="button" onclick="calculateMealWithAI()" ${isAiCalculating || aiLeft <= 0 ? 'disabled' : ''}
              class="w-full py-2.5 rounded-xl text-xs font-extrabold accent-bg transition active:scale-[0.98] disabled:opacity-50">
              ${isAiCalculating ? 'Calculating Meal...' : '✨ Calculate Calories with AI'}
            </button>
          </div>

          ${aiResultHtml}
        </section>

        <!-- Unified Daily Logs / Favorites / History Widget -->
        ${renderUnifiedLogsFavoritesHistoryCardHtml()}

        <!-- Food & Calorie Database -->
        <section class="bg-surface border border-borderDark rounded-3xl p-4 space-y-3">
          <div class="flex items-center justify-between">
            <h3 class="text-sm font-extrabold text-white">Food &amp; Calorie Database</h3>
            <span class="text-[11px] text-mutedText">${filteredFoods.length} items</span>
          </div>
          <input type="text" placeholder="Search 115+ foods & Georgian dishes..." value="${escapeHtml(foodSearchQuery)}"
            oninput="foodSearchQuery=this.value; renderApp();"
            class="w-full bg-obsidian border border-borderDark rounded-2xl px-3.5 py-2.5 text-xs text-white focus:outline-none" />
          <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-1">${catPills}</div>
          <div class="space-y-2 max-h-80 overflow-y-auto pr-1">${foodListHtml}</div>
        </section>
      `;
    }

    // =========================================================
    // 11. TAB 4: BODY & PLAN (SPLITS, METABOLIC CALCULATOR, MEASUREMENTS)
    // =========================================================
    function setMeasurementUnit(unit) {
      const prev = appState.measurements.unit || 'metric';
      if (prev === unit) return;
      const m = appState.measurements;
      const factorW = unit === 'imperial' ? 2.20462 : (1 / 2.20462);
      const factorL = unit === 'imperial' ? (1 / 2.54) : 2.54;
      if (m.weight) m.weight = (parseFloat(m.weight) * factorW).toFixed(1);
      ['waist', 'hips', 'chest', 'arms', 'thighs'].forEach(k => {
        if (m[k]) m[k] = (parseFloat(m[k]) * factorL).toFixed(1);
      });
      m.unit = unit;
      persistState(true);
      renderApp();
    }

    function updateMeasurementField(key, val) {
      appState.measurements[key] = val;
      if (key === 'weight' && parseFloat(val) > 0) {
        const wKg = appState.measurements.unit === 'imperial'
          ? parseFloat(val) / 2.20462
          : parseFloat(val);
        appState.bmrProfile.weightKg = Math.round(wKg * 10) / 10;
      }
      persistState(false);
    }

    function updateBmrField(key, val) {
      appState.bmrProfile[key] = Number(val);
      persistState(false);
      renderApp();
    }

    function applyCalculatedTarget(kcal, weightKg) {
      appState.calorieTarget = Math.round(kcal);
      appState.proteinTarget = Math.round((Number(weightKg) || 65) * 1.85);
      persistState(true);
      renderApp();
      showToast(`Daily target set to ${Math.round(kcal)} kcal`);
    }

    function addNewRoutine() {
      const newId = 'r_' + Date.now();
      appState.routines.push({
        id: newId,
        name: `Custom Split #${appState.routines.length + 1}`,
        exercises: []
      });
      persistState(true);
      renderApp();
      openExercisePicker(newId);
    }

    function renameRoutine(id, newName) {
      const r = (appState.routines || []).find(x => x.id === id);
      if (r && newName.trim()) {
        r.name = newName.trim();
        persistState(false);
      }
    }

    function deleteRoutine(id) {
      appState.routines = (appState.routines || []).filter(x => x.id !== id);
      persistState(true);
      renderApp();
    }

    function renderPlanView() {
      const b = appState.bmrProfile || { age: 26, heightCm: 168, weightKg: 62, activity: 1.55, goalOffset: 0 };
      const isMale = appState.gender === 'male';
      const bmr = Math.round(10 * b.weightKg + 6.25 * b.heightCm - 5 * b.age + (isMale ? 5 : -161));
      const tdee = Math.round(bmr * (Number(b.activity) || 1.55));
      const targetKcal = Math.max(1100, tdee + (Number(b.goalOffset) || 0));

      const m = appState.measurements || { unit: 'metric', weight: '62', waist: '68', hips: '96', chest: '88', arms: '28', thighs: '54' };
      const wUnit = m.unit === 'imperial' ? 'lbs' : 'kg';
      const lUnit = m.unit === 'imperial' ? 'in' : 'cm';

      const routinesHtml = (appState.routines || []).map(r => {
        const exList = (r.exercises || []).map((exId, eIdx) => {
          const ex = getExerciseById(exId);
          const fKey = `rt_${r.id}_${exId}`;
          const open = !!expandedFormIds[fKey];
          return `
            <div class="bg-obsidian border border-borderDark rounded-2xl p-2.5 space-y-2">
              <div class="flex items-center justify-between gap-2">
                <span class="text-xs font-bold text-white truncate">${eIdx + 1}. ${escapeHtml(ex.name)}</span>
                <button type="button" onclick="toggleFormDrawer('${fKey}')" class="text-[11px] font-extrabold accent-text shrink-0">
                  ${open ? 'Hide' : 'Form'}
                </button>
              </div>
              ${open ? `
                <div class="space-y-2 pt-1">
                  ${renderExerciseSvgAnimation(ex.anim)}
                  <ul class="space-y-1">
                    ${(ex.mistakes || []).map(ms => `<li class="text-[10px] text-[#D1D1D6]">• ${escapeHtml(ms)}</li>`).join('')}
                  </ul>
                </div>
              ` : ''}
            </div>
          `;
        }).join('');

        return `
          <div class="bg-obsidian/70 border border-borderDark rounded-2xl p-3.5 space-y-2.5">
            <div class="flex items-center justify-between gap-2">
              <input type="text" value="${escapeHtml(r.name)}" onchange="renameRoutine('${r.id}', this.value)"
                class="bg-transparent text-xs font-extrabold text-white focus:outline-none flex-1" />
              <button type="button" onclick="deleteRoutine('${r.id}')" class="text-xs text-mutedText hover:text-coralAccent">✕</button>
            </div>
            <div class="space-y-1.5">${exList}</div>
            <button type="button" onclick="openExercisePicker('${r.id}')" class="w-full py-2 rounded-xl bg-surface border border-borderDark text-[11px] font-extrabold text-white">
              + Add / Edit Exercises in Routine
            </button>
          </div>
        `;
      }).join('');

      return `
        <!-- Training Splits -->
        <section class="bg-surface border border-borderDark rounded-3xl p-4 space-y-3">
          <div class="flex items-center justify-between">
            <h2 class="text-base font-extrabold text-white">Training Splits &amp; Routines</h2>
            <button type="button" onclick="addNewRoutine()" class="px-3 py-1.5 rounded-xl text-xs font-extrabold accent-bg">+ New Split</button>
          </div>
          <div class="space-y-3">${routinesHtml}</div>
        </section>

        <!-- Metabolic & Calorie Calculator (Clean Title Only) -->
        <section class="bg-surface border border-borderDark rounded-3xl p-4 space-y-3.5">
          <h2 class="text-base font-extrabold text-white">Metabolic &amp; Calorie Calculator</h2>

          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="text-[10px] font-bold text-mutedText block mb-1">Age (yrs)</label>
              <input type="number" value="${b.age}" onchange="updateBmrField('age', this.value)"
                class="w-full bg-obsidian border border-borderDark rounded-xl px-3 py-2 text-xs font-extrabold text-white text-center" />
            </div>
            <div>
              <label class="text-[10px] font-bold text-mutedText block mb-1">Height (cm)</label>
              <input type="number" value="${b.heightCm}" onchange="updateBmrField('heightCm', this.value)"
                class="w-full bg-obsidian border border-borderDark rounded-xl px-3 py-2 text-xs font-extrabold text-white text-center" />
            </div>
            <div>
              <label class="text-[10px] font-bold text-mutedText block mb-1">Weight (kg)</label>
              <input type="number" step="0.1" value="${b.weightKg}" onchange="updateBmrField('weightKg', this.value)"
                class="w-full bg-obsidian border border-borderDark rounded-xl px-3 py-2 text-xs font-extrabold text-white text-center" />
            </div>
          </div>

          <div>
            <label class="text-[10px] font-bold text-mutedText block mb-1">Weekly Activity Level</label>
            <select onchange="updateBmrField('activity', this.value)" class="w-full bg-obsidian border border-borderDark rounded-xl px-3 py-2.5 text-xs font-bold text-white">
              <option value="1.2" ${b.activity == 1.2 ? 'selected' : ''}>Sedentary (Desk job, little exercise)</option>
              <option value="1.375" ${b.activity == 1.375 ? 'selected' : ''}>Lightly Active (1–3 workouts/week)</option>
              <option value="1.55" ${b.activity == 1.55 ? 'selected' : ''}>Moderately Active (3–5 workouts/week)</option>
              <option value="1.725" ${b.activity == 1.725 ? 'selected' : ''}>Very Active (6–7 workouts/week)</option>
            </select>
          </div>

          <div class="grid grid-cols-3 gap-1.5">
            <button type="button" onclick="updateBmrField('goalOffset', -400)"
              class="py-2 rounded-xl text-[11px] font-extrabold border ${b.goalOffset === -400 ? 'accent-bg border-transparent' : 'bg-obsidian border-borderDark text-mutedText'}">
              Fat Loss (-400)
            </button>
            <button type="button" onclick="updateBmrField('goalOffset', 0)"
              class="py-2 rounded-xl text-[11px] font-extrabold border ${b.goalOffset === 0 ? 'accent-bg border-transparent' : 'bg-obsidian border-borderDark text-mutedText'}">
              Maintain
            </button>
            <button type="button" onclick="updateBmrField('goalOffset', 300)"
              class="py-2 rounded-xl text-[11px] font-extrabold border ${b.goalOffset === 300 ? 'accent-bg border-transparent' : 'bg-obsidian border-borderDark text-mutedText'}">
              Lean Bulk (+300)
            </button>
          </div>

          <div class="grid grid-cols-3 gap-2 text-center">
            <div class="bg-obsidian border border-borderDark rounded-2xl p-2.5">
              <p class="text-[9px] font-bold text-mutedText">BMR</p>
              <p class="text-sm font-extrabold text-white mt-0.5">${bmr}</p>
              <p class="text-[9px] text-mutedText">kcal/day</p>
            </div>
            <div class="bg-obsidian border border-borderDark rounded-2xl p-2.5">
              <p class="text-[9px] font-bold text-mutedText">TDEE</p>
              <p class="text-sm font-extrabold text-white mt-0.5">${tdee}</p>
              <p class="text-[9px] text-mutedText">maintenance</p>
            </div>
            <div class="bg-obsidian border accent-border rounded-2xl p-2.5">
              <p class="text-[9px] font-bold accent-text">TARGET</p>
              <p class="text-sm font-extrabold text-white mt-0.5">${targetKcal}</p>
              <p class="text-[9px] text-mutedText">kcal/day</p>
            </div>
          </div>

          <button type="button" onclick="applyCalculatedTarget(${targetKcal}, ${b.weightKg})"
            class="w-full py-3 rounded-2xl bg-obsidian border border-borderDark hover:border-white/25 text-xs font-extrabold text-white">
            ✓ Set ${targetKcal} kcal as Daily Target
          </button>
        </section>

        <!-- Body Measurements (Metric / Imperial, No Body Fat, Separate Arms & Thighs) -->
        <section class="bg-surface border border-borderDark rounded-3xl p-4 space-y-3.5">
          <div class="flex items-center justify-between gap-2">
            <div>
              <p class="text-[10px] font-extrabold uppercase tracking-wider accent-text">Progress Check-In</p>
              <h2 class="text-base font-extrabold text-white">Body Measurements</h2>
            </div>
            <div class="bg-obsidian border border-borderDark p-0.5 rounded-xl flex text-[10px] font-extrabold">
              <button type="button" onclick="setMeasurementUnit('metric')" class="px-2.5 py-1 rounded-lg ${m.unit !== 'imperial' ? 'accent-bg' : 'text-mutedText'}">Metric</button>
              <button type="button" onclick="setMeasurementUnit('imperial')" class="px-2.5 py-1 rounded-lg ${m.unit === 'imperial' ? 'accent-bg' : 'text-mutedText'}">Imperial</button>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label class="text-[10px] font-bold text-mutedText block mb-1">Body Weight (${wUnit})</label>
              <input type="number" step="0.1" value="${escapeHtml(m.weight)}" oninput="updateMeasurementField('weight', this.value)"
                class="w-full bg-obsidian border border-borderDark rounded-xl px-3 py-2 text-xs font-extrabold text-white" />
            </div>
            <div>
              <label class="text-[10px] font-bold text-mutedText block mb-1">Waist (${lUnit})</label>
              <input type="number" step="0.1" value="${escapeHtml(m.waist)}" oninput="updateMeasurementField('waist', this.value)"
                class="w-full bg-obsidian border border-borderDark rounded-xl px-3 py-2 text-xs font-extrabold text-white" />
            </div>
            <div>
              <label class="text-[10px] font-bold text-mutedText block mb-1">Glutes / Hips (${lUnit})</label>
              <input type="number" step="0.1" value="${escapeHtml(m.hips)}" oninput="updateMeasurementField('hips', this.value)"
                class="w-full bg-obsidian border border-borderDark rounded-xl px-3 py-2 text-xs font-extrabold text-white" />
            </div>
            <div>
              <label class="text-[10px] font-bold text-mutedText block mb-1">Chest (${lUnit})</label>
              <input type="number" step="0.1" value="${escapeHtml(m.chest)}" oninput="updateMeasurementField('chest', this.value)"
                class="w-full bg-obsidian border border-borderDark rounded-xl px-3 py-2 text-xs font-extrabold text-white" />
            </div>
            <div>
              <label class="text-[10px] font-bold text-mutedText block mb-1">Arms (${lUnit})</label>
              <input type="number" step="0.1" value="${escapeHtml(m.arms)}" oninput="updateMeasurementField('arms', this.value)"
                class="w-full bg-obsidian border border-borderDark rounded-xl px-3 py-2 text-xs font-extrabold text-white" />
            </div>
            <div>
              <label class="text-[10px] font-bold text-mutedText block mb-1">Thighs (${lUnit})</label>
              <input type="number" step="0.1" value="${escapeHtml(m.thighs)}" oninput="updateMeasurementField('thighs', this.value)"
                class="w-full bg-obsidian border border-borderDark rounded-xl px-3 py-2 text-xs font-extrabold text-white" />
            </div>
          </div>
        </section>
      `;
    }

    // =========================================================
    // 12. PROFILE & SETTINGS MODAL (WITH CHANGE EMAIL/USERNAME)
    // =========================================================
    function openModal(html) {
      const ov = document.getElementById('modalOverlay');
      const card = document.getElementById('modalCard');
      if (!ov || !card) return;
      card.innerHTML = html;
      ov.classList.remove('hidden');
    }

    function closeModal() {
      const ov = document.getElementById('modalOverlay');
      if (ov) ov.classList.add('hidden');
    }

    function openAccountModal() {
      const sess = getActiveSession();
      const swatches = Object.entries(THEME_MAP).map(([k, v]) => `
        <button type="button" onclick="applyTheme('${k}'); persistState(true); openAccountModal();"
          class="w-8 h-8 rounded-full border-2 ${appState.accent === k ? 'border-white scale-110' : 'border-transparent'}"
          style="background-color: ${v.hex};"></button>
      `).join('');

      openModal(`
        <div class="flex items-center justify-between">
          <h3 class="text-base font-extrabold text-white">Profile &amp; Settings</h3>
          <button type="button" onclick="closeModal()" class="text-xs font-bold text-mutedText">✕</button>
        </div>

        <div class="space-y-3">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[10px] font-bold text-mutedText block mb-1">First Name</label>
              <input id="profFirstInput" type="text" value="${escapeHtml(appState.firstName || '')}"
                class="w-full bg-obsidian border border-borderDark rounded-xl px-3 py-2 text-xs font-bold text-white" />
            </div>
            <div>
              <label class="text-[10px] font-bold text-mutedText block mb-1">Gender</label>
              <select id="profGenderInput" class="w-full bg-obsidian border border-borderDark rounded-xl px-3 py-2 text-xs font-bold text-white">
                <option value="female" ${appState.gender !== 'male' ? 'selected' : ''}>Female</option>
                <option value="male" ${appState.gender === 'male' ? 'selected' : ''}>Male</option>
              </select>
            </div>
          </div>

          <div>
            <label class="text-[10px] font-bold text-mutedText block mb-1">Email / Account Username</label>
            <input id="profEmailInput" type="text" value="${escapeHtml(sess?.username || '')}" placeholder="e.g. alex@example.com"
              class="w-full bg-obsidian border border-borderDark rounded-xl px-3 py-2 text-xs font-bold text-white" />
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[10px] font-bold text-mutedText block mb-1">Daily Calorie Target</label>
              <input id="profCalInput" type="number" value="${appState.calorieTarget}"
                class="w-full bg-obsidian border border-borderDark rounded-xl px-3 py-2 text-xs font-extrabold text-white" />
            </div>
            <div>
              <label class="text-[10px] font-bold text-mutedText block mb-1">Daily Protein Target (g)</label>
              <input id="profProtInput" type="number" value="${appState.proteinTarget}"
                class="w-full bg-obsidian border border-borderDark rounded-xl px-3 py-2 text-xs font-extrabold text-white" />
            </div>
          </div>

          <div>
            <label class="text-[10px] font-bold text-mutedText block mb-1.5">Accent Color</label>
            <div class="flex items-center justify-between bg-obsidian border border-borderDark rounded-2xl p-3">
              ${swatches}
            </div>
          </div>

          <button type="button" onclick="saveProfileSettings()" class="w-full py-3 rounded-2xl text-xs font-extrabold accent-bg">
            Save Profile &amp; Sync
          </button>

          <button type="button" onclick="signOutUser()" class="w-full py-2.5 rounded-2xl bg-obsidian border border-borderDark text-xs font-extrabold text-coralAccent">
            Sign Out
          </button>
        </div>
      `);
    }

    async function saveProfileSettings() {
      const firstName = (document.getElementById('profFirstInput')?.value || '').trim() || 'Athlete';
      const gender = document.getElementById('profGenderInput')?.value === 'male' ? 'male' : 'female';
      const newEmail = (document.getElementById('profEmailInput')?.value || '').toLowerCase().trim().replace(/[^a-z0-9@._-]/g, '');
      const calTarget = parseInt(document.getElementById('profCalInput')?.value, 10) || 2000;
      const protTarget = parseInt(document.getElementById('profProtInput')?.value, 10) || 130;

      appState.firstName = firstName;
      appState.gender = gender;
      appState.calorieTarget = calTarget;
      appState.proteinTarget = protTarget;

      const sess = getActiveSession();
      if (sess && newEmail.length >= 3 && newEmail !== sess.username) {
        const oldUsername = sess.username;
        sess.username = newEmail;
        sess.firstName = firstName;
        sess.displayName = firstName;
        localStorage.setItem(ACCOUNT_SESSION_KEY, JSON.stringify(sess));
        try {
          localStorage.removeItem(`${ACCOUNT_VAULT_PREFIX}${oldUsername}`);
          localStorage.removeItem(`${ACCOUNT_VAULT_PREFIX}${oldUsername}_backup`);
        } catch (_) {}
        if (supabaseClient) {
          try {
            await supabaseClient.from('cadence_profiles').delete().eq('username', oldUsername);
          } catch (_) {}
        }
        updateHomeScreenManifest();
      } else if (sess) {
        sess.firstName = firstName;
        sess.displayName = firstName;
        localStorage.setItem(ACCOUNT_SESSION_KEY, JSON.stringify(sess));
      }

      applyTheme(appState.accent);
      persistState(true);
      closeModal();
      renderApp();
      showToast('Profile saved!');
    }

    function signOutUser() {
      localStorage.removeItem(ACCOUNT_SESSION_KEY);
      localStorage.removeItem(GUEST_MODE_KEY);
      if (window.location.protocol !== 'about:' && !window.location.href.startsWith('blob:')) {
        window.location.href = './login.html';
      } else {
        closeModal();
        showToast('Signed out');
      }
    }

    // =========================================================
    // 13. MAIN RENDER & LIFECYCLE HOOKS
    // =========================================================
    function renderApp() {
      renderFrozenHeader();
      const main = document.getElementById('appMain');
      if (!main) return;
      if (activeTab === 'grid') main.innerHTML = renderGridView();
      else if (activeTab === 'workouts') main.innerHTML = renderWorkoutsView();
      else if (activeTab === 'calories') main.innerHTML = renderCaloriesView();
      else if (activeTab === 'plan') main.innerHTML = renderPlanView();

      document.querySelectorAll('.nav-btn').forEach(btn => {
        const isTarget = btn.getAttribute('data-tab') === activeTab;
        btn.classList.toggle('accent-text', isTarget);
        btn.classList.toggle('text-mutedText', !isTarget);
      });
      syncHeaderSpacer();
    }

    window.addEventListener('resize', syncHeaderSpacer);

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') {
        persistState(true);
      } else if (document.visibilityState === 'visible') {
        hydrateStateFromVault().then(() => {
          applyTheme(appState.accent);
          renderApp();
        });
      }
    });

    window.addEventListener('pagehide', () => persistState(true));

    setInterval(() => {
      const nowStr = toLocalDateStr(new Date());
      if (nowStr !== lastKnownCalendarDate) {
        lastKnownCalendarDate = nowStr;
        TODAY_OBJ = new Date();
        TODAY_STR = nowStr;
        selectedCalorieDate = nowStr;
        selectedWorkoutDate = nowStr;
        appState.aiCalorieUsage = { date: nowStr, count: 0 };
        persistState(true);
        renderApp();
      }
    }, 30000);

    (async function initApp() {
      if (!enforceLoginGate()) return;
      syncHeaderSpacer();
      await hydrateStateFromVault();
      applyTheme(appState.accent);
      renderApp();
      syncHeaderSpacer();
    })();
  </script>
</body>
</html>
