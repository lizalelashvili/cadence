  <script>
    (function generateImmediateCadenceIcons() {
      try {
        const THEME_MAP = {
          blue: '#3B82F6',
          pink: '#FF4D94',
          lime: '#C6FF00',
          coral: '#FF5E3A',
          violet: '#A855F7',
          cyan: '#22D3EE'
        };
        let hex = THEME_MAP.blue;
        try {
          const saved = JSON.parse(localStorage.getItem('cadence_workout_tracker_v1') || 'null');
          if (saved && saved.accent && THEME_MAP[saved.accent]) hex = THEME_MAP[saved.accent];
        } catch (_) {}

        function buildIconDataUrl(size) {
          const canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#0A0A0C';
          ctx.fillRect(0, 0, size, size);

          const pad = Math.round(size * 0.21);
          const gap = Math.round(size * 0.08);
          const sq = Math.round((size - pad * 2 - gap) / 2);
          const r = Math.round(sq * 0.24);

          function drawSq(x, y, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + sq - r, y);
            ctx.quadraticCurveTo(x + sq, y, x + sq, y + r);
            ctx.lineTo(x + sq, y + sq - r);
            ctx.quadraticCurveTo(x + sq, y + sq, x + sq - r, y + sq);
            ctx.lineTo(x + r, y + sq);
            ctx.quadraticCurveTo(x, y + sq, x, y + sq - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
            ctx.fill();
          }

          drawSq(pad, pad, hex);
          drawSq(pad + sq + gap, pad, '#27272E');
          drawSq(pad, pad + sq + gap, '#27272E');
          drawSq(pad + sq + gap, pad + sq + gap, hex);
          return canvas.toDataURL('image/png');
        }

        const icon180 = buildIconDataUrl(180);
        const icon512 = buildIconDataUrl(512);
        document.getElementById('appleTouchIcon').href = icon180;
        document.getElementById('appleTouchIcon512').href = icon512;
        document.getElementById('faviconIcon').href = icon180;

        const manifestObj = {
          name: 'CADENCE — 365-Day Workout Tracker',
          short_name: 'CADENCE',
          start_url: './index.html',
          display: 'standalone',
          background_color: '#0A0A0C',
          theme_color: '#0A0A0C',
          icons: [
            { src: icon180, sizes: '180x180', type: 'image/png' },
            { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
          ]
        };
        const blob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
        document.getElementById('appManifest').href = URL.createObjectURL(blob);
      } catch (_) {}
    })();
  </script>

    /* ==========================================================================
       2. SUPABASE & INDEXEDDB STORAGE HELPERS
       ========================================================================== */
    function getSupabaseConfig() {
      try {
        const saved = JSON.parse(localStorage.getItem(SUPABASE_CONFIG_KEY) || 'null');
        if (saved && saved.url && saved.anonKey) {
          return { url: saved.url.trim().replace(/\/rest\/v1\/?$/, ''), anonKey: saved.anonKey.trim() };
        }
      } catch (_) {}
      if (DEFAULT_SUPABASE_URL && DEFAULT_SUPABASE_ANON_KEY) {
        return { url: DEFAULT_SUPABASE_URL.trim().replace(/\/rest\/v1\/?$/, ''), anonKey: DEFAULT_SUPABASE_ANON_KEY.trim() };
      }
      return null;
    }

    function initSupabase() {
      const cfg = getSupabaseConfig();
      if (!cfg || !window.supabase || !window.supabase.createClient) {
        supabaseClient = null;
        return;
      }
      try {
        supabaseClient = window.supabase.createClient(cfg.url, cfg.anonKey);
      } catch (_) {
        supabaseClient = null;
      }
    }

    function openVaultIDB() {
      return new Promise((resolve) => {
        if (!window.indexedDB) return resolve(null);
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
      });
    }

    async function readFromIDB(key) {
      const db = await openVaultIDB();
      if (!db) return null;
      return new Promise((resolve) => {
        try {
          const tx = db.transaction(IDB_STORE, 'readonly');
          const req = tx.objectStore(IDB_STORE).get(key);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        } catch (_) {
          resolve(null);
        }
      });
    }

    function writeToIDB(key, value) {
      idbWriteQueue = idbWriteQueue.then(async () => {
        const db = await openVaultIDB();
        if (!db) return;
        return new Promise((resolve) => {
          try {
            const tx = db.transaction(IDB_STORE, 'readwrite');
            tx.objectStore(IDB_STORE).put(value, key);
            tx.oncomplete = () => resolve();
            tx.onerror = () => resolve();
          } catch (_) {
            resolve();
          }
        });
      });
      return idbWriteQueue;
    }

    async function pushStateToSupabase(username, stateObj, passHash) {
      if (!supabaseClient || !username) return false;
      try {
        const payload = {
          username,
          state_json: stateObj,
          updated_at: new Date().toISOString()
        };
        if (passHash) payload.pass_hash = passHash;
        const { error } = await supabaseClient
          .from('cadence_profiles')
          .upsert(payload, { onConflict: 'username' });
        if (error) {
          lastCloudSyncError = error.message || 'Cloud sync rejected';
          return false;
        }
        lastCloudSyncError = '';
        lastCloudSyncAt = Date.now();
        return true;
      } catch (e) {
        lastCloudSyncError = e?.message || 'Network unavailable';
        return false;
      }
    }

    async function pullStateFromSupabase(username) {
      if (!supabaseClient || !username) return null;
      try {
        const { data, error } = await supabaseClient
          .from('cadence_profiles')
          .select('username, pass_hash, state_json')
          .eq('username', username)
          .maybeSingle();
        if (error || !data || !data.state_json) return null;
        const st = data.state_json;
        if (data.pass_hash) st._passHash = data.pass_hash;
        return st;
      } catch (_) {
        return null;
      }
    }

    function normalizeLoadedState(raw) {
      const clean = {
        accent: (raw && THEME_PRESETS[raw.accent]) ? raw.accent : 'blue',
        firstName: (raw && raw.firstName) || '',
        lastName: (raw && raw.lastName) || '',
        gender: (raw && raw.gender === 'male') ? 'male' : 'female',
        weeklyGoal: (raw && Number(raw.weeklyGoal) >= 1 && Number(raw.weeklyGoal) <= 7) ? Number(raw.weeklyGoal) : 3,
        measurementUnit: (raw && raw.measurementUnit === 'imperial') ? 'imperial' : 'metric',
        profilePhoto: (raw && raw.profilePhoto) || '',
        bioStats: {
          age: (raw && raw.bioStats && Number(raw.bioStats.age)) || 25,
          heightCm: (raw && raw.bioStats && Number(raw.bioStats.heightCm)) || 168,
          weightKg: (raw && raw.bioStats && Number(raw.bioStats.weightKg)) || 62,
          activityMultiplier: (raw && raw.bioStats && Number(raw.bioStats.activityMultiplier)) || 1.55,
          goalMode: (raw && raw.bioStats && raw.bioStats.goalMode) || 'maintain'
        },
        calorieLogs: (raw && raw.calorieLogs && typeof raw.calorieLogs === 'object') ? raw.calorieLogs : {},
        favoriteFoods: (raw && Array.isArray(raw.favoriteFoods)) ? raw.favoriteFoods : [],
        aiCalorieUsage: (raw && raw.aiCalorieUsage && typeof raw.aiCalorieUsage === 'object')
          ? { date: String(raw.aiCalorieUsage.date || ''), count: Number(raw.aiCalorieUsage.count) || 0 }
          : { date: '', count: 0 },
        workouts: (raw && raw.workouts && typeof raw.workouts === 'object') ? raw.workouts : {},
        measurements: (raw && Array.isArray(raw.measurements)) ? raw.measurements : [],
        customExercises: (raw && Array.isArray(raw.customExercises)) ? raw.customExercises : [],
        templates: (raw && Array.isArray(raw.templates) && raw.templates.length > 0)
          ? raw.templates
          : JSON.parse(JSON.stringify(DEFAULT_TEMPLATES)),
        _passHash: (raw && raw._passHash) || '',
        _displayName: (raw && raw._displayName) || '',
        _updatedAt: (raw && Number(raw._updatedAt)) || 0
      };
      return clean;
    }

    async function saveState(forceCloud = false) {
      appState._updatedAt = Date.now();
      const snapshot = JSON.parse(JSON.stringify(appState));

      if (accountSession && accountSession.username) {
        const userKey = `${ACCOUNT_VAULT_PREFIX}${accountSession.username}`;
        snapshot._passHash = accountSession.passHash || snapshot._passHash || '';
        snapshot._displayName = getDisplayFirstName();
        try {
          localStorage.setItem(userKey, JSON.stringify(snapshot));
          localStorage.setItem(`${userKey}_backup`, JSON.stringify(snapshot));
        } catch (_) {}
        await writeToIDB(userKey, snapshot);
        if (supabaseClient) {
          await pushStateToSupabase(accountSession.username, snapshot, snapshot._passHash);
        }
      } else {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot));
          localStorage.setItem(BACKUP_STORAGE_KEY, JSON.stringify(snapshot));
        } catch (_) {}
        await writeToIDB(IDB_KEY, snapshot);
      }
    }

    async function hydrateStateFromVault() {
      initSupabase();
      try {
        const rawSess = JSON.parse(localStorage.getItem(ACCOUNT_SESSION_KEY) || 'null');
        if (rawSess && rawSess.username && (!rawSess.expiresAt || Date.now() < rawSess.expiresAt)) {
          accountSession = rawSess;
        } else {
          accountSession = null;
        }
      } catch (_) {
        accountSession = null;
      }

      if (accountSession && accountSession.username) {
        const userKey = `${ACCOUNT_VAULT_PREFIX}${accountSession.username}`;
        let localUser = null;
        try {
          localUser = JSON.parse(localStorage.getItem(userKey) || localStorage.getItem(`${userKey}_backup`) || 'null');
        } catch (_) {}
        const idbUser = await readFromIDB(userKey);
        if (idbUser && (!localUser || (idbUser._updatedAt || 0) > (localUser._updatedAt || 0))) {
          localUser = idbUser;
        }

        const cloudUser = await pullStateFromSupabase(accountSession.username);
        let chosen = localUser;
        if (cloudUser && (!localUser || (cloudUser._updatedAt || 0) >= (localUser._updatedAt || 0))) {
          chosen = cloudUser;
        }

        appState = normalizeLoadedState(chosen || {});
        if (!appState.firstName && accountSession.firstName) appState.firstName = accountSession.firstName;
        if (!appState.lastName && accountSession.lastName) appState.lastName = accountSession.lastName;
        if (accountSession.gender && !chosen?.gender) appState.gender = accountSession.gender;

        if (!cloudUser && supabaseClient) {
          await saveState(true);
        }
      } else {
        let localGuest = null;
        try {
          localGuest = JSON.parse(localStorage.getItem(STORAGE_KEY) || localStorage.getItem(BACKUP_STORAGE_KEY) || 'null');
        } catch (_) {}
        const idbGuest = await readFromIDB(IDB_KEY);
        if (idbGuest && (!localGuest || (idbGuest._updatedAt || 0) > (localGuest._updatedAt || 0))) {
          localGuest = idbGuest;
        }
        appState = normalizeLoadedState(localGuest || {});
      }

      applyAccentTheme(appState.accent, false);
      updateAccountHeaderUI();
      isStateHydrated = true;
    }

    /* ==========================================================================
       3. DATE, THEME, ACCOUNT HEADER & TOAST UTILITIES
       ========================================================================== */
    function getTodayStr() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function parseLocalDate(dateStr) {
      const [y, m, d] = (dateStr || getTodayStr()).split('-').map(Number);
      return new Date(y, (m || 1) - 1, d || 1);
    }

    function toDateStr(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatHumanDate(dateStr) {
      const dt = parseLocalDate(dateStr);
      return dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById('toast');
      const txt = document.getElementById('toastMessage');
      if (!el || !txt) return;
      txt.textContent = msg;
      el.classList.remove('opacity-0', '-translate-y-2');
      el.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        el.classList.add('opacity-0', '-translate-y-2');
        el.classList.remove('opacity-100', 'translate-y-0');
      }, 2400);
    }

    function getDisplayFirstName() {
      if (appState.firstName && appState.firstName.trim()) return appState.firstName.trim();
      if (accountSession && accountSession.firstName) return accountSession.firstName;

    /* ==========================================================================
       4. EXERCISE CATALOG & PROGRESSIVE OVERLOAD HELPERS
       ========================================================================== */
    function getAllExercises() {
      return [...EXERCISE_CATALOG, ...(appState.customExercises || [])];
    }

    function getExerciseById(id) {
      return getAllExercises().find(e => e.id === id) || {
        id,
        name: id,
        muscle: 'Custom',
        equipment: 'Custom',
        isCardio: false
      };
    }

    function isExerciseCardio(ex) {
      if (!ex) return false;
      if (typeof ex.isCardio === 'boolean') return ex.isCardio;
      return (ex.muscle || '').toLowerCase() === 'cardio';
    }

    function getExerciseHistory(exerciseId, excludeDate = null) {
      const dates = Object.keys(appState.workouts || {}).sort();
      const history = [];
      for (const dateStr of dates) {
        if (excludeDate && dateStr === excludeDate) continue;
        const w = appState.workouts[dateStr];
        if (!w || !Array.isArray(w.exercises)) continue;
        const entry = w.exercises.find(e => e.exerciseId === exerciseId);
        if (!entry || !Array.isArray(entry.sets) || entry.sets.length === 0) continue;

        let maxWeight = 0;
        let maxReps = 0;
        let totalVolume = 0;
        for (const s of entry.sets) {
          const wt = parseFloat(s.weight) || 0;
          const rp = parseFloat(s.reps) || 0;
          if (wt > maxWeight) maxWeight = wt;
          if (rp > maxReps) maxReps = rp;
          totalVolume += wt * (rp || 1);
        }
        history.push({ date: dateStr, sets: entry.sets, maxWeight, maxReps, totalVolume });
      }
      return history;
    }

    function evaluateSetOverload(exerciseId, weightVal, repsVal, currentDate) {
      const wt = parseFloat(weightVal) || 0;
      const rp = parseFloat(repsVal) || 0;
      if (wt <= 0 && rp <= 0) return { status: 'neutral', badge: '' };

      const history = getExerciseHistory(exerciseId, currentDate);
      if (history.length === 0) return { status: 'baseline', badge: 'BASE' };

      const prev = history[history.length - 1];
      if (wt > prev.maxWeight || (wt === prev.maxWeight && rp > prev.maxReps)) {
        return { status: 'pr', badge: '↑ PR' };
      }
      if (wt === prev.maxWeight && rp === prev.maxReps) {
        return { status: 'match', badge: '= MATCH' };
      }
      return { status: 'building', badge: '' };
    }

    /* ==========================================================================
       5. STREAK & 365-DAY MATRIX CALCULATIONS
       ========================================================================== */
    function getCompletedDaysLast365() {
      const today = parseLocalDate(getTodayStr());
      const start = new Date(today);
      start.setDate(today.getDate() - 364);
      const startStr = toDateStr(start);
      const todayStr = toDateStr(today);
      return Object.keys(appState.workouts || {}).filter(d => d >= startStr && d <= todayStr).length;
    }

    function getWeeklyStreakCount() {
      const goal = appState.weeklyGoal || 3;
      const today = parseLocalDate(getTodayStr());
      const dayOfWeek = today.getDay();
      const mondayOffset = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
      const currentWeekMonday = new Date(today);
      currentWeekMonday.setDate(today.getDate() + mondayOffset);

      let streak = 0;
      for (let w = 0; w < 104; w++) {
        const weekStart = new Date(currentWeekMonday);
        weekStart.setDate(currentWeekMonday.getDate() - w * 7);
        const weekEnd = new Date(weekStart);
        weekEnd.setDate(weekStart.getDate() + 6);

        const sStr = toDateStr(weekStart);
        const eStr = toDateStr(weekEnd);
        const count = Object.keys(appState.workouts || {}).filter(d => d >= sStr && d <= eStr).length;

        if (count >= goal) {
          streak++;
        } else if (w === 0) {
          continue;
        } else {
          break;
        }
      }
      return streak;
    }

    function buildYearMatrix() {
      if (cachedYearMatrix) return cachedYearMatrix;
      const today = parseLocalDate(getTodayStr());
      const startDate = new Date(today);
      startDate.setDate(today.getDate() - 364);

      const startDay = startDate.getDay();
      const padStart = startDay === 0 ? 6 : startDay - 1;
      const gridStart = new Date(startDate);
      gridStart.setDate(startDate.getDate() - padStart);

      const cells = [];
      const cur = new Date(gridStart);
      const endBound = new Date(today);
      const endDay = endBound.getDay();
      const padEnd = endDay === 0 ? 0 : 7 - endDay;
      endBound.setDate(today.getDate() + padEnd);

      const startStr = toDateStr(startDate);
      const todayStr = toDateStr(today);

      while (cur <= endBound) {
        const dStr = toDateStr(cur);
        const inRange = dStr >= startStr && dStr <= todayStr;
        const workout = inRange ? (appState.workouts[dStr] || null) : null;
        cells.push({
          date: dStr,
          inRange,
          isToday: dStr === todayStr,
          workout,
          monthLabel: cur.getDate() === 1 ? cur.toLocaleDateString('en-US', { month: 'short' }) : ''
        });
        cur.setDate(cur.getDate() + 1);
      }
      cachedYearMatrix = cells;
      return cells;
    }

    /* ==========================================================================
       6. TOP WEEK STRIP RENDERER
       ========================================================================== */
    function renderWeekStrip() {
      const strip = document.getElementById('weekStrip');
      const yearCountEl = document.getElementById('headerYearCount');
      const streakBadgeEl = document.getElementById('streakBadge');

      const completed365 = getCompletedDaysLast365();
      const weeklyStreak = getWeeklyStreakCount();
      if (yearCountEl) yearCountEl.textContent = `${completed365}/365d`;
      if (streakBadgeEl) streakBadgeEl.textContent = `🔥 ${weeklyStreak}w Streak`;

      if (!strip) return;
      const today = parseLocalDate(getTodayStr());
      const todayStr = toDateStr(today);
      const dayOfWeek = today.getDay();
      const mondayOffset = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
      const monday = new Date(today);
      monday.setDate(today.getDate() + mondayOffset);

      const labels = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
      let html = '';
      for (let i = 0; i < 7; i++) {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        const dStr = toDateStr(d);
        const hasWorkout = Boolean(appState.workouts && appState.workouts[dStr]);
        const isToday = dStr === todayStr;
        const isSelected = dStr === selectedDate;

        html += `
          <button type="button" onclick="openDayDetailModal('${dStr}')"
            class="flex flex-col items-center py-1.5 rounded-xl border transition ${
              hasWorkout
                ? 'accent-bg text-obsidian accent-border font-extrabold'
                : isSelected
                  ? 'bg-surfaceElevated border-white/30 text-white'
                  : 'bg-surface border-borderDark text-mutedText hover:text-white'
            }">
            <span class="text-[9px] font-bold uppercase opacity-80">${labels[i]}</span>
            <span class="text-xs font-extrabold mt-0.5 ${isToday && !hasWorkout ? 'accent-text' : ''}">${d.getDate()}</span>
          </button>
        `;
      }
      strip.innerHTML = html;
    }

    /* ==========================================================================
       7. VIEW 1: 365-DAY YEAR GRID & MONTHLY CALENDAR
       ========================================================================== */
    function renderGridSquaresHtml(isFullScreen = false) {
      const cells = buildYearMatrix();
      const numCols = Math.ceil(cells.length / 7);
      const sqSize = isFullScreen ? 'w-3 h-3 rounded-[3px]' : 'w-2.5 h-2.5 rounded-[2px]';

      let colsHtml = '';
      for (let c = 0; c < numCols; c++) {
        let monthHeader = `<div class="h-3.5 text-[8px] font-bold text-mutedText leading-none"></div>`;
        for (let r = 0; r < 7; r++) {
          const cell = cells[c * 7 + r];
          if (cell && cell.inRange && cell.monthLabel) {
            monthHeader = `<div class="h-3.5 text-[8px] font-bold text-mutedText leading-none whitespace-nowrap">${cell.monthLabel}</div>`;
            break;
          }
        }

        let colCells = '';
        for (let r = 0; r < 7; r++) {
          const cell = cells[c * 7 + r];
          if (!cell || !cell.inRange) {
            colCells += `<div class="${sqSize} bg-transparent"></div>`;
            continue;
          }
          const done = Boolean(cell.workout);
          colCells += `
            <button type="button" onclick="openDayDetailModal('${cell.date}')" title="${cell.date}"
              class="grid-sq ${sqSize} ${
                done
                  ? 'accent-bg'
                  : cell.isToday
                    ? 'bg-surfaceElevated ring-1 ring-white/50'
                    : 'bg-[#1D1D24] hover:bg-white/20'
              }">
            </button>
          `;
        }
        colsHtml += `<div class="flex flex-col gap-1 shrink-0">${monthHeader}${colCells}</div>`;
      }

      return `
        <div class="overflow-x-auto no-scrollbar pb-1" id="${isFullScreen ? 'fsGridScroller' : 'mainGridScroller'}">
          <div class="inline-flex gap-1 min-w-full justify-end">
            ${colsHtml}
          </div>
        </div>
      `;
    }

    function renderMonthlyCalendarHtml() {
      const base = parseLocalDate(getTodayStr());
      base.setDate(1);
      base.setMonth(base.getMonth() + calendarMonthOffset);

      const year = base.getFullYear();
      const month = base.getMonth();
      const monthTitle = base.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
      const firstDay = new Date(year, month, 1).getDay();
      const pad = firstDay === 0 ? 6 : firstDay - 1;
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const todayStr = getTodayStr();

      let cells = '';
      for (let i = 0; i < pad; i++) {
        cells += `<div></div>`;
      }
      for (let d = 1; d <= daysInMonth; d++) {
        const dStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const done = Boolean(appState.workouts && appState.workouts[dStr]);
        const isToday = dStr === todayStr;
        cells += `
          <button type="button" onclick="openDayDetailModal('${dStr}')"
            class="aspect-square rounded-xl flex items-center justify-center text-xs font-extrabold border transition ${
              done
                ? 'accent-bg text-obsidian accent-border'
                : isToday
                  ? 'bg-surfaceElevated border-white/40 text-white'
                  : 'bg-obsidian border-borderDark text-mutedText hover:text-white'
            }">
            ${d}
          </button>
        `;
      }

      return `
        <div class="space-y-3">
          <div class="flex items-center justify-between">
            <button type="button" onclick="calendarMonthOffset--; renderGridView();" class="w-8 h-8 rounded-full bg-obsidian border border-borderDark text-xs font-bold text-white">‹</button>
            <span class="text-xs font-extrabold text-white">${monthTitle}</span>
            <button type="button" onclick="calendarMonthOffset++; renderGridView();" class="w-8 h-8 rounded-full bg-obsidian border border-borderDark text-xs font-bold text-white">›</button>
          </div>
          <div class="grid grid-cols-7 gap-1.5 text-center text-[10px] font-bold text-mutedText">
            <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
          </div>
          <div class="grid grid-cols-7 gap-1.5">
            ${cells}
          </div>
        </div>
      `;
    }

    function renderGridView() {
      const container = document.getElementById('view_grid');
      if (!container) return;

      const completed365 = getCompletedDaysLast365();
      const pct = Math.round((completed365 / 365) * 100);
      const todayStr = getTodayStr();
      const todayLogged = Boolean(appState.workouts && appState.workouts[todayStr]);

      const recentDates = Object.keys(appState.workouts || {}).sort((a, b) => b.localeCompare(a)).slice(0, 5);
      const recentHtml = recentDates.length === 0
        ? `<div class="bg-surface border border-borderDark rounded-2xl p-4 text-center text-xs text-mutedText">No workouts logged yet. Tap <span class="text-white font-bold">+ Log</span> or <span class="text-white font-bold">Quick Check-In</span> to fill your first square!</div>`
        : recentDates.map(dStr => {
            const w = appState.workouts[dStr];
            const exCount = (w.exercises || []).length;
            const totalSets = (w.exercises || []).reduce((acc, e) => acc + (e.sets ? e.sets.length : 0), 0);
            return `
              <button type="button" onclick="openDayDetailModal('${dStr}')" class="w-full text-left bg-surface border border-borderDark hover:border-white/25 rounded-2xl p-3.5 flex items-center justify-between transition">
                <div class="min-w-0 pr-2">
                  <div class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full accent-bg shrink-0"></span>
                    <p class="text-xs font-extrabold text-white truncate">${escapeHtml(w.title || 'Workout Session')}</p>
                  </div>
                  <p class="text-[11px] text-mutedText mt-0.5">${formatHumanDate(dStr)} · ${exCount > 0 ? `${exCount} exercises · ${totalSets} sets` : 'Quick Check-In'}</p>
                </div>
                <span class="text-xs text-mutedText">›</span>
              </button>
            `;
          }).join('');

      container.innerHTML = `
        <section class="bg-surface border border-borderDark rounded-3xl p-4 space-y-3.5">
          <div class="flex items-center justify-between gap-2">
            <div>
              <div class="flex items-center gap-2">
                <h2 class="text-sm font-extrabold text-white">YEAR GRID</h2>
                <span class="text-[11px] font-extrabold accent-text">${completed365} / 365 (${pct}%)</span>
              </div>
              <p class="text-[11px] text-mutedText">Tap any square to inspect or log a session</p>
            </div>
            <div class="flex items-center gap-1.5">
              <div class="grid grid-cols-2 bg-obsidian border border-borderDark p-0.5 rounded-xl">
                <button type="button" onclick="gridMode = '365'; renderGridView();" class="px-2 py-1 rounded-lg text-[10px] font-extrabold transition ${gridMode === '365' ? 'accent-bg text-obsidian' : 'text-mutedText'}">365d</button>
                <button type="button" onclick="gridMode = 'month'; renderGridView();" class="px-2 py-1 rounded-lg text-[10px] font-extrabold transition ${gridMode === 'month' ? 'accent-bg text-obsidian' : 'text-mutedText'}">Month</button>
              </div>
              <button type="button" onclick="openFullScreenYearGrid()" aria-label="Expand Year Grid" class="w-8 h-8 rounded-xl bg-obsidian border border-borderDark text-xs font-bold text-white flex items-center justify-center">
                ⤢
              </button>
            </div>
          </div>

          ${gridMode === '365' ? renderGridSquaresHtml(false) : renderMonthlyCalendarHtml()}

          <div class="grid grid-cols-2 gap-2 pt-1">
            <button type="button" onclick="quickCheckInToday()" class="py-2.5 px-3 rounded-2xl bg-obsidian border border-borderDark hover:border-white/25 text-xs font-extrabold text-white transition active:scale-95">
              ${todayLogged ? '✓ Checked In Today' : '⚡ Quick Check-In'}
            </button>
            <button type="button" onclick="startOrResumeTodayWorkout()" class="py-2.5 px-3 rounded-2xl accent-bg text-obsidian text-xs font-extrabold transition active:scale-95 shadow-lg">
              + Log Workout
            </button>
          </div>
        </section>

        <section class="space-y-2.5">
          <div class="flex items-center justify-between">
            <h3 class="text-xs font-extrabold uppercase tracking-wider text-mutedText">Recent Sessions</h3>
            <button type="button" onclick="switchTab('templates')" class="text-[11px] font-extrabold accent-text">Routines →</button>
          </div>
          <div class="space-y-2">
            ${recentHtml}
          </div>
        </section>
      `;

      dirtyTabs.grid = false;
      requestAnimationFrame(() => {
        const scroller = document.getElementById('mainGridScroller');
        if (scroller) scroller.scrollLeft = scroller.scrollWidth;
      });
    }

    function openFullScreenYearGrid() {
      const overlay = document.getElementById('fullScreenGridOverlay');
      const body = document.getElementById('fsGridBody');
      const sub = document.getElementById('fsGridSubtitle');
      if (!overlay || !body) return;
      const completed = getCompletedDaysLast365();
      if (sub) sub.textContent = `${completed} of 365 days completed (${Math.round((completed / 365) * 100)}%)`;
      body.innerHTML = `
        <div class="bg-surface border border-borderDark rounded-3xl p-4 space-y-3">
          ${renderGridSquaresHtml(true)}
          <div class="flex items-center justify-between text-[11px] text-mutedText pt-2 border-t border-borderDark">
            <span>Tap any square to view or edit</span>
            <span class="font-bold text-white">${completed} days active</span>
          </div>
        </div>
      `;
      overlay.classList.remove('hidden');
      requestAnimationFrame(() => {
        const scroller = document.getElementById('fsGridScroller');
        if (scroller) scroller.scrollLeft = scroller.scrollWidth;
      });
    }

    function closeFullScreenYearGrid() {
      const overlay = document.getElementById('fullScreenGridOverlay');
      if (overlay) overlay.classList.add('hidden');
    }

    async function quickCheckInToday() {
      const todayStr = getTodayStr();
      if (!appState.workouts[todayStr]) {
        appState.workouts[todayStr] = {
          title: 'Active Check-In',
          notes: '',
          exercises: []
        };
        markTabsDirty('grid', 'overload');
        await saveState();
        renderWeekStrip();
        renderGridView();
        showToast('Today checked in on your Year Grid!');
      } else {
        openDayDetailModal(todayStr);
      }
    }

    /* ==========================================================================
       8. DAY DETAIL MODAL
       ========================================================================== */
    function openDayDetailModal(dateStr) {
      closeFullScreenYearGrid();
      selectedDate = dateStr;
      renderWeekStrip();
      const workout = appState.workouts[dateStr] || null;

      if (!workout) {
        openModal(formatHumanDate(dateStr), `
          <div class="space-y-4 text-center py-2">
            <p class="text-xs text-mutedText">No workout logged for <span class="text-white font-bold">${formatHumanDate(dateStr)}</span> yet.</p>
            <div class="grid grid-cols-2 gap-2.5">
              <button type="button" onclick="quickCheckInDate('${dateStr}')" class="py-3 rounded-2xl bg-obsidian border border-borderDark text-xs font-extrabold text-white">
                ⚡ Quick Check-In
              </button>
              <button type="button" onclick="closeModal(); editWorkoutForDate('${dateStr}');" class="py-3 rounded-2xl accent-bg text-obsidian text-xs font-extrabold">
                + Log Exercises
              </button>
            </div>
          </div>
        `);
        return;
      }

      const exSummaryHtml = (workout.exercises || []).length === 0
        ? `<p class="text-xs text-mutedText bg-obsidian border border-borderDark rounded-2xl p-3.5 text-center">Quick check-in logged (no individual sets recorded).</p>`
        : (workout.exercises || []).map(exEntry => {
            const ex = getExerciseById(exEntry.exerciseId);
            const cardio = isExerciseCardio(ex);
            const setsText = (exEntry.sets || []).map((s, idx) =>
              cardio
                ? `Set ${idx + 1}: ${s.weight || 0} min${s.reps ? ` @ ${escapeHtml(s.reps)}` : ''}`
                : `Set ${idx + 1}: ${s.weight || 0}kg × ${s.reps || 0}`
            ).join(' · ');
            return `
              <div class="bg-obsidian border border-borderDark rounded-2xl p-3">
                <p class="text-xs font-extrabold text-white">${escapeHtml(ex.name)}</p>
                <p class="text-[11px] text-mutedText mt-1">${setsText}</p>
              </div>
            `;
          }).join('');

      openModal(formatHumanDate(dateStr), `
        <div class="space-y-3.5">
          <div class="flex items-center justify-between">
            <div>
              <span class="text-[10px] font-extrabold uppercase tracking-wider accent-text">COMPLETED SESSION</span>
              <h4 class="text-sm font-extrabold text-white mt-0.5">${escapeHtml(workout.title || 'Workout Session')}</h4>
            </div>
            <button type="button" onclick="deleteWorkoutForDate('${dateStr}')" class="text-xs font-bold text-coralAccent px-2.5 py-1 rounded-xl bg-coralAccent/10">Delete</button>
          </div>

          <div class="space-y-2 max-h-60 overflow-y-auto">
            ${exSummaryHtml}
          </div>

          <button type="button" onclick="closeModal(); editWorkoutForDate('${dateStr}');" class="w-full py-3 rounded-2xl accent-bg text-obsidian font-extrabold text-xs">
            ✎ Edit Workout
          </button>
        </div>
      `);
    }

    async function quickCheckInDate(dateStr) {
      appState.workouts[dateStr] = {
        title: 'Active Check-In',
        notes: '',
        exercises: []
      };
      markTabsDirty('grid', 'overload');
      await saveState();
      closeModal();
      renderWeekStrip();
      renderCurrentTab();
      showToast(`Checked in for ${formatHumanDate(dateStr)}!`);
    }

    async function deleteWorkoutForDate(dateStr) {
      delete appState.workouts[dateStr];
      if (activeDraft && activeDraft.date === dateStr) activeDraft = null;
      markTabsDirty('grid', 'logger', 'overload');
      await saveState();
      closeModal();
      renderWeekStrip();
      renderCurrentTab();
      showToast('Workout deleted.');
    }

    /* ==========================================================================
       9. VIEW 2: WORKOUT LOGGER & MULTI-SELECT EXERCISE PICKER
       ========================================================================== */
    function ensureDraftForDate(dateStr) {
      if (activeDraft && activeDraft.date === dateStr) return activeDraft;
      const existing = appState.workouts[dateStr];
      if (existing) {
        activeDraft = {
          date: dateStr,
          title: existing.title || 'Workout Session',
          exercises: JSON.parse(JSON.stringify(existing.exercises || []))
        };
      } else {
        activeDraft = {
          date: dateStr,
          title: 'Workout Session',
          exercises: []
        };
      }
      return activeDraft;
    }

    function startOrResumeTodayWorkout() {
      editWorkoutForDate(getTodayStr());
    }

    function editWorkoutForDate(dateStr) {
      selectedDate = dateStr;
      ensureDraftForDate(dateStr);
      markTabsDirty('logger');
      renderWeekStrip();
      switchTab('logger');
    }

    function startWorkoutFromTemplate(tplId) {
      const tpl = (appState.templates || []).find(t => t.id === tplId);
      if (!tpl) return;
      const todayStr = getTodayStr();
      selectedDate = todayStr;
      activeDraft = {
        date: todayStr,
        title: tpl.name,
        exercises: (tpl.exercises || []).map(exId => {
          const hist = getExerciseHistory(exId, todayStr);
          const last = hist.length > 0 ? hist[hist.length - 1] : null;
          return {
            exerciseId: exId,
            sets: last && last.sets.length > 0
              ? last.sets.map(s => ({ weight: s.weight, reps: s.reps }))
              : [{ weight: '', reps: '' }, { weight: '', reps: '' }, { weight: '', reps: '' }]
          };
        })
      };
      markTabsDirty('logger');
      renderWeekStrip();
      switchTab('logger');
      showToast(`Loaded "${tpl.name}"`);
    }

    function renderLoggerView() {
      const container = document.getElementById('view_logger');
      if (!container) return;

      const draft = ensureDraftForDate(selectedDate);
      const templatesQuickHtml = (appState.templates || []).map(t => `
        <button type="button" onclick="startWorkoutFromTemplate('${t.id}')" class="px-3 py-1.5 rounded-full bg-obsidian border border-borderDark hover:border-white/25 text-[11px] font-bold text-white whitespace-nowrap shrink-0">
          ▶ ${escapeHtml(t.name)}
        </button>
      `).join('');

      const exercisesHtml = draft.exercises.length === 0
        ? `<div class="bg-surface border border-borderDark rounded-3xl p-6 text-center space-y-2.5">
             <p class="text-xs font-bold text-white">No exercises added yet</p>
             <p class="text-[11px] text-mutedText">Tap <span class="text-white font-bold">+ Add Exercises</span> below or load one of your saved routines.</p>
           </div>`
        : draft.exercises.map((exEntry, exIdx) => {
            const ex = getExerciseById(exEntry.exerciseId);
            const cardio = isExerciseCardio(ex);
            const hist = getExerciseHistory(exEntry.exerciseId, draft.date);
            const lastSession = hist.length > 0 ? hist[hist.length - 1] : null;
            const prevHint = lastSession
              ? (cardio
                  ? `Last: ${lastSession.maxWeight} min`
                  : `Last best: ${lastSession.maxWeight}kg × ${lastSession.maxReps}`)
              : 'First time logging';

            const setsRows = (exEntry.sets || []).map((s, setIdx) => {
              const ov = evaluateSetOverload(exEntry.exerciseId, s.weight, s.reps, draft.date);
              return `
                <div class="grid grid-cols-12 gap-1.5 items-center">
                  <span class="col-span-2 text-[11px] font-extrabold text-mutedText text-center">Set ${setIdx + 1}</span>
                  <input type="number" step="any" inputmode="decimal" value="${escapeHtml(s.weight)}"
                    placeholder="${cardio ? 'Min' : 'kg'}"
                    oninput="updateDraftSetField(${exIdx}, ${setIdx}, 'weight', this.value, this)"
                    class="col-span-4 bg-obsidian border border-borderDark rounded-xl px-2.5 py-2 text-base sm:text-xs font-extrabold text-white text-center focus:outline-none focus:border-white/35" />
                  <input type="${cardio ? 'text' : 'number'}" ${cardio ? '' : 'inputmode="numeric"'} value="${escapeHtml(s.reps)}"
                    placeholder="${cardio ? 'Lvl/Dist' : 'Reps'}"
                    oninput="updateDraftSetField(${exIdx}, ${setIdx}, 'reps', this.value, this)"
                    class="col-span-4 bg-obsidian border border-borderDark rounded-xl px-2.5 py-2 text-base sm:text-xs font-extrabold text-white text-center focus:outline-none focus:border-white/35" />
                  <div class="col-span-2 flex items-center justify-end gap-1">
                    <span id="ovBadge_${exIdx}_${setIdx}" class="text-[9px] font-extrabold ${ov.status === 'pr' ? 'accent-text' : 'text-mutedText'}">${ov.badge}</span>
                    <button type="button" onclick="removeSetFromDraftExercise(${exIdx}, ${setIdx})" class="text-xs text-mutedText hover:text-coralAccent px-1">✕</button>
                  </div>
                </div>
              `;
            }).join('');

            return `
              <div class="bg-surface border border-borderDark rounded-3xl p-4 space-y-3">
                <div class="flex items-start justify-between gap-2">
                  <div>
                    <span class="text-[9px] font-extrabold uppercase tracking-wider accent-text">${escapeHtml(ex.muscle || 'Exercise')}</span>
                    <h3 class="text-sm font-extrabold text-white">${escapeHtml(ex.name)}</h3>
                    <p class="text-[10px] text-mutedText">${prevHint}</p>
                  </div>
                  <button type="button" onclick="removeExerciseFromDraft(${exIdx})" class="text-xs text-mutedText hover:text-coralAccent px-2 py-1">Remove</button>
                </div>

                <div class="space-y-2">
                  ${setsRows}
                </div>

                <button type="button" onclick="addSetToDraftExercise(${exIdx})" class="w-full py-2 rounded-xl bg-obsidian border border-borderDark hover:border-white/25 text-[11px] font-extrabold text-white">
                  + Add Set
                </button>
              </div>
            `;
          }).join('');

      container.innerHTML = `
        <section class="space-y-3.5">
          <div class="bg-surface border border-borderDark rounded-3xl p-4 space-y-3">
            <div class="flex items-center justify-between gap-2">
              <input type="text" value="${escapeHtml(draft.title)}" oninput="activeDraft.title = this.value"
                placeholder="Workout Title (e.g. Lower Body)"
                class="flex-1 bg-obsidian border border-borderDark rounded-xl px-3 py-2 text-sm font-extrabold text-white focus:outline-none" />
              <input type="date" value="${draft.date}" onchange="editWorkoutForDate(this.value)"
                class="bg-obsidian border border-borderDark rounded-xl px-2.5 py-2 text-xs font-bold text-white" />
            </div>

            ${templatesQuickHtml ? `
              <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pt-0.5">
                ${templatesQuickHtml}
              </div>
            ` : ''}
          </div>

          <div class="space-y-3">
            ${exercisesHtml}
          </div>

          <div class="grid grid-cols-2 gap-2.5 pt-1">
            <button type="button" onclick="openExercisePicker('logger')" class="py-3.5 rounded-2xl bg-surface border border-borderDark hover:border-white/25 text-xs font-extrabold text-white">
              + Add Exercises
            </button>
            <button type="button" onclick="saveWorkoutSession()" class="py-3.5 rounded-2xl accent-bg text-obsidian text-xs font-extrabold shadow-lg active:scale-95 transition">
              ✓ Save Workout
            </button>
          </div>
        </section>
      `;
      dirtyTabs.logger = false;
    }

    function updateDraftSetField(exIdx, setIdx, field, val) {
      if (!activeDraft || !activeDraft.exercises[exIdx] || !activeDraft.exercises[exIdx].sets[setIdx]) return;
      activeDraft.exercises[exIdx].sets[setIdx][field] = val;
      const s = activeDraft.exercises[exIdx].sets[setIdx];
      const ov = evaluateSetOverload(activeDraft.exercises[exIdx].exerciseId, s.weight, s.reps, activeDraft.date);
      const badgeEl = document.getElementById(`ovBadge_${exIdx}_${setIdx}`);
      if (badgeEl) {
        badgeEl.textContent = ov.badge;
        badgeEl.className = `text-[9px] font-extrabold ${ov.status === 'pr' ? 'accent-text' : 'text-mutedText'}`;
      }
    }

    function addSetToDraftExercise(exIdx) {
      if (!activeDraft || !activeDraft.exercises[exIdx]) return;
      const sets = activeDraft.exercises[exIdx].sets;
      const last = sets[sets.length - 1] || { weight: '', reps: '' };
      sets.push({ weight: last.weight, reps: last.reps });
      renderLoggerView();
    }

    function removeSetFromDraftExercise(exIdx, setIdx) {
      if (!activeDraft || !activeDraft.exercises[exIdx]) return;
      activeDraft.exercises[exIdx].sets.splice(setIdx, 1);
      renderLoggerView();
    }

    function removeExerciseFromDraft(exIdx) {
      if (!activeDraft) return;
      activeDraft.exercises.splice(exIdx, 1);
      renderLoggerView();
    }

    async function saveWorkoutSession() {
      if (!activeDraft) return;
      const cleanExercises = activeDraft.exercises.map(exEntry => ({
        exerciseId: exEntry.exerciseId,
        sets: (exEntry.sets || []).filter(s => String(s.weight || '').trim() !== '' || String(s.reps || '').trim() !== '')
      }));

      appState.workouts[activeDraft.date] = {
        title: (activeDraft.title || 'Workout Session').trim(),
        notes: '',
        exercises: cleanExercises
      };

      selectedDate = activeDraft.date;
      if (cleanExercises.length > 0) {
        selectedOverloadExerciseId = cleanExercises[0].exerciseId;
      }

      markTabsDirty('grid', 'logger', 'overload');
      await saveState();
      renderWeekStrip();
      switchTab('grid');
      showToast('Workout saved & Year Grid updated!');
    }

    /* ==========================================================================
       10. MULTI-SELECT EXERCISE PICKER & CUSTOM EXERCISE CREATION
       ========================================================================== */
    let pickerTargetMode = 'logger';
    let pickerSearchQuery = '';
    let pickerMuscleFilter = 'All';

    function openExercisePicker(mode = 'logger') {
      pickerTargetMode = mode;
      pickerSearchQuery = '';
      pickerMuscleFilter = 'All';
      if (mode === 'template') {
        pickerSelectedIds = [...(routineBuilderDraft.exerciseIds || [])];
      } else {
        const draft = ensureDraftForDate(selectedDate);
        pickerSelectedIds = draft.exercises.map(e => e.exerciseId);
      }

      const muscles = ['All', 'Legs', 'Glutes', 'Posterior', 'Chest', 'Back', 'Shoulders', 'Arms', 'Core', 'Cardio'];
      const muscleChips = muscles.map(m => `
        <button type="button" onclick="pickerMuscleFilter = '${m}'; updateExercisePickerList();"
          class="px-2.5 py-1 rounded-full text-[10px] font-extrabold bg-obsidian border border-borderDark text-white hover:border-white/30 whitespace-nowrap shrink-0">
          ${m}
        </button>
      `).join('');

      const routineHeaderHtml = mode === 'template' ? `
        <div class="bg-obsidian border border-borderDark rounded-2xl p-3 space-y-2">
          <div class="grid grid-cols-3 gap-2">
            <input id="pickerRoutineName" type="text" value="${escapeHtml(routineBuilderDraft.name)}"
              oninput="routineBuilderDraft.name = this.value"
              placeholder="Routine name..."
              class="col-span-2 bg-surface border border-borderDark rounded-xl px-3 py-2 text-xs font-extrabold text-white focus:outline-none" />
            <input id="pickerRoutineTag" type="text" value="${escapeHtml(routineBuilderDraft.tag || 'CUSTOM')}"
              oninput="routineBuilderDraft.tag = this.value"
              placeholder="Tag"
              class="col-span-1 bg-surface border border-borderDark rounded-xl px-2.5 py-2 text-[11px] font-extrabold text-white uppercase focus:outline-none" />
          </div>
        </div>
      ` : '';

      openModal(mode === 'template' ? 'Build Routine & Pick Exercises' : 'Select Exercises', `
        <div class="space-y-3">
          ${routineHeaderHtml}

          <input id="exerciseSearchInput" type="text"
            oninput="pickerSearchQuery = this.value; updateExercisePickerList();"
            placeholder="Search or type a new exercise name..."
            class="w-full bg-obsidian border border-borderDark rounded-2xl px-3.5 py-2.5 text-base sm:text-xs font-bold text-white focus:outline-none focus:border-white/30" />

          <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
            ${muscleChips}
          </div>

          <div id="exercisePickerListContainer" class="space-y-1.5 max-h-64 overflow-y-auto pr-0.5"></div>

          <div class="grid ${mode === 'template' ? 'grid-cols-2' : 'grid-cols-1'} gap-2 pt-1">
            ${mode === 'template' ? `
              <button type="button" onclick="confirmExercisePicker()" class="py-3 rounded-2xl bg-obsidian border border-borderDark text-xs font-extrabold text-white">

              </button>

    function calculateBmrAndTdee() {
      const bio = appState.bioStats || { age: 25, heightCm: 168, weightKg: 62, activityMultiplier: 1.55, goalMode: 'maintain' };
      const gender = appState.gender === 'male' ? 'male' : 'female';
      const weight = Math.max(30, parseFloat(bio.weightKg) || 62);
      const height = Math.max(100, parseFloat(bio.heightCm) || 168);
      const age = Math.max(13, parseInt(bio.age, 10) || 25);
      const mult = parseFloat(bio.activityMultiplier) || 1.55;

      const base = (10 * weight) + (6.25 * height) - (5 * age);
      const bmr = Math.round(gender === 'male' ? base + 5 : base - 161);
      const tdee = Math.round(bmr * mult);

      let targetCalories = tdee;
      if (bio.goalMode === 'cut') targetCalories = Math.max(1200, tdee - 400);
      else if (bio.goalMode === 'bulk') targetCalories = tdee + 300;

      const proteinGrams = Math.round(weight * 2.0);
      return { gender, bmr, tdee, targetCalories, proteinGrams };
    }

    function getCurrentWeekMealHistory() {
      const today = parseLocalDate(getTodayStr());
      const dayOfWeek = today.getDay();
      const mondayOffset = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
      const monday = new Date(today);
      monday.setDate(today.getDate() + mondayOffset);
      const sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);

      const mondayStr = toDateStr(monday);
      const sundayStr = toDateStr(sunday);

      const logs = appState.calorieLogs || {};
      const datesInWeek = Object.keys(logs)
        .filter(d => d >= mondayStr && d <= sundayStr)
        .sort((a, b) => b.localeCompare(a));

      const entries = [];
      for (const dateStr of datesInWeek) {
        const dayItems = Array.isArray(logs[dateStr]) ? logs[dateStr] : [];
        for (let i = dayItems.length - 1; i >= 0; i--) {
          const item = dayItems[i];
          if (!item || !item.name) continue;
          entries.push({
            dateStr,
            name: item.name,
            calories: Math.round(Number(item.calories) || 0),
            protein: Math.round(Number(item.protein) || 0),
            meal: item.meal || 'snacks'
          });
        }
      }
      return entries;
    }

    function estimateMealLocallyFallback(mealDescription) {
      const text = mealDescription.toLowerCase();
      const ingredients = [];

      const rules = [
        { regex: /(?:(\d+(?:\.\d+)?)\s*(?:g|grams?))?\s*chicken\s*(?:breast|fillet)?/i, name: 'Chicken Breast', baseG: 150, kcal100: 165, p100: 31, c100: 0, f100: 3.6 },
        { regex: /(?:(\d+(?:\.\d+)?)\s*(?:g|grams?))?\s*(?:beef|steak)/i, name: 'Beef', baseG: 150, kcal100: 210, p100: 26, c100: 0, f100: 11 },
        { regex: /(?:(\d+(?:\.\d+)?)\s*(?:g|grams?))?\s*salmon/i, name: 'Salmon', baseG: 150, kcal100: 208, p100: 20, c100: 0, f100: 13 },
        { regex: /(?:(\d+)\s*)?eggs?/i, name: 'Whole Eggs', isUnit: true, unitG: 50, baseUnits: 2, kcalUnit: 72, pUnit: 6.3, cUnit: 0.4, fUnit: 5 },
        { regex: /(?:(\d+(?:\.\d+)?)\s*(?:tbsp|tablespoons?|g|grams?))?\s*(?:brown\s+|white\s+)?rice/i, name: 'Cooked Rice', isTbspCapable: true, baseG: 150, kcal100: 125, p100: 2.7, c100: 27, f100: 0.4 },
        { regex: /(?:(\d+(?:\.\d+)?)\s*(?:g|grams?))?\s*(?:oats|oatmeal)/i, name: 'Oats', baseG: 60, kcal100: 380, p100: 13, c100: 66, f100: 7 },
        { regex: /(?:(\d+(?:\.\d+)?)\s*(?:g|grams?))?\s*(?:pasta|spaghetti)/i, name: 'Cooked Pasta', baseG: 180, kcal100: 158, p100: 5.8, c100: 31, f100: 0.9 },
        { regex: /(?:(\d+(?:\.\d+)?)\s*(?:g|grams?))?\s*potato(?:es)?/i, name: 'Potato', baseG: 180, kcal100: 87, p100: 2, c100: 20, f100: 0.1 },
        { regex: /(?:(\d+)\s*(?:slices?)?)?\s*bread|toast/i, name: 'Bread Slice', isUnit: true, unitG: 35, baseUnits: 1, kcalUnit: 100, pUnit: 3.5, cUnit: 19, fUnit: 1 },
        { regex: /(?:(\d+(?:\.\d+)?)\s*(?:g|grams?))?\s*cheese|sulguni/i, name: 'Cheese', baseG: 40, kcal100: 290, p100: 21, c100: 2, f100: 22 },
        { regex: /(?:(\d+)\s*)?bananas?/i, name: 'Banana', isUnit: true, unitG: 118, baseUnits: 1, kcalUnit: 105, pUnit: 1.3, cUnit: 27, fUnit: 0.4 },
        { regex: /(?:(\d+(?:\.\d+)?)\s*(?:tbsp|tablespoons?|tsp|teaspoons?))?\s*(?:olive\s+|vegetable\s+|cooking\s+)?(?:oil|fried|butter)/i, name: 'Cooking Oil / Butter', isOil: true, baseG: 8, kcal100: 884, p100: 0, c100: 0, f100: 100 }
      ];

      let totalKcal = 0, totalP = 0, totalC = 0, totalF = 0;

      for (const r of rules) {
        const match = text.match(r.regex);
        if (!match) continue;
        const qty = match[1] ? parseFloat(match[1]) : null;
        let grams = r.baseG || 100;
        let kcal = 0, p = 0, c = 0, f = 0;

        if (r.isUnit) {
          const units = qty || r.baseUnits || 1;
          grams = units * r.unitG;
          kcal = units * r.kcalUnit;
          p = units * r.pUnit;
          c = units * r.cUnit;
          f = units * r.fUnit;
        } else {
          if (r.isTbspCapable && qty && /tbsp|tablespoon/i.test(match[0])) {
            grams = qty * 20;
          } else if (r.isOil && qty) {
            grams = /tsp|teaspoon/i.test(match[0]) ? qty * 4.5 : qty * 13.5;
          } else if (qty) {
            grams = qty;
          }
          const factor = grams / 100;
          kcal = r.kcal100 * factor;
          p = r.p100 * factor;
          c = r.c100 * factor;
          f = r.f100 * factor;
        }

        ingredients.push({
          name: r.name,
          estimated_grams: Math.round(grams),
          calories: Math.round(kcal),
          protein_g: Math.round(p * 10) / 10
        });
        totalKcal += kcal;
        totalP += p;
        totalC += c;
        totalF += f;
      }

      if (ingredients.length === 0) {
        return {
          dish_name: mealDescription.slice(0, 48),
          total_calories: 350,
          protein_g: 18,
          carbs_g: 38,
          fat_g: 12,
          note: 'Estimated standard mixed portion.',
          ingredients: [{ name: mealDescription.slice(0, 40), estimated_grams: 250, calories: 350, protein_g: 18 }]
        };
      }

      return {
        dish_name: ingredients.map(i => i.name).join(' + '),
        total_calories: Math.round(totalKcal),
        protein_g: Math.round(totalP),
        carbs_g: Math.round(totalC),
        fat_g: Math.round(totalF),
        note: 'Calculated from ingredient weights & cooking preparation.',
        ingredients
      };
    }

    async function callGeminiTextCalorieCalculator(mealDescription) {
      const apiKey = "";
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

      const systemInstruction = `You are a precision sports nutritionist and calorie calculator. Analyze the user's text meal description and return an accurate breakdown of every ingredient, realistic portion weights in grams, calories, and macronutrients. Account for cooking oils, frying absorption, and standard household measurements (e.g., 1 tablespoon of cooked rice is ~15-20g, cooking oil absorbed when pan-frying is ~5-10g unless specified). Keep dish_name concise and clear.`;

      const payload = {
        contents: [{ parts: [{ text: mealDescription }] }],
        systemInstruction: { parts: [{ text: systemInstruction }] },
        generationConfig: {
          responseMimeType: "application/json",
          responseSchema: {
            type: "OBJECT",
            properties: {
              dish_name: { type: "STRING" },
              total_calories: { type: "NUMBER" },
              protein_g: { type: "NUMBER" },
              carbs_g: { type: "NUMBER" },
              fat_g: { type: "NUMBER" },
              note: { type: "STRING" },
              ingredients: {
                type: "ARRAY",
                items: {
                  type: "OBJECT",
                  properties: {
                    name: { type: "STRING" },
                    estimated_grams: { type: "NUMBER" },
                    calories: { type: "NUMBER" },
                    protein_g: { type: "NUMBER" }
                  },
                  required: ["name", "estimated_grams", "calories", "protein_g"]
                }
              }
            },
            required: ["dish_name", "total_calories", "protein_g", "carbs_g", "fat_g", "ingredients"]
          }
        }
      };

      const delays = [800, 1600];
      for (let attempt = 0; attempt <= delays.length; attempt++) {
        try {
          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (!response.ok) {
            if (attempt < delays.length && (response.status === 429 || response.status >= 500)) {
              await new Promise(r => setTimeout(r, delays[attempt]));
              continue;
            }
            throw new Error(`HTTP ${response.status}`);
          }
          const data = await response.json();
          const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
          if (!rawText) throw new Error('Empty AI response');
          return JSON.parse(rawText);
        } catch (err) {
          if (attempt < delays.length) {
            await new Promise(r => setTimeout(r, delays[attempt]));
            continue;
          }
          return estimateMealLocallyFallback(mealDescription);
        }
      }
    }

    async function analyzeMealWithAI() {
      const remaining = getAiRemainingToday();
      if (remaining <= 0) {
        showToast('Daily limit of 3 AI calculations reached — resets at 00:00.');
        return;
      }

      const promptEl = document.getElementById('aiMealPromptInput');
      const query = (promptEl?.value || '').trim();
      if (query.length < 3) {
        showToast('Describe your meal first (e.g. "2 eggs and 1 slice of toast").');
        return;
      }

      isAiCalculating = true;
      renderCaloriesView();
      const restoredInput = document.getElementById('aiMealPromptInput');
      if (restoredInput) restoredInput.value = query;

      try {
        const result = await callGeminiTextCalorieCalculator(query);
        const today = getTodayStr();
        const prevCount = (appState.aiCalorieUsage && appState.aiCalorieUsage.date === today)
          ? (Number(appState.aiCalorieUsage.count) || 0)
          : 0;

        appState.aiCalorieUsage = {
          date: today,
          count: Math.min(3, prevCount + 1)
        };
        aiMealLastResult = result;
        await saveState();
        showToast(`Calculated: ${Math.round(result.total_calories || 0)} kcal`);
      } catch (_) {
        showToast('Could not calculate right now — please try again.');
      } finally {
        isAiCalculating = false;
        renderCaloriesView();
      }
    }

    async function logAiMealResult() {
      if (!aiMealLastResult) return;
      const r = aiMealLastResult;
      if (!appState.calorieLogs) appState.calorieLogs = {};
      if (!Array.isArray(appState.calorieLogs[selectedCalorieDate])) {
        appState.calorieLogs[selectedCalorieDate] = [];

      appState.calorieLogs[selectedCalorieDate].push({
        name: r.dish_name || 'AI Analyzed Meal',
        calories: Math.round(r.total_calories || 0),
        protein: Math.round(r.protein_g || 0),
        meal: selectedMealType
      });
      aiMealLastResult = null;
      await saveState();
      renderCaloriesView();
      const mealLabel = MEAL_SECTIONS.find(m => m.id === selectedMealType)?.label || 'Meal';
      showToast(`Added to ${mealLabel}!`);

    async function toggleFavoriteFoodItem(name, calories, protein) {
      if (!Array.isArray(appState.favoriteFoods)) appState.favoriteFoods = [];
      const cleanName = String(name || '').trim();
      if (!cleanName) return;
      const existingIdx = appState.favoriteFoods.findIndex(f => f.name.toLowerCase() === cleanName.toLowerCase());
      if (existingIdx >= 0) {
        appState.favoriteFoods.splice(existingIdx, 1);
        await saveState();
        renderCaloriesView();
        showToast(`Removed "${cleanName}" from Favorites`);
      } else {
        appState.favoriteFoods.unshift({
          name: cleanName,
          calories: Math.round(Number(calories) || 0),
          protein: Math.round(Number(protein) || 0)
        });
        await saveState();
        renderCaloriesView();
        showToast(`Saved "${cleanName}" to Favorites ★`);
      }
    }

    async function saveMeasurementEntry() {
      const unitSystem = appState.measurementUnit === 'imperial' ? 'imperial' : 'metric';
      const entry = {
        date: document.getElementById('measDate')?.value || getTodayStr(),
        unit: unitSystem,
        weight: (document.getElementById('measWeight')?.value || '').trim(),
        waist: (document.getElementById('measWaist')?.value || '').trim(),
        glutes: (document.getElementById('measGlutes')?.value || '').trim(),
        chest: (document.getElementById('measChest')?.value || '').trim(),
        arms: (document.getElementById('measArms')?.value || '').trim(),
        thighs: (document.getElementById('measThighs')?.value || '').trim()
      };

      if (!entry.weight && !entry.waist && !entry.glutes && !entry.chest && !entry.arms && !entry.thighs) {
        showToast('Enter at least one measurement first.');
        return;
      }

      if (entry.weight && parseFloat(entry.weight) > 0) {
        const weightInKg = unitSystem === 'imperial'
          ? parseFloat((parseFloat(entry.weight) * 0.453592).toFixed(1))
          : parseFloat(entry.weight);
        appState.bioStats = { ...(appState.bioStats || {}), weightKg: weightInKg };
        markTabsDirty('calories');
      }

      appState.measurements = (appState.measurements || []).filter(m => m.date !== entry.date);
      appState.measurements.push(entry);
      await saveState();
      renderTemplatesView();
      showToast('Body measurements saved!');
    }

    async function deleteMeasurement(sortedIdx) {
      const sorted = [...(appState.measurements || [])].sort((a, b) => b.date.localeCompare(a.date));
      const target = sorted[sortedIdx];
      if (!target) return;
      appState.measurements = (appState.measurements || []).filter(m => m !== target);
      await saveState();
      renderTemplatesView();
      showToast('Measurement removed.');
    }

                  <span class="text-[10px] accent-text font-bold">${formatDelta('weight', latestWUnit)}</span>
                </div>
                <div class="bg-obsidian border border-borderDark rounded-2xl p-2.5">
                  <span class="text-[9px] font-bold uppercase text-mutedText">Waist</span>

    async function saveNewTemplate() {
      const nameEl = document.getElementById('newTplNameInput');
      const tagEl = document.getElementById('newTplTagInput');
      const finalName = ((nameEl ? nameEl.value : routineBuilderDraft.name) || '').trim();
      const finalTag = ((tagEl ? tagEl.value : routineBuilderDraft.tag) || 'CUSTOM').trim().toUpperCase();

      if (!finalName) {
        showToast('Please enter a routine name.');
        return;
      }
      if (!routineBuilderDraft.exerciseIds || routineBuilderDraft.exerciseIds.length === 0) {
        showToast('Select at least 1 exercise.');
        return;
      }

      appState.templates.push({
        id: 'tpl_' + Date.now(),
        name: finalName,
        tag: finalTag,
        exercises: [...routineBuilderDraft.exerciseIds]
      });

      markTabsDirty('grid', 'templates');
      await saveState();
      closeModal();
      switchTab('templates');
      showToast(`Routine "${finalName}" saved!`);

        openModal('Profile & Goals', `
          <div class="space-y-4">
            <div class="flex items-center gap-3.5 bg-obsidian border border-borderDark rounded-2xl p-3.5">
              <label class="relative w-14 h-14 rounded-2xl bg-surface border border-borderDark overflow-hidden flex items-center justify-center cursor-pointer shrink-0 group">
                ${appState.profilePhoto
                  ? `<img src="${appState.profilePhoto}" alt="Profile" class="w-full h-full object-cover" />`
                  : `<span class="text-lg font-extrabold accent-text">${escapeHtml(firstNameVal.charAt(0).toUpperCase())}</span>`}
                <span class="absolute inset-x-0 bottom-0 bg-black/70 text-[9px] font-bold text-white text-center py-0.5">Edit</span>
                <input type="file" accept="image/*" onchange="handleProfilePhotoUpload(event)" class="hidden" />
              </label>
              <div class="min-w-0 flex-1">
                <p class="text-sm font-extrabold text-white truncate">${escapeHtml(firstNameVal)}${lastNameVal ? ' ' + escapeHtml(lastNameVal) : ''}</p>
                <p class="text-[11px] text-mutedText mt-0.5">${getCompletedDaysLast365()} workouts logged this year</p>
              </div>
            </div>

            <div class="bg-obsidian border border-borderDark rounded-2xl p-3.5 space-y-2.5">
              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="text-[10px] font-bold uppercase text-mutedText block mb-1">First Name</label>
                  <input id="profileFirstNameInput" type="text" value="${escapeHtml(firstNameVal)}" class="w-full bg-surface border border-borderDark rounded-xl px-3 py-2 text-xs font-bold text-white" />
                </div>
                <div>
                  <label class="text-[10px] font-bold uppercase text-mutedText block mb-1">Surname (Opt)</label>
                  <input id="profileLastNameInput" type="text" value="${escapeHtml(lastNameVal)}" placeholder="Optional" class="w-full bg-surface border border-borderDark rounded-xl px-3 py-2 text-xs font-bold text-white" />
                </div>
              </div>
              <div class="flex items-center justify-between gap-2 pt-1">
                <div class="grid grid-cols-2 gap-1 bg-surface border border-borderDark p-0.5 rounded-xl">
                  <button type="button" onclick="updateGenderFromProfile('female')" class="px-3 py-1.5 rounded-lg text-[10px] font-extrabold transition ${genderVal === 'female' ? 'accent-bg text-obsidian' : 'text-mutedText'}">Female</button>
                  <button type="button" onclick="updateGenderFromProfile('male')" class="px-3 py-1.5 rounded-lg text-[10px] font-extrabold transition ${genderVal === 'male' ? 'accent-bg text-obsidian' : 'text-mutedText'}">Male</button>
                </div>
                <button type="button" onclick="saveProfileDetails()" class="px-3.5 py-2 rounded-xl accent-bg text-obsidian text-xs font-extrabold">
                  Save Profile
                </button>
              </div>
            </div>

            <div class="bg-obsidian border border-borderDark rounded-2xl p-3.5 space-y-2.5">
              <div class="flex items-center justify-between">
                <span class="text-xs font-extrabold text-white">Weekly Workout Goal</span>
                <span class="text-xs font-extrabold accent-text">${currentGoal}x / week</span>
              </div>
              <div class="grid grid-cols-7 gap-1.5">
                ${goalButtons}
              </div>
              <p class="text-[10px] text-mutedText">Your 🔥 weekly streak advances every week you hit ${currentGoal} workout${currentGoal > 1 ? 's' : ''}.</p>
            </div>

            <button type="button" id="manualSyncBtn" onclick="forceSyncNow()" class="w-full py-3 rounded-2xl bg-obsidian border border-borderDark hover:border-white/25 text-xs font-extrabold text-white transition">
              ↻ Sync Profile &amp; Routines to Cloud Now
            </button>

            <button type="button" onclick="signOutAccount()" class="w-full py-3 rounded-2xl bg-obsidian border border-coralAccent/40 text-coralAccent font-extrabold text-xs">
              Sign Out
            </button>
          </div>
        `);
        return;
      }

      openModal('Account', `
        <div class="space-y-3 text-center py-2">
          <p class="text-xs text-mutedText">Sign in or create an account to sync your workouts, routines, and measurements across devices.</p>
          <a href="./login.html" class="block w-full py-3.5 rounded-2xl accent-bg text-obsidian font-extrabold text-xs">
            Go to Sign In / Create Account →
          </a>
        </div>
      `);
    }

    async function updateGenderFromProfile(gender) {
      appState.gender = gender === 'male' ? 'male' : 'female';
      markTabsDirty('calories');
      await saveState();
      openAccountModal();
    }

    async function saveProfileDetails() {
      const fn = (document.getElementById('profileFirstNameInput')?.value || '').trim();
      const ln = (document.getElementById('profileLastNameInput')?.value || '').trim();
      if (fn) appState.firstName = fn;
      appState.lastName = ln;
      markTabsDirty('calories');
      await saveState();
      updateAccountHeaderUI();
      openAccountModal();
      showToast('Profile saved!');
    }

    async function setWeeklyGoal(days) {
      appState.weeklyGoal = days;
      await saveState();
      renderWeekStrip();
      openAccountModal();
      showToast(`Weekly goal updated to ${days}x / week`);
    }

    function handleProfilePhotoUpload(event) {
      const file = event.target?.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = async () => {
          const canvas = document.createElement('canvas');
          const maxDim = 200;
          const scale = Math.min(maxDim / img.width, maxDim / img.height, 1);
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          appState.profilePhoto = canvas.toDataURL('image/jpeg', 0.82);
          await saveState();
          updateAccountHeaderUI();
          openAccountModal();
          showToast('Profile photo updated!');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function forceSyncNow() {
      const btn = document.getElementById('manualSyncBtn');
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'Syncing...';
      }
      await saveState(true);
      if (btn) {
        btn.disabled = false;
        btn.textContent = lastCloudSyncError
          ? `⚠ Sync Error: ${lastCloudSyncError}`
          : `✓ Synced ${getDisplayFirstName()} to Cloud`;
      }
    }

    async function signOutAccount() {
      if (accountSession && accountSession.username) {
        await saveState(true);
      }
      localStorage.removeItem(ACCOUNT_SESSION_KEY);
      localStorage.removeItem(GUEST_MODE_KEY);
      accountSession = null;
      activeDraft = null;
      closeModal();
      if (window.location.protocol !== 'about:' && !window.location.href.startsWith('blob:')) {
        window.location.href = './login.html';
      } else {
        updateAccountHeaderUI();
        markTabsDirty();
        renderCurrentTab();
        showToast('Signed out.');
      }
    }

    /* ==========================================================================
       15. MODAL & ZERO-LAG TAB SWITCHING CONTROLLERS
       ========================================================================== */
    function openModal(title, bodyHtml) {
      const overlay = document.getElementById('modalOverlay');
      const titleEl = document.getElementById('modalTitle');
      const bodyEl = document.getElementById('modalBody');
      if (!overlay || !titleEl || !bodyEl) return;
      titleEl.textContent = title;
      bodyEl.innerHTML = bodyHtml;
      overlay.classList.remove('hidden');
    }

    function closeModal() {
      const overlay = document.getElementById('modalOverlay');
      if (overlay) overlay.classList.add('hidden');
    }

    document.getElementById('modalOverlay')?.addEventListener('click', (e) => {
      if (e.target.id === 'modalOverlay') closeModal();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeModal();
        closeFullScreenYearGrid();
      }
    });

    function renderCurrentTab() {
      if (currentTab === 'grid' && dirtyTabs.grid) renderGridView();
      else if (currentTab === 'logger' && dirtyTabs.logger) renderLoggerView();
      else if (currentTab === 'overload' && dirtyTabs.overload) renderOverloadView();
      else if (currentTab === 'calories' && dirtyTabs.calories) renderCaloriesView();
      else if (currentTab === 'templates' && dirtyTabs.templates) renderTemplatesView();
    }

    function switchTab(tab) {
      if (currentTab === tab && !dirtyTabs[tab]) return;
      currentTab = tab;

      document.querySelectorAll('.nav-btn').forEach(btn => {
        const isActive = btn.getAttribute('data-tab') === tab;
        btn.classList.toggle('text-white', isActive);
        btn.classList.toggle('accent-text', isActive);
        btn.classList.toggle('text-mutedText', !isActive);
      });

      document.querySelectorAll('.tab-pane').forEach(pane => {
        pane.classList.toggle('hidden', pane.id !== `view_${tab}`);
      });

      renderCurrentTab();
    }

    /* ==========================================================================
       16. INITIALIZATION & 60-DAY AUTH GATE
       ========================================================================== */
    window.addEventListener('DOMContentLoaded', async () => {
      const isSandboxed = window.location.protocol === 'about:' || window.location.href.startsWith('blob:');
      if (!isSandboxed) {
        try {
          const sess = JSON.parse(localStorage.getItem(ACCOUNT_SESSION_KEY) || 'null');
          const isGuest = localStorage.getItem(GUEST_MODE_KEY) === 'true';
          const isValid = sess && sess.username && (!sess.expiresAt || Date.now() < sess.expiresAt);
          if (!isValid && !isGuest) {
            window.location.replace('./login.html');
            return;
          }
        } catch (_) {}
      }

      await hydrateStateFromVault();
      markTabsDirty();
      renderWeekStrip();
      renderCurrentTab();

      let lastKnownDay = getTodayStr();
      setInterval(() => {
        const nowDay = getTodayStr();
        if (nowDay !== lastKnownDay) {
          lastKnownDay = nowDay;
          selectedDate = nowDay;
          selectedCalorieDate = nowDay;
          markTabsDirty();
          renderWeekStrip();
          renderCurrentTab();
        }
      }, 30000);
    });
  </script>
</body>
</html>
