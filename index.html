      darkMode: 'class',

        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'sans-serif'],
          },
          colors: {
            obsidian: '#0A0A0C',
            surface: '#141418',
            surfaceHover: '#1B1B20',
            borderDark: '#232329',
            accent: 'var(--accent)',
            coralAccent: '#FF5E3A',
            mutedText: '#8E8E93',

  <style>
    :root {
      --accent: #FF4D94;
      --accent-rgb: 255, 77, 148;
      --accent-soft: rgba(255, 77, 148, 0.16);
      --accent-border: rgba(255, 77, 148, 0.35);
      --accent-glow: rgba(255, 77, 148, 0.42);
    }
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    html, body {
      background-color: #0A0A0C;
      color: #F5F5F7;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overscroll-behavior-y: none;
      margin: 0;
      padding: 0;
    }
    /* Custom subtle scrollbars */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #0A0A0C;
    }
    ::-webkit-scrollbar-thumb {
      background: #232329;
      border-radius: 9999px;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Safe area spacing for iPhone notch & home indicator */
    .pt-safe {
      padding-top: max(1rem, env(safe-area-inset-top));
    }
    .pb-safe {
      padding-bottom: max(5.5rem, calc(env(safe-area-inset-bottom) + 4.5rem));
    }
    .bottom-nav-safe {
      padding-bottom: max(0.65rem, env(safe-area-inset-bottom));
    }

    /* Year Grid Cells */
    .grid-cell {
      width: 11px;
      height: 11px;
      border-radius: 3px;
      transition: transform 0.12s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    }
    .grid-cell:hover, .grid-cell:active {
      transform: scale(1.28);
      z-index: 10;
    }

    /* Smooth bottom sheet animation */
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0.6; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-slide-up {
      animation: slideUp 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 var(--accent-glow); }
      50% { box-shadow: 0 0 14px 2px var(--accent-soft); }
    }
    .pr-glow {
      animation: pulseGlow 2.4s infinite;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }
  </style>
</head>

    /*************************************************************************
     * DATE UTILITIES
     *************************************************************************/
    function getTodayStr() {
      const now = new Date();
      return formatDateLocal(now);
    }

    function formatDateLocal(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function parseDateLocal(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    function formatReadableDate(dateStr) {
      const today = getTodayStr();
      const d = parseDateLocal(dateStr);
      const yesterday = new Date();
      yesterday.setDate(yesterday.getDate() - 1);
      if (dateStr === today) return 'Today';
      if (dateStr === formatDateLocal(yesterday)) return 'Yesterday';
      return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    }

    /*************************************************************************
     * MULTI-LAYER STORAGE PERSISTENCE (IndexedDB + LocalStorage Vault)
     * Prevents iOS Safari / Home Screen Web Clips from resetting user data
     *************************************************************************/
    function openVaultDB() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) {
          reject(new Error('IndexedDB unavailable'));
          return;
        }
        const request = indexedDB.open(IDB_NAME, 1);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) {
            db.createObjectStore(IDB_STORE);
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function writeToVaultIDB(snapshot) {
      try {
        const db = await openVaultDB();
        return await new Promise((resolve, reject) => {
          const tx = db.transaction(IDB_STORE, 'readwrite');
          tx.objectStore(IDB_STORE).put(snapshot, STORAGE_KEY);
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => reject(tx.error);
        });
      } catch (e) {
        return false;
      }
    }

    async function readFromVaultIDB() {
      try {
        const db = await openVaultDB();
        return await new Promise((resolve, reject) => {
          const tx = db.transaction(IDB_STORE, 'readonly');
          const req = tx.objectStore(IDB_STORE).get(STORAGE_KEY);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => reject(req.error);
        });
      } catch (e) {
        return null;
      }
    }

    function requestPersistentStorage() {
      if (navigator.storage && navigator.storage.persist) {
        navigator.storage.persist().catch(() => {});
      }
    }

    function mergeLoadedState(parsed) {
      if (!parsed || typeof parsed !== 'object') return;
      appState = {
        ...appState,
        ...parsed,
        exercises: Array.isArray(parsed.exercises) ? parsed.exercises : appState.exercises,
        templates: Array.isArray(parsed.templates) ? parsed.templates : appState.templates,
        workouts: (parsed.workouts && typeof parsed.workouts === 'object') ? parsed.workouts : appState.workouts
      };
      if (!ACCENT_THEMES[appState.accent]) {
        appState.accent = 'pink';
      }
      // Clear only legacy auto-seeded sample workouts if flagged
      if (appState.hasSampleData) {
        appState.workouts = {};
        appState.hasSampleData = false;
      }
    }

    async function loadState() {
      requestPersistentStorage();
      let loadedData = null;

      // 1. Check primary and mirror localStorage first (synchronous)
      try {
        const rawPrimary = localStorage.getItem(STORAGE_KEY);
        const rawMirror = localStorage.getItem(BACKUP_STORAGE_KEY);
        if (rawPrimary) {
          loadedData = JSON.parse(rawPrimary);
        } else if (rawMirror) {
          loadedData = JSON.parse(rawMirror);
        }
      } catch (e) {
        console.warn('LocalStorage read failed, falling back to IndexedDB:', e);
      }

      // 2. Check IndexedDB (survives iOS WebClip / Safari cache sweeps much better)
      const idbData = await readFromVaultIDB();
      if (idbData && typeof idbData === 'object') {
        if (!loadedData) {
          loadedData = idbData;
        } else {
          // Pick whichever store has the newer save timestamp
          const lsTs = loadedData._updatedAt || 0;
          const idbTs = idbData._updatedAt || 0;
          if (idbTs > lsTs) {
            loadedData = idbData;
          }
        }
      }

      if (loadedData) {
        mergeLoadedState(loadedData);
        // Merge any newly added default encyclopedia exercises without removing user's custom ones
        const existingIds = new Set(appState.exercises.map(e => e.id));
        DEFAULT_EXERCISES.forEach(defEx => {
          if (!existingIds.has(defEx.id)) {
            appState.exercises.push(defEx);
          }
        });
      } else {
        // Brand new user: initialize clean slate once and persist immediately
        appState.workouts = {};
        appState.hasSampleData = false;
      }

      isStateHydrated = true;
      await saveState();
      applyAccentTheme(appState.accent);
    }

    async function saveState() {
      if (!isStateHydrated) return;
      const snapshot = {
        ...appState,
        _updatedAt: Date.now()
      };
      const serialized = JSON.stringify(snapshot);

      // Write to dual localStorage keys
      try {
        localStorage.setItem(STORAGE_KEY, serialized);
        localStorage.setItem(BACKUP_STORAGE_KEY, serialized);
      } catch (e) {
        console.warn('LocalStorage write warning:', e);
      }

      // Write to IndexedDB Vault
      if (!isSavingInProgress) {
        isSavingInProgress = true;
        await writeToVaultIDB(snapshot);
        isSavingInProgress = false;
      }
    }

    /*************************************************************************
     * ACCENT COLOR THEME HELPERS & DYNAMIC PWA ICON GENERATOR
     *************************************************************************/
    function generateAppIconPng(accentHex, size = 512) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      // Full-bleed dark background (iOS automatically applies its rounded squircle mask)
      ctx.fillStyle = '#0E0E12';
      ctx.fillRect(0, 0, size, size);

      // Subtle inner rounded card matching the header logo container
      const inset = Math.round(size * 0.08);
      const cardSize = size - inset * 2;
      const cardRadius = Math.round(size * 0.22);
      ctx.fillStyle = '#141418';
      ctx.beginPath();
      ctx.roundRect(inset, inset, cardSize, cardSize, cardRadius);
      ctx.fill();

      // Exact 2x2 diagonal square grid from the header logo
      const gridSize = Math.round(size * 0.50);
      const gap = Math.round(size * 0.08);
      const cell = (gridSize - gap) / 2;
      const cellRadius = Math.round(cell * 0.24);
      const startX = (size - gridSize) / 2;
      const startY = (size - gridSize) / 2;

      const cells = [
        { col: 0, row: 0, color: accentHex }, // Top-Left: Accent
        { col: 1, row: 0, color: '#232329' }, // Top-Right: Dark Slate
        { col: 0, row: 1, color: '#232329' }, // Bottom-Left: Dark Slate
        { col: 1, row: 1, color: accentHex }  // Bottom-Right: Accent
      ];

      cells.forEach(({ col, row, color }) => {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.roundRect(
          startX + col * (cell + gap),
          startY + row * (cell + gap),
          cell,
          cell,
          cellRadius
        );
        ctx.fill();
      });

      return canvas.toDataURL('image/png');
    }

    function getThemeObj() {
      return ACCENT_THEMES[appState.accent] || ACCENT_THEMES.pink;
    }

    function getAccentHex() {

    function applyAccentTheme(themeKey) {
      const theme = ACCENT_THEMES[themeKey] || ACCENT_THEMES.pink;
      const root = document.documentElement;
      root.style.setProperty('--accent', theme.hex);
      root.style.setProperty('--accent-rgb', theme.rgb);
      root.style.setProperty('--accent-soft', `rgba(${theme.rgb}, 0.16)`);
      root.style.setProperty('--accent-border', `rgba(${theme.rgb}, 0.35)`);
      root.style.setProperty('--accent-glow', `rgba(${theme.rgb}, 0.42)`);

      // Generate high-res PNG icons matching the exact 2x2 diagonal logo (iOS Safari requires PNG for apple-touch-icon)
      const applePng = generateAppIconPng(theme.hex, 512);
      const favPng = generateAppIconPng(theme.hex, 128);

      const appleEl = document.getElementById('appleTouchIcon');
      const favEl = document.getElementById('faviconIcon');
      if (appleEl) appleEl.setAttribute('href', applePng);
      if (favEl) favEl.setAttribute('href', favPng);

      // Update inline Web App Manifest so Android/iOS opens in true standalone full-screen app mode
      const manifestObj = {
        name: 'CADENCE — Workout & Overload Log',
        short_name: 'CADENCE',
        start_url: './',
        display: 'standalone',
        orientation: 'portrait',
        background_color: '#0A0A0C',

          { src: applePng, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },

      };

    /*************************************************************************
     * CORE ANALYTICS, STREAK & PROGRESSIVE OVERLOAD CALCULATIONS
     *************************************************************************/
    function calculateStats() {
      const workoutDates = Object.keys(appState.workouts).sort();
      const totalDays = workoutDates.length;

      // Days trained in the last 365 days
      const today = new Date();
      const cutoff = new Date(today);
      cutoff.setDate(today.getDate() - 364);
      const cutoffStr = formatDateLocal(cutoff);
      const todayStr = getTodayStr();

      const daysLast365 = workoutDates.filter(d => d >= cutoffStr && d <= todayStr).length;

      // Calculate consecutive active weeks streak (Mon-Sun weeks with >= 1 workout)
      const activeMondays = new Set();
      workoutDates.forEach(dateStr => {
        const d = parseDateLocal(dateStr);
        const mondayOffset = (d.getDay() + 6) % 7;
        const mon = new Date(d);
        mon.setDate(d.getDate() - mondayOffset);
        activeMondays.add(formatDateLocal(mon));
      });

      const currentMondayOffset = (today.getDay() + 6) % 7;
      const currentMonday = new Date(today);
      currentMonday.setDate(today.getDate() - currentMondayOffset);

      let weekStreak = 0;
      const checkMonday = new Date(currentMonday);

      // If current week has no workout yet, check starting from last week so streak doesn't prematurely reset mid-week
      if (!activeMondays.has(formatDateLocal(checkMonday))) {
        checkMonday.setDate(checkMonday.getDate() - 7);
      }

      while (activeMondays.has(formatDateLocal(checkMonday))) {
        weekStreak++;
        checkMonday.setDate(checkMonday.getDate() - 7);
      }

      return { totalDays, daysLast365, weekStreak };
    }

    function getWorkoutIntensity(workout) {
      if (!workout) return 0;
      if (workout.isQuickCheckIn) return 1;
      const totalSets = (workout.entries || []).reduce((acc, e) => acc + (e.sets ? e.sets.length : 0), 0);
      const prCount = countWorkoutPRs(workout);
      if (prCount > 0 || totalSets >= 14) return 4;
      if (totalSets >= 9) return 3;
      if (totalSets >= 4) return 2;
      return 1;
    }

    function calcE1RM(weight, reps) {
      const w = parseFloat(weight);
      const r = parseInt(reps, 10);
      if (!w || w <= 0 || !r || r <= 0) return 0;
      if (r === 1) return Math.round(w * 10) / 10;
      // Epley Formula
      return Math.round(w * (1 + r / 30) * 10) / 10;
    }

    function getExerciseName(exerciseId) {
      const found = appState.exercises.find(e => e.id === exerciseId);
      return found ? found.name : 'Custom Exercise';
    }

    function getExerciseBenchmarks(exerciseId, beforeDateStr) {
      const priorDates = Object.keys(appState.workouts)
        .filter(d => d < beforeDateStr)
        .sort();

      let lastSession = null;
      let bestWeight = 0;
      let bestWeightReps = 0;
      let bestE1RM = 0;

      priorDates.forEach(dateStr => {
        const w = appState.workouts[dateStr];
        if (!w || !w.entries) return;
        const entry = w.entries.find(e => e.exerciseId === exerciseId);
        if (entry && entry.sets && entry.sets.length > 0) {
          const validSets = entry.sets.filter(s => parseFloat(s.weight) > 0 && parseInt(s.reps, 10) > 0);
          if (validSets.length > 0) {
            lastSession = { date: dateStr, sets: validSets };
            validSets.forEach(s => {
              const wt = parseFloat(s.weight);
              const rp = parseInt(s.reps, 10);
              const e1rm = calcE1RM(wt, rp);
              if (wt > bestWeight || (wt === bestWeight && rp > bestWeightReps)) {
                bestWeight = wt;
                bestWeightReps = rp;
              }
              if (e1rm > bestE1RM) {
                bestE1RM = e1rm;
              }
            });
          }
        }
      });

      return { lastSession, bestWeight, bestWeightReps, bestE1RM };
    }

    function evaluateSetOverload(exerciseId, weight, reps, sessionDateStr) {
      const w = parseFloat(weight);
      const r = parseInt(reps, 10);
      if (!w || w <= 0 || !r || r <= 0) return null;

      const bench = getExerciseBenchmarks(exerciseId, sessionDateStr);
      if (!bench.lastSession) return null;

      const currentE1RM = calcE1RM(w, r);

      // All-Time Weight PR
      if (w > bench.bestWeight) {
        return { type: 'PR', label: 'WEIGHT PR 🏆' };
      }
      // All-Time Estimated 1RM PR
      if (currentE1RM > bench.bestE1RM) {
        return { type: 'PR', label: '1RM PR 🏆' };
      }

      // Compare against last session's top set for progressive overload
      const lastSets = bench.lastSession.sets;
      const lastTopWeight = Math.max(...lastSets.map(s => parseFloat(s.weight) || 0));
      const lastMaxRepsAtWeight = Math.max(
        0,
        ...lastSets.filter(s => parseFloat(s.weight) >= w).map(s => parseInt(s.reps, 10) || 0)
      );

      if (w > lastTopWeight || (w === lastTopWeight && r > lastMaxRepsAtWeight)) {
        return { type: 'OVERLOAD', label: '+OVERLOAD ↑' };
      }

      return null;
    }

      const stats = calculateStats();
      const accentHex = getAccentHex();
      const streakBadge = document.getElementById('streakBadge');
      streakBadge.style.color = accentHex;
      streakBadge.style.borderColor = 'var(--accent-border)';
      streakBadge.style.backgroundColor = 'var(--accent-soft)';
      streakBadge.innerHTML = `🔥 ${stats.weekStreak}w Streak`;
      document.getElementById('totalDaysBadge').textContent = `${stats.daysLast365}/365d`;

      // Render Mon–Sun of current week
      const stripEl = document.getElementById('weeklyStrip');
      const dayLabels = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
      const mondayOffset = (today.getDay() + 6) % 7;
      const monday = new Date(today);
      monday.setDate(today.getDate() - mondayOffset);

      let html = '';
      for (let i = 0; i < 7; i++) {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        const dateStr = formatDateLocal(d);
        const hasWorkout = !!appState.workouts[dateStr];
        const isToday = dateStr === todayStr;
        const isSelected = dateStr === appState.selectedDate;

        let pillStyle = 'background-color: #141418; border: 1px solid #232329; color: #8E8E93;';
        if (hasWorkout) {
          pillStyle = `background-color: ${accentHex}; border: 1px solid ${accentHex}; color: #0A0A0C; font-weight: 800;`;
        } else if (isToday) {
          pillStyle = `background-color: #1B1B20; border: 1px solid ${accentHex}; color: #F5F5F7;`;
        }

        html += `
          <button onclick="handleDayTap('${dateStr}')" class="flex flex-col items-center justify-center py-1.5 rounded-xl transition active:scale-95 ${isSelected ? 'ring-1 ring-white/40' : ''}" style="${pillStyle}">
            <span class="text-[10px] uppercase tracking-wider opacity-80">${dayLabels[i]}</span>
            <span class="text-xs font-bold mt-0.5">${d.getDate()}</span>
            <span class="w-1 h-1 rounded-full mt-0.5 ${hasWorkout ? 'bg-obsidian' : (isToday ? 'bg-white' : 'bg-transparent')}"></span>
          </button>
        `;
      }
      stripEl.innerHTML = html;

      // Update active nav tab styling
      document.querySelectorAll('.nav-btn').forEach(btn => {
        const isActive = btn.dataset.tab === appState.activeTab;
        btn.style.color = isActive ? accentHex : '#8E8E93';
      });
    }

    function handleDayTap(dateStr) {
      appState.selectedDate = dateStr;
      renderHeaderAndStrip();
      if (appState.workouts[dateStr]) {
        openDayDetailModal(dateStr);
      } else {
        openLoggerForDate(dateStr);
      }
    }

    /*************************************************************************
     * TAB NAVIGATION
     *************************************************************************/
    function switchTab(tabName) {
      appState.activeTab = tabName;
      if (tabName === 'log' && activeSession.entries.length === 0 && !appState.workouts[activeSession.date]) {
        // Pre-populate session if empty
        initSessionForDate(appState.selectedDate || getTodayStr());
      }
      renderHeaderAndStrip();
      renderMainView();
    }

    function renderMainView() {
      const container = document.getElementById('mainContent');
      if (appState.activeTab === 'calendar') {
        renderCalendarTab(container);
      } else if (appState.activeTab === 'log') {
        renderLoggerTab(container);
      } else if (appState.activeTab === 'progress') {
        renderProgressTab(container);
      } else if (appState.activeTab === 'settings') {
        renderSettingsTab(container);
      }
    }

    /*************************************************************************
     * TAB 1: GYM YEARS (365-DAY MATRIX + MONTHLY CALENDAR + RECENT FEED)
     *************************************************************************/
    function renderCalendarTab(container) {
      const stats = calculateStats();
      const accentHex = getAccentHex();
      const todayStr = getTodayStr();
      const todayWorkout = appState.workouts[todayStr];

      // Dismissible Home Screen Shortcut Banner
      const installBannerHtml = !appState.dismissedInstallBanner ? `
        <div class="bg-surface border border-borderDark rounded-2xl p-3.5 flex items-center justify-between gap-3">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl flex items-center justify-center shrink-0" style="background-color: var(--accent-soft); color: ${accentHex};">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 1.5H8.25A2.25 2.25 0 006 3.75v16.5a2.25 2.25 0 002.25 2.25h7.5A2.25 2.25 0 0018 20.25V3.75a2.25 2.25 0 00-2.25-2.25H13.5m-3 0V3h3V1.5m-3 0h3m-3 18.75h3" />
              </svg>
            </div>
            <div>
              <p class="text-xs font-bold text-white">Use CADENCE like a native app</p>
              <p class="text-[11px] text-mutedText leading-snug">Tap Share → <span class="text-white font-medium">Add to Home Screen</span> for 1-tap access.</p>
            </div>
          </div>
          <div class="flex items-center gap-1.5 shrink-0">
            <button onclick="openInstallModal()" class="text-[11px] font-bold px-2.5 py-1.5 rounded-lg bg-borderDark text-white hover:bg-white/10">How</button>
            <button onclick="dismissInstallBanner()" class="p-1.5 text-mutedText hover:text-white" aria-label="Dismiss">✕</button>
          </div>
        </div>
      ` : '';

      // CADENCE Year Grid Card
      const calendarHtml = appState.calendarMode === 'grid'
        ? build365GridHtml()
        : buildMonthlyCalendarHtml();

      // Recent Workouts List
      const recentDates = Object.keys(appState.workouts).sort().reverse().slice(0, 6);
      const recentHtml = recentDates.length > 0 ? recentDates.map(dateStr => {
        const w = appState.workouts[dateStr];
        const prCount = countWorkoutPRs(w);
        const totalSets = (w.entries || []).reduce((acc, e) => acc + (e.sets ? e.sets.length : 0), 0);
        return `
          <button onclick="openDayDetailModal('${dateStr}')" class="w-full text-left bg-surface hover:bg-surfaceHover border border-borderDark rounded-2xl p-3.5 transition flex items-center justify-between gap-3 active:scale-[0.99]">
            <div class="min-w-0">
              <div class="flex items-center gap-2">
                <span class="text-[11px] font-semibold text-mutedText uppercase tracking-wider">${formatReadableDate(dateStr)}</span>
                ${w.isQuickCheckIn ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-white/10 text-white">Quick Check-In</span>` : ''}
                ${prCount > 0 ? `<span class="text-[10px] font-extrabold px-2 py-0.5 rounded-full text-obsidian" style="background-color: ${accentHex};">${prCount} PR 🏆</span>` : ''}
              </div>
              <h4 class="text-sm font-bold text-white truncate mt-1">${escapeHtml(w.title || 'Workout Session')}</h4>
              <p class="text-xs text-mutedText truncate mt-0.5">
                ${w.isQuickCheckIn
                  ? escapeHtml(w.notes || 'Active day logged')
                  : `${w.entries.length} exercises · ${totalSets} sets`}
              </p>
            </div>
            <div class="w-8 h-8 rounded-xl bg-obsidian border border-borderDark flex items-center justify-center shrink-0 text-mutedText">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
              </svg>
            </div>
          </button>
        `;
      }).join('') : `
        <div class="bg-surface border border-borderDark rounded-2xl p-6 text-center">
          <p class="text-sm font-semibold text-white">No workouts logged yet</p>
          <p class="text-xs text-mutedText mt-1">Start your first session or tap Quick Check-In to light up your first square.</p>
        </div>
      `;

      container.innerHTML = `
        ${installBannerHtml}

        <!-- YEAR GRID CARD -->
        <section class="bg-surface border border-borderDark rounded-3xl p-4 shadow-xl">
          <div class="flex items-center justify-between mb-3">
            <div>
              <div class="flex items-center gap-2">
                <h2 class="text-sm font-extrabold tracking-tight text-white uppercase">Year Grid</h2>
                <span class="text-[11px] font-bold px-2 py-0.5 rounded-md bg-obsidian border border-borderDark" style="color: ${accentHex};">
                  ${stats.daysLast365} / 365 Days
                </span>
              </div>
              <p class="text-[11px] text-mutedText mt-0.5">Every square is a day you showed up</p>
            </div>

            <!-- Grid vs Month Toggle -->
            <div class="flex bg-obsidian p-1 rounded-xl border border-borderDark">
              <button onclick="setCalendarMode('grid')" class="px-2.5 py-1 rounded-lg text-[11px] font-bold transition ${appState.calendarMode === 'grid' ? 'bg-surface text-white shadow' : 'text-mutedText'}">
                365 Grid
              </button>
              <button onclick="setCalendarMode('month')" class="px-2.5 py-1 rounded-lg text-[11px] font-bold transition ${appState.calendarMode === 'month' ? 'bg-surface text-white shadow' : 'text-mutedText'}">
                Month
              </button>
            </div>
          </div>

          ${calendarHtml}

          <!-- Quick Actions Footer inside Year Grid Card -->
          <div class="mt-4 pt-3 border-t border-borderDark flex items-center gap-2">
            <button onclick="openLoggerForDate('${todayStr}')" class="flex-1 py-2.5 px-3 rounded-xl font-extrabold text-xs text-obsidian flex items-center justify-center gap-1.5 active:scale-[0.98] transition" style="background-color: ${accentHex};">
              <svg class="w-4 h-4 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
              </svg>
              ${todayWorkout ? 'Edit Today’s Workout' : 'Log Today’s Workout'}
            </button>
            <button onclick="quickCheckInToday()" class="py-2.5 px-3 rounded-xl bg-obsidian hover:bg-white/5 border border-borderDark text-xs font-semibold text-white flex items-center gap-1.5 active:scale-[0.98] transition" title="Mark active day without detailed sets">
              <span>✓</span>
              <span>Quick Check-In</span>
            </button>
          </div>
        </section>

        <!-- QUICK START ROUTINES -->
        <section>
          <div class="flex items-center justify-between mb-2 px-0.5">
            <h3 class="text-xs font-bold uppercase tracking-wider text-mutedText">1-Tap Start Routine</h3>
            <button onclick="switchTab('settings')" class="text-[11px] font-semibold" style="color: ${accentHex};">Manage →</button>
          </div>
          <div class="flex gap-2.5 overflow-x-auto no-scrollbar pb-1">
            ${appState.templates.map(tpl => `
              <button onclick="startFromTemplate('${tpl.id}')" class="shrink-0 bg-surface hover:bg-surfaceHover border border-borderDark rounded-2xl p-3.5 w-44 text-left transition active:scale-95">
                <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-md bg-obsidian border border-borderDark" style="color: ${accentHex};">${escapeHtml(tpl.tag)}</span>
                <p class="text-xs font-bold text-white mt-2 truncate">${escapeHtml(tpl.name)}</p>
                <p class="text-[11px] text-mutedText mt-0.5">${tpl.exerciseIds.length} exercises</p>
              </button>
            `).join('')}
          </div>
        </section>

        <!-- RECENT SESSIONS -->
        <section class="space-y-2.5">
          <div class="flex items-center justify-between px-0.5">
            <h3 class="text-xs font-bold uppercase tracking-wider text-mutedText">Recent Activity</h3>
            <span class="text-[11px] text-mutedText">${stats.totalDays} total sessions</span>
          </div>
          ${recentHtml}
        </section>
      `;

      // Auto-scroll 365-day grid to the rightmost (most recent) weeks
      if (appState.calendarMode === 'grid') {
        requestAnimationFrame(() => {
          const scrollBox = document.getElementById('gridScrollContainer');
          if (scrollBox) scrollBox.scrollLeft = scrollBox.scrollWidth;
        });
      }
    }

    function build365GridHtml() {
      const today = new Date();
      // Align end of grid to Sunday of current week so columns are neat Mon–Sun weeks
      const daysUntilSunday = (7 - today.getDay()) % 7;
      const endSunday = new Date(today);
      endSunday.setDate(today.getDate() + daysUntilSunday);

      const numWeeks = 53;
      const startMonday = new Date(endSunday);
      startMonday.setDate(endSunday.getDate() - (numWeeks * 7 - 1));

      const todayStr = getTodayStr();
      let monthLabelsHtml = '';
      let columnsHtml = '';
      let lastMonth = -1;

      for (let w = 0; w < numWeeks; w++) {
        const weekStart = new Date(startMonday);
        weekStart.setDate(startMonday.getDate() + w * 7);
        const m = weekStart.getMonth();
        const showMonth = m !== lastMonth;
        if (showMonth) lastMonth = m;

        monthLabelsHtml += `<div class="w-[11px] shrink-0 text-[9px] font-semibold text-mutedText leading-none">${showMonth ? weekStart.toLocaleDateString('en-US', { month: 'short' }) : ''}</div>`;

        let cellsHtml = '';
        for (let d = 0; d < 7; d++) {
          const cellDate = new Date(weekStart);
          cellDate.setDate(weekStart.getDate() + d);
          const dateStr = formatDateLocal(cellDate);
          const isFuture = dateStr > todayStr;
          const workout = appState.workouts[dateStr];
          const intensity = isFuture ? 0 : getWorkoutIntensity(workout);
          const isToday = dateStr === todayStr;

          cellsHtml += `
            <button
              onclick="handleGridSquareClick('${dateStr}', ${isFuture})"
              title="${dateStr}${workout ? ' — ' + escapeHtml(workout.title) : ''}"
              class="grid-cell block ${isFuture ? 'opacity-25 cursor-default' : 'cursor-pointer'} ${isToday ? 'ring-1 ring-white' : ''}"
              style="${getIntensityStyle(intensity)}"
            ></button>
          `;
        }
        columnsHtml += `<div class="flex flex-col gap-[3px] shrink-0">${cellsHtml}</div>`;
      }

      return `
        <div class="flex gap-2">
          <!-- Day-of-week labels -->
          <div class="flex flex-col justify-between pt-4 pb-0.5 text-[9px] font-semibold text-mutedText select-none shrink-0">
            <span>M</span>
            <span>W</span>
            <span>F</span>
            <span>S</span>
          </div>

          <!-- Horizontally scrollable 53-week matrix -->
          <div id="gridScrollContainer" class="overflow-x-auto no-scrollbar flex-1 pb-1">
            <div class="flex gap-[3px] mb-1.5 min-w-max">
              ${monthLabelsHtml}
            </div>
            <div class="flex gap-[3px] min-w-max">
              ${columnsHtml}
            </div>
          </div>
        </div>

        <!-- Legend -->
        <div class="flex items-center justify-between mt-2.5 text-[10px] text-mutedText">
          <span>Tap any square to inspect or log</span>
          <div class="flex items-center gap-1">
            <span>Rest</span>
            <span class="w-2.5 h-2.5 rounded-[2px] inline-block" style="${getIntensityStyle(0)}"></span>
            <span class="w-2.5 h-2.5 rounded-[2px] inline-block" style="${getIntensityStyle(1)}"></span>
            <span class="w-2.5 h-2.5 rounded-[2px] inline-block" style="${getIntensityStyle(2)}"></span>
            <span class="w-2.5 h-2.5 rounded-[2px] inline-block" style="${getIntensityStyle(3)}"></span>
            <span class="w-2.5 h-2.5 rounded-[2px] inline-block" style="${getIntensityStyle(4)}"></span>
            <span>PR / High Vol</span>
          </div>
        </div>
      `;
    }

    function buildMonthlyCalendarHtml() {
      const base = new Date();
      base.setDate(1);
      base.setMonth(base.getMonth() + appState.selectedMonthOffset);

      const year = base.getFullYear();
      const month = base.getMonth();
      const monthTitle = base.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
      const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7; // Mon=0
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const todayStr = getTodayStr();
      const accentHex = getAccentHex();

      let cells = '';
      for (let empty = 0; empty < firstDayIndex; empty++) {
        cells += `<div></div>`;
      }
      for (let day = 1; day <= daysInMonth; day++) {
        const d = new Date(year, month, day);
        const dateStr = formatDateLocal(d);
        const workout = appState.workouts[dateStr];
        const isToday = dateStr === todayStr;
        const isFuture = dateStr > todayStr;

        let style = 'background-color: #0A0A0C; border: 1px solid #232329; color: #8E8E93;';
        if (workout) {
          style = `background-color: ${accentHex}; border: 1px solid ${accentHex}; color: #0A0A0C; font-weight: 800;`;
        } else if (isToday) {
          style = `background-color: #1B1B20; border: 1px solid ${accentHex}; color: #F5F5F7;`;
        }

        cells += `
          <button
            onclick="handleGridSquareClick('${dateStr}', ${isFuture})"
            class="aspect-square rounded-xl flex flex-col items-center justify-center text-xs transition active:scale-90 ${isFuture ? 'opacity-30' : ''}"
            style="${style}"
          >
            <span>${day}</span>
          </button>
        `;
      }

      return `
        <div>
          <div class="flex items-center justify-between mb-3">
            <button onclick="changeMonthOffset(-1)" class="p-1.5 rounded-lg bg-obsidian border border-borderDark text-mutedText hover:text-white">‹</button>
            <span class="text-xs font-bold text-white">${monthTitle}</span>
            <button onclick="changeMonthOffset(1)" class="p-1.5 rounded-lg bg-obsidian border border-borderDark text-mutedText hover:text-white">›</button>
          </div>
          <div class="grid grid-cols-7 gap-1.5 text-center text-[10px] font-semibold text-mutedText mb-1.5">
            <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
          </div>
          <div class="grid grid-cols-7 gap-1.5">
            ${cells}
          </div>
        </div>
      `;
    }

    function setCalendarMode(mode) {
      appState.calendarMode = mode;
      saveState();
      renderMainView();
    }

    function changeMonthOffset(delta) {
      appState.selectedMonthOffset += delta;
      renderMainView();
    }

    function handleGridSquareClick(dateStr, isFuture) {
      if (isFuture) {
        showToast('Cannot log future dates yet');
        return;
      }
      appState.selectedDate = dateStr;
      renderHeaderAndStrip();
      if (appState.workouts[dateStr]) {
        openDayDetailModal(dateStr);
      } else {
        openLoggerForDate(dateStr);
      }
    }

    function quickCheckInToday() {
      const todayStr = getTodayStr();
      if (appState.workouts[todayStr]) {
        openDayDetailModal(todayStr);
        return;
      }
      appState.workouts[todayStr] = {
        date: todayStr,
        title: 'Quick Workout Check-In',
        notes: 'Logged active training day.',
        isQuickCheckIn: true,
        entries: []
      };
      saveState();
      renderHeaderAndStrip();
      renderMainView();
      showToast('Workout day checked in! Square lit up.');
    }

    /*************************************************************************
     * TAB 2: WORKOUT & PROGRESSIVE OVERLOAD LOGGER
     *************************************************************************/
    function initSessionForDate(dateStr) {
      const existing = appState.workouts[dateStr];
      if (existing) {
        activeSession = JSON.parse(JSON.stringify(existing));
      } else {
        activeSession = {
          date: dateStr,
          title: 'Strength Training',
          notes: '',
          isQuickCheckIn: false,
          entries: []
        };
      }
    }

    function openLoggerForDate(dateStr) {
      appState.selectedDate = dateStr;
      initSessionForDate(dateStr);
      switchTab('log');
    }

    function startFromTemplate(templateId) {
      const tpl = appState.templates.find(t => t.id === templateId);
      if (!tpl) return;
      const dateStr = getTodayStr();
      activeSession = {
        date: dateStr,
        title: tpl.name,
        notes: '',
        isQuickCheckIn: false,
        entries: tpl.exerciseIds.map(exId => {
          const bench = getExerciseBenchmarks(exId, dateStr);
          const defaultWeight = bench.lastSession && bench.lastSession.sets[0]
            ? bench.lastSession.sets[0].weight
            : '';
          const defaultReps = bench.lastSession && bench.lastSession.sets[0]
            ? bench.lastSession.sets[0].reps
            : 10;
          return {
            exerciseId: exId,
            sets: [
              { weight: defaultWeight, reps: defaultReps, rir: '2', completed: false },
              { weight: defaultWeight, reps: defaultReps, rir: '1', completed: false },
              { weight: defaultWeight, reps: defaultReps, rir: '1', completed: false }
            ]
          };
        })
      };
      appState.selectedDate = dateStr;
      switchTab('log');
      showToast(`Loaded "${tpl.name}"`);
    }

    function renderLoggerTab(container) {
      const accentHex = getAccentHex();
      const unit = appState.unit;

      const entriesHtml = activeSession.entries.map((entry, exIdx) => {
        const exName = getExerciseName(entry.exerciseId);
        const bench = getExerciseBenchmarks(entry.exerciseId, activeSession.date);

        let benchmarkLine = 'No previous history — set your baseline today!';
        if (bench.lastSession) {
          const lastSummary = bench.lastSession.sets.map(s => `${s.weight}${unit}×${s.reps}`).join(', ');
          benchmarkLine = `Last: <span class="text-white font-semibold">${lastSummary}</span> · Best: <span style="color: ${accentHex};" class="font-bold">${bench.bestWeight}${unit}×${bench.bestWeightReps}</span>`;
        }

        const setsHtml = entry.sets.map((set, setIdx) => {
          const overload = evaluateSetOverload(entry.exerciseId, set.weight, set.reps, activeSession.date);
          const badgeHtml = overload
            ? `<span class="text-[9px] font-extrabold px-1.5 py-0.5 rounded uppercase tracking-tight ${overload.type === 'PR' ? 'text-obsidian pr-glow' : 'bg-white/10 text-white'}" style="${overload.type === 'PR' ? `background-color: ${accentHex};` : ''}">${overload.label}</span>`
            : '';

          return `
            <div class="grid grid-cols-12 gap-1.5 items-center py-1.5 ${set.completed ? 'opacity-95' : ''}">
              <div class="col-span-1 text-center text-xs font-bold text-mutedText">${setIdx + 1}</div>
              <div class="col-span-3">
                <input
                  type="number"
                  step="0.5"
                  inputmode="decimal"
                  placeholder="${unit}"
                  value="${set.weight}"
                  onchange="updateSetField(${exIdx}, ${setIdx}, 'weight', this.value)"
                  class="w-full bg-obsidian border border-borderDark focus:border-white rounded-xl py-2 px-2 text-center text-xs font-bold text-white outline-none"
                />
              </div>
              <div class="col-span-3">
                <input
                  type="number"
                  inputmode="numeric"
                  placeholder="reps"
                  value="${set.reps}"
                  onchange="updateSetField(${exIdx}, ${setIdx}, 'reps', this.value)"
                  class="w-full bg-obsidian border border-borderDark focus:border-white rounded-xl py-2 px-2 text-center text-xs font-bold text-white outline-none"
                />
              </div>
              <div class="col-span-3 flex flex-col items-center justify-center">
                ${badgeHtml || `<span class="text-[10px] text-mutedText">${set.weight && set.reps ? `1RM ~${calcE1RM(set.weight, set.reps)}` : '—'}</span>`}
              </div>
              <div class="col-span-2 flex items-center justify-end gap-1">
                <button
                  onclick="toggleSetComplete(${exIdx}, ${setIdx})"
                  class="w-8 h-8 rounded-xl flex items-center justify-center border transition active:scale-90"
                  style="${set.completed ? `background-color: ${accentHex}; border-color: ${accentHex}; color: #0A0A0C;` : 'background-color: #0A0A0C; border-color: #232329; color: #8E8E93;'}"
                  title="Complete set"
                >
                  ✓
                </button>
              </div>
            </div>
          `;
        }).join('');

        return `
          <div class="bg-surface border border-borderDark rounded-3xl p-4 space-y-2.5">
            <div class="flex items-start justify-between gap-2">
              <div>
                <h4 class="text-sm font-extrabold text-white">${escapeHtml(exName)}</h4>
                <p class="text-[11px] text-mutedText mt-0.5">${benchmarkLine}</p>

      if (!newDate) return;

    function updateSetField(exIdx, setIdx, field, val) {
      activeSession.entries[exIdx].sets[setIdx][field] = val;
      renderMainView();
    }

    function toggleSetComplete(exIdx, setIdx) {
      const s = activeSession.entries[exIdx].sets[setIdx];
      s.completed = !s.completed;
      if (s.completed) {
        const overload = evaluateSetOverload(activeSession.entries[exIdx].exerciseId, s.weight, s.reps, activeSession.date);
        if (overload) {
          showToast(`${overload.label} on ${getExerciseName(activeSession.entries[exIdx].exerciseId)}!`);
        }
      }
      renderMainView();
    }

    function addSetToExercise(exIdx) {
      const sets = activeSession.entries[exIdx].sets;
      const last = sets[sets.length - 1] || { weight: '', reps: 10, rir: '2' };
      sets.push({ weight: last.weight, reps: last.reps, rir: last.rir, completed: false });
      renderMainView();
    }

    function removeLastSet(exIdx) {
      if (activeSession.entries[exIdx].sets.length > 1) {
        activeSession.entries[exIdx].sets.pop();
        renderMainView();
      }
    }

    function removeExerciseFromSession(exIdx) {
      activeSession.entries.splice(exIdx, 1);
      renderMainView();
    }

    function saveQuickCheckInFromLogger() {
      appState.workouts[activeSession.date] = {
        date: activeSession.date,
        title: activeSession.title || 'Active Day Check-In',
        notes: activeSession.notes || 'Quick check-in logged.',
        isQuickCheckIn: true,
        entries: []
      };
      saveState();
      renderHeaderAndStrip();
      switchTab('calendar');
      showToast('Active day marked on Year Grid!');
    }

    function saveActiveWorkout() {
      if (activeSession.entries.length === 0) {
        saveQuickCheckInFromLogger();
        return;
      }
      // Filter out completely empty sets while keeping filled sets
      const cleanedEntries = activeSession.entries.map(e => ({
        exerciseId: e.exerciseId,
        sets: e.sets.filter(s => (parseFloat(s.weight) > 0 || parseInt(s.reps) > 0))
      })).filter(e => e.sets.length > 0);

      if (cleanedEntries.length === 0) {
        showToast('Enter weight or reps for at least 1 set first');
        return;
      }

      appState.workouts[activeSession.date] = {
        date: activeSession.date,
        title: activeSession.title || 'Strength Workout',
        notes: activeSession.notes || '',
        isQuickCheckIn: false,
        entries: cleanedEntries
      };
      saveState();
      renderHeaderAndStrip();
      switchTab('calendar');
      showToast('Workout saved & calendar updated!');
    }

    function countWorkoutPRs(workout) {
      if (!workout || workout.isQuickCheckIn || !workout.entries) return 0;
      let prs = 0;
      workout.entries.forEach(entry => {
        let hitPrInExercise = false;
        (entry.sets || []).forEach(s => {
          const ev = evaluateSetOverload(entry.exerciseId, s.weight, s.reps, workout.date);
          if (ev && ev.type === 'PR') hitPrInExercise = true;
        });
        if (hitPrInExercise) prs++;
      });
      return prs;
    }

    function getExerciseHistorySeries(exerciseId) {
      const dates = Object.keys(appState.workouts).sort();
      const series = [];

      dates.forEach(dateStr => {
        const w = appState.workouts[dateStr];
        if (!w || !w.entries) return;
        const entry = w.entries.find(e => e.exerciseId === exerciseId);
        if (entry && entry.sets && entry.sets.length > 0) {
          const validSets = entry.sets.filter(s => parseFloat(s.weight) > 0);
          if (validSets.length > 0) {
            const topWeight = Math.max(...validSets.map(s => parseFloat(s.weight) || 0));
            const bestE1RM = Math.max(...validSets.map(s => calcE1RM(s.weight, s.reps)));
            const totalVolume = validSets.reduce((acc, s) => acc + (parseFloat(s.weight) || 0) * (parseInt(s.reps) || 0), 0);
            series.push({
              date: dateStr,
              topWeight,
              bestE1RM,
              totalVolume,
              setsSummary: validSets.map(s => `${s.weight}${appState.unit}×${s.reps}`).join(', ')
            });
          }
        }
      });

      return series;
    }

    function buildOverloadSvgChart(points, accentHex, unit) {
      if (points.length === 0) {
        return `<div class="h-40 flex items-center justify-center text-xs text-mutedText">Log this exercise to visualize your progressive overload curve.</div>`;
      }
      if (points.length === 1) {
        const p = points[0];
        return `<div class="h-36 flex flex-col items-center justify-center text-center">
          <p class="text-xs font-bold text-white">Baseline Logged: ${p.topWeight} ${unit} (Est 1RM: ${p.bestE1RM} ${unit})</p>
          <p class="text-[11px] text-mutedText mt-1">Log a second session to plot your progression line.</p>
        </div>`;
      }

      const width = 340;
      const height = 150;
      const padL = 32;
      const padR = 14;
      const padT = 16;
      const padB = 24;
      const plotW = width - padL - padR;
      const plotH = height - padT - padB;

      const allVals = points.flatMap(p => [p.topWeight, p.bestE1RM]);
      const minVal = Math.floor(Math.min(...allVals) * 0.92);
      const maxVal = Math.ceil(Math.max(...allVals) * 1.05);
      const range = Math.max(1, maxVal - minVal);

      const getX = idx => padL + (idx / (points.length - 1)) * plotW;
      const getY = val => padT + plotH - ((val - minVal) / range) * plotH;

      const weightCoords = points.map((p, i) => `${getX(i).toFixed(1)},${getY(p.topWeight).toFixed(1)}`);
      const e1rmCoords = points.map((p, i) => `${getX(i).toFixed(1)},${getY(p.bestE1RM).toFixed(1)}`);

      const areaPath = `M ${getX(0).toFixed(1)},${(padT + plotH).toFixed(1)} L ${weightCoords.join(' L ')} L ${getX(points.length - 1).toFixed(1)},${(padT + plotH).toFixed(1)} Z`;

      const dotsHtml = points.map((p, i) => {
        const cx = getX(i).toFixed(1);
        const cy = getY(p.topWeight).toFixed(1);
        return `<circle cx="${cx}" cy="${cy}" r="3.2" fill="#0A0A0C" stroke="${accentHex}" stroke-width="2" />`;
      }).join('');

      return `
        <svg viewBox="0 0 ${width} ${height}" class="w-full h-40 overflow-visible">
          <defs>
            <linearGradient id="overloadGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="${accentHex}" stop-opacity="0.28" />
              <stop offset="100%" stop-color="${accentHex}" stop-opacity="0.0" />
            </linearGradient>
          </defs>

          <!-- Horizontal Grid Lines -->
          <line x1="${padL}" y1="${padT}" x2="${width - padR}" y2="${padT}" stroke="#232329" stroke-dasharray="3 3" />
          <line x1="${padL}" y1="${padT + plotH / 2}" x2="${width - padR}" y2="${padT + plotH / 2}" stroke="#232329" stroke-dasharray="3 3" />
          <line x1="${padL}" y1="${padT + plotH}" x2="${width - padR}" y2="${padT + plotH}" stroke="#232329" />

          <!-- Y Axis Labels -->
          <text x="${padL - 5}" y="${padT + 3}" text-anchor="end" fill="#8E8E93" font-size="9">${maxVal}</text>
          <text x="${padL - 5}" y="${padT + plotH / 2 + 3}" text-anchor="end" fill="#8E8E93" font-size="9">${Math.round((maxVal + minVal) / 2)}</text>
          <text x="${padL - 5}" y="${padT + plotH}" text-anchor="end" fill="#8E8E93" font-size="9">${minVal}</text>

          <!-- X Axis Start / End Dates -->
          <text x="${padL}" y="${height - 5}" text-anchor="start" fill="#8E8E93" font-size="9">${points[0].date.slice(5)}</text>
          <text x="${width - padR}" y="${height - 5}" text-anchor="end" fill="#8E8E93" font-size="9">${points[points.length - 1].date.slice(5)}</text>

          <!-- Area & Lines -->
          <path d="${areaPath}" fill="url(#overloadGrad)" />
          <polyline fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" stroke-dasharray="3 3" points="${e1rmCoords.join(' ')}" />
          <polyline fill="none" stroke="${accentHex}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" points="${weightCoords.join(' ')}" />
          ${dotsHtml}
        </svg>
      `;
    }

    function setUnit(unit) {
      appState.unit = unit;
      saveState();
      renderMainView();
      showToast(`Switched unit to ${unit.toUpperCase()}`);
    }

    function setAccent(accent) {
      if (!ACCENT_THEMES[accent]) return;
      appState.accent = accent;
      applyAccentTheme(accent);
      saveState();
      renderHeaderAndStrip();
      renderMainView();
      showToast(`Theme switched to ${ACCENT_THEMES[accent].name}`);
    }

    function deleteTemplate(id) {
      appState.templates = appState.templates.filter(t => t.id !== id);
      saveState();
      renderMainView();
      showToast('Routine removed');
    }

    function clearSampleOrAllData() {
      appState.workouts = {};
      appState.hasSampleData = false;
      saveState();
      renderHeaderAndStrip();
      switchTab('calendar');
      showToast('All workout logs cleared. Ready for Day 1!');
    }

    function exportBackupJson() {
      const dataStr = JSON.stringify(appState, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `cadence-backup-${getTodayStr()}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('JSON Backup downloaded');
    }

    function importBackupJson(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const imported = JSON.parse(e.target.result);
          if (imported && typeof imported.workouts === 'object') {
            appState = { ...appState, ...imported, hasSampleData: false };
            saveState();
            renderHeaderAndStrip();
            renderMainView();
            showToast('Backup restored successfully!');
          } else {
            showToast('Invalid backup file format');
          }
        } catch (err) {
          showToast('Could not parse JSON file');
        }
      };
      reader.readAsText(file);
    }

    /*************************************************************************
     * MODALS & BOTTOM SHEETS
     *************************************************************************/
    function openModal(innerHtml) {
      const overlay = document.getElementById('modalOverlay');
      const sheet = document.getElementById('modalSheet');
      sheet.innerHTML = innerHtml;
      overlay.classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.add('hidden');
    }

    function closeModalOnBackdrop(e) {
      if (e.target.id === 'modalOverlay') closeModal();
    }

    // 1. Day Detail Bottom Sheet (when tapping a lit square on the 365-day grid)
    function openDayDetailModal(dateStr) {
      const w = appState.workouts[dateStr];
      if (!w) return;
      const accentHex = getAccentHex();
      const unit = appState.unit;

      const entriesHtml = w.isQuickCheckIn ? `
        <div class="bg-obsidian border border-borderDark rounded-2xl p-4 text-center">
          <span class="text-2xl">✅</span>
          <p class="text-xs font-bold text-white mt-1">Quick Check-In Day</p>
          <p class="text-[11px] text-mutedText mt-0.5">${escapeHtml(w.notes || 'Active recovery / conditioning logged')}</p>
        </div>
      ` : (w.entries || []).map(entry => {
        const setsStr = (entry.sets || []).map((s, idx) => {
          const ov = evaluateSetOverload(entry.exerciseId, s.weight, s.reps, dateStr);
          return `
            <div class="flex items-center justify-between text-xs py-1">
              <span class="text-mutedText">Set ${idx + 1}</span>
              <span class="font-bold text-white">${s.weight} ${unit} × ${s.reps} reps</span>
              <span class="text-[10px] font-bold" style="color: ${ov ? accentHex : '#8E8E93'};">${ov ? ov.label : `1RM ~${calcE1RM(s.weight, s.reps)}`}</span>
            </div>
          `;
        }).join('');

        return `
          <div class="bg-obsidian border border-borderDark rounded-2xl p-3.5">
            <div class="flex items-center justify-between mb-1.5">
              <h4 class="text-xs font-extrabold text-white">${escapeHtml(getExerciseName(entry.exerciseId))}</h4>
              <button onclick="closeModal(); viewExerciseChart('${entry.exerciseId}')" class="text-[10px] font-bold" style="color: ${accentHex};">Chart →</button>
            </div>
            <div class="divide-y divide-borderDark/50">
              ${setsStr}
            </div>
          </div>
        `;
      }).join('');

      openModal(`
        <div class="space-y-4">
          <div class="flex items-start justify-between">
            <div>
              <span class="text-[11px] font-bold uppercase tracking-wider" style="color: ${accentHex};">${formatReadableDate(dateStr)} · ${dateStr}</span>
              <h3 class="text-base font-extrabold text-white mt-0.5">${escapeHtml(w.title)}</h3>
              ${w.notes ? `<p class="text-xs text-mutedText mt-1">${escapeHtml(w.notes)}</p>` : ''}
            </div>
            <button onclick="closeModal()" class="p-2 rounded-xl bg-obsidian text-mutedText hover:text-white">✕</button>
          </div>

          <div class="space-y-2.5 max-h-[50vh] overflow-y-auto pr-1">
            ${entriesHtml}
          </div>

          <div class="grid grid-cols-2 gap-2.5 pt-2">
            <button onclick="deleteWorkoutDate('${dateStr}')" class="py-3 rounded-2xl bg-coralAccent/15 border border-coralAccent/30 text-coralAccent text-xs font-bold">
              Delete Log
            </button>
            <button onclick="closeModal(); openLoggerForDate('${dateStr}')" class="py-3 rounded-2xl text-xs font-extrabold text-obsidian" style="background-color: ${accentHex};">
              Edit Workout
            </button>
          </div>
        </div>
      `);
    }

    function deleteWorkoutDate(dateStr) {
      delete appState.workouts[dateStr];
      saveState();
      closeModal();
      renderHeaderAndStrip();
      renderMainView();
      showToast('Workout removed');
    }

    // 2. Exercise Picker & Custom Exercise Modal
    function openExercisePickerModal(filterCat = 'All', searchQuery = '') {
      const accentHex = getAccentHex();
      const categories = ['All', 'Glutes / Lower', 'Back', 'Chest', 'Shoulders', 'Arms', 'Core & Cardio', 'Full Body', 'Custom'];

      const filtered = appState.exercises.filter(ex => {
        const matchesCat = filterCat === 'All' || ex.category === filterCat;
        const matchesQuery = ex.name.toLowerCase().includes(searchQuery.toLowerCase()) || ex.category.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCat && matchesQuery;
      });

      openModal(`
        <div class="space-y-3.5">
          <div class="flex items-center justify-between">
            <h3 class="text-base font-extrabold text-white">Add Exercise</h3>
            <button onclick="closeModal()" class="p-2 rounded-xl bg-obsidian text-mutedText hover:text-white">✕</button>
          </div>

          <input
            type="text"
            value="${escapeHtml(searchQuery)}"
            oninput="openExercisePickerModal('${filterCat}', this.value)"
            placeholder="Search ${appState.exercises.length}+ exercises..."
            class="w-full bg-obsidian border border-borderDark rounded-2xl px-3.5 py-2.5 text-xs text-white placeholder-mutedText outline-none"
          />

          <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-1">
            ${categories.map(cat => `
              <button
                onclick="openExercisePickerModal('${cat}', '${escapeHtml(searchQuery)}')"
                class="px-3 py-1.5 rounded-xl text-[11px] font-bold shrink-0 border transition ${filterCat === cat ? 'text-obsidian' : 'bg-obsidian border-borderDark text-mutedText'}"
                style="${filterCat === cat ? `background-color: ${accentHex}; border-color: ${accentHex};` : ''}"
              >
                ${cat}
              </button>
            `).join('')}
          </div>

          <div class="space-y-1.5 max-h-60 overflow-y-auto pr-1">
            ${filtered.map(ex => `
              <button onclick="addExerciseToActiveSession('${ex.id}')" class="w-full text-left bg-obsidian hover:bg-white/5 border border-borderDark rounded-2xl p-3 flex items-center justify-between transition">
                <div>
                  <p class="text-xs font-bold text-white">${escapeHtml(ex.name)}</p>
                  <p class="text-[10px] text-mutedText">${escapeHtml(ex.category)}</p>
                </div>
                <span class="text-xs font-extrabold" style="color: ${accentHex};">+ Add</span>
              </button>
            `).join('') || `<p class="text-xs text-mutedText text-center py-4">No matching exercises found.</p>`}
          </div>

          <!-- Create Custom Exercise -->
          <div class="pt-3 border-t border-borderDark space-y-2">
            <p class="text-[11px] font-bold text-white">Or Create Custom Exercise</p>
            <div class="flex gap-2">
              <input type="text" id="customExNameInput" placeholder="e.g., Smith Machine Squat" class="flex-1 bg-obsidian border border-borderDark rounded-xl px-3 py-2 text-xs text-white outline-none" />
              <button onclick="createAndAddCustomExercise()" class="px-3.5 py-2 rounded-xl text-xs font-extrabold text-obsidian shrink-0" style="background-color: ${accentHex};">
                Create
              </button>
            </div>
          </div>
        </div>
      `);
    }

    function addExerciseToActiveSession(exerciseId) {
      const bench = getExerciseBenchmarks(exerciseId, activeSession.date);
      const defaultWeight = bench.lastSession && bench.lastSession.sets[0] ? bench.lastSession.sets[0].weight : '';
      const defaultReps = bench.lastSession && bench.lastSession.sets[0] ? bench.lastSession.sets[0].reps : 10;

      activeSession.entries.push({
        exerciseId,
        sets: [
          { weight: defaultWeight, reps: defaultReps, rir: '2', completed: false },
          { weight: defaultWeight, reps: defaultReps, rir: '1', completed: false },
          { weight: defaultWeight, reps: defaultReps, rir: '1', completed: false }
        ]
      });
      closeModal();
      renderMainView();
    }

    function createAndAddCustomExercise() {
      const input = document.getElementById('customExNameInput');
      const name = (input ? input.value : '').trim();
      if (!name) {
        showToast('Enter an exercise name');
        return;
      }
      const newId = 'ex_custom_' + Date.now();
      appState.exercises.unshift({ id: newId, name, category: 'Custom' });
      saveState();
      addExerciseToActiveSession(newId);
      showToast(`Added "${name}"`);
    }

    // 3. Create Reusable Routine Modal (With Search, Category Filter & Custom Exercise Creation)
    let routineBuilderSelectedIds = new Set();

    function openCreateTemplateModal(resetSelection = true) {
      if (resetSelection) {
        routineBuilderSelectedIds = new Set();
      }
      const accentHex = getAccentHex();
      const categories = ['All', 'Glutes / Lower', 'Back', 'Chest', 'Shoulders', 'Arms', 'Core & Cardio', 'Full Body', 'Custom'];

      openModal(`
        <div class="space-y-3">
          <div class="flex items-center justify-between">
            <div>
              <h3 class="text-base font-extrabold text-white">New Workout Routine</h3>
              <p class="text-[11px] text-mutedText"><span id="tplSelectedCount" style="color: ${accentHex};" class="font-bold">0</span> exercises selected</p>
            </div>
            <button onclick="closeModal()" class="p-2 rounded-xl bg-obsidian text-mutedText hover:text-white">✕</button>
          </div>

          <input type="text" id="tplNameInput" placeholder="Routine Name (e.g., Glutes & Hamstrings)" class="w-full bg-obsidian border border-borderDark rounded-2xl px-3.5 py-2.5 text-xs font-bold text-white outline-none" />

          <!-- Search Filter inside Routine Builder -->
          <input
            type="text"
            id="tplExSearchInput"
            oninput="filterTemplateExerciseList()"
            placeholder="Search ${appState.exercises.length}+ exercises..."
            class="w-full bg-obsidian border border-borderDark rounded-2xl px-3.5 py-2 text-xs text-white placeholder-mutedText outline-none"
          />

          <!-- Muscle Group Filter Pills -->
          <div id="tplCatPills" class="flex gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
            ${categories.map((cat, idx) => `
              <button
                type="button"
                data-cat="${cat}"
                onclick="selectTemplateCategory('${cat}')"
                class="tpl-cat-btn px-2.5 py-1 rounded-xl text-[10px] font-bold shrink-0 border transition ${idx === 0 ? 'text-obsidian' : 'bg-obsidian border-borderDark text-mutedText'}"
                style="${idx === 0 ? `background-color: ${accentHex}; border-color: ${accentHex};` : ''}"
              >
                ${cat}
              </button>
            `).join('')}
          </div>

          <!-- Filtered Exercise Checklist -->
          <div id="tplExerciseChecklist" class="space-y-1.5 max-h-56 overflow-y-auto pr-1">
          </div>

          <!-- Quick Add Custom Exercise Directly While Building Routine -->
          <div class="pt-2 border-t border-borderDark/70 flex gap-2">
            <input type="text" id="tplQuickCustomEx" placeholder="Missing a lift? Type custom name..." class="flex-1 bg-obsidian border border-borderDark rounded-xl px-3 py-2 text-xs text-white outline-none" />
            <button type="button" onclick="quickCreateExerciseForTemplate()" class="px-3 py-2 rounded-xl bg-obsidian border border-borderDark text-xs font-bold text-white hover:bg-white/5 shrink-0">
              + Add
            </button>
          </div>

          <button onclick="saveNewTemplate()" class="w-full py-3 rounded-2xl text-xs font-extrabold text-obsidian shadow-lg" style="background-color: ${accentHex};">
            Save Routine
          </button>
        </div>
      `);

      window._activeTplFilterCat = 'All';
      filterTemplateExerciseList();
    }

    function selectTemplateCategory(cat) {
      window._activeTplFilterCat = cat;
      const accentHex = getAccentHex();
      document.querySelectorAll('.tpl-cat-btn').forEach(btn => {
        const isSelected = btn.dataset.cat === cat;
        if (isSelected) {
          btn.style.backgroundColor = accentHex;
          btn.style.borderColor = accentHex;
          btn.style.color = '#0A0A0C';
        } else {
          btn.style.backgroundColor = '#0A0A0C';
          btn.style.borderColor = '#232329';
          btn.style.color = '#8E8E93';
        }
      });
      filterTemplateExerciseList();
    }

    function toggleRoutineBuilderExercise(exId) {
      if (routineBuilderSelectedIds.has(exId)) {
        routineBuilderSelectedIds.delete(exId);
      } else {
        routineBuilderSelectedIds.add(exId);
      }
      const countEl = document.getElementById('tplSelectedCount');
      if (countEl) countEl.textContent = routineBuilderSelectedIds.size;
    }

    function filterTemplateExerciseList() {
      const listEl = document.getElementById('tplExerciseChecklist');
      if (!listEl) return;
      const q = (document.getElementById('tplExSearchInput')?.value || '').toLowerCase().trim();
      const cat = window._activeTplFilterCat || 'All';
      const accentHex = getAccentHex();

      const filtered = appState.exercises.filter(ex => {
        const matchCat = cat === 'All' || ex.category === cat;
        const matchQ = !q || ex.name.toLowerCase().includes(q) || ex.category.toLowerCase().includes(q);
        return matchCat && matchQ;
      });

      listEl.innerHTML = filtered.map(ex => {
        const checked = routineBuilderSelectedIds.has(ex.id);
        return `
          <label class="flex items-center justify-between bg-obsidian border ${checked ? 'border-white/30' : 'border-borderDark'} rounded-xl p-2.5 cursor-pointer transition">
            <div class="min-w-0 pr-2">
              <span class="text-xs font-semibold text-white block truncate">${escapeHtml(ex.name)}</span>
              <span class="text-[10px] text-mutedText">${escapeHtml(ex.category)}</span>
            </div>
            <input
              type="checkbox"
              value="${ex.id}"
              ${checked ? 'checked' : ''}
              onchange="toggleRoutineBuilderExercise('${ex.id}'); filterTemplateExerciseList();"
              style="accent-color: ${accentHex};"
              class="w-4 h-4 shrink-0"
            />
          </label>
        `;
      }).join('') || `<p class="text-xs text-mutedText text-center py-4">No matching exercises. Add it below!</p>`;
    }

    function quickCreateExerciseForTemplate() {
      const input = document.getElementById('tplQuickCustomEx');
      const name = (input ? input.value : '').trim();
      if (!name) {
        showToast('Type an exercise name first');
        return;
      }
      const newId = 'ex_custom_' + Date.now();
      appState.exercises.unshift({ id: newId, name, category: 'Custom' });
      routineBuilderSelectedIds.add(newId);
      saveState();
      input.value = '';
      const countEl = document.getElementById('tplSelectedCount');
      if (countEl) countEl.textContent = routineBuilderSelectedIds.size;
      filterTemplateExerciseList();
      showToast(`Created & selected "${name}"`);
    }

    function saveNewTemplate() {
      const name = document.getElementById('tplNameInput').value.trim();
      const checked = Array.from(routineBuilderSelectedIds);
      if (!name || checked.length === 0) {
        showToast('Enter a routine name and select at least 1 exercise');
        return;
      }
      const firstEx = appState.exercises.find(e => e.id === checked[0]);
      appState.templates.unshift({
        id: 'tpl_' + Date.now(),
        name,
        tag: firstEx ? firstEx.category : 'Custom',
        exerciseIds: checked
      });
      saveState();
      closeModal();
      renderMainView();
      showToast('Routine saved!');
    }

    // 4. Phone Home Screen Shortcut Guide Modal
    function openInstallModal() {
      const accentHex = getAccentHex();
      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2.5">
              <div class="w-9 h-9 rounded-xl bg-obsidian border border-borderDark flex items-center justify-center">
                <span class="text-base">📱</span>
              </div>
              <div>
                <h3 class="text-base font-extrabold text-white">Install CADENCE as a Full-Screen App</h3>
                <p class="text-[11px] text-mutedText">Zero browser bars via GitHub Pages</p>
              </div>
            </div>
            <button onclick="closeModal()" class="p-2 rounded-xl bg-obsidian text-mutedText hover:text-white">✕</button>
          </div>

          <div class="bg-obsidian border border-borderDark rounded-2xl p-3.5 space-y-2">
            <p class="text-xs font-extrabold" style="color: ${accentHex};">Step 1: Host on GitHub Pages (Free)</p>
            <ol class="text-xs text-mutedText space-y-1.5 list-decimal list-inside">
              <li>Create a new public repository on <span class="text-white font-semibold">github.com</span> (e.g. <code class="text-white">cadence</code>).</li>
              <li>Upload this single file named exactly <code class="text-white font-semibold">index.html</code>.</li>
              <li>Go to <span class="text-white font-semibold">Settings → Pages</span>, select branch <span class="text-white font-semibold">main</span>, and click <span class="text-white font-semibold">Save</span>.</li>
            </ol>
          </div>

          <div class="bg-obsidian border border-borderDark rounded-2xl p-3.5 space-y-2">
            <p class="text-xs font-extrabold" style="color: ${accentHex};">Step 2: Add Your GitHub Link to Home Screen</p>
            <ol class="text-xs text-mutedText space-y-1.5 list-decimal list-inside">
              <li>Open your <code class="text-white">username.github.io/cadence</code> link in <span class="text-white font-semibold">Safari</span> (iPhone) or <span class="text-white font-semibold">Chrome</span> (Android).</li>
              <li>Tap <span class="text-white font-semibold">Share → Add to Home Screen</span> (iOS) or <span class="text-white font-semibold">⋮ → Install App</span> (Android).</li>
              <li>It will launch completely full-screen like a real native app!</li>
            </ol>
          </div>

          <button onclick="closeModal()" class="w-full py-3 rounded-2xl text-xs font-extrabold text-obsidian" style="background-color: ${accentHex};">
            Got It
          </button>
        </div>
      `);
    }

    // 5. Quick Theme Picker Modal (Triggered from Header Color Swatch)
    function openThemePickerModal() {
      const accentHex = getAccentHex();
      const swatches = Object.values(ACCENT_THEMES).map(t => {
        const isSelected = appState.accent === t.id;
        return `
          <button
            onclick="setAccent('${t.id}'); openThemePickerModal();"
            class="w-full flex items-center justify-between p-3 rounded-2xl border transition active:scale-[0.98] ${isSelected ? 'bg-obsidian border-white/40' : 'bg-obsidian/60 border-borderDark hover:bg-obsidian'}"
          >
            <div class="flex items-center gap-3">
              <span class="w-6 h-6 rounded-full block border border-white/20" style="background-color: ${t.hex}; box-shadow: 0 0 10px rgba(${t.rgb}, 0.4);"></span>
              <span class="text-xs font-bold text-white">${t.name}</span>
            </div>
            ${isSelected ? `<span class="text-[11px] font-extrabold px-2.5 py-0.5 rounded-full text-obsidian" style="background-color: ${t.hex};">Active</span>` : `<span class="text-[11px] text-mutedText">Select</span>`}
          </button>
        `;
      }).join('');

      openModal(`
        <div class="space-y-3.5">
          <div class="flex items-center justify-between">
            <div>
              <h3 class="text-base font-extrabold text-white">Choose Accent Color</h3>
              <p class="text-[11px] text-mutedText">Updates your Year Grid, PR badges, charts & app icon</p>
            </div>
            <button onclick="closeModal()" class="p-2 rounded-xl bg-obsidian text-mutedText hover:text-white">✕</button>
          </div>

          <div class="space-y-2">
            ${swatches}
          </div>

          <button onclick="closeModal()" class="w-full py-3 rounded-2xl text-xs font-extrabold text-obsidian" style="background-color: ${accentHex};">
            Done
          </button>
        </div>
      `);
    }

    function dismissInstallBanner() {
      appState.dismissedInstallBanner = true;
      saveState();
      renderMainView();
    }

    /*************************************************************************
     * TOAST & SECURITY HELPERS
     *************************************************************************/
    function showToast(message) {
      const container = document.getElementById('toastContainer');
      const accentHex = getAccentHex();
      const toast = document.createElement('div');
      toast.className = 'bg-surface border border-borderDark text-white text-xs font-bold px-4 py-2.5 rounded-2xl shadow-2xl flex items-center gap-2 transition-all duration-200';
      toast.innerHTML = `<span class="w-2 h-2 rounded-full shrink-0" style="background-color: ${accentHex};"></span><span>${escapeHtml(message)}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-6px)';
        setTimeout(() => toast.remove(), 220);
      }, 2400);
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    /*************************************************************************
     * INITIALIZATION & LIFECYCLE AUTOSAVE
     *************************************************************************/
    function setupLifecycleAutosave() {
      // Flush state whenever iOS switches apps, locks screen, or backgrounds the Web Clip
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') {
          saveState();
        }
      });
      window.addEventListener('pagehide', () => {
        saveState();
      });
      window.addEventListener('beforeunload', () => {
        saveState();
      });
    }

    window.addEventListener('DOMContentLoaded', async () => {
      await loadState();
      initSessionForDate(getTodayStr());
      renderHeaderAndStrip();
      renderMainView();
      setupLifecycleAutosave();
    });
  </script>
