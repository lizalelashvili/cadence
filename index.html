    function applyAccentTheme(accentKey) {
      const theme = ACCENT_THEMES[accentKey] || ACCENT_THEMES.blue;
      appState.accent = ACCENT_THEMES[accentKey] ? accentKey : 'blue';
      document.documentElement.style.setProperty('--accent', theme.hex);
      document.documentElement.style.setProperty('--accent-soft', theme.soft);
      document.documentElement.style.setProperty('--accent-border', theme.border);
      updateDynamicIconsAndManifest(theme.hex);
    }

    function updateDynamicIconsAndManifest(hex) {
      try {
        function buildIconDataUrl(size) {
          const canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#0A0A0C';
          ctx.fillRect(0, 0, size, size);

          const pad = Math.round(size * 0.21);
          const gap = Math.round(size * 0.08);
          const sq = Math.round((size - pad * 2 - gap) / 2);
          const r = Math.round(sq * 0.24);

          function drawSq(x, y, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + sq - r, y);
            ctx.quadraticCurveTo(x + sq, y, x + sq, y + r);
            ctx.lineTo(x + sq, y + sq - r);
            ctx.quadraticCurveTo(x + sq, y + sq, x + sq - r, y + sq);
            ctx.lineTo(x + r, y + sq);
            ctx.quadraticCurveTo(x, y + sq, x, y + sq - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
            ctx.fill();
          }

          drawSq(pad, pad, hex);
          drawSq(pad + sq + gap, pad, '#27272E');
          drawSq(pad, pad + sq + gap, '#27272E');
          drawSq(pad + sq + gap, pad + sq + gap, hex);
          return canvas.toDataURL('image/png');
        }

        const icon180 = buildIconDataUrl(180);
        const icon512 = buildIconDataUrl(512);
        const el180 = document.getElementById('appleTouchIcon');
        const el512 = document.getElementById('appleTouchIcon512');
        const elFav = document.getElementById('faviconIcon');
        if (el180) el180.href = icon180;
        if (el512) el512.href = icon512;
        if (elFav) elFav.href = icon180;

        let startUrl = './index.html';
        try {
          const sess = JSON.parse(localStorage.getItem(ACCOUNT_SESSION_KEY) || 'null');
          if (sess && sess.username && sess.passHash) {
            startUrl = `./index.html?u=${encodeURIComponent(sess.username)}&h=${encodeURIComponent(sess.passHash)}`;
          }
        } catch (_) {}

        const manifestObj = {
          name: 'CADENCE — 365-Day Workout Tracker',
          short_name: 'CADENCE',
          start_url: startUrl,
          display: 'standalone',
          background_color: '#0A0A0C',
          theme_color: '#0A0A0C',
          icons: [
            { src: icon180, sizes: '180x180', type: 'image/png' },
            { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
          ]
        };
        const blob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
        const manEl = document.getElementById('appManifest');
        if (manEl) manEl.href = URL.createObjectURL(blob);
      } catch (_) {}
    }

    function writeToIDB(key, val) {
      return new Promise((resolve) => {
        if (!window.indexedDB) return resolve();
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
        };
        req.onsuccess = () => {
          try {
            const tx = req.result.transaction(IDB_STORE, 'readwrite');
            tx.objectStore(IDB_STORE).put(val, key);
            tx.oncomplete = () => resolve();
            tx.onerror = () => resolve();
          } catch (_) { resolve(); }
        };
        req.onerror = () => resolve();
      });
    }

    function readFromIDB(key) {
      return new Promise((resolve) => {
        if (!window.indexedDB) return resolve(null);
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
        };
        req.onsuccess = () => {
          try {
            const tx = req.result.transaction(IDB_STORE, 'readonly');
            const g = tx.objectStore(IDB_STORE).get(key);
            g.onsuccess = () => resolve(g.result || null);
            g.onerror = () => resolve(null);
          } catch (_) { resolve(null); }
        };
        req.onerror = () => resolve(null);
      });
    }

    function mergeStateSnapshots(base, incoming) {
      if (!incoming || typeof incoming !== 'object') return base;
      const incomingNewer = (Number(incoming._updatedAt || 0) >= Number(base._updatedAt || 0));
      const merged = {
        ...base,
        ...(incomingNewer ? incoming : {}),
        workouts: { ...(base.workouts || {}), ...(incoming.workouts || {}) },
        calorieLogs: { ...(base.calorieLogs || {}) },
        customExercises: [...(base.customExercises || [])],
        favoriteFoods: [...(base.favoriteFoods || [])]
      };

      // Merge per-day calorie logs without dropping entries
      const allCalDates = new Set([...Object.keys(base.calorieLogs || {}), ...Object.keys(incoming.calorieLogs || {})]);
      allCalDates.forEach(dt => {
        const listA = Array.isArray(base.calorieLogs?.[dt]) ? base.calorieLogs[dt] : [];
        const listB = Array.isArray(incoming.calorieLogs?.[dt]) ? incoming.calorieLogs[dt] : [];
        const seen = new Set();
        const combined = [];
        [...listA, ...listB].forEach(item => {
          const sig = `${item.id || ''}_${item.name}_${item.cal}_${item.meal || ''}`;
          if (!seen.has(sig)) {
            seen.add(sig);
            combined.push(item);
          }
        });
        merged.calorieLogs[dt] = combined;
      });

      // Merge custom exercises
      const seenEx = new Set(merged.customExercises.map(e => e.id));
      (incoming.customExercises || []).forEach(e => {
        if (e && e.id && !seenEx.has(e.id)) {
          seenEx.add(e.id);
          merged.customExercises.push(e);
        }
      });

      // Merge favorite foods
      const seenFav = new Set(merged.favoriteFoods.map(f => (f.name || '').toLowerCase().trim()));
      (incoming.favoriteFoods || []).forEach(f => {
        const key = (f.name || '').toLowerCase().trim();
        if (key && !seenFav.has(key)) {
          seenFav.add(key);
          merged.favoriteFoods.push(f);
        }
      });

      if (!incomingNewer) {
        merged.accent = base.accent;
        merged.firstName = base.firstName;
        merged.lastName = base.lastName;
        merged.gender = base.gender;
        merged.calorieTarget = base.calorieTarget;
        merged.proteinTarget = base.proteinTarget;
        merged.bmrProfile = base.bmrProfile;
        merged.measurements = base.measurements;
        merged.routines = base.routines;
        merged.pendingAiResult = base.pendingAiResult;
        merged.aiUsage = base.aiUsage;
      }
      return merged;
    }

    async function pushStateToSupabase(immediate = false) {
      const session = getActiveSession();
      if (!session || !session.username) return;
      const cfg = getSupabaseConfig();
      if (!cfg) return;

      const payload = {
        username: session.username,
        pass_hash: session.passHash || appState._passHash || '',
        state_json: {
          ...appState,
          _passHash: session.passHash || appState._passHash || '',
          _displayName: appState.firstName || session.username,
          _updatedAt: appState._updatedAt || Date.now()
        },
        updated_at: new Date().toISOString()
      };

      const doSend = async () => {
        try {
          if (supabaseClient) {
            await supabaseClient.from('cadence_profiles').upsert(payload, { onConflict: 'username' });
          } else {
            await fetch(`${cfg.url}/rest/v1/cadence_profiles?on_conflict=username`, {
              method: 'POST',
              keepalive: true,
              headers: {
                'Content-Type': 'application/json',
                'apikey': cfg.anonKey,
                'Authorization': `Bearer ${cfg.anonKey}`,
                'Prefer': 'resolution=merge-duplicates'
              },
              body: JSON.stringify(payload)
            });
          }
        } catch (_) {}
      };

      if (immediate) {
        clearTimeout(cloudSyncTimer);
        await doSend();
      } else {
        clearTimeout(cloudSyncTimer);
        cloudSyncTimer = setTimeout(doSend, 350);
      }
    }

    function persistState(immediateCloud = false) {
      appState._updatedAt = Date.now();
      const session = getActiveSession();
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
        if (session && session.username) {
          const userKey = `${ACCOUNT_VAULT_PREFIX}${session.username}`;
          localStorage.setItem(userKey, JSON.stringify(appState));
          localStorage.setItem(`${userKey}_backup`, JSON.stringify(appState));
          writeToIDB(userKey, appState);
        }
      } catch (_) {}
      pushStateToSupabase(immediateCloud);
    }

    async function hydrateStateFromVault() {
      // Handle Home Screen PWA URL auto-login query params (?u=...&h=...)
      try {
        const params = new URLSearchParams(window.location.search);
        const qUser = params.get('u');
        const qHash = params.get('h');
        if (qUser && qHash && !getActiveSession()) {
          localStorage.setItem(ACCOUNT_SESSION_KEY, JSON.stringify({
            username: qUser.toLowerCase().trim(),
            passHash: qHash,
            expiresAt: Date.now() + SIXTY_DAYS_MS
          }));
          window.history.replaceState({}, document.title, window.location.pathname);
        }
      } catch (_) {}

      const session = getActiveSession();
      let candidate = getDefaultState();

      try {
        const localMain = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        if (localMain) candidate = mergeStateSnapshots(candidate, localMain);
      } catch (_) {}

      if (session && session.username) {
        const userKey = `${ACCOUNT_VAULT_PREFIX}${session.username}`;
        try {
          const vaultLocal = JSON.parse(localStorage.getItem(userKey) || localStorage.getItem(`${userKey}_backup`) || 'null');
          if (vaultLocal) candidate = mergeStateSnapshots(candidate, vaultLocal);
        } catch (_) {}

        const vaultIdb = await readFromIDB(userKey);
        if (vaultIdb) candidate = mergeStateSnapshots(candidate, vaultIdb);

        if (supabaseClient) {
          try {
            const { data } = await supabaseClient
              .from('cadence_profiles')
              .select('state_json')
              .eq('username', session.username)
              .maybeSingle();
            if (data && data.state_json) {
              candidate = mergeStateSnapshots(candidate, data.state_json);
            }
          } catch (_) {}
        }

        if (session.firstName && (!candidate.firstName || candidate.firstName === 'Athlete')) {
          candidate.firstName = session.firstName;
        }
        if (session.gender && !candidate.gender) {
          candidate.gender = session.gender;
        }
      }

      if (!Array.isArray(candidate.routines) || candidate.routines.length === 0) {
        candidate.routines = getDefaultRoutines();
      }
      if (!candidate.aiUsage || candidate.aiUsage.date !== TODAY_STR) {
        candidate.aiUsage = { date: TODAY_STR, count: 0 };
      }

      appState = candidate;
      applyAccentTheme(appState.accent || 'blue');
    }

      const session = getActiveSession();
      const isGuest = localStorage.getItem(GUEST_MODE_KEY) === 'true';
      if (!session && !isGuest) {
        if (window.location.protocol !== 'about:' && !window.location.href.startsWith('blob:')) {
          window.location.href = './login.html';
          return false;
        }
      }
      return true;
    }

    function getExercisePrText(exerciseId) {
      let bestKg = 0;
      let bestReps = 0;
      Object.values(appState.workouts || {}).forEach(w => {
        (w.entries || []).forEach(ent => {
          if (ent.exerciseId === exerciseId) {
            (ent.sets || []).forEach(s => {
              const kg = Number(s.kg || 0);
              const reps = Number(s.reps || 0);
              if (kg > bestKg || (kg === bestKg && reps > bestReps)) {
                bestKg = kg;
                bestReps = reps;
              }

          }
        });
      });
      return bestKg > 0 ? `PR: ${bestKg}kg × ${bestReps}` : 'No PR yet';

    function resolveExerciseAnimType(ex) {
      const id = (ex.id || '').toLowerCase();
      const name = (ex.name || '').toLowerCase();
      if (id.includes('hip_thrust') || id.includes('glute_bridge') || name.includes('thrust') || name.includes('bridge')) return 'thrust';
      if (id.includes('bulgarian') || id.includes('lunge') || name.includes('bulgarian') || name.includes('lunge') || name.includes('split')) return 'lunge';
      if (id.includes('rdl') || name.includes('deadlift') || name.includes('rdl') || name.includes('hinge')) return 'hinge';
      if (id.includes('squat') || id.includes('leg_press') || name.includes('squat') || name.includes('leg press')) return 'squat';
      if (id.includes('leg_ext') || id.includes('leg_curl') || name.includes('leg ext') || name.includes('leg curl')) return 'leg_iso';
      if (id.includes('pulldown') || id.includes('pullup') || id.includes('row') || name.includes('pulldown') || name.includes('pull-up') || name.includes('row')) return 'pull';
      if (id.includes('lateral') || id.includes('ohp') || id.includes('face_pull') || name.includes('shoulder') || name.includes('lateral') || name.includes('overhead')) return 'shoulder';
      if (id.includes('bench') || id.includes('pushup') || id.includes('fly') || id.includes('dip') || name.includes('bench') || name.includes('chest') || name.includes('press')) return 'press';
      if (id.includes('curl') || id.includes('tricep') || id.includes('skull') || name.includes('curl') || name.includes('tricep')) return 'arms';
      if (id.includes('stair') || id.includes('walk') || id.includes('run') || id.includes('bike') || id.includes('erg') || ex.muscle === 'Cardio') return 'cardio';
      if (ex.muscle === 'Core' || id.includes('plank') || id.includes('crunch') || id.includes('hanging')) return 'core';

    function getMondayOfWeek(d) {
      const copy = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      const day = copy.getDay();
      const diff = (day === 0 ? -6 : 1 - day);
      copy.setDate(copy.getDate() + diff);
      return copy;
    }

    function formatShortDate(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      return dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    }

    function getCompletedDaysCurrentYear() {
      const year = TODAY_OBJ.getFullYear();
      let count = 0;
      Object.entries(appState.workouts || {}).forEach(([dt, w]) => {
        if (dt.startsWith(`${year}-`) && w && w.completed) count++;
      });
      return count;
    }

    function getWeeklyStreak() {
      let streak = 0;
      let cursor = getMondayOfWeek(TODAY_OBJ);
      for (let w = 0; w < 52; w++) {
        let weekHasWorkout = false;
        for (let i = 0; i < 7; i++) {
          const d = new Date(cursor);
          d.setDate(cursor.getDate() + i);
          const s = toLocalDateStr(d);
          if (appState.workouts?.[s]?.completed) {
            weekHasWorkout = true;
            break;
          }
        }
        if (weekHasWorkout) {
          streak++;
          cursor.setDate(cursor.getDate() - 7);
        } else if (w === 0) {
          cursor.setDate(cursor.getDate() - 7);
        } else {
          break;
        }
      }
      return streak;
    }

    function getCalorieDayTotals(dateStr) {
      const items = appState.calorieLogs?.[dateStr] || [];
      let cal = 0;
      let p = 0;
      items.forEach(it => {
        cal += Number(it.cal || 0);
        p += Number(it.p || 0);
      });
      return { cal: Math.round(cal), p: Math.round(p), count: items.length };
    }

    function toggleQuickCheckIn(dateStr = TODAY_STR) {
      if (!appState.workouts) appState.workouts = {};
      const existing = appState.workouts[dateStr] || { splitName: 'Quick Check-In', entries: [], completed: false };
      existing.completed = !existing.completed;
      if (!existing.splitName) existing.splitName = 'Quick Check-In';
      appState.workouts[dateStr] = existing;
      persistState(true);
      renderApp();
      showToast(existing.completed ? 'Day marked complete!' : 'Check-in removed');
    }

    function buildYearMatrixMondayFirst(year) {
      const jan1 = new Date(year, 0, 1);
      const dec31 = new Date(year, 11, 31);
      const startMonday = getMondayOfWeek(jan1);
      const weeks = [];
      let cursor = new Date(startMonday);
      while (cursor <= dec31) {
        const weekCols = [];
        for (let r = 0; r < 7; r++) {
          const d = new Date(cursor);
          d.setDate(cursor.getDate() + r);
          const inYear = d.getFullYear() === year;
          weekCols.push({
            dateStr: toLocalDateStr(d),
            inYear,
            month: d.getMonth(),
            dayOfMonth: d.getDate()
          });
        }
        weeks.push(weekCols);
        cursor.setDate(cursor.getDate() + 7);
      }
      return weeks;
    }

    function renderYearHeatmapHtml(isFullScreen = false) {
      const year = TODAY_OBJ.getFullYear();
      const weeks = buildYearMatrixMondayFirst(year);
      const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      const dayLetters = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
      const cellSize = isFullScreen ? 'w-3.5 h-3.5' : 'w-3 h-3';

      let monthHeaderHtml = '';
      let lastMonth = -1;
      weeks.forEach(w => {
        const firstInYear = w.find(c => c.inYear && c.dayOfMonth <= 7);
        if (firstInYear && firstInYear.month !== lastMonth) {
          lastMonth = firstInYear.month;
          monthHeaderHtml += `<div class="${isFullScreen ? 'w-3.5' : 'w-3'} text-[9px] font-bold text-mutedText overflow-visible whitespace-nowrap">${monthNames[firstInYear.month]}</div>`;
        } else {
          monthHeaderHtml += `<div class="${isFullScreen ? 'w-3.5' : 'w-3'}"></div>`;
        }
      });

      const leftAxisHtml = `
        <div class="flex flex-col gap-1 pr-1.5 pt-4 shrink-0">
          ${dayLetters.map(l => `<div class="${isFullScreen ? 'h-3.5' : 'h-3'} flex items-center justify-center text-[9px] font-extrabold text-mutedText">${l}</div>`).join('')}
        </div>
      `;

      const columnsHtml = weeks.map(w => `
        <div class="flex flex-col gap-1 shrink-0">
          ${w.map(cell => {
            if (!cell.inYear) return `<div class="${cellSize} rounded-[3px] bg-transparent"></div>`;
            const isDone = !!appState.workouts?.[cell.dateStr]?.completed;
            const isToday = cell.dateStr === TODAY_STR;
            return `<button type="button" onclick="toggleQuickCheckIn('${cell.dateStr}')" title="${cell.dateStr}"

      `).join('');

      return `

              <div class="flex gap-1">${monthHeaderHtml}</div>
              <div class="flex gap-1">${columnsHtml}</div>
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 9. WORKOUTS TAB (TODAY'S SESSION + FORM ANIMATIONS & COMMON MISTAKES)
    // =========================================================================
    function getOrCreateWorkoutSession(dateStr) {
      if (!appState.workouts) appState.workouts = {};
      if (!appState.workouts[dateStr]) {
        appState.workouts[dateStr] = {
          splitName: 'Custom Session',
          completed: false,
          entries: []
        };
      }
      return appState.workouts[dateStr];
    }

    function updateWorkoutSplitName(val) {
      const w = getOrCreateWorkoutSession(selectedWorkoutDate);
      w.splitName = val;
      persistState();
    }

    function toggleFormDrawer(key) {
      openFormDrawers[key] = !openFormDrawers[key];
      renderApp();
    }

    function addSetToEntry(entryIdx) {
      const w = getOrCreateWorkoutSession(selectedWorkoutDate);
      const ent = w.entries[entryIdx];
      if (!ent) return;
      const last = ent.sets[ent.sets.length - 1] || { kg: 20, reps: 10 };
      ent.sets.push({ kg: last.kg, reps: last.reps });
      persistState();
      renderApp();
    }

    function updateSetField(entryIdx, setIdx, field, val) {
      const w = getOrCreateWorkoutSession(selectedWorkoutDate);
      if (!w.entries[entryIdx]?.sets[setIdx]) return;
      w.entries[entryIdx].sets[setIdx][field] = Math.max(0, Number(val) || 0);
      persistState();
    }

    function removeEntryFromWorkout(entryIdx) {
      const w = getOrCreateWorkoutSession(selectedWorkoutDate);
      w.entries.splice(entryIdx, 1);
      persistState();
      renderApp();
    }

    function finishWorkoutAndFillSquare() {
      const w = getOrCreateWorkoutSession(selectedWorkoutDate);
      w.completed = true;
      persistState(true);
      activeTab = 'grid';
      renderApp();
      showToast(`Workout saved! ${formatShortDate(selectedWorkoutDate)} filled.`);
    }

              <div class="grid grid-cols-12 gap-2 px-2 text-[10px] font-bold uppercase tracking-wider text-mutedText">

                <span class="col-span-5 text-center">Weight (kg)</span>

              ${(ent.sets || []).map((s, sIdx) => `

            <button type="button" onclick="addSetToEntry(${idx})"

              + Add Set
            </button>

        `;
      }).join('');

      return `
        <!-- Today's Session Header Card -->
        <section class="bg-surface border border-borderDark rounded-3xl p-4 space-y-3">
          <div class="flex items-center justify-between gap-2">
            <div>
              <p class="text-[10px] font-extrabold uppercase tracking-wider accent-text">TODAY'S SESSION</p>
              <h2 class="text-lg font-extrabold text-white mt-0.5">${formatShortDate(selectedWorkoutDate)}</h2>
            </div>
            <button type="button" onclick="openDarkDatePicker('workout')"
              class="px-3 py-2 rounded-2xl bg-obsidian border border-borderDark hover:border-white/25 text-xs font-extrabold text-white">
              📅 ${selectedWorkoutDate}
            </button>
          </div>
          <input type="text" value="${escapeHtml(session.splitName || '')}" oninput="updateWorkoutSplitName(this.value)"
            placeholder="Session Name (e.g. Upper Body, Glute Focused)"
            class="w-full bg-obsidian border border-borderDark rounded-2xl px-3.5 py-2.5 text-xs font-extrabold text-white focus:outline-none focus:border-white/40" />
        </section>

        ${entriesHtml}

        <button type="button" onclick="openExercisePicker('workout')"
          class="w-full py-3.5 rounded-2xl bg-surface border border-dashed border-white/25 hover:border-white/50 text-xs font-extrabold text-white transition">
          + Add Exercise to Workout

        <button type="button" onclick="finishWorkoutAndFillSquare()"

    // =========================================================================
    // 10. CALORIES TAB (FULL-SCREEN MANUAL MEAL BUILDER, AI CALCULATOR, UNIFIED LOGS)
    // =========================================================================
    function getBaseGramsForFood(food) {
      const m = (food.name || '').match(/(\d+)\s*(g|ml)/i);
      return m ? Number(m[1]) : 100;
    }

    function isFoodFavorited(name) {
      const target = (name || '').toLowerCase().trim();
      return (appState.favoriteFoods || []).some(f => (f.name || '').toLowerCase().trim() === target);
    }

    function toggleFavoriteMealObj(mealObj) {
      if (!appState.favoriteFoods) appState.favoriteFoods = [];
      const target = (mealObj.name || '').toLowerCase().trim();
      const idx = appState.favoriteFoods.findIndex(f => (f.name || '').toLowerCase().trim() === target);
      if (idx >= 0) {
        appState.favoriteFoods.splice(idx, 1);
        showToast('Removed from Favorites');
      } else {
        appState.favoriteFoods.unshift({
          name: mealObj.name,
          cal: Math.round(Number(mealObj.cal || 0)),
          p: Math.round(Number(mealObj.p || 0))
        });
        showToast('Added to ★ Favorites');
      }
      persistState();
      renderApp();
    }

    function toggleFavoriteByFoodId(foodId) {
      const f = FOOD_DATABASE.find(x => x.id === foodId);
      if (f) toggleFavoriteMealObj(f);
    }

    function toggleFavoriteFromDayLogIdx(idx) {
      const list = appState.calorieLogs?.[selectedCalorieDate] || [];
      if (list[idx]) toggleFavoriteMealObj(list[idx]);
    }

    function logFoodItemDirect(name, cal, p, mealBucket = selectedMealBucket) {
      if (!appState.calorieLogs) appState.calorieLogs = {};
      if (!appState.calorieLogs[selectedCalorieDate]) appState.calorieLogs[selectedCalorieDate] = [];
      const validMeal = ['Breakfast', 'Lunch', 'Dinner', 'Snacks'].includes(mealBucket) ? mealBucket : 'Snacks';
      appState.calorieLogs[selectedCalorieDate].push({
        id: `m_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
        name: String(name || 'Logged Meal'),
        cal: Math.round(Number(cal || 0)),
        p: Math.round(Number(p || 0)),
        meal: validMeal
      });
      persistState(true);
      renderApp();
    }

    function logFoodById(foodId) {
      const f = FOOD_DATABASE.find(x => x.id === foodId);
      if (!f) return;
      logFoodItemDirect(f.name, f.cal, f.p, selectedMealBucket);
      showToast(`Logged ${f.name}`);
    }

    function logFavoriteByIndex(idx) {
      const fav = (appState.favoriteFoods || [])[idx];
      if (!fav) return;
      logFoodItemDirect(fav.name, fav.cal, fav.p, selectedMealBucket);
      showToast(`Logged ${fav.name}`);
    }

    function deleteFoodEntry(idx) {
      const list = appState.calorieLogs?.[selectedCalorieDate];
      if (!list || !list[idx]) return;
      list.splice(idx, 1);
      persistState(true);
      renderApp();
    }

    // --- Full-Screen Manual Meal Builder ---
    function addManualIngredient(foodId) {
      const food = FOOD_DATABASE.find(f => f.id === foodId);
      if (!food) return;
      const defaultGrams = Math.round(getBaseGramsForFood(food));
      const existing = manualMealItems.find(it => it.foodId === foodId);
      if (existing) {
        existing.grams += defaultGrams;
      } else {
        manualMealItems.push({ foodId, grams: defaultGrams });
      }
      renderManualMealFullScreen();
    }

    function updateManualIngredientGrams(idx, rawVal) {
      if (!manualMealItems[idx]) return;
      manualMealItems[idx].grams = Math.max(1, Math.round(Number(rawVal) || 0));
      renderManualMealFullScreen();
    }

    function removeManualIngredient(idx) {
      manualMealItems.splice(idx, 1);
      renderManualMealFullScreen();
    }

    function getManualMealTotals() {
      let cal = 0;
      let p = 0;
      const parts = [];
      manualMealItems.forEach(it => {
        const food = FOOD_DATABASE.find(f => f.id === it.foodId);
        if (!food) return;
        const ratio = Number(it.grams || 0) / getBaseGramsForFood(food);
        cal += food.cal * ratio;
        p += food.p * ratio;
        const cleanLabel = food.name.replace(/\s*\([^)]*\)/g, '').trim();
        parts.push(`${cleanLabel} (${it.grams}g)`);
      });
      return {
        cal: Math.round(cal),
        p: Math.round(p),
        summaryName: (manualMealName || '').trim() || parts.join(' + ') || 'Custom Meal'
      };
    }

    function logManualBuiltMeal(saveAsFav = false) {
      if (manualMealItems.length === 0) {
        showToast('Add at least one product first');
        return;
      }
      const totals = getManualMealTotals();
      logFoodItemDirect(totals.summaryName, totals.cal, totals.p, selectedMealBucket);
      if (saveAsFav) {
        toggleFavoriteMealObj({ name: totals.summaryName, cal: totals.cal, p: totals.p });
      }
      manualMealItems = [];
      manualMealName = '';
      manualMealSearch = '';
      manualMealDrawerOpen = false;
      closeFullScreenGrid();
      renderApp();
      showToast(`Logged ${totals.summaryName} (${totals.cal} kcal)`);
    }

    function openManualMealModal() {
      manualMealDrawerOpen = true;
      renderManualMealFullScreen();
      const overlay = document.getElementById('fullScreenGridOverlay');
      if (overlay) overlay.classList.remove('hidden');
    }

    function getManualMealSearchMatchesHtml() {
      const q = manualMealSearch.trim().toLowerCase();
      const matches = q
        ? FOOD_DATABASE.filter(f => f.name.toLowerCase().includes(q)).slice(0, 14)
        : FOOD_DATABASE.slice(0, 8);
      if (matches.length === 0) {
        return `<p class="text-xs text-mutedText text-center py-3">No matching foods found for "${escapeHtml(manualMealSearch)}".</p>`;
      }
      return matches.map(f => `
        <button type="button" onclick="addManualIngredient('${f.id}')"
          class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-2xl bg-surface border border-borderDark hover:border-white/25 text-left transition active:scale-[0.99]">
          <div class="min-w-0">
            <p class="text-xs font-bold text-white truncate">${escapeHtml(f.name)}</p>
            <p class="text-[10px] text-mutedText">${f.cal} kcal · ${f.p}g protein</p>
          </div>
          <span class="px-2.5 py-1 rounded-xl accent-soft-bg accent-text text-[11px] font-extrabold shrink-0 ml-2">+ Add</span>
        </button>
      `).join('');
    }

    function handleManualMealSearchInput(val) {
      manualMealSearch = val;
      const box = document.getElementById('manualMealSearchResults');
      if (box) box.innerHTML = getManualMealSearchMatchesHtml();
    }

    function renderManualMealFullScreen() {
      const overlay = document.getElementById('fullScreenGridOverlay');
      if (!overlay) return;
      const manualTotals = getManualMealTotals();

      overlay.innerHTML = `
        <div class="max-w-lg w-full mx-auto flex flex-col min-h-full space-y-4">
          <div class="flex items-center justify-between pb-3 border-b border-borderDark">
            <div>
              <p class="text-[10px] font-extrabold uppercase tracking-wider accent-text">Custom Macro Builder</p>
              <h2 class="text-lg font-extrabold text-white">Add Meal Manually</h2>
            </div>
            <button type="button" onclick="manualMealDrawerOpen=false; closeFullScreenGrid();"

            </button>
          </div>

          <div class="grid grid-cols-4 gap-1.5 bg-surface border border-borderDark p-1 rounded-2xl">
            ${['Breakfast', 'Lunch', 'Dinner', 'Snacks'].map(m => `
              <button type="button" onclick="selectedMealBucket='${m}'; renderManualMealFullScreen();"
                class="py-2 rounded-xl text-[11px] font-extrabold transition ${selectedMealBucket === m ? 'accent-bg' : 'text-mutedText hover:text-white'}">
                ${m}
              </button>
            `).join('')}
          </div>

          <div class="space-y-2.5">
            <div>
              <label class="text-[10px] font-bold uppercase tracking-wider text-mutedText block mb-1">Meal Name (Optional)</label>
              <input id="manualMealNameInput" type="text" value="${escapeHtml(manualMealName)}"
                oninput="manualMealName=this.value"
                placeholder="e.g. Chicken &amp; Rice Bowl"
                class="w-full bg-surface border border-borderDark rounded-2xl px-3.5 py-3 text-sm text-white focus:outline-none focus:border-white/40" />
            </div>

            <div>
              <label class="text-[10px] font-bold uppercase tracking-wider text-mutedText block mb-1">Search Products to Add</label>
              <input id="manualMealSearchInput" type="text" value="${escapeHtml(manualMealSearch)}"
                oninput="handleManualMealSearchInput(this.value)"
                placeholder="Type product name (e.g. Chicken, Rice, Olive Oil, Egg)..."
                class="w-full bg-surface border border-borderDark rounded-2xl px-3.5 py-3 text-sm text-white focus:outline-none focus:border-white/40" />
            </div>
          </div>

          <div id="manualMealSearchResults" class="space-y-1.5 max-h-52 overflow-y-auto pr-1">
            ${getManualMealSearchMatchesHtml()}
          </div>

          <div class="bg-surface border border-borderDark rounded-3xl p-4 space-y-3 flex-1">
            <div class="flex items-center justify-between">
              <span class="text-xs font-extrabold text-white">Selected Ingredients (${manualMealItems.length})</span>
              <span class="text-xs font-extrabold accent-text">${manualTotals.cal} kcal · ${manualTotals.p}g P</span>
            </div>

            ${manualMealItems.length === 0 ? `
              <p class="text-xs text-mutedText text-center py-6">Tap "+ Add" on any product above to build your meal and set exact grams.</p>
            ` : `
              <div class="space-y-2">
                ${manualMealItems.map((it, idx) => {
                  const food = FOOD_DATABASE.find(f => f.id === it.foodId);
                  if (!food) return '';
                  const ratio = Number(it.grams || 0) / getBaseGramsForFood(food);
                  const itemCal = Math.round(food.cal * ratio);
                  const itemP = Math.round(food.p * ratio);
                  return `
                    <div class="flex items-center justify-between gap-2 p-3 rounded-2xl bg-obsidian border border-borderDark">
                      <div class="min-w-0 flex-1">
                        <p class="text-xs font-extrabold text-white truncate">${escapeHtml(food.name.replace(/\s*\([^)]*\)/g, '').trim())}</p>
                        <p class="text-[10px] text-mutedText">${itemCal} kcal · ${itemP}g protein</p>
                      </div>
                      <div class="flex items-center gap-1.5 shrink-0">
                        <input type="number" min="1" step="5" value="${it.grams}"
                          onchange="updateManualIngredientGrams(${idx}, this.value)"
                          class="w-20 bg-surface border border-borderDark rounded-xl px-2.5 py-2 text-xs font-extrabold text-white text-center" />
                        <span class="text-[11px] font-bold text-mutedText">g</span>
                        <button type="button" onclick="removeManualIngredient(${idx})" class="w-7 h-7 rounded-xl bg-surface border border-borderDark text-xs text-mutedText hover:text-coralAccent">✕</button>

            <button type="button" onclick="logManualBuiltMeal(true)"
              class="py-3.5 rounded-2xl bg-surface border border-borderDark text-xs font-extrabold text-amber-400">
              ★ Save &amp; Log

    function getAiRemainingCount() {
      if (!appState.aiUsage || appState.aiUsage.date !== TODAY_STR) {
        appState.aiUsage = { date: TODAY_STR, count: 0 };
      }
      return Math.max(0, 3 - Number(appState.aiUsage.count || 0));
    }

    function estimateMealLocallyFallback(desc) {
      const lower = desc.toLowerCase();
      let totalCal = 0;
      let totalP = 0;
      const found = [];

      const gramMatches = [...lower.matchAll(/(\d+(?:\.\d+)?)\s*(?:g|grams|gram|ml)\s*(?:of\s+)?([a-z\s]+)/gi)];
      gramMatches.forEach(m => {
        const grams = Number(m[1]);
        const phrase = m[2].trim();
        const food = FOOD_DATABASE.find(f => phrase.split(/\s+/).some(w => w.length > 2 && f.name.toLowerCase().includes(w)));
        if (food) {
          const ratio = grams / getBaseGramsForFood(food);
          totalCal += food.cal * ratio;
          totalP += food.p * ratio;
          found.push(`${grams}g ${food.name.replace(/\s*\([^)]*\)/g, '').trim()}`);
        }
      });

      if (found.length === 0) {
        FOOD_DATABASE.forEach(f => {
          const keyword = f.name.split('(')[0].trim().toLowerCase().split(' ')[0];
          if (keyword.length > 3 && lower.includes(keyword)) {
            totalCal += f.cal;
            totalP += f.p;
            found.push(f.name.split('(')[0].trim());
          }
        });
      }

      if (lower.includes('oil') || lower.includes('fried') || lower.includes('butter')) {
        totalCal += 75;
        found.push('Cooking oil (~1 tsp)');
      }

      if (totalCal === 0) {
        totalCal = 380;
        totalP = 24;
      }

      return {
        name: desc.trim().slice(0, 65),
        cal: Math.round(totalCal),
        p: Math.round(totalP),
        notes: found.length ? `Estimated from: ${found.join(', ')}` : 'Estimated standard meal portion.'
      };
    }

    async function calculateMealWithAI() {
      const desc = (aiMealInputText || '').trim();
      if (!desc) {
        showToast('Describe your meal first');
        return;
      }
      if (getAiRemainingCount() <= 0) {
        showToast('Daily 3/3 AI limit reached · resets at 00:00');
        return;
      }

      aiCalculating = true;
      renderApp();

      try {
        let parsed = null;
        try {
          const apiKey = '';
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
          const payload = {
            contents: [{
              parts: [{
                text: `Estimate total calories and protein grams for this meal description: "${desc}". Account for cooking oils if fried/sautéed. Return JSON only.`
              }]
            }],
            generationConfig: {
              responseMimeType: 'application/json',
              responseSchema: {
                type: 'OBJECT',
                properties: {
                  name: { type: 'STRING' },
                  cal: { type: 'NUMBER' },
                  p: { type: 'NUMBER' },
                  notes: { type: 'STRING' }
                },
                required: ['name', 'cal', 'p', 'notes']
              }
            }
          };
          const res = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (res.ok) {
            const data = await res.json();
            const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
            if (rawText) parsed = JSON.parse(rawText);
          }
        } catch (_) {}

        if (!parsed || !parsed.cal) {
          parsed = estimateMealLocallyFallback(desc);
        }

        appState.aiUsage = {
          date: TODAY_STR,
          count: Math.min(3, Number(appState.aiUsage?.count || 0) + 1)
        };
        appState.pendingAiResult = {
          name: parsed.name || desc,
          cal: Math.round(Number(parsed.cal || 0)),
          p: Math.round(Number(parsed.p || 0)),
          notes: parsed.notes || ''
        };
        persistState(true);
      } finally {
        aiCalculating = false;
        renderApp();
      }
    }

    function calculateBmrAndTdee() {
      const p = appState.bmrProfile || { age: 26, heightCm: 168, weightKg: 62, activity: 1.55, goalOffset: 0 };
      const isMale = appState.gender === 'male';
      const base = (10 * Number(p.weightKg || 62)) + (6.25 * Number(p.heightCm || 168)) - (5 * Number(p.age || 26));

      const tdee = Math.round(bmr * Number(p.activity || 1.55));
      const target = Math.max(1100, tdee + Number(p.goalOffset || 0));
      return { bmr, tdee, target };
    }

    function openModal(html) {

      const card = document.getElementById('modalCard');
      if (!overlay || !card) return;
      card.innerHTML = html;
      overlay.classList.remove('hidden');
    }

    function closeModal() {
      const overlay = document.getElementById('modalOverlay');
      if (overlay) overlay.classList.add('hidden');
    }

    let pickerTargetMode = 'workout';
    let pickerRoutineIdx = 0;
    let pickerSearch = '';
    let pickerMuscle = 'All';

    function openExercisePicker(mode = 'workout', rtIdx = 0) {
      pickerTargetMode = mode;
      pickerRoutineIdx = rtIdx;
      pickerSearch = '';
      pickerMuscle = 'All';
      renderExercisePickerModal();
    }

    function toggleExerciseInTarget(exId) {
      if (pickerTargetMode === 'workout') {
        const w = getOrCreateWorkoutSession(selectedWorkoutDate);
        const existingIdx = w.entries.findIndex(e => e.exerciseId === exId);
        if (existingIdx >= 0) {
          w.entries.splice(existingIdx, 1);
        } else {
          w.entries.push({ exerciseId: exId, sets: [{ kg: 20, reps: 10 }, { kg: 20, reps: 10 }] });
        }
      } else {
        const rt = appState.routines[pickerRoutineIdx];
        if (!rt) return;
        const existingIdx = rt.exercises.findIndex(e => e.exerciseId === exId);
        if (existingIdx >= 0) {
          rt.exercises.splice(existingIdx, 1);
        } else {
          rt.exercises.push({ exerciseId: exId, sets: [{ kg: 20, reps: 10 }, { kg: 20, reps: 10 }] });
        }
      }
      persistState();
      renderExercisePickerModal();
      renderApp();
    }

    function createCustomExerciseInPicker() {
      const nameIn = document.getElementById('customExNameInput');
      const muscleIn = document.getElementById('customExMuscleSelect');
      const name = (nameIn?.value || '').trim();
      if (!name) {
        showToast('Enter an exercise name');
        return;
      }
      const newEx = {
        id: `ex_custom_${Date.now()}`,
        name,
        muscle: muscleIn?.value || 'Full Body',
        mistakes: ['Using excessive momentum instead of controlled form', 'Cutting range of motion short']
      };
      if (!appState.customExercises) appState.customExercises = [];
      appState.customExercises.push(newEx);
      toggleExerciseInTarget(newEx.id);
      showToast(`Added "${name}"`);
    }

        return mOk && qOk;

    // --- Custom Obsidian Dark Calendar Picker (Monday-First) ---
    let darkPickerTarget = 'calorie';
    let darkPickerCursor = new Date(TODAY_OBJ.getFullYear(), TODAY_OBJ.getMonth(), 1);

    function openDarkDatePicker(target) {
      darkPickerTarget = target;
      const curStr = target === 'calorie' ? selectedCalorieDate : selectedWorkoutDate;
      const [y, m] = curStr.split('-').map(Number);
      darkPickerCursor = new Date(y, m - 1, 1);
      renderDarkDatePickerModal();
    }

    function shiftDarkPickerMonth(delta) {
      darkPickerCursor = new Date(darkPickerCursor.getFullYear(), darkPickerCursor.getMonth() + delta, 1);
      renderDarkDatePickerModal();
    }

    function pickDarkCalendarDate(dateStr) {
      if (darkPickerTarget === 'calorie') {
        selectedCalorieDate = dateStr;
      } else {
        selectedWorkoutDate = dateStr;
      }
      closeModal();
      renderApp();
    }

    function renderDarkDatePickerModal() {
      const y = darkPickerCursor.getFullYear();
      const m = darkPickerCursor.getMonth();
      const label = darkPickerCursor.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
      const offset = (darkPickerCursor.getDay() + 6) % 7;
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      const activeStr = darkPickerTarget === 'calorie' ? selectedCalorieDate : selectedWorkoutDate;
      const dayLetters = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];

      let cells = '';
      for (let i = 0; i < offset; i++) cells += `<div></div>`;
      for (let d = 1; d <= daysInMonth; d++) {
        const dStr = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const isSel = dStr === activeStr;
        const isToday = dStr === TODAY_STR;
        cells += `
          <button type="button" onclick="pickDarkCalendarDate('${dStr}')"
            class="aspect-square rounded-2xl flex items-center justify-center text-xs font-extrabold transition ${isSel ? 'accent-bg' : 'bg-obsidian border border-borderDark text-white hover:border-white/30'} ${isToday && !isSel ? 'ring-1 ring-white/50' : ''}">
            ${d}
          </button>
        `;
      }

      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <button type="button" onclick="shiftDarkPickerMonth(-1)" class="px-3.5 py-2 rounded-xl bg-obsidian border border-borderDark text-xs font-extrabold text-white">←</button>
            <h3 class="text-sm font-extrabold text-white">${label}</h3>
            <button type="button" onclick="shiftDarkPickerMonth(1)" class="px-3.5 py-2 rounded-xl bg-obsidian border border-borderDark text-xs font-extrabold text-white">→</button>
          </div>
          <div class="grid grid-cols-7 gap-1.5 text-center">
            ${dayLetters.map(l => `<span class="text-[10px] font-extrabold text-mutedText">${l}</span>`).join('')}
          </div>
          <div class="grid grid-cols-7 gap-1.5">
            ${cells}
          </div>
          <div class="flex items-center justify-between pt-2 border-t border-borderDark">
            <button type="button" onclick="pickDarkCalendarDate(TODAY_STR)" class="text-xs font-extrabold accent-text">Jump to Today</button>
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-obsidian border border-borderDark text-xs font-extrabold text-white">Close</button>
          </div>
        </div>
      `);
    }

    async function saveProfileSettings() {
      const fName = (document.getElementById('profFirstName')?.value || '').trim();
      const lName = (document.getElementById('profLastName')?.value || '').trim();
      const newEmail = (document.getElementById('profEmailInput')?.value || '').toLowerCase().trim().replace(/[^a-z0-9@._-]/g, '');
      const calT = Number(document.getElementById('profCalTarget')?.value || 2000);
      const protT = Number(document.getElementById('profProtTarget')?.value || 130);

      if (fName) appState.firstName = fName;
      appState.lastName = lName;
      if (calT > 500) appState.calorieTarget = calT;
      if (protT > 20) appState.proteinTarget = protT;

      const session = getActiveSession();
      if (session && newEmail && newEmail.length >= 3 && newEmail !== session.username) {
        const oldUser = session.username;
        session.username = newEmail;
        session.firstName = appState.firstName;
        session.displayName = appState.firstName;
        localStorage.setItem(ACCOUNT_SESSION_KEY, JSON.stringify(session));
        localStorage.removeItem(`${ACCOUNT_VAULT_PREFIX}${oldUser}`);
      } else if (session) {
        session.firstName = appState.firstName;
        session.displayName = appState.firstName;
        localStorage.setItem(ACCOUNT_SESSION_KEY, JSON.stringify(session));
      }

      persistState(true);
      closeModal();
      renderApp();
      showToast('Profile updated & synced');
    }

    function signOutAccount() {
      localStorage.removeItem(ACCOUNT_SESSION_KEY);
      localStorage.removeItem(GUEST_MODE_KEY);
      if (window.location.protocol !== 'about:' && !window.location.href.startsWith('blob:')) {
        window.location.href = './login.html';
      } else {
        closeModal();
        showToast('Signed out');
      }
    }

        return `
          <button type="button" onclick="activeTab='${t.id}'; renderApp();"
            class="flex flex-col items-center justify-center py-1.5 rounded-2xl transition ${active ? 'accent-text' : 'text-mutedText hover:text-white'}">
            <span class="text-sm leading-none">${t.icon}</span>
            <span class="text-[11px] font-extrabold mt-1">${t.label}</span>
          </button>
        `;
      }).join('');
    }

    function renderApp() {
      renderFrozenHeader();
      renderBottomNav();
      const main = document.getElementById('appMain');
      if (main) {
        if (activeTab === 'grid') main.innerHTML = renderGridView();
        else if (activeTab === 'workouts') main.innerHTML = renderWorkoutsView();
        else if (activeTab === 'calories') main.innerHTML = renderCaloriesView();
        else if (activeTab === 'plan') main.innerHTML = renderPlanView();
      }
      requestAnimationFrame(syncHeaderSpacer);
    }

    async function initApp() {
      if (!enforceLoginGate()) return;
      initSupabase();
      await hydrateStateFromVault();
      renderApp();

      const headerEl = document.getElementById('appHeader');
      if (headerEl && window.ResizeObserver) {
        new ResizeObserver(() => syncHeaderSpacer()).observe(headerEl);
      }
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => syncHeaderSpacer());
      }

      // Auto-sync on tab close / backgrounding (critical for iOS Home Screen PWA)
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') {
          persistState(true);
        } else if (document.visibilityState === 'visible') {
          hydrateStateFromVault().then(() => renderApp());
        }
      });
      window.addEventListener('pagehide', () => persistState(true));

      // Midnight (00:00) live calendar rollover watcher
      setInterval(() => {
        const nowObj = new Date();
        const nowStr = toLocalDateStr(nowObj);
        if (nowStr !== lastKnownCalendarDate) {
          TODAY_OBJ = nowObj;
          TODAY_STR = nowStr;
          lastKnownCalendarDate = nowStr;
          selectedCalorieDate = nowStr;
          selectedWorkoutDate = nowStr;
          appState.aiUsage = { date: nowStr, count: 0 };
          persistState(true);
          renderApp();
        }
      }, 30000);
    }

    initApp();
  </script>
</body>
</html>
