  <script>
    (function generateImmediateCadenceIcons() {
      try {
        const THEME_MAP = {
          blue: '#3B82F6',
          pink: '#FF4D94',
          lime: '#C6FF00',
          coral: '#FF5E3A',
          violet: '#A855F7',
          cyan: '#22D3EE'
        };
        let hex = THEME_MAP.blue;
        try {
          const saved = JSON.parse(localStorage.getItem('cadence_workout_tracker_v1') || 'null');
          if (saved && saved.accent && THEME_MAP[saved.accent]) hex = THEME_MAP[saved.accent];
        } catch (_) {}

        function buildIconDataUrl(size) {
          const canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#0A0A0C';
          ctx.fillRect(0, 0, size, size);

          const pad = Math.round(size * 0.21);
          const gap = Math.round(size * 0.08);
          const sq = Math.round((size - pad * 2 - gap) / 2);
          const r = Math.round(sq * 0.24);

          function drawSq(x, y, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + sq - r, y);
            ctx.quadraticCurveTo(x + sq, y, x + sq, y + r);
            ctx.lineTo(x + sq, y + sq - r);
            ctx.quadraticCurveTo(x + sq, y + sq, x + sq - r, y + sq);
            ctx.lineTo(x + r, y + sq);
            ctx.quadraticCurveTo(x, y + sq, x, y + sq - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
            ctx.fill();
          }

          drawSq(pad, pad, hex);
          drawSq(pad + sq + gap, pad, '#27272E');
          drawSq(pad, pad + sq + gap, '#27272E');
          drawSq(pad + sq + gap, pad + sq + gap, hex);
          return canvas.toDataURL('image/png');
        }

        const icon180 = buildIconDataUrl(180);
        const icon512 = buildIconDataUrl(512);
        document.getElementById('appleTouchIcon').href = icon180;
        document.getElementById('appleTouchIcon512').href = icon512;
        document.getElementById('faviconIcon').href = icon180;

        let startUrl = './index.html';
        try {
          const sess = JSON.parse(localStorage.getItem('cadence_account_session_v1') || 'null');
          if (sess && sess.username && sess.passHash) {
            startUrl = `./index.html?u=${encodeURIComponent(sess.username)}&h=${encodeURIComponent(sess.passHash)}`;
          }
        } catch (_) {}

        const manifestObj = {
          name: 'CADENCE — 365-Day Workout Tracker',
          short_name: 'CADENCE',
          start_url: startUrl,
          display: 'standalone',
          background_color: '#0A0A0C',
          theme_color: '#0A0A0C',
          icons: [
            { src: icon180, sizes: '180x180', type: 'image/png' },
            { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
          ]
        };
        const blob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
        document.getElementById('appManifest').href = URL.createObjectURL(blob);
      } catch (_) {}
    })();
  </script>

    function resolveExerciseAnimType(ex, baseGuide) {
      if (!ex) return baseGuide.animType || 'squat';
      const id = (ex.id || '').toLowerCase();
      const name = (ex.name || '').toLowerCase();

      // 1. Legs & Calves
      if (id.includes('leg_press') || id.includes('hack_squat') || id.includes('pendulum') || id.includes('v_squat') || name.includes('leg press') || name.includes('hack squat') || name.includes('pendulum')) {
        return 'leg_press';
      }
      if (id.includes('bulgarian') || id.includes('split_squat') || id.includes('lunge') || id.includes('step_up') || name.includes('lunge') || name.includes('split squat') || name.includes('step-up')) {
        return 'lunge';
      }
      if (id.includes('leg_extension') || name.includes('leg extension')) {
        return 'leg_ext';
      }
      if (id.includes('nordic') || name.includes('nordic')) {
        return 'nordic';
      }
      if (id.includes('leg_curl') || id.includes('hamstring_curl') || name.includes('leg curl') || name.includes('hamstring curl')) {
        return 'leg_curl';
      }
      if (id.includes('adduction') || name.includes('adduction') || name.includes('inner thigh')) {
        return 'adduction';
      }
      if (id.includes('calf') || name.includes('calf')) {

    function toLocalDateStr(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function parseLocalDate(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    function addDays(dateObj, days) {
      const copy = new Date(dateObj);
      copy.setDate(copy.getDate() + days);
      return copy;
    }

    function formatDisplayDate(dateStr) {
      const d = parseLocalDate(dateStr);
      return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    }

    function loadAccountSession() {
      try {
        try {
          const params = new URLSearchParams(window.location.search || '');
          const qUser = (params.get('u') || '').toLowerCase().trim().replace(/[^a-z0-9@._-]/g, '');
          const qHash = (params.get('h') || '').trim();
          if (qUser && qHash) {
            const existing = JSON.parse(localStorage.getItem(ACCOUNT_SESSION_KEY) || 'null');
            if (!existing || existing.username !== qUser) {
              localStorage.removeItem(GUEST_MODE_KEY);
              localStorage.setItem(ACCOUNT_SESSION_KEY, JSON.stringify({
                username: qUser,
                firstName: qUser.split('@')[0],
                lastName: '',
                gender: 'female',
                displayName: qUser.split('@')[0],
                passHash: qHash,
                expiresAt: Date.now() + SIXTY_DAYS_MS
              }));
            }
          }
        } catch (_) {}

        const raw = localStorage.getItem(ACCOUNT_SESSION_KEY);
        if (!raw) {
          accountSession = null;
          return;
        }
        const parsed = JSON.parse(raw);
        if (parsed && parsed.username) {
          if (parsed.expiresAt && Date.now() >= parsed.expiresAt) {
            localStorage.removeItem(ACCOUNT_SESSION_KEY);
            accountSession = null;
            return;
          }
          if (!parsed.expiresAt) {
            parsed.expiresAt = Date.now() + SIXTY_DAYS_MS;
            localStorage.setItem(ACCOUNT_SESSION_KEY, JSON.stringify(parsed));
          }
          accountSession = parsed;
        } else {
          accountSession = null;
        }
      } catch (_) {
        accountSession = null;
      }
    }

    function enforceLoginGate() {
      loadAccountSession();
      const isSandboxedPreview = window.location.protocol === 'about:' || window.location.href.startsWith('blob:');
      if (isSandboxedPreview) return true;
      const isGuest = localStorage.getItem(GUEST_MODE_KEY) === 'true';
      if (!accountSession && !isGuest) {
        window.location.replace('./login.html');
        return false;
      }
      return true;
    }

    /* ==========================================================================
       4. MULTI-LAYER STORAGE & SUPABASE CLOUD SYNC
       ========================================================================== */
    function getSupabaseConfig() {
      try {
        const saved = JSON.parse(localStorage.getItem(SUPABASE_CONFIG_KEY) || 'null');
        if (saved && saved.url && saved.anonKey) {
          return { url: saved.url.trim().replace(/\/rest\/v1\/?$/, ''), anonKey: saved.anonKey.trim() };
        }
      } catch (_) {}
      if (DEFAULT_SUPABASE_URL && DEFAULT_SUPABASE_ANON_KEY) {
        return { url: DEFAULT_SUPABASE_URL.trim().replace(/\/rest\/v1\/?$/, ''), anonKey: DEFAULT_SUPABASE_ANON_KEY.trim() };
      }
      return null;
    }

    function initSupabaseClient() {
      const cfg = getSupabaseConfig();
      if (!cfg || !window.supabase || !window.supabase.createClient) {
        supabaseClient = null;
        return null;
      }
      try {
        supabaseClient = window.supabase.createClient(cfg.url.trim(), cfg.anonKey.trim());
        return supabaseClient;
      } catch (_) {
        supabaseClient = null;
        return null;
      }
    }

    function openVaultDB() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) return reject(new Error('IndexedDB unavailable'));
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) {
            db.createObjectStore(IDB_STORE);
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    function readFromIDB(key = IDB_KEY) {
      return openVaultDB().then((db) => {
        return new Promise((resolve) => {
          try {
            const tx = db.transaction(IDB_STORE, 'readonly');
            const store = tx.objectStore(IDB_STORE);
            const getReq = store.get(key);
            getReq.onsuccess = () => resolve(getReq.result || null);
            getReq.onerror = () => resolve(null);
          } catch (_) {
            resolve(null);
          }
        });
      }).catch(() => null);
    }

    function writeToIDB(snapshotObj, key = IDB_KEY) {
      idbWriteQueue = idbWriteQueue.then(() => openVaultDB()).then((db) => {
        return new Promise((resolve) => {
          try {
            const tx = db.transaction(IDB_STORE, 'readwrite');
            const store = tx.objectStore(IDB_STORE);
            store.put(snapshotObj, key);
            tx.oncomplete = () => resolve(true);
            tx.onerror = () => resolve(false);
          } catch (_) {
            resolve(false);
          }
        });
      }).catch(() => false);
      return idbWriteQueue;
    }

    function normalizeState(raw) {
      const def = getDefaultState();
      if (!raw || typeof raw !== 'object') return def;
      return {
        accent: THEME_PRESETS[raw.accent] ? raw.accent : def.accent,
        firstName: typeof raw.firstName === 'string' ? raw.firstName : (typeof raw._displayName === 'string' ? raw._displayName : ''),
        lastName: typeof raw.lastName === 'string' ? raw.lastName : '',
        gender: raw.gender === 'male' ? 'male' : 'female',
        profilePhoto: typeof raw.profilePhoto === 'string' ? raw.profilePhoto : '',
        weeklyGoal: (Number(raw.weeklyGoal) >= 1 && Number(raw.weeklyGoal) <= 7) ? Number(raw.weeklyGoal) : 4,
        measurementUnit: raw.measurementUnit === 'imperial' ? 'imperial' : 'metric',
        workouts: (raw.workouts && typeof raw.workouts === 'object' && !Array.isArray(raw.workouts)) ? raw.workouts : {},
        templates: Array.isArray(raw.templates) && raw.templates.length > 0 ? raw.templates : def.templates,
        customExercises: Array.isArray(raw.customExercises) ? raw.customExercises : [],
        bodyMetrics: Array.isArray(raw.bodyMetrics) ? raw.bodyMetrics : [],
        calorieGoal: Number(raw.calorieGoal) > 0 ? Number(raw.calorieGoal) : 2000,
        calorieLogs: (raw.calorieLogs && typeof raw.calorieLogs === 'object' && !Array.isArray(raw.calorieLogs)) ? raw.calorieLogs : {},
        favoriteFoods: Array.isArray(raw.favoriteFoods) ? raw.favoriteFoods : [],
        pendingAiResult: (raw.pendingAiResult && typeof raw.pendingAiResult === 'object') ? raw.pendingAiResult : null,
        aiCalorieUsage: (raw.aiCalorieUsage && typeof raw.aiCalorieUsage === 'object')
          ? { date: String(raw.aiCalorieUsage.date || TODAY_STR), count: Number(raw.aiCalorieUsage.count) || 0 }
          : { date: TODAY_STR, count: 0 },
        bmrProfile: (raw.bmrProfile && typeof raw.bmrProfile === 'object')
          ? {
              age: Number(raw.bmrProfile.age) || 26,
              heightCm: Number(raw.bmrProfile.heightCm) || 168,
              weightKg: Number(raw.bmrProfile.weightKg) || 62,
              activity: Number(raw.bmrProfile.activity) || 1.55,
              goalMode: ['cut', 'maintain', 'bulk'].includes(raw.bmrProfile.goalMode) ? raw.bmrProfile.goalMode : 'maintain'
            }
          : def.bmrProfile,
        _passHash: raw._passHash || '',
        _displayName: raw._displayName || '',
        _updatedAt: Number(raw._updatedAt) || 0
      };
    }

    function countRichnessScore(stateObj) {
      if (!stateObj || typeof stateObj !== 'object') return -1;
      const workoutDays = Object.keys(stateObj.workouts || {}).length;
      const customCount = (stateObj.customExercises || []).length;
      const metricCount = (stateObj.bodyMetrics || []).length;
      const mealCount = Object.values(stateObj.calorieLogs || {}).reduce((s, arr) => s + (Array.isArray(arr) ? arr.length : 0), 0);
      const favCount = (stateObj.favoriteFoods || []).length;
      return workoutDays * 10 + customCount * 2 + metricCount + mealCount * 3 + favCount * 2;
    }

    function buildSyncPayload() {
      const payload = normalizeState(appState);
      payload.pendingAiResult = aiMealLastResult || null;
      payload._updatedAt = Date.now();
      if (accountSession) {
        payload._passHash = accountSession.passHash || payload._passHash;
        payload._displayName = payload.firstName || accountSession.firstName || accountSession.displayName || accountSession.username;
      }
      return payload;
    }

    async function pushStateToSupabase(showErrorToast = false) {
      if (!supabaseClient) initSupabaseClient();
      if (!supabaseClient || !accountSession || !accountSession.username) return false;
      try {
        const payload = buildSyncPayload();
        const { error } = await supabaseClient
          .from('cadence_profiles')
          .upsert({
            username: accountSession.username,
            pass_hash: accountSession.passHash || payload._passHash || '',
            state_json: payload,
            updated_at: new Date().toISOString()
          }, { onConflict: 'username' });

        if (error) {
          lastCloudSyncError = error.message || 'Cloud sync rejected';
          if (showErrorToast) showToast(`Sync error: ${lastCloudSyncError}`);
          return false;
        }
        lastCloudSyncError = '';
        lastCloudSyncAt = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        return true;
      } catch (e) {
        lastCloudSyncError = e?.message || 'Network unavailable';
        if (showErrorToast) showToast(`Sync error: ${lastCloudSyncError}`);
        return false;
      }
    }

    function flushStateKeepaliveOnExit() {
      try {
        if (!isStateHydrated) return;
        const payload = buildSyncPayload();
        const serialized = JSON.stringify(payload);
        const vaultKey = getCurrentAccountVaultKey();
        localStorage.setItem(vaultKey, serialized);
        localStorage.setItem(`${vaultKey}_backup`, serialized);
        localStorage.setItem(STORAGE_KEY, serialized);

        const cfg = getSupabaseConfig();
        if (cfg && accountSession && accountSession.username) {
          fetch(`${cfg.url}/rest/v1/cadence_profiles?on_conflict=username`, {
            method: 'POST',
            keepalive: true,
            headers: {
              'Content-Type': 'application/json',
              'apikey': cfg.anonKey,
              'Authorization': `Bearer ${cfg.anonKey}`,
              'Prefer': 'resolution=merge-duplicates,return=minimal'
            },
            body: JSON.stringify({
              username: accountSession.username,
              pass_hash: accountSession.passHash || payload._passHash || '',
              state_json: payload,
              updated_at: new Date().toISOString()
            })
          }).catch(() => {});
        }
      } catch (_) {}
    }

    async function pullStateFromSupabase(username) {
      if (!supabaseClient) initSupabaseClient();
      if (!supabaseClient || !username) return null;
      try {
        const { data, error } = await supabaseClient
          .from('cadence_profiles')
          .select('username, pass_hash, state_json, updated_at')
          .eq('username', username)
          .maybeSingle();

        if (error) {
          lastCloudSyncError = error.message || 'Cloud read error';
          return null;
        }
        if (data && data.state_json) {
          const remote = normalizeState(data.state_json);
          if (data.pass_hash) remote._passHash = data.pass_hash;
          lastCloudSyncError = '';
          lastCloudSyncAt = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          return remote;
        }
        return null;
      } catch (e) {
        lastCloudSyncError = e?.message || 'Cloud offline';
        return null;
      }
    }

    function saveState() {
      if (!isStateHydrated) return;
      try {
        const payload = buildSyncPayload();
        const serialized = JSON.stringify(payload);
        const vaultKey = getCurrentAccountVaultKey();
        localStorage.setItem(vaultKey, serialized);
        localStorage.setItem(`${vaultKey}_backup`, serialized);
        localStorage.setItem(STORAGE_KEY, serialized);
        writeToIDB(payload, vaultKey);
        pushStateToSupabase(false);
      } catch (_) {
        showToast('Storage warning — backup recommended');
      }
    }

    async function hydrateStateFromVault() {
      loadAccountSession();
      initSupabaseClient();
      const vaultKey = getCurrentAccountVaultKey();

      let lsPrimary = null;
      let lsBackup = null;
      try {
        const r1 = localStorage.getItem(vaultKey);
        if (r1) lsPrimary = normalizeState(JSON.parse(r1));
      } catch (_) {}
      try {
        const r2 = localStorage.getItem(`${vaultKey}_backup`);
        if (r2) lsBackup = normalizeState(JSON.parse(r2));
      } catch (_) {}

      let idbState = null;
      const rawIdb = await readFromIDB(vaultKey);
      if (rawIdb) idbState = normalizeState(rawIdb);

      let cloudState = null;
      if (accountSession && accountSession.username) {
        cloudState = await pullStateFromSupabase(accountSession.username);
      }

      const candidates = [lsPrimary, lsBackup, idbState, cloudState].filter(Boolean);
      if (candidates.length > 0) {
        candidates.sort((a, b) => {
          if ((b._updatedAt || 0) !== (a._updatedAt || 0)) {
            return (b._updatedAt || 0) - (a._updatedAt || 0);
          }
          return countRichnessScore(b) - countRichnessScore(a);
        });
        const newest = candidates[0];
        // Merge workouts, calorieLogs, favoriteFoods, and customExercises across local & cloud snapshots so nothing is ever lost
        const mergedWorkouts = { ...(newest.workouts || {}) };
        const mergedCalorieLogs = { ...(newest.calorieLogs || {}) };
        const favMap = new Map();
        const customMap = new Map();

        candidates.slice().reverse().forEach(src => {
          Object.entries(src.workouts || {}).forEach(([dKey, wVal]) => {
            if (!mergedWorkouts[dKey]) mergedWorkouts[dKey] = wVal;
          });
          Object.entries(src.calorieLogs || {}).forEach(([dKey, arrVal]) => {
            if (!mergedCalorieLogs[dKey] || mergedCalorieLogs[dKey].length === 0) {
              mergedCalorieLogs[dKey] = arrVal;
            }
          });
          (src.favoriteFoods || []).forEach(f => {
            if (f && f.name) favMap.set(f.name.toLowerCase().trim(), f);
          });
          (src.customExercises || []).forEach(cx => {
            if (cx && cx.id) customMap.set(cx.id, cx);
          });
        });

        appState = {
          ...newest,
          workouts: mergedWorkouts,
          calorieLogs: mergedCalorieLogs,
          favoriteFoods: Array.from(favMap.values()),
          customExercises: Array.from(customMap.values())
        };
      } else {
        appState = getDefaultState();
      }

      if (appState.pendingAiResult && typeof appState.pendingAiResult === 'object') {
        aiMealLastResult = appState.pendingAiResult;
      }

      if (accountSession) {
        if (!appState.firstName && accountSession.firstName) {
          appState.firstName = accountSession.firstName;
        }
        if (!appState.lastName && accountSession.lastName) {
          appState.lastName = accountSession.lastName;
        }
        if (accountSession.gender && !appState._updatedAt) {
          appState.gender = accountSession.gender;
        }
        const resolvedName = appState.firstName || accountSession.firstName || accountSession.displayName || accountSession.username;
        accountSession.firstName = resolvedName;
        accountSession.displayName = resolvedName;
        try {
          localStorage.setItem(ACCOUNT_SESSION_KEY, JSON.stringify(accountSession));
        } catch (_) {}
      }

      isStateHydrated = true;
      saveState();

      if (accountSession && accountSession.pendingMode) {
        const mode = accountSession.pendingMode;
        delete accountSession.pendingMode;
        try {
          localStorage.setItem(ACCOUNT_SESSION_KEY, JSON.stringify(accountSession));
        } catch (_) {}
        const greetingName = appState.firstName || accountSession.username;
        showToast(mode === 'signup' ? `Account created — welcome ${greetingName}!` : `Welcome back, ${greetingName}`);
      }
    }

    function updateHeaderAccountUI() {
      const label = document.getElementById('headerAccountLabel');
      const avatarBox = document.getElementById('headerAccountAvatar');
      if (!label || !avatarBox) return;

      const displayName = appState.firstName || accountSession?.firstName || accountSession?.displayName || accountSession?.username;

        }

      }
    }

    /* ==========================================================================
       5. THEME & TOAST UTILITIES
       ========================================================================== */
    function applyTheme(accentKey) {
      const theme = THEME_PRESETS[accentKey] || THEME_PRESETS.blue;
      document.documentElement.style.setProperty('--accent', theme.hex);
      document.documentElement.style.setProperty('--accent-rgb', theme.rgb);
      document.documentElement.style.setProperty('--accent-glow', theme.glow);
      updateDynamicAppIcon(theme.hex);
    }

    function updateDynamicAppIcon(hex) {
      try {
        function buildPng(size) {
          const canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#0A0A0C';
          ctx.fillRect(0, 0, size, size);

          const pad = Math.round(size * 0.21);
          const gap = Math.round(size * 0.08);
          const sq = Math.round((size - pad * 2 - gap) / 2);
          const r = Math.round(sq * 0.24);

          function drawSq(x, y, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + sq - r, y);
            ctx.quadraticCurveTo(x + sq, y, x + sq, y + r);
            ctx.lineTo(x + sq, y + sq - r);
            ctx.quadraticCurveTo(x + sq, y + sq, x + sq - r, y + sq);
            ctx.lineTo(x + r, y + sq);
            ctx.quadraticCurveTo(x, y + sq, x, y + sq - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
            ctx.fill();
          }

          drawSq(pad, pad, hex);
          drawSq(pad + sq + gap, pad, '#27272E');
          drawSq(pad, pad + sq + gap, '#27272E');
          drawSq(pad + sq + gap, pad + sq + gap, hex);
          return canvas.toDataURL('image/png');
        }

        const icon180 = buildPng(180);
        const icon512 = buildPng(512);
        const touchLink = document.getElementById('appleTouchIcon');
        const touchLink512 = document.getElementById('appleTouchIcon512');
        const favLink = document.getElementById('faviconIcon');
        if (touchLink) touchLink.href = icon180;
        if (touchLink512) touchLink512.href = icon512;
        if (favLink) favLink.href = icon180;
      } catch (_) {}
    }

      saveState();
      closeModal();

    /* ==========================================================================
       6. DATA HELPERS: EXERCISES, WORKOUTS, STREAKS & YEAR MATRIX (JAN–DEC)
       ========================================================================== */
    function getAllExercises() {
      return [...EXERCISE_CATALOG, ...appState.customExercises];
    }

    function getExerciseById(id) {
      return getAllExercises().find(e => e.id === id) || { id, name: id, muscle: 'Custom', equipment: 'Custom' };
    }

    function isDayCompleted(dateStr) {
      const w = appState.workouts[dateStr];
      if (!w) return false;
      if (w.completed === true) return true;
      if (Array.isArray(w.exercises)) {
        return w.exercises.some(ex => Array.isArray(ex.sets) && ex.sets.some(s => s.done));
      }
      return false;
    }

    function getDayVolume(dateStr) {
      const w = appState.workouts[dateStr];
      if (!w || !Array.isArray(w.exercises)) return 0;
      let total = 0;
      w.exercises.forEach(ex => {
        (ex.sets || []).forEach(s => {
          if (s.done) {
            total += (Number(s.weight) || 0) * (Number(s.reps) || 0);
          }
        });
      });
      return total;
    }

    function getCompletedDaysCurrentYear() {
      let count = 0;
      for (let i = 0; i < YEAR_DAYS_TOTAL; i++) {
        const dStr = toLocalDateStr(addDays(YEAR_START_OBJ, i));
        if (isDayCompleted(dStr)) count++;
      }
      return count;
    }

    function getWeeklyStreak() {
      const goal = Math.max(1, Math.min(7, Number(appState.weeklyGoal) || 4));
      const dayOfWeek = (TODAY_OBJ.getDay() + 6) % 7;
      const currentMonday = addDays(TODAY_OBJ, -dayOfWeek);

      let streak = 0;
      for (let w = 0; w < 52; w++) {
        const mon = addDays(currentMonday, -w * 7);
        let weekCount = 0;
        for (let d = 0; d < 7; d++) {
          const checkStr = toLocalDateStr(addDays(mon, d));
          if (isDayCompleted(checkStr)) weekCount++;
        }
        if (weekCount >= goal) {
          streak++;
        } else if (w === 0) {
          continue;
        } else {
          break;
        }
      }
      return streak;
    }

    function buildYearMatrix() {
      if (cachedYearMatrix) return cachedYearMatrix;
      const startDow = (YEAR_START_OBJ.getDay() + 6) % 7;
      const gridStart = addDays(YEAR_START_OBJ, -startDow);

      const endDow = (YEAR_END_OBJ.getDay() + 6) % 7;
      const gridEnd = addDays(YEAR_END_OBJ, 6 - endDow);

      const weeks = [];
      let cursor = new Date(gridStart);
      let currentWeek = [];

      while (cursor <= gridEnd) {
        const dStr = toLocalDateStr(cursor);
        const inYear = cursor.getFullYear() === CURRENT_YEAR;
        currentWeek.push({
          dateStr: dStr,
          dateObj: new Date(cursor),
          inWindow: inYear,
          isToday: dStr === TODAY_STR,
          isFuture: cursor > TODAY_OBJ,
          monthShort: cursor.toLocaleDateString('en-US', { month: 'short' }),
          dayNum: cursor.getDate()
        });
        if (currentWeek.length === 7) {
          weeks.push(currentWeek);
          currentWeek = [];
        }
        cursor = addDays(cursor, 1);
      }
      cachedYearMatrix = weeks;
      return weeks;
    }

    function getPreviousExerciseStats(exerciseId, beforeDateStr) {
      const dates = Object.keys(appState.workouts)
        .filter(d => d < beforeDateStr)
        .sort((a, b) => b.localeCompare(a));

      for (const d of dates) {
        const w = appState.workouts[d];
        const found = (w.exercises || []).find(e => e.exerciseId === exerciseId);
        if (found && found.sets && found.sets.length > 0) {
          const validSets = found.sets.filter(s => Number(s.weight) > 0 || Number(s.reps) > 0);
          if (validSets.length > 0) {
            const bestSet = validSets.reduce((best, cur) =>
              (Number(cur.weight) || 0) >= (Number(best.weight) || 0) ? cur : best
            , validSets[0]);
            return {
              date: d,
              sets: validSets,
              bestWeight: Number(bestSet.weight) || 0,
              bestReps: Number(bestSet.reps) || 0
            };
          }
        }
      }
      return null;
    }

    /* ==========================================================================
       7. NAVIGATION & RENDER PIPELINE (ZERO-LAG TAB CACHING)
       ========================================================================== */
    function markAllTabsDirty() {
      dirtyTabs.grid = true;
      dirtyTabs.logger = true;
      dirtyTabs.calories = true;
      dirtyTabs.templates = true;
    }

    function markTabDirty(tabName) {
      if (tabName in dirtyTabs) dirtyTabs[tabName] = true;

    function switchTab(tabName) {
      activeTab = tabName;
      document.querySelectorAll('.nav-btn').forEach(btn => {
        const isMatch = btn.dataset.tab === tabName;
        btn.classList.toggle('accent-text', isMatch);
        btn.classList.toggle('text-white', isMatch);
        btn.classList.toggle('text-mutedText', !isMatch);
      });

      document.querySelectorAll('.tab-pane').forEach(pane => {
        pane.classList.toggle('hidden', pane.id !== `view_${tabName}`);
      });

      renderActiveTabIfNeeded(false);
    }

    function renderActiveTabIfNeeded(force = false) {
      if (activeTab === 'grid' && (force || dirtyTabs.grid)) {
        renderGridView();
        dirtyTabs.grid = false;
      } else if (activeTab === 'logger' && (force || dirtyTabs.logger)) {
        renderLoggerView();
        dirtyTabs.logger = false;
      } else if (activeTab === 'calories' && (force || dirtyTabs.calories)) {
        renderCaloriesView();
        dirtyTabs.calories = false;
      } else if (activeTab === 'templates' && (force || dirtyTabs.templates)) {
        renderTemplatesView();
        dirtyTabs.templates = false;
      }
    }

    function renderApp(forceCurrentTab = true) {
      renderHeaderStats();
      renderWeekStrip();
      renderActiveTabIfNeeded(forceCurrentTab);
    }

    function renderHeaderStats() {

    function toggleExerciseFormGuide(exIdx) {
      const w = appState.workouts[selectedWorkoutDate];
      if (!w || !w.exercises || !w.exercises[exIdx]) return;
      w.exercises[exIdx].showFormGuide = !w.exercises[exIdx].showFormGuide;
      saveState();
      renderLoggerView();
    }

    function updateWorkoutTitle(dateStr, newTitle) {
      const w = ensureWorkoutObject(dateStr);
      w.title = newTitle.trim() || 'Training Session';
      saveState();
    }

    function addSetToExercise(dateStr, exIdx) {
      const w = appState.workouts[dateStr];
      if (!w || !w.exercises[exIdx]) return;
      const sets = w.exercises[exIdx].sets;
      const last = sets[sets.length - 1] || { weight: '', reps: 10 };
      sets.push({ weight: last.weight, reps: last.reps, done: false });
      saveState();
      renderLoggerView();
    }

    function removeLastSetFromExercise(dateStr, exIdx) {
      const w = appState.workouts[dateStr];
      if (!w || !w.exercises[exIdx]) return;
      if (w.exercises[exIdx].sets.length > 1) {
        w.exercises[exIdx].sets.pop();
        saveState();
        renderLoggerView();
      }
    }

    function updateSetField(dateStr, exIdx, setIdx, field, rawVal) {
      const w = appState.workouts[dateStr];
      if (!w || !w.exercises[exIdx] || !w.exercises[exIdx].sets[setIdx]) return;
      w.exercises[exIdx].sets[setIdx][field] = rawVal === '' ? '' : Number(rawVal);
      saveState();
      markAllTabsDirty();
      renderHeaderStats();
    }

    function toggleSetDone(dateStr, exIdx, setIdx) {
      const w = appState.workouts[dateStr];
      if (!w || !w.exercises[exIdx] || !w.exercises[exIdx].sets[setIdx]) return;
      const s = w.exercises[exIdx].sets[setIdx];
      s.done = !s.done;
      if (s.done && (s.reps === '' || s.reps === undefined)) {
        s.reps = 10;
      }
      saveState();
      markAllTabsDirty();
      renderApp(true);
    }

    function removeExerciseFromWorkout(dateStr, exIdx) {
      const w = appState.workouts[dateStr];
      if (!w) return;
      w.exercises.splice(exIdx, 1);
      saveState();
      markAllTabsDirty();
      renderApp(true);
    }

    function finishWorkoutSession(dateStr) {
      const w = ensureWorkoutObject(dateStr);
      w.completed = true;
      if (w.exercises.length > 0) {
        const anyDone = w.exercises.some(ex => (ex.sets || []).some(s => s.done));
        if (!anyDone) {
          w.exercises.forEach(ex => {
            if (ex.sets && ex.sets[0]) ex.sets[0].done = true;
          });
        }
      }
      saveState();
      markAllTabsDirty();
      renderApp(true);
      showToast('Workout saved! Today’s square is filled.');
      switchTab('grid');
    }

    function applyTemplateToDate(templateId, dateStr) {
      const tpl = appState.templates.find(t => t.id === templateId);
      if (!tpl) return;
      const w = ensureWorkoutObject(dateStr);
      w.title = tpl.name;
      tpl.exercises.forEach(exId => {
        const alreadyExists = w.exercises.some(e => e.exerciseId === exId);
        if (!alreadyExists) {
          const prev = getPreviousExerciseStats(exId, dateStr);
          const defaultWeight = prev ? prev.bestWeight : '';
          const defaultReps = prev ? prev.bestReps : 10;
          w.exercises.push({
            exerciseId: exId,
            sets: [
              { weight: defaultWeight, reps: defaultReps, done: false },
              { weight: defaultWeight, reps: defaultReps, done: false },
              { weight: defaultWeight, reps: defaultReps, done: false }
            ]
          });
        }
      });
      saveState();
      selectedWorkoutDate = dateStr;
      markAllTabsDirty();
      switchTab('logger');
      showToast(`Loaded "${tpl.name}"`);

    function setPickerMuscle(m) {
      pickerFilterMuscle = m;
      document.querySelectorAll('.picker-muscle-btn').forEach(btn => {

        btn.className = `picker-muscle-btn px-3 py-1.5 rounded-full text-[11px] font-bold border shrink-0 transition ${active ? 'accent-bg text-obsidian border-transparent' : 'bg-obsidian border-borderDark text-mutedText'}`;

      refreshExercisePickerList();

    function refreshExercisePickerList() {
      const container = document.getElementById('pickerExerciseList');
      if (!container) return;
      const q = pickerSearchQuery.toLowerCase().trim();
      const filtered = getAllExercises().filter(ex => {
        const matchMuscle = pickerFilterMuscle === 'All' || ex.muscle === pickerFilterMuscle;
        const matchQuery = !q || ex.name.toLowerCase().includes(q) || ex.muscle.toLowerCase().includes(q) || ex.equipment.toLowerCase().includes(q);
        return matchMuscle && matchQuery;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<p class="text-xs text-mutedText text-center py-6">No matching exercises. Tap "+ Create Custom Exercise" below.</p>`;
        return;
      }

      container.innerHTML = filtered.map(ex => {
        const isSelected = pickerSelectedIds.includes(ex.id);
        return `
          <button type="button" onclick="toggleExerciseSelection('${ex.id}')"
            class="w-full text-left bg-obsidian border rounded-2xl p-3 flex items-center justify-between transition active:scale-[0.99]

            </span>
          </button>

    function toggleExerciseSelection(exerciseId) {
      const idx = pickerSelectedIds.indexOf(exerciseId);
      if (idx >= 0) {
        pickerSelectedIds.splice(idx, 1);
      } else {
        pickerSelectedIds.push(exerciseId);
      }
      refreshExercisePickerList();

      const confirmBtn = document.getElementById('pickerConfirmBtn');
      if (confirmBtn) {
        confirmBtn.textContent = pickerTargetTemplateId
          ? `Save Routine (${pickerSelectedIds.length} exercises)`
          : `Done (${pickerSelectedIds.length} selected)`;
      }
    }

    function confirmExercisePickerSelection() {
      if (pickerTargetTemplateId) {
        const tpl = appState.templates.find(t => t.id === pickerTargetTemplateId);
        if (tpl) {
          tpl.exercises = [...pickerSelectedIds];
          saveState();
          closeModal();
          markAllTabsDirty();
          renderApp(true);
          showToast(`Saved ${tpl.exercises.length} exercises to "${tpl.name}"`);
        }
        return;
      }

      const w = ensureWorkoutObject(pickerTargetDate);
      const existingMap = new Map((w.exercises || []).map(e => [e.exerciseId, e]));
      const updatedExercises = [];

      pickerSelectedIds.forEach(exId => {
        if (existingMap.has(exId)) {
          updatedExercises.push(existingMap.get(exId));
        } else {
          const prev = getPreviousExerciseStats(exId, pickerTargetDate);
          updatedExercises.push({
            exerciseId: exId,
            sets: [
              { weight: prev ? prev.bestWeight : '', reps: prev ? prev.bestReps : 10, done: false },
              { weight: prev ? prev.bestWeight : '', reps: prev ? prev.bestReps : 10, done: false },
              { weight: prev ? prev.bestWeight : '', reps: prev ? prev.bestReps : 10, done: false }
            ]
          });

      });

      w.exercises = updatedExercises;
      saveState();
      closeModal();
      markAllTabsDirty();
      renderApp(true);
      showToast(`Updated workout (${updatedExercises.length} exercises)`);

    function calculateBmrAndTdee() {
      const p = appState.bmrProfile || { age: 26, heightCm: 168, weightKg: 62, activity: 1.55, goalMode: 'maintain' };
      const gender = appState.gender === 'male' ? 'male' : 'female';
      const w = Number(p.weightKg) || 62;
      const h = Number(p.heightCm) || 168;
      const a = Number(p.age) || 26;
      const act = Number(p.activity) || 1.55;

      const bmr = gender === 'male'
        ? Math.round(10 * w + 6.25 * h - 5 * a + 5)
        : Math.round(10 * w + 6.25 * h - 5 * a - 161);

      const tdee = Math.round(bmr * act);
      let target = tdee;
      if (p.goalMode === 'cut') target = Math.max(1200, tdee - 400);
      if (p.goalMode === 'bulk') target = tdee + 300;

      return { bmr, tdee, target, gender };
    }

    function getDayCaloriesSummary(dateStr) {
      const list = Array.isArray(appState.calorieLogs[dateStr]) ? appState.calorieLogs[dateStr] : [];
      let calories = 0;
      let protein = 0;
      list.forEach(item => {
        calories += Number(item.calories) || 0;
        protein += Number(item.protein) || 0;
      });
      return { calories, protein, list };
    }

    function getAiDailyUsageInfo() {
      const currentToday = toLocalDateStr(new Date());
      if (!appState.aiCalorieUsage || appState.aiCalorieUsage.date !== currentToday) {
        appState.aiCalorieUsage = { date: currentToday, count: 0 };
        saveState();
      }
      const used = Math.min(3, Math.max(0, Number(appState.aiCalorieUsage.count) || 0));
      return { used, remaining: Math.max(0, 3 - used), limit: 3 };
    }

    function isFoodFavorited(name) {
      const key = (name || '').toLowerCase().trim();
      return (appState.favoriteFoods || []).some(f => (f.name || '').toLowerCase().trim() === key);
    }

    function getCurrentWeekMondayStr(refDateStr = TODAY_STR) {
      const d = parseLocalDate(refDateStr);
      const dayOfWeek = (d.getDay() + 6) % 7;
      return toLocalDateStr(addDays(d, -dayOfWeek));
    }

    function getThisWeekMealsHistory() {
      const mondayStr = getCurrentWeekMondayStr(TODAY_STR);
      const sundayStr = toLocalDateStr(addDays(parseLocalDate(mondayStr), 6));
      const allDates = Object.keys(appState.calorieLogs || {})
        .filter(d => d >= mondayStr && d <= sundayStr)
        .sort((a, b) => b.localeCompare(a));

      const items = [];
      allDates.forEach(dStr => {
        const dayEntries = Array.isArray(appState.calorieLogs[dStr]) ? appState.calorieLogs[dStr] : [];
        for (let i = dayEntries.length - 1; i >= 0; i--) {
          items.push({
            ...dayEntries[i],
            dateStr: dStr,
            dayLabel: dStr === TODAY_STR ? 'Today' : formatDisplayDate(dStr)
          });
        }
      });
      return items;
    }

    function estimateMealLocallyFallback(description) {
      const text = description.toLowerCase();
      const items = [];
      const rules = [
        { re: /chicken\s*breast|chicken/, name: 'Chicken Breast', per100: { kcal: 165, p: 31, c: 0, f: 3.6 }, defG: 100 },
        { re: /brown\s*rice/, name: 'Boiled Brown Rice', per100: { kcal: 112, p: 2.6, c: 23.5, f: 0.9 }, defG: 100, tbspG: 15 },
        { re: /white\s*rice|rice/, name: 'Boiled Rice', per100: { kcal: 130, p: 2.7, c: 28, f: 0.3 }, defG: 120, tbspG: 15 },
        { re: /olive\s*oil|oil|fried/, name: 'Cooking Oil', per100: { kcal: 884, p: 0, c: 0, f: 100 }, defG: 7, tbspG: 14 },
        { re: /butter/, name: 'Butter', per100: { kcal: 717, p: 0.9, c: 0.1, f: 81 }, defG: 10, tbspG: 14 },
        { re: /egg/, name: 'Whole Eggs', per100: { kcal: 144, p: 12.6, c: 0.7, f: 9.5 }, defG: 110 },
        { re: /salmon/, name: 'Salmon Fillet', per100: { kcal: 208, p: 20, c: 0, f: 13 }, defG: 150 },
        { re: /beef|steak/, name: 'Beef', per100: { kcal: 220, p: 26, c: 0, f: 12 }, defG: 150 },
        { re: /oat/, name: 'Oats', per100: { kcal: 380, p: 13, c: 67, f: 7 }, defG: 50, tbspG: 10 },
        { re: /banana/, name: 'Banana', per100: { kcal: 89, p: 1.1, c: 23, f: 0.3 }, defG: 120 },
        { re: /yogurt|matsoni/, name: 'Greek Yogurt', per100: { kcal: 70, p: 10, c: 4, f: 1.5 }, defG: 170, tbspG: 15 },
        { re: /bread|toast|puri/, name: 'Bread', per100: { kcal: 265, p: 9, c: 49, f: 3.2 }, defG: 70 },
        { re: /cheese|sulguni|feta/, name: 'Cheese', per100: { kcal: 290, p: 20, c: 2, f: 22 }, defG: 45 },
        { re: /potato/, name: 'Potato', per100: { kcal: 87, p: 2, c: 20, f: 0.1 }, defG: 180 },
        { re: /pasta/, name: 'Cooked Pasta', per100: { kcal: 147, p: 5, c: 30, f: 0.9 }, defG: 150 },
        { re: /avocado/, name: 'Avocado', per100: { kcal: 160, p: 2, c: 9, f: 15 }, defG: 75 }
      ];

      rules.forEach(r => {
        const match = text.match(r.re);
        if (!match) return;
        const idx = match.index || 0;
        const windowBefore = text.slice(Math.max(0, idx - 26), idx);
        let grams = r.defG;
        const gMatch = windowBefore.match(/(\d+(?:\.\d+)?)\s*(?:g|gr|grams)\b/);
        const tbspMatch = windowBefore.match(/(\d+(?:\.\d+)?)\s*(?:tbsp|table\s*spoons?|tablespoons?)\b/);
        const tspMatch = windowBefore.match(/(\d+(?:\.\d+)?)\s*(?:tsp|tea\s*spoons?|teaspoons?)\b/);
        if (gMatch) {
          grams = Number(gMatch[1]);
        } else if (tbspMatch && r.tbspG) {
          grams = Number(tbspMatch[1]) * r.tbspG;
        } else if (tspMatch) {
          grams = Number(tspMatch[1]) * 5;
        }
        const scale = grams / 100;
        items.push({
          name: r.name,
          portion: `${Math.round(grams)}g`,
          calories: Math.round(r.per100.kcal * scale),
          protein: Math.round(r.per100.p * scale),
          carbs: Math.round(r.per100.c * scale),
          fat: Math.round(r.per100.f * scale)
        });
      });

      if (items.length === 0) {
        items.push({
          name: description.slice(0, 48),
          portion: '1 serving',
          calories: 320,
          protein: 18,
          carbs: 32,
          fat: 12
        });
      }

      const totals = items.reduce((acc, it) => ({
        kcal: acc.kcal + it.calories,
        p: acc.p + it.protein,
        c: acc.c + it.carbs,
        f: acc.f + it.fat
      }), { kcal: 0, p: 0, c: 0, f: 0 });

      return {
        dishName: items.map(i => i.name).join(' + '),
        totalCalories: totals.kcal,
        protein: totals.p,
        carbs: totals.c,
        fat: totals.f,
        items,
        notes: 'Estimated from standard USDA / nutritional portion equivalents.'
      };
    }

    async function callGeminiTextCalorieCalculator(mealDescription) {
      const apiKey = "";
      if (!apiKey) {
        return estimateMealLocallyFallback(mealDescription);
      }

      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
      const systemInstruction = `You are a precision nutrition and calorie estimation engine for a fitness app.
Given a user's plain-text description of a meal (including weights in grams, tablespoons, teaspoons, cooking methods like fried in oil/butter, or restaurant items), break down every ingredient and compute the most accurate realistic calories and macronutrients (protein, carbs, fat in grams).
Account for cooking oil/butter absorbed during frying when mentioned (e.g., "a bit of oil" ~ 0.5-1 tsp = 3-5g = 27-45 kcal; 1 tbsp cooked brown rice ~ 15g = ~17 kcal).
Return clean JSON matching the exact schema.`;

      const payload = {
        contents: [{ parts: [{ text: `Calculate exact calories and macros for: ${mealDescription}` }] }],
        systemInstruction: { parts: [{ text: systemInstruction }] },
        generationConfig: {
          responseMimeType: "application/json",
          responseSchema: {
            type: "OBJECT",
            properties: {
              dishName: { type: "STRING" },
              totalCalories: { type: "NUMBER" },
              protein: { type: "NUMBER" },
              carbs: { type: "NUMBER" },
              fat: { type: "NUMBER" },
              notes: { type: "STRING" },
              items: {
                type: "ARRAY",
                items: {
                  type: "OBJECT",
                  properties: {
                    name: { type: "STRING" },
                    portion: { type: "STRING" },
                    calories: { type: "NUMBER" },
                    protein: { type: "NUMBER" }
                  },
                  required: ["name", "portion", "calories", "protein"]
                }
              }
            },
            required: ["dishName", "totalCalories", "protein", "carbs", "fat", "items"]
          }
        }
      };

      for (let attempt = 0; attempt < 2; attempt++) {
        try {
          const resp = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const data = await resp.json();
          const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
          if (!rawText) throw new Error('Empty AI response');
          return JSON.parse(rawText);
        } catch (err) {
          if (attempt === 1) return estimateMealLocallyFallback(mealDescription);
          await new Promise(r => setTimeout(r, 800));
        }
      }
      return estimateMealLocallyFallback(mealDescription);
    }

    async function calculateMealCaloriesWithAI() {
      const usage = getAiDailyUsageInfo();
      if (usage.remaining <= 0) {
        showToast('Daily limit of 3 AI calculations reached — resets at 00:00');
        return;
      }

      const text = (document.getElementById('aiMealTextarea')?.value || aiMealPromptText || '').trim();
      if (!text) {
        showToast('Describe your meal first');
        return;
      }
      aiMealPromptText = text;
      isAiCalculatingMeal = true;
      renderCaloriesView();

      try {
        const result = await callGeminiTextCalorieCalculator(text);
        const currentToday = toLocalDateStr(new Date());
        const currentCount = (appState.aiCalorieUsage && appState.aiCalorieUsage.date === currentToday)
          ? (Number(appState.aiCalorieUsage.count) || 0)
          : 0;
        appState.aiCalorieUsage = {
          date: currentToday,
          count: Math.min(3, currentCount + 1)
        };

        aiMealLastResult = {
          dishName: result.dishName || text.slice(0, 48),
          totalCalories: Math.round(Number(result.totalCalories) || 0),
          protein: Math.round(Number(result.protein) || 0),
          carbs: Math.round(Number(result.carbs) || 0),
          fat: Math.round(Number(result.fat) || 0),
          notes: result.notes || '',
          items: Array.isArray(result.items) ? result.items.map(it => ({
            name: it.name || 'Ingredient',
            portion: it.portion || '',
            calories: Math.round(Number(it.calories) || 0),
            protein: Math.round(Number(it.protein) || 0)
          })) : []
        };
        appState.pendingAiResult = aiMealLastResult;
        saveState();
        showToast(`AI estimated ${aiMealLastResult.totalCalories} kcal & saved`);
      } catch (e) {
        showToast('Could not calculate meal — please try again');
      } finally {
        isAiCalculatingMeal = false;
        renderCaloriesView();
      }
    }

      appState.calorieLogs[selectedCalorieDate].push({

            : (lastCloudSyncAt ? `Synced ${accountSession.username} at ${lastCloudSyncAt}` : `Syncing ${accountSession.username}...`))
        : 'Sign in to sync profile across devices';

      const displayFullName = [appState.firstName, appState.lastName].filter(Boolean).join(' ')
        || accountSession?.firstName
        || accountSession?.username
        || 'Athlete';
      const initialLetter = (displayFullName || 'A').charAt(0).toUpperCase();

      const avatarPreviewHtml = appState.profilePhoto
        ? `<img src="${appState.profilePhoto}" alt="Profile Photo" class="w-full h-full object-cover" />`
        : `<span class="text-lg font-extrabold accent-text">${escapeHtml(initialLetter)}</span>`;

      if (accountSession && accountSession.username) {
        const bodyHtml = `
          <div class="space-y-4">
            <!-- Profile Avatar & Name -->
            <div class="bg-obsidian border border-borderDark rounded-2xl p-4 flex items-center gap-3.5">
              <label for="profilePhotoInput" class="relative w-16 h-16 rounded-2xl bg-surface border border-borderDark overflow-hidden flex items-center justify-center cursor-pointer shrink-0 group">
                ${avatarPreviewHtml}
                <span class="absolute bottom-0 inset-x-0 bg-black/75 text-[9px] font-extrabold text-white text-center py-0.5">Edit</span>
              </label>
              <input id="profilePhotoInput" type="file" accept="image/*" class="hidden" onchange="handleProfilePhotoUpload(event)" />

              <div class="min-w-0 flex-1">
                <p class="text-sm font-extrabold text-white truncate">${escapeHtml(displayFullName)}</p>
                <p class="text-[11px] text-mutedText truncate mt-0.5">${escapeHtml(accountSession.username)}</p>
                <p class="text-[11px] text-mutedText mt-0.5">${done365} workouts logged this year</p>
                ${appState.profilePhoto ? `<button type="button" onclick="removeProfilePhoto()" class="text-[10px] font-bold text-coralAccent mt-1">Remove photo</button>` : ''}
              </div>
            </div>

            <!-- Edit Name, Email & Gender -->
            <div class="bg-obsidian border border-borderDark rounded-2xl p-3.5 space-y-2.5">
              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="text-[10px] font-bold uppercase tracking-wider text-mutedText block mb-1">First Name</label>
                  <input id="profileFirstNameInput" type="text" value="${escapeHtml(appState.firstName || '')}" placeholder="First Name"
                    class="w-full bg-surface border border-borderDark rounded-xl px-3 py-2 text-xs font-bold text-white focus:outline-none" />
                </div>
                <div>
                  <label class="text-[10px] font-bold uppercase tracking-wider text-mutedText block mb-1">Surname (Opt)</label>
                  <input id="profileLastNameInput" type="text" value="${escapeHtml(appState.lastName || '')}" placeholder="Optional"
                    class="w-full bg-surface border border-borderDark rounded-xl px-3 py-2 text-xs font-bold text-white focus:outline-none" />
                </div>
              </div>

              <div>
                <label class="text-[10px] font-bold uppercase tracking-wider text-mutedText block mb-1">Email / Account Username</label>
                <input id="profileEmailInput" type="text" autocapitalize="none" spellcheck="false" value="${escapeHtml(accountSession.username || '')}" placeholder="you@example.com"
                  class="w-full bg-surface border border-borderDark rounded-xl px-3 py-2 text-xs font-bold text-white focus:outline-none" />
              </div>

              <div>
                <label class="text-[10px] font-bold uppercase tracking-wider text-mutedText block mb-1">Gender (For Calorie &amp; BMR Calculation)</label>
                <div class="grid grid-cols-2 gap-2">
                  <button type="button" onclick="setProfileGender('female')"
                    class="py-2 rounded-xl border text-xs font-extrabold transition
                    ${appState.gender !== 'male' ? 'accent-bg text-obsidian border-transparent' : 'bg-surface border-borderDark text-mutedText'}">
                    Female
                  </button>
                  <button type="button" onclick="setProfileGender('male')"
                    class="py-2 rounded-xl border text-xs font-extrabold transition
                    ${appState.gender === 'male' ? 'accent-bg text-obsidian border-transparent' : 'bg-surface border-borderDark text-mutedText'}">
                    Male
                  </button>
                </div>
              </div>

              <button type="button" onclick="saveProfileNameAndEmail()"
                class="w-full py-2.5 rounded-xl accent-bg text-obsidian text-xs font-extrabold">
                Save Profile &amp; Email
              </button>
            </div>

            <!-- Weekly Workout Frequency Goal -->
            <div class="bg-obsidian border border-borderDark rounded-2xl p-4 space-y-2.5">
              <div class="flex items-center justify-between">
                <span class="text-xs font-extrabold text-white">Weekly Workout Goal</span>
                <span class="text-xs font-extrabold accent-text">${weeklyGoal}x / week</span>
              </div>
              <div class="grid grid-cols-7 gap-1.5">
                ${[1, 2, 3, 4, 5, 6, 7].map(n => `
                  <button type="button" onclick="setWeeklyWorkoutGoal(${n})"
                    class="py-2 rounded-xl border text-xs font-extrabold transition
                    ${weeklyGoal === n ? 'accent-bg text-obsidian border-transparent' : 'bg-surface border-borderDark text-mutedText hover:text-white'}">
                    ${n}d
                  </button>
                `).join('')}
              </div>
              <p class="text-[11px] text-mutedText">Your 🔥 weekly streak advances every week you hit ${weeklyGoal} workout${weeklyGoal > 1 ? 's' : ''}.</p>
            </div>

            <!-- Manual Cloud Sync Button -->
            <button id="manualSyncBtn" type="button" onclick="manualCloudSyncNow()"
              class="w-full py-3 rounded-2xl bg-obsidian border border-borderDark hover:border-white/25 text-xs font-extrabold text-white transition">
              ↻ ${escapeHtml(syncStatusText)}
            </button>

            <button type="button" onclick="signOutAccount()"
              class="w-full py-3 rounded-2xl bg-obsidian border border-coralAccent/40 text-xs font-extrabold text-coralAccent hover:bg-coralAccent/10 transition">
              Sign Out
            </button>
          </div>
        `;
        openModal('Profile & Goals', bodyHtml);
      } else {
        const bodyHtml = `
          <div class="space-y-4">
            <div class="bg-obsidian border border-borderDark rounded-2xl p-4 space-y-2">
              <p class="text-xs font-extrabold text-white">Guest Mode</p>
              <p class="text-xs text-mutedText leading-relaxed">Sign in or create an account to save your profile photo, weekly streak goal, workouts, and meals across devices.</p>
            </div>
            <button type="button" onclick="goToLoginPage()"
              class="w-full py-3.5 rounded-2xl accent-bg text-obsidian text-xs font-extrabold shadow-lg">
              Sign In or Create Account →
            </button>
          </div>
        `;
        openModal('Profile & Account', bodyHtml);
      }
    }

    async function saveProfileNameAndEmail() {
      const fName = (document.getElementById('profileFirstNameInput')?.value || '').trim();
      const lName = (document.getElementById('profileLastNameInput')?.value || '').trim();
      const rawNewEmail = (document.getElementById('profileEmailInput')?.value || '').toLowerCase().trim().replace(/[^a-z0-9@._-]/g, '');

      if (rawNewEmail && rawNewEmail.length < 3) {
        showToast('Email / username must be at least 3 characters');
        return;
      }

      if (fName) appState.firstName = fName;
      appState.lastName = lName;

      if (accountSession) {
        const oldUsername = accountSession.username;
        const emailChanged = rawNewEmail && rawNewEmail !== oldUsername;

        if (emailChanged) {
          accountSession.username = rawNewEmail;
        }
        accountSession.firstName = appState.firstName || rawNewEmail.split('@')[0];
        accountSession.lastName = appState.lastName;
        accountSession.displayName = accountSession.firstName;
        localStorage.setItem(ACCOUNT_SESSION_KEY, JSON.stringify(accountSession));

        if (emailChanged) {
          saveState();
          await pushStateToSupabase(true);
          if (supabaseClient && oldUsername) {
            try {
              await supabaseClient.from('cadence_profiles').delete().eq('username', oldUsername);
            } catch (_) {}
          }
          try {
            localStorage.removeItem(`${ACCOUNT_VAULT_PREFIX}${oldUsername}`);
            localStorage.removeItem(`${ACCOUNT_VAULT_PREFIX}${oldUsername}_backup`);
          } catch (_) {}
        }
      }

      saveState();
      renderHeaderStats();
      openAccountModal();
      showToast('Profile & email updated!');
    }

    function setProfileGender(gender) {
      appState.gender = gender === 'male' ? 'male' : 'female';
      if (accountSession) {
        accountSession.gender = appState.gender;
        localStorage.setItem(ACCOUNT_SESSION_KEY, JSON.stringify(accountSession));
      }
      saveState();
      markAllTabsDirty();
      renderApp(true);
      openAccountModal();
      showToast(`Gender set to ${appState.gender === 'male' ? 'Male' : 'Female'}`);
    }

    function handleProfilePhotoUpload(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        const img = new Image();
        img.onload = function () {
          const canvas = document.createElement('canvas');
          const maxDim = 220;
          const scale = Math.min(maxDim / img.width, maxDim / img.height, 1);
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          appState.profilePhoto = canvas.toDataURL('image/jpeg', 0.82);
          saveState();
          renderHeaderStats();
          openAccountModal();
          showToast('Profile photo updated!');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function removeProfilePhoto() {
      appState.profilePhoto = '';
      saveState();
      renderHeaderStats();
      openAccountModal();
      showToast('Profile photo removed');
    }

    function setWeeklyWorkoutGoal(daysPerWeek) {
      appState.weeklyGoal = daysPerWeek;
      saveState();
      markAllTabsDirty();
      renderApp(true);
      openAccountModal();
      showToast(`Weekly goal set to ${daysPerWeek}x / week`);
    }

    async function manualCloudSyncNow() {
      const btn = document.getElementById('manualSyncBtn');
      if (btn) btn.textContent = 'Syncing to server...';
      const ok = await pushStateToSupabase(true);
      if (btn) {
        btn.textContent = ok
          ? `✓ Synced ${accountSession.username} to Cloud`
          : `⚠ ${lastCloudSyncError || 'Sync Failed'}`;
      }
      if (ok) showToast('Synced to cloud!');
    }

    function goToLoginPage() {
      localStorage.removeItem(GUEST_MODE_KEY);
      if (window.location.protocol === 'about:' || window.location.href.startsWith('blob:')) {
        closeModal();
        showToast('Open login.html in the editor to test sign-in');
        return;
      }
      window.location.href = './login.html';
    }

    function signOutAccount() {
      localStorage.removeItem(ACCOUNT_SESSION_KEY);
      localStorage.removeItem(GUEST_MODE_KEY);
      accountSession = null;
      if (window.location.protocol === 'about:' || window.location.href.startsWith('blob:')) {
        closeModal();
        updateHeaderAccountUI();
        showToast('Signed out');
        return;
      }
      window.location.replace('./login.html');
    }

    /* ==========================================================================
       14. SECURITY & ESCAPING
       ========================================================================== */
    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    /* ==========================================================================
       15. BOOTSTRAP & AUTOMATIC CLOUD / MIDNIGHT SYNC LISTENERS
       ========================================================================== */
    let lastKnownCalendarDate = TODAY_STR;
    setInterval(() => {
      const nowObj = new Date();
      const nowDateStr = toLocalDateStr(nowObj);
      if (nowDateStr !== lastKnownCalendarDate) {
        const prevToday = lastKnownCalendarDate;
        lastKnownCalendarDate = nowDateStr;
        TODAY_STR = nowDateStr;
        if (selectedCalorieDate === prevToday) selectedCalorieDate = nowDateStr;
        if (selectedWorkoutDate === prevToday) selectedWorkoutDate = nowDateStr;
        if (appState.aiCalorieUsage && appState.aiCalorieUsage.date !== nowDateStr) {
          appState.aiCalorieUsage = { date: nowDateStr, count: 0 };
          saveState();
        }
        markAllTabsDirty();
        renderApp(true);
      }
    }, 30000);

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') {
        flushStateKeepaliveOnExit();
      } else if (document.visibilityState === 'visible' && isStateHydrated && accountSession?.username) {
        pullStateFromSupabase(accountSession.username).then(remote => {
          if (remote && (remote._updatedAt || 0) > (appState._updatedAt || 0)) {
            appState = remote;
            if (appState.pendingAiResult) aiMealLastResult = appState.pendingAiResult;
            applyTheme(appState.accent);
            markAllTabsDirty();
            renderApp(true);
          }
        });
      }
    });

    window.addEventListener('pagehide', flushStateKeepaliveOnExit);
    window.addEventListener('beforeunload', flushStateKeepaliveOnExit);

    (async function initApp() {
      if (!enforceLoginGate()) return;
      await hydrateStateFromVault();
      applyTheme(appState.accent);
      markAllTabsDirty();
      renderApp(true);
    })();
  </script>
</body>
</html>
