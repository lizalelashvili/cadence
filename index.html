  <script>
    (function generateImmediateCadenceIcons() {
      try {
        const THEME_MAP = {
          blue: '#3B82F6',
          pink: '#FF4D94',
          lime: '#C6FF00',
          coral: '#FF5E3A',
          violet: '#A855F7',
          cyan: '#22D3EE'
        };
        let hex = THEME_MAP.blue;
        try {
          const saved = JSON.parse(localStorage.getItem('cadence_workout_tracker_v1') || 'null');
          if (saved && saved.accent && THEME_MAP[saved.accent]) hex = THEME_MAP[saved.accent];
        } catch (_) {}

        function buildIconDataUrl(size) {
          const canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#0A0A0C';
          ctx.fillRect(0, 0, size, size);

          const pad = Math.round(size * 0.21);
          const gap = Math.round(size * 0.08);
          const sq = Math.round((size - pad * 2 - gap) / 2);
          const r = Math.round(sq * 0.24);

          function drawSq(x, y, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + sq - r, y);
            ctx.quadraticCurveTo(x + sq, y, x + sq, y + r);
            ctx.lineTo(x + sq, y + sq - r);
            ctx.quadraticCurveTo(x + sq, y + sq, x + sq - r, y + sq);
            ctx.lineTo(x + r, y + sq);
            ctx.quadraticCurveTo(x, y + sq, x, y + sq - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
            ctx.fill();
          }

          drawSq(pad, pad, hex);
          drawSq(pad + sq + gap, pad, '#27272E');
          drawSq(pad, pad + sq + gap, '#27272E');
          drawSq(pad + sq + gap, pad + sq + gap, hex);
          return canvas.toDataURL('image/png');
        }

        const icon180 = buildIconDataUrl(180);
        const icon512 = buildIconDataUrl(512);
        document.getElementById('appleTouchIcon').href = icon180;
        document.getElementById('appleTouchIcon512').href = icon512;
        document.getElementById('faviconIcon').href = icon180;

        let startUrl = './index.html';
        try {
          const sess = JSON.parse(localStorage.getItem('cadence_account_session_v1') || 'null');
          if (sess && sess.username && sess.passHash) {
            startUrl = `./index.html?u=${encodeURIComponent(sess.username)}&h=${encodeURIComponent(sess.passHash)}`;
          }
        } catch (_) {}

        const manifestObj = {
          name: 'CADENCE — 365-Day Workout Tracker',
          short_name: 'CADENCE',
          start_url: startUrl,
          display: 'standalone',
          background_color: '#0A0A0C',
          theme_color: '#0A0A0C',
          icons: [
            { src: icon180, sizes: '180x180', type: 'image/png' },
            { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
          ]
        };
        const blob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
        document.getElementById('appManifest').href = URL.createObjectURL(blob);
      } catch (_) {}
    })();
  </script>

    function resolveExerciseAnimType(ex, baseGuide) {
      if (!ex) return baseGuide.animType || 'squat';
      const id = (ex.id || '').toLowerCase();
      const name = (ex.name || '').toLowerCase();

      if (id.includes('bulgarian') || id.includes('split_squat') || id.includes('lunge') || id.includes('step_up') || name.includes('lunge') || name.includes('split squat')) {
        return 'lunge';
      }
      if (id.includes('leg_extension') || name.includes('leg extension')) {
        return 'leg_ext';
      }
      if (id.includes('leg_curl') || id.includes('hamstring_curl') || name.includes('leg curl')) {
        return 'leg_curl';
      }
      if (id.includes('abduction') || id.includes('adduction') || name.includes('abduction') || name.includes('adduction')) {
        return 'abduction';
      }
      if (id.includes('kickback') || name.includes('kickback')) {
        return 'kickback';
      }
      if (id.includes('calf') || name.includes('calf')) {
        return 'calf';
      }
      if (id.includes('lateral_raise') || id.includes('front_raise') || id.includes('rear_delt') || id.includes('reverse_pec') || name.includes('lateral raise') || name.includes('rear delt')) {
        return 'lateral';
      }
      if (id.includes('fly') || id.includes('pec_deck') || name.includes('fly') || name.includes('pec deck')) {
        return 'fly';
      }
      if (id.includes('incline') && (id.includes('press') || name.includes('press'))) {
        return 'incline_press';
      }
      if (id.includes('overhead_press') || id.includes('shoulder_press') || id.includes('arnold') || id.includes('ohp') || name.includes('shoulder press') || name.includes('overhead press')) {
        return 'ohp';
      }
      if (id.includes('row') || id.includes('face_pull') || name.includes('row') || name.includes('face pull')) {
        return 'row';
      }
      if (id.includes('tricep') || id.includes('pushdown') || id.includes('skull_crusher') || name.includes('tricep') || name.includes('skull')) {
        return 'tricep';
      }
      if (id.includes('curl') || name.includes('curl')) {
        return 'curl';
      }
      return baseGuide.animType || 'squat';
    }

    function getExerciseFormGuide(ex) {
      const base = (ex && SPECIFIC_FORM_GUIDES[ex.id])
        ? SPECIFIC_FORM_GUIDES[ex.id]
        : (MUSCLE_FALLBACK_GUIDES[ex?.muscle] || MUSCLE_FALLBACK_GUIDES.Legs);
      return {
        ...base,
        animType: resolveExerciseAnimType(ex, base)
      };
    }

    function renderExerciseFormSvg(animType) {
      const uid = 'bio_' + Math.random().toString(36).slice(2, 9);
      return `
        <div class="w-32 h-28 rounded-xl bg-obsidian border border-borderDark/90 flex flex-col items-center justify-center shrink-0 overflow-hidden relative shadow-inner">
          <canvas id="${uid}" data-bio-anim="${escapeHtml(animType)}" width="256" height="224" class="w-full h-full block"></canvas>
        </div>
      `;
    }

    /* ==========================================================================
       60FPS ANATOMICAL BIOMECHANICS CANVAS ENGINE
       ========================================================================== */
    let bioAnimRafId = null;

    function solveTwoBoneIK(ax, ay, bx, by, L1, L2, bendDir) {
      const dx = bx - ax;
      const dy = by - ay;
      const maxReach = (L1 + L2) * 0.99;
      const minReach = Math.abs(L1 - L2) + 1;
      const dist = Math.min(maxReach, Math.max(minReach, Math.hypot(dx, dy)));
      const baseAngle = Math.atan2(dy, dx);
      const cosA = Math.min(1, Math.max(-1, (L1 * L1 + dist * dist - L2 * L2) / (2 * L1 * dist)));
      const offsetAngle = Math.acos(cosA) * (bendDir >= 0 ? 1 : -1);
      const jointAngle = baseAngle + offsetAngle;
      return {
        x: ax + Math.cos(jointAngle) * L1,
        y: ay + Math.sin(jointAngle) * L1
      };
    }

    function getCycleWave(tSec, periodSec = 2.8) {
      const raw = (tSec % periodSec) / periodSec;
      let p = 0;
      let phase = 'CONTROL';
      if (raw < 0.52) {
        const u = raw / 0.52;
        p = 0.5 - 0.5 * Math.cos(Math.PI * u);
        phase = 'LOWER';
      } else if (raw < 0.64) {
        p = 1;
        phase = 'HOLD';
      } else {
        const u = (raw - 0.64) / 0.36;
        p = 0.5 + 0.5 * Math.cos(Math.PI * u);
        phase = 'DRIVE';
      }
      return { p, phase, raw };
    }

    function drawTaperedLimb(ctx, x1, y1, x2, y2, r1, r2, color, glow = false) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const len = Math.hypot(dx, dy);
      if (len < 0.5) return;
      const nx = -dy / len;
      const ny = dx / len;

      ctx.save();
      if (glow) {
        ctx.shadowColor = color;
        ctx.shadowBlur = 12;
      }
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(x1 + nx * r1, y1 + ny * r1);
      ctx.lineTo(x2 + nx * r2, y2 + ny * r2);
      ctx.arc(x2, y2, r2, Math.atan2(ny, nx), Math.atan2(-ny, -nx), false);
      ctx.lineTo(x1 - nx * r1, y1 - ny * r1);
      ctx.arc(x1, y1, r1, Math.atan2(-ny, -nx), Math.atan2(ny, nx), false);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawJointNode(ctx, x, y, r, accentHex) {
      ctx.save();
      ctx.fillStyle = '#0A0A0C';
      ctx.strokeStyle = accentHex;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function drawHead(ctx, x, y, r = 9.5) {
      ctx.save();
      ctx.fillStyle = '#F5F5F7';
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawBarbellPlate(ctx, x, y, radius, accentHex) {
      ctx.save();
      ctx.shadowColor = accentHex;
      ctx.shadowBlur = 10;
      ctx.fillStyle = accentHex;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#0A0A0C';
      ctx.beginPath();
      ctx.arc(x, y, radius * 0.36, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.45)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(x, y, radius * 0.72, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    function drawDumbbell(ctx, x, y, angleRad, accentHex) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angleRad);
      ctx.fillStyle = '#A1A1AA';
      ctx.fillRect(-13, -2.5, 26, 5);
      ctx.shadowColor = accentHex;
      ctx.shadowBlur = 8;
      ctx.fillStyle = accentHex;
      ctx.beginPath();
      ctx.roundRect(-16, -7, 6, 14, 2);
      ctx.roundRect(10, -7, 6, 14, 2);
      ctx.fill();
      ctx.restore();
    }

    function renderBioCanvasFrame(ctx, w, h, animType, tSec, accentHex) {
      ctx.clearRect(0, 0, w, h);

      // Architectural grid & floor plane
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
      ctx.lineWidth = 1;
      for (let gx = 32; gx < w; gx += 32) {
        ctx.beginPath(); ctx.moveTo(gx, 18); ctx.lineTo(gx, h - 22); ctx.stroke();
      }
      for (let gy = 36; gy < h - 22; gy += 32) {
        ctx.beginPath(); ctx.moveTo(16, gy); ctx.lineTo(w - 16, gy); ctx.stroke();
      }

      const floorY = h - 24;
      ctx.strokeStyle = '#2A2A34';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(20, floorY);
      ctx.lineTo(w - 20, floorY);
      ctx.stroke();

      const { p, phase, raw } = getCycleWave(tSec, animType === 'cardio' ? 1.5 : 2.8);
      const bodyLight = '#F5F5F7';
      const bodyMid = '#9CA3AF';
      const equipDark = '#272730';

      if (animType === 'squat') {
        // Side-profile facing RIGHT: knees bend forward (+X), hips sit back (-X)
        const ankle = { x: 118, y: floorY - 6 };
        drawTaperedLimb(ctx, ankle.x - 5, floorY - 3, ankle.x + 18, floorY - 3, 4, 3, bodyLight);

        // Knee glides slightly forward (+X), hip drops down & back (-X, +Y)
        const knee = { x: ankle.x + 6 + p * 18, y: ankle.y - 44 + p * 6 };
        const hip = { x: 112 - p * 26, y: 112 + p * 42 };
        // Torso leans forward slightly (+X) so barbell stays over mid-foot
        const shoulder = { x: hip.x + 8 + p * 26, y: hip.y - 54 + p * 10 };
        const elbow = { x: shoulder.x - 10, y: shoulder.y + 18 };

        // Vertical bar-path reference line
        ctx.save();
        ctx.setLineDash([3, 3]);
        ctx.strokeStyle = 'rgba(255,255,255,0.16)';
        ctx.beginPath(); ctx.moveTo(120, 48); ctx.lineTo(120, floorY - 8); ctx.stroke();
        ctx.restore();

        drawTaperedLimb(ctx, ankle.x, ankle.y, knee.x, knee.y, 5.5, 7, bodyMid);
        drawTaperedLimb(ctx, hip.x, hip.y, knee.x, knee.y, 9.5, 6.5, accentHex, true);
        drawTaperedLimb(ctx, hip.x, hip.y, shoulder.x, shoulder.y, 9.5, 8.5, bodyLight);
        drawHead(ctx, shoulder.x + 7, shoulder.y - 17, 9.5);
        // Arm gripping barbell on upper traps
        drawTaperedLimb(ctx, shoulder.x - 2, shoulder.y + 4, elbow.x, elbow.y, 4.5, 4, bodyMid);
        drawTaperedLimb(ctx, elbow.x, elbow.y, shoulder.x - 5, shoulder.y - 4, 4, 3.5, bodyMid);
        drawBarbellPlate(ctx, shoulder.x - 5, shoulder.y - 4, 13, accentHex);
        drawJointNode(ctx, hip.x, hip.y, 4, accentHex);
      } else if (animType === 'lunge') {
        // Rear Bench on LEFT, facing RIGHT (supports both glute-leaning and quad-leaning split squat mechanics)
        ctx.fillStyle = equipDark;
        ctx.beginPath(); ctx.roundRect(34, floorY - 42, 36, 42, 6); ctx.fill();

        const frontAnkle = { x: 174, y: floorY - 6 };
        drawTaperedLimb(ctx, frontAnkle.x - 5, floorY - 3, frontAnkle.x + 18, floorY - 3, 4, 3, bodyLight);

        // Front knee travels forward (+X) as hips descend, with controlled torso lean
        const frontKnee = { x: frontAnkle.x + 6 + p * 14, y: frontAnkle.y - 44 + p * 5 };
        const hip = { x: 128 - p * 6, y: 112 + p * 34 };
        const rearFoot = { x: 64, y: floorY - 42 };
        const rearKnee = solveTwoBoneIK(hip.x, hip.y, rearFoot.x, rearFoot.y, 44, 44, -1);
        const shoulder = { x: hip.x + 8 + p * 16, y: hip.y - 54 + p * 6 };

        // Rear leg (muted)
        drawTaperedLimb(ctx, hip.x, hip.y, rearKnee.x, rearKnee.y, 7.5, 5.5, '#6B7280');
        drawTaperedLimb(ctx, rearKnee.x, rearKnee.y, rearFoot.x, rearFoot.y, 5.5, 4.5, '#6B7280');
        // Front working leg (highlighted)
        drawTaperedLimb(ctx, frontAnkle.x, frontAnkle.y, frontKnee.x, frontKnee.y, 5.5, 7, bodyMid);
        drawTaperedLimb(ctx, hip.x, hip.y, frontKnee.x, frontKnee.y, 9.5, 6.5, accentHex, true);
        // Torso & hanging dumbbell
        drawTaperedLimb(ctx, hip.x, hip.y, shoulder.x, shoulder.y, 9, 8.5, bodyLight);
        drawHead(ctx, shoulder.x + 6, shoulder.y - 17, 9.5);
        const hand = { x: shoulder.x + 2, y: shoulder.y + 44 };
        drawTaperedLimb(ctx, shoulder.x, shoulder.y + 4, hand.x, hand.y, 5, 4, bodyMid);
        drawDumbbell(ctx, hand.x, hand.y, 0, accentHex);
        drawJointNode(ctx, hip.x, hip.y, 4, accentHex);
        drawJointNode(ctx, frontKnee.x, frontKnee.y, 4, accentHex);
      } else if (animType === 'leg_ext') {
        // Seated facing RIGHT: p=0 is extended horizontal (0 rad), p=1 is bent down (PI/2 rad)
        ctx.strokeStyle = equipDark;
        ctx.lineWidth = 10;
        ctx.beginPath(); ctx.moveTo(64, 58); ctx.lineTo(72, 134); ctx.lineTo(144, 134); ctx.stroke();

        const hip = { x: 84, y: 124 };
        const knee = { x: 142, y: 124 };
        const shoulder = { x: 76, y: 72 };
        const ang = p * 1.48; // 0 = straight horizontal extension, 1.48 rad = bent down
        const ankle = { x: knee.x + Math.cos(ang) * 48, y: knee.y + Math.sin(ang) * 48 };

        drawTaperedLimb(ctx, hip.x, hip.y, shoulder.x, shoulder.y, 9.5, 8.5, bodyLight);
        drawHead(ctx, shoulder.x, shoulder.y - 18, 9.5);
        drawTaperedLimb(ctx, hip.x, hip.y, knee.x, knee.y, 9.5, 7.5, accentHex, true);
        drawTaperedLimb(ctx, knee.x, knee.y, ankle.x, ankle.y, 7, 5, bodyLight);
        // Foot & roller pad
        drawTaperedLimb(ctx, ankle.x, ankle.y, ankle.x + Math.sin(ang) * 14, ankle.y - Math.cos(ang) * 14, 4, 3, bodyLight);
        ctx.fillStyle = accentHex;
        ctx.beginPath(); ctx.arc(ankle.x + Math.cos(ang - 0.5) * 6, ankle.y + Math.sin(ang - 0.5) * 6, 6.5, 0, Math.PI * 2); ctx.fill();
        drawJointNode(ctx, knee.x, knee.y, 4.5, accentHex);
      } else if (animType === 'leg_curl') {
        // Lying prone facing LEFT: p=0 is curled up toward glutes, p=1 is extended straight
        ctx.fillStyle = equipDark;
        ctx.beginPath(); ctx.roundRect(42, 128, 136, 12, 6); ctx.fill();
        ctx.fillRect(62, 140, 8, floorY - 140);
        ctx.fillRect(150, 140, 8, floorY - 140);

        const shoulder = { x: 66, y: 114 };
        const hip = { x: 114, y: 118 };
        const knee = { x: 162, y: 120 };
        const ang = -1.68 * (1 - p); // -1.68 rad = curled up, 0 = straight horizontal
        const ankle = { x: knee.x + Math.cos(ang) * 46, y: knee.y + Math.sin(ang) * 46 };

        drawHead(ctx, 46, 108, 9);
        drawTaperedLimb(ctx, shoulder.x, shoulder.y, hip.x, hip.y, 8.5, 9, bodyLight);
        drawTaperedLimb(ctx, hip.x, hip.y, knee.x, knee.y, 9, 7, accentHex, true);
        drawTaperedLimb(ctx, knee.x, knee.y, ankle.x, ankle.y, 6.5, 5, bodyLight);
        ctx.fillStyle = accentHex;
        ctx.beginPath(); ctx.arc(ankle.x + 3, ankle.y - 5, 6.5, 0, Math.PI * 2); ctx.fill();
        drawJointNode(ctx, knee.x, knee.y, 4.5, accentHex);
      } else if (animType === 'hinge') {
        // Romanian Deadlift: hips push backward (-X) while knees stay softly bent (~15 deg)
        const ankle = { x: 124, y: floorY - 6 };
        drawTaperedLimb(ctx, ankle.x - 5, floorY - 3, ankle.x + 18, floorY - 3, 4, 3, bodyLight);

        const knee = { x: ankle.x + 5 + p * 4, y: ankle.y - 45 };
        const hip = { x: 120 - p * 28, y: 110 + p * 8 };
        const torsoAngle = -Math.PI / 2 + p * 1.32;
        const shoulder = { x: hip.x + Math.cos(torsoAngle) * 56, y: hip.y + Math.sin(torsoAngle) * 56 };
        // Barbell tracks vertically straight down close to shins/thighs
        const bar = { x: shoulder.x + 2, y: shoulder.y + 52 };

        drawTaperedLimb(ctx, ankle.x, ankle.y, knee.x, knee.y, 5.5, 7, bodyMid);
        drawTaperedLimb(ctx, hip.x, hip.y, knee.x, knee.y, 9.5, 7, accentHex, true);
        drawTaperedLimb(ctx, hip.x, hip.y, shoulder.x, shoulder.y, 9.5, 8.5, bodyLight);
        drawHead(ctx, shoulder.x + Math.cos(torsoAngle) * 18, shoulder.y + Math.sin(torsoAngle) * 18, 9.5);
        drawTaperedLimb(ctx, shoulder.x, shoulder.y + 3, bar.x, bar.y, 5, 4, bodyMid);
        drawBarbellPlate(ctx, bar.x, bar.y, 13, accentHex);
        drawJointNode(ctx, hip.x, hip.y, 4.5, accentHex);
        drawJointNode(ctx, knee.x, knee.y, 3.5, accentHex);
      } else if (animType === 'thrust') {
        // Hip Thrust: upper back pivots on bench edge (shoulder fulcrum), shins vertical at lockout
        ctx.fillStyle = equipDark;
        ctx.beginPath(); ctx.roundRect(28, 114, 46, floorY - 114, 8); ctx.fill();

        const ankle = { x: 184, y: floorY - 6 };
        drawTaperedLimb(ctx, ankle.x - 5, floorY - 3, ankle.x + 18, floorY - 3, 4, 3, bodyLight);
        const knee = { x: 184 - p * 4, y: 124 + p * 4 };
        // Upper back pivots cleanly at bench edge
        const pivot = { x: 74, y: 118 };
        const hip = { x: 128 - p * 8, y: 120 + p * 40 };
        const torsoAngle = Math.atan2(pivot.y - hip.y, pivot.x - hip.x);
        const headPos = { x: pivot.x + Math.cos(torsoAngle) * 16, y: pivot.y + Math.sin(torsoAngle) * 16 - 6 };

        drawTaperedLimb(ctx, ankle.x, ankle.y, knee.x, knee.y, 5.5, 7, bodyMid);
        drawTaperedLimb(ctx, hip.x, hip.y, knee.x, knee.y, 9.5, 7, accentHex, true);
        drawTaperedLimb(ctx, pivot.x, pivot.y, hip.x, hip.y, 8.5, 9.5, bodyLight);
        drawHead(ctx, headPos.x, headPos.y, 9);
        drawBarbellPlate(ctx, hip.x, hip.y - 10, 13, accentHex);
        drawJointNode(ctx, hip.x, hip.y, 4.5, accentHex);
        drawJointNode(ctx, knee.x, knee.y, 4, accentHex);
      } else if (animType === 'abduction') {
        ctx.fillStyle = equipDark;
        ctx.beginPath(); ctx.roundRect(86, 126, 84, 14, 7); ctx.fill();
        ctx.fillRect(122, 140, 12, floorY - 140);

        drawHead(ctx, 128, 46, 10);
        drawTaperedLimb(ctx, 128, 124, 128, 66, 12, 14, bodyLight);
        const spread = 16 + (1 - p) * 38;
        const lKnee = { x: 116 - spread, y: 126 };
        const rKnee = { x: 140 + spread, y: 126 };
        drawTaperedLimb(ctx, 118, 124, lKnee.x, lKnee.y, 8, 6.5, accentHex, true);
        drawTaperedLimb(ctx, 138, 124, rKnee.x, rKnee.y, 8, 6.5, accentHex, true);
        drawTaperedLimb(ctx, lKnee.x, lKnee.y, lKnee.x - 4, floorY - 6, 6, 4.5, bodyMid);
        drawTaperedLimb(ctx, rKnee.x, rKnee.y, rKnee.x + 4, floorY - 6, 6, 4.5, bodyMid);
        drawJointNode(ctx, lKnee.x, lKnee.y, 3.5, accentHex);
        drawJointNode(ctx, rKnee.x, rKnee.y, 3.5, accentHex);
      } else if (animType === 'kickback') {
        const standAnkle = { x: 138, y: floorY - 6 };
        drawTaperedLimb(ctx, standAnkle.x - 4, floorY - 3, standAnkle.x + 16, floorY - 3, 4, 3, bodyLight);
        const hip = { x: 136, y: 108 };
        const shoulder = { x: 164, y: 66 };
        const kickAngle = (Math.PI / 2) + (1 - p) * 0.85;
        const kickFoot = { x: hip.x + Math.cos(kickAngle) * 76, y: hip.y + Math.sin(kickAngle) * 76 };

        drawTaperedLimb(ctx, standAnkle.x, standAnkle.y, hip.x, hip.y, 6, 8.5, bodyMid);
        drawTaperedLimb(ctx, hip.x, hip.y, kickFoot.x, kickFoot.y, 9, 5, accentHex, true);
        drawTaperedLimb(ctx, hip.x, hip.y, shoulder.x, shoulder.y, 9, 8, bodyLight);
        drawHead(ctx, shoulder.x + 12, shoulder.y - 12, 9);
        ctx.strokeStyle = '#52525B';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(32, floorY - 12); ctx.lineTo(kickFoot.x, kickFoot.y); ctx.stroke();
        drawJointNode(ctx, hip.x, hip.y, 4, accentHex);
      } else if (animType === 'calf') {
        ctx.fillStyle = equipDark;
        ctx.fillRect(102, floorY - 16, 48, 16);
        const heelLift = (1 - p) * 18;
        const toe = { x: 136, y: floorY - 18 };
        const ankle = { x: 120, y: floorY - 20 - heelLift };
        const knee = { x: 122, y: ankle.y - 44 };
        const hip = { x: 120, y: knee.y - 44 };
        const shoulder = { x: 122, y: hip.y - 48 };

        drawTaperedLimb(ctx, ankle.x, ankle.y, toe.x, toe.y, 4.5, 3.5, bodyLight);
        drawTaperedLimb(ctx, ankle.x, ankle.y, knee.x, knee.y, 5, 8, accentHex, true);
        drawTaperedLimb(ctx, knee.x, knee.y, hip.x, hip.y, 7.5, 9, bodyMid);
        drawTaperedLimb(ctx, hip.x, hip.y, shoulder.x, shoulder.y, 9, 8.5, bodyLight);
        drawHead(ctx, shoulder.x + 2, shoulder.y - 17, 9);
        drawJointNode(ctx, ankle.x, ankle.y, 3.5, accentHex);
      } else if (animType === 'press' || animType === 'incline_press') {
        const isIncline = animType === 'incline_press';
        ctx.strokeStyle = equipDark;
        ctx.lineWidth = 10;
        ctx.beginPath();
        if (isIncline) {
          ctx.moveTo(52, 96); ctx.lineTo(118, 146); ctx.lineTo(164, 146);
        } else {
          ctx.moveTo(44, 146); ctx.lineTo(168, 146);
        }
        ctx.stroke();

        const hip = { x: 122, y: 136 };
        const shoulder = isIncline ? { x: 74, y: 102 } : { x: 72, y: 136 };
        const headPos = isIncline ? { x: 58, y: 88 } : { x: 50, y: 132 };
        drawHead(ctx, headPos.x, headPos.y, 9);
        drawTaperedLimb(ctx, hip.x, hip.y, shoulder.x, shoulder.y, 9, 9.5, bodyLight);
        drawTaperedLimb(ctx, hip.x, hip.y, 162, 138, 8, 6.5, bodyMid);
        drawTaperedLimb(ctx, 162, 138, 168, floorY - 4, 6, 4.5, bodyMid);

        const barPos = isIncline
          ? { x: shoulder.x + 24 - p * 10, y: shoulder.y - 46 + p * 30 }
          : { x: shoulder.x + 12, y: shoulder.y - 52 + p * 36 };
        // Elbow tucks toward hip (+X/+Y), never flares backward toward head
        const elbow = solveTwoBoneIK(shoulder.x, shoulder.y, barPos.x, barPos.y, 26, 26, 1);

        drawTaperedLimb(ctx, shoulder.x, shoulder.y, elbow.x, elbow.y, 6, 5, accentHex, true);
        drawTaperedLimb(ctx, elbow.x, elbow.y, barPos.x, barPos.y, 5, 4.5, bodyLight);
        drawBarbellPlate(ctx, barPos.x, barPos.y, 12, accentHex);
        drawJointNode(ctx, elbow.x, elbow.y, 3.5, accentHex);
      } else if (animType === 'fly') {
        ctx.fillStyle = equipDark;
        ctx.beginPath(); ctx.roundRect(114, 72, 28, 88, 8); ctx.fill();
        drawHead(ctx, 128, 54, 10);
        drawTaperedLimb(ctx, 128, 148, 128, 78, 12, 15, bodyLight);

        const openAng = (1 - p) * 0.22 + p * 1.15;
        const lHand = { x: 108 - Math.sin(openAng) * 52, y: 88 + Math.cos(openAng) * 14 };
        const rHand = { x: 148 + Math.sin(openAng) * 52, y: 88 + Math.cos(openAng) * 14 };
        drawTaperedLimb(ctx, 112, 86, lHand.x, lHand.y, 6.5, 4.5, accentHex, true);
        drawTaperedLimb(ctx, 144, 86, rHand.x, rHand.y, 6.5, 4.5, accentHex, true);
        drawDumbbell(ctx, lHand.x, lHand.y, Math.PI / 2, accentHex);
        drawDumbbell(ctx, rHand.x, rHand.y, Math.PI / 2, accentHex);
      } else if (animType === 'ohp') {
        // Side-profile facing RIGHT: elbow drops forward (+X) & down under the bar (bendDir = 1)
        const hip = { x: 122, y: 122 };
        const shoulder = { x: 122, y: 68 };
        drawTaperedLimb(ctx, 122, floorY - 4, hip.x, hip.y, 6, 8.5, bodyMid);
        drawTaperedLimb(ctx, hip.x, hip.y, shoulder.x, shoulder.y, 9, 9.5, bodyLight);
        drawHead(ctx, 120, 48, 9.5);

        const barY = 24 + p * 42;
        const hand = { x: 128 + p * 6, y: barY };
        const elbow = solveTwoBoneIK(shoulder.x, shoulder.y, hand.x, hand.y, 25, 25, 1);
        drawTaperedLimb(ctx, shoulder.x, shoulder.y, elbow.x, elbow.y, 6, 5, accentHex, true);
        drawTaperedLimb(ctx, elbow.x, elbow.y, hand.x, hand.y, 5, 4.5, bodyLight);
        drawBarbellPlate(ctx, hand.x, hand.y, 12, accentHex);
        drawJointNode(ctx, elbow.x, elbow.y, 3.5, accentHex);
      } else if (animType === 'lateral') {
        drawHead(ctx, 128, 44, 10);
        drawTaperedLimb(ctx, 128, 126, 128, 66, 11, 14, bodyLight);
        drawTaperedLimb(ctx, 120, 126, 116, floorY - 4, 6, 4.5, bodyMid);
        drawTaperedLimb(ctx, 136, 126, 140, floorY - 4, 6, 4.5, bodyMid);

        const raiseAng = (1 - p) * 1.42;
        const lHand = { x: 110 - Math.sin(raiseAng) * 48, y: 70 + Math.cos(raiseAng) * 48 };
        const rHand = { x: 146 + Math.sin(raiseAng) * 48, y: 70 + Math.cos(raiseAng) * 48 };
        drawTaperedLimb(ctx, 112, 70, lHand.x, lHand.y, 6.5, 4.5, accentHex, true);
        drawTaperedLimb(ctx, 144, 70, rHand.x, rHand.y, 6.5, 4.5, accentHex, true);
        drawDumbbell(ctx, lHand.x, lHand.y, 0, accentHex);
        drawDumbbell(ctx, rHand.x, rHand.y, 0, accentHex);
      } else if (animType === 'pull') {
        // Front-view Lat Pulldown: elbows pull DOWN & IN toward ribs (lElbow bendDir = -1, rElbow bendDir = 1)
        ctx.fillStyle = equipDark;
        ctx.beginPath(); ctx.roundRect(96, 146, 64, 12, 6); ctx.fill();
        const barY = 26 + (1 - p) * 48;
        ctx.strokeStyle = '#52525B';
        ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(128, 8); ctx.lineTo(128, barY); ctx.stroke();

        drawHead(ctx, 128, 62, 9.5);
        drawTaperedLimb(ctx, 128, 144, 128, 82, 11, 14, bodyLight);
        drawTaperedLimb(ctx, 118, 144, 96, floorY - 4, 6, 4.5, bodyMid);
        drawTaperedLimb(ctx, 138, 144, 160, floorY - 4, 6, 4.5, bodyMid);

        const lHand = { x: 82, y: barY };
        const rHand = { x: 174, y: barY };
        const lElbow = solveTwoBoneIK(112, 84, lHand.x, lHand.y, 26, 26, -1);
        const rElbow = solveTwoBoneIK(144, 84, rHand.x, rHand.y, 26, 26, 1);

        drawTaperedLimb(ctx, 112, 84, lElbow.x, lElbow.y, 6.5, 5, accentHex, true);
        drawTaperedLimb(ctx, 144, 84, rElbow.x, rElbow.y, 6.5, 5, accentHex, true);
        drawTaperedLimb(ctx, lElbow.x, lElbow.y, lHand.x, lHand.y, 5, 4, bodyLight);
        drawTaperedLimb(ctx, rElbow.x, rElbow.y, rHand.x, rHand.y, 5, 4, bodyLight);
        ctx.strokeStyle = accentHex;
        ctx.lineWidth = 5;
        ctx.beginPath(); ctx.moveTo(74, barY); ctx.lineTo(182, barY); ctx.stroke();
        drawJointNode(ctx, lElbow.x, lElbow.y, 3.5, accentHex);
        drawJointNode(ctx, rElbow.x, rElbow.y, 3.5, accentHex);
      } else if (animType === 'row') {
        // Seated Cable Row facing RIGHT: elbow drives backward (-X) past torso (bendDir = 1)
        const hip = { x: 96, y: 152 };
        const shoulder = { x: 92, y: 96 };
        drawTaperedLimb(ctx, hip.x, hip.y, 148, 152, 8, 6.5, bodyMid);
        drawTaperedLimb(ctx, 148, 152, 186, 136, 6, 4.5, bodyMid);
        drawTaperedLimb(ctx, hip.x, hip.y, shoulder.x, shoulder.y, 9.5, 9, bodyLight);
        drawHead(ctx, 90, 76, 9.5);

        const handX = 148 - (1 - p) * 44;
        const hand = { x: handX, y: 118 };
        ctx.strokeStyle = '#52525B';
        ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(hand.x, hand.y); ctx.lineTo(228, 118); ctx.stroke();

        const elbow = solveTwoBoneIK(shoulder.x, shoulder.y, hand.x, hand.y, 28, 28, 1);
        drawTaperedLimb(ctx, shoulder.x, shoulder.y, elbow.x, elbow.y, 6.5, 5, accentHex, true);
        drawTaperedLimb(ctx, elbow.x, elbow.y, hand.x, hand.y, 5, 4.5, bodyLight);
        drawJointNode(ctx, elbow.x, elbow.y, 3.5, accentHex);
      } else if (animType === 'curl') {
        const hip = { x: 112, y: 126 };
        const shoulder = { x: 112, y: 68 };
        const elbow = { x: 114, y: 106 };
        drawTaperedLimb(ctx, 112, floorY - 4, hip.x, hip.y, 6, 8.5, bodyMid);
        drawTaperedLimb(ctx, hip.x, hip.y, shoulder.x, shoulder.y, 9, 9.5, bodyLight);
        drawHead(ctx, 112, 48, 9.5);
        drawTaperedLimb(ctx, shoulder.x, shoulder.y, elbow.x, elbow.y, 6.5, 5.5, bodyMid);

        // Forearm curls upward from hanging (+1.45 rad) to flexed (-0.95 rad)
        const curlAng = 1.45 - (1 - p) * 2.4;
        const hand = { x: elbow.x + Math.cos(curlAng) * 34, y: elbow.y + Math.sin(curlAng) * 34 };
        drawTaperedLimb(ctx, elbow.x, elbow.y, hand.x, hand.y, 5.5, 4.5, accentHex, true);
        drawDumbbell(ctx, hand.x, hand.y, curlAng + Math.PI / 2, accentHex);
        drawJointNode(ctx, elbow.x, elbow.y, 3.5, accentHex);
      } else if (animType === 'tricep') {
        ctx.strokeStyle = '#52525B';
        ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(156, 12); ctx.lineTo(156, 112); ctx.stroke();

        const hip = { x: 108, y: 126 };
        const shoulder = { x: 110, y: 68 };
        const elbow = { x: 114, y: 104 };
        drawTaperedLimb(ctx, 108, floorY - 4, hip.x, hip.y, 6, 8.5, bodyMid);
        drawTaperedLimb(ctx, hip.x, hip.y, shoulder.x, shoulder.y, 9, 9.5, bodyLight);
        drawHead(ctx, 112, 48, 9.5);
        drawTaperedLimb(ctx, shoulder.x, shoulder.y, elbow.x, elbow.y, 6.5, 5.5, bodyMid);

        // Forearm presses down from horizontal (-0.1 rad) to vertical lock (+1.48 rad)
        const extAng = -0.1 + (1 - p) * 1.58;
        const hand = { x: elbow.x + Math.cos(extAng) * 34, y: elbow.y + Math.sin(extAng) * 34 };
        drawTaperedLimb(ctx, elbow.x, elbow.y, hand.x, hand.y, 5.5, 4.5, accentHex, true);
        ctx.fillStyle = accentHex;
        ctx.beginPath(); ctx.arc(hand.x, hand.y, 6, 0, Math.PI * 2); ctx.fill();
        drawJointNode(ctx, elbow.x, elbow.y, 3.5, accentHex);
      } else if (animType === 'core') {
        const hip = { x: 132, y: floorY - 8 };
        const knee = { x: 172, y: floorY - 44 };
        const foot = { x: 204, y: floorY - 6 };
        drawTaperedLimb(ctx, hip.x, hip.y, knee.x, knee.y, 8.5, 6.5, bodyMid);
        drawTaperedLimb(ctx, knee.x, knee.y, foot.x, foot.y, 6, 4.5, bodyMid);

        const curlAng = -Math.PI + (1 - p) * 0.72;
        const shoulder = { x: hip.x + Math.cos(curlAng) * 58, y: hip.y + Math.sin(curlAng) * 58 };
        drawTaperedLimb(ctx, hip.x, hip.y, shoulder.x, shoulder.y, 9, 8.5, accentHex, true);
        drawHead(ctx, shoulder.x + Math.cos(curlAng) * 18, shoulder.y + Math.sin(curlAng) * 18, 9);
      } else {
        // StairMaster / Cardio: knees bend forward (+X, bendDir = 1)
        ctx.strokeStyle = equipDark;
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(46, floorY - 6); ctx.lineTo(94, floorY - 6);
        ctx.lineTo(94, floorY - 34); ctx.lineTo(142, floorY - 34);
        ctx.lineTo(142, floorY - 62); ctx.lineTo(192, floorY - 62);
        ctx.stroke();

        const stepWave = Math.sin(raw * Math.PI * 2);
        const hip = { x: 124, y: 98 - Math.abs(stepWave) * 5 };
        const shoulder = { x: 130, y: 48 - Math.abs(stepWave) * 5 };
        drawTaperedLimb(ctx, hip.x, hip.y, shoulder.x, shoulder.y, 9, 8.5, bodyLight);
        drawHead(ctx, shoulder.x + 3, shoulder.y - 17, 9);

        const lFoot = { x: 86 + Math.max(0, stepWave) * 28, y: floorY - 12 - Math.max(0, stepWave) * 24 };
        const rFoot = { x: 154 - Math.max(0, -stepWave) * 28, y: floorY - 40 - Math.max(0, -stepWave) * 22 };
        const lKnee = solveTwoBoneIK(hip.x, hip.y, lFoot.x, lFoot.y, 34, 34, 1);
        const rKnee = solveTwoBoneIK(hip.x, hip.y, rFoot.x, rFoot.y, 34, 34, 1);

        drawTaperedLimb(ctx, hip.x, hip.y, lKnee.x, lKnee.y, 7.5, 5.5, bodyMid);
        drawTaperedLimb(ctx, lKnee.x, lKnee.y, lFoot.x, lFoot.y, 5.5, 4, bodyMid);
        drawTaperedLimb(ctx, hip.x, hip.y, rKnee.x, rKnee.y, 8, 6, accentHex, true);
        drawTaperedLimb(ctx, rKnee.x, rKnee.y, rFoot.x, rFoot.y, 6, 4.5, accentHex);
      }

      // Live Tempo Phase Badge (Top-Left of Canvas)
      ctx.save();
      ctx.fillStyle = 'rgba(20, 20, 24, 0.85)';
      ctx.beginPath(); ctx.roundRect(10, 10, 56, 18, 6); ctx.fill();
      ctx.fillStyle = phase === 'DRIVE' ? accentHex : '#A1A1AA';
      ctx.font = '800 9px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(animType === 'cardio' ? 'STEADY' : phase, 38, 22);
      ctx.restore();
    }

    function startBioAnimationLoop() {
      if (bioAnimRafId) return;
      function tick(nowMs) {
        const canvases = document.querySelectorAll('canvas[data-bio-anim]');
        if (canvases.length > 0) {
          const accentHex = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#3B82F6';
          const tSec = nowMs / 1000;
          canvases.forEach(canvas => {
            const animType = canvas.getAttribute('data-bio-anim') || 'squat';
            const ctx = canvas.getContext('2d');
            if (ctx) {
              renderBioCanvasFrame(ctx, canvas.width, canvas.height, animType, tSec, accentHex);
            }
          });
        }
        bioAnimRafId = requestAnimationFrame(tick);
      }
      bioAnimRafId = requestAnimationFrame(tick);
    }

    /* ==========================================================================
       2. SUPABASE & INDEXEDDB STORAGE HELPERS
       ========================================================================== */
    function getSupabaseConfig() {
      try {
        const saved = JSON.parse(localStorage.getItem(SUPABASE_CONFIG_KEY) || 'null');
        if (saved && saved.url && saved.anonKey) {
          return { url: saved.url.trim().replace(/\/rest\/v1\/?$/, ''), anonKey: saved.anonKey.trim() };
        }
      } catch (_) {}
      if (DEFAULT_SUPABASE_URL && DEFAULT_SUPABASE_ANON_KEY) {
        return { url: DEFAULT_SUPABASE_URL.trim().replace(/\/rest\/v1\/?$/, ''), anonKey: DEFAULT_SUPABASE_ANON_KEY.trim() };
      }
      return null;
    }

    function initSupabase() {
      const cfg = getSupabaseConfig();
      if (!cfg || !window.supabase || !window.supabase.createClient) {
        supabaseClient = null;
        return;
      }
      try {
        supabaseClient = window.supabase.createClient(cfg.url, cfg.anonKey);
      } catch (_) {
        supabaseClient = null;
      }
    }

    function openVaultIDB() {
      return new Promise((resolve) => {
        if (!window.indexedDB) return resolve(null);
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
      });
    }

    async function readFromIDB(key) {
      const db = await openVaultIDB();
      if (!db) return null;
      return new Promise((resolve) => {
        try {
          const tx = db.transaction(IDB_STORE, 'readonly');
          const req = tx.objectStore(IDB_STORE).get(key);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        } catch (_) {
          resolve(null);
        }
      });
    }

    function writeToIDB(key, value) {
      idbWriteQueue = idbWriteQueue.then(async () => {
        const db = await openVaultIDB();
        if (!db) return;
        return new Promise((resolve) => {
          try {
            const tx = db.transaction(IDB_STORE, 'readwrite');
            tx.objectStore(IDB_STORE).put(value, key);
            tx.oncomplete = () => resolve();
            tx.onerror = () => resolve();
          } catch (_) {
            resolve();
          }
        });
      });
      return idbWriteQueue;
    }

    async function pushStateToSupabase(username, stateObj, passHash) {
      if (!supabaseClient || !username) return false;
      try {
        const payload = {
          username,
          state_json: stateObj,
          updated_at: new Date().toISOString()
        };
        if (passHash) payload.pass_hash = passHash;
        const { error } = await supabaseClient
          .from('cadence_profiles')
          .upsert(payload, { onConflict: 'username' });
        if (error) {
          lastCloudSyncError = error.message || 'Cloud sync rejected';
          return false;
        }
        lastCloudSyncError = '';
        lastCloudSyncAt = Date.now();
        return true;
      } catch (e) {
        lastCloudSyncError = e?.message || 'Network unavailable';
        return false;
      }
    }

    async function pullStateFromSupabase(username) {
      if (!supabaseClient || !username) return null;
      try {
        const { data, error } = await supabaseClient
          .from('cadence_profiles')
          .select('username, pass_hash, state_json')
          .eq('username', username)
          .maybeSingle();
        if (error || !data || !data.state_json) return null;
        const st = data.state_json;
        if (data.pass_hash) st._passHash = data.pass_hash;
        return st;
      } catch (_) {
        return null;
      }
    }

    function normalizeLoadedState(raw) {
      const clean = {
        accent: (raw && THEME_PRESETS[raw.accent]) ? raw.accent : 'blue',
        firstName: (raw && raw.firstName) || '',
        lastName: (raw && raw.lastName) || '',
        gender: (raw && raw.gender === 'male') ? 'male' : 'female',
        weeklyGoal: (raw && Number(raw.weeklyGoal) >= 1 && Number(raw.weeklyGoal) <= 7) ? Number(raw.weeklyGoal) : 3,
        measurementUnit: (raw && raw.measurementUnit === 'imperial') ? 'imperial' : 'metric',
        profilePhoto: (raw && raw.profilePhoto) || '',
        bioStats: {
          age: (raw && raw.bioStats && Number(raw.bioStats.age)) || 25,
          heightCm: (raw && raw.bioStats && Number(raw.bioStats.heightCm)) || 168,
          weightKg: (raw && raw.bioStats && Number(raw.bioStats.weightKg)) || 62,
          activityMultiplier: (raw && raw.bioStats && Number(raw.bioStats.activityMultiplier)) || 1.55,
          goalMode: (raw && raw.bioStats && raw.bioStats.goalMode) || 'maintain'
        },
        calorieLogs: (raw && raw.calorieLogs && typeof raw.calorieLogs === 'object') ? raw.calorieLogs : {},
        favoriteFoods: (raw && Array.isArray(raw.favoriteFoods)) ? raw.favoriteFoods : [],
        aiCalorieUsage: (raw && raw.aiCalorieUsage && typeof raw.aiCalorieUsage === 'object')
          ? { date: String(raw.aiCalorieUsage.date || ''), count: Number(raw.aiCalorieUsage.count) || 0 }
          : { date: '', count: 0 },
        workouts: (raw && raw.workouts && typeof raw.workouts === 'object') ? raw.workouts : {},
        measurements: (raw && Array.isArray(raw.measurements)) ? raw.measurements : [],
        customExercises: (raw && Array.isArray(raw.customExercises)) ? raw.customExercises : [],
        templates: (raw && Array.isArray(raw.templates) && raw.templates.length > 0)
          ? raw.templates
          : JSON.parse(JSON.stringify(DEFAULT_TEMPLATES)),
        _passHash: (raw && raw._passHash) || '',
        _displayName: (raw && raw._displayName) || '',
        _updatedAt: (raw && Number(raw._updatedAt)) || 0
      };
      return clean;
    }

    async function saveState(forceCloud = false) {
      appState._updatedAt = Date.now();
      const snapshot = JSON.parse(JSON.stringify(appState));

      if (accountSession && accountSession.username) {
        const userKey = `${ACCOUNT_VAULT_PREFIX}${accountSession.username}`;
        snapshot._passHash = accountSession.passHash || snapshot._passHash || '';
        snapshot._displayName = getDisplayFirstName();
        try {
          localStorage.setItem(userKey, JSON.stringify(snapshot));
          localStorage.setItem(`${userKey}_backup`, JSON.stringify(snapshot));
        } catch (_) {}
        await writeToIDB(userKey, snapshot);
        if (supabaseClient) {
          await pushStateToSupabase(accountSession.username, snapshot, snapshot._passHash);
        }
      } else {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot));
          localStorage.setItem(BACKUP_STORAGE_KEY, JSON.stringify(snapshot));
        } catch (_) {}
        await writeToIDB(IDB_KEY, snapshot);
      }
    }

    async function hydrateStateFromVault() {
      initSupabase();

      try {
        const params = new URLSearchParams(window.location.search);
        const urlUser = (params.get('u') || '').toLowerCase().trim();
        const urlHash = (params.get('h') || '').trim();
        if (urlUser && urlHash) {
          const existing = JSON.parse(localStorage.getItem(ACCOUNT_SESSION_KEY) || 'null');
          if (!existing || existing.username !== urlUser) {
            localStorage.removeItem(GUEST_MODE_KEY);
            localStorage.setItem(ACCOUNT_SESSION_KEY, JSON.stringify({
              username: urlUser,
              passHash: urlHash,
              expiresAt: Date.now() + SIXTY_DAYS_MS
            }));
          }
          window.history.replaceState({}, '', window.location.pathname);
        }
      } catch (_) {}

      try {
        const rawSess = JSON.parse(localStorage.getItem(ACCOUNT_SESSION_KEY) || 'null');
        if (rawSess && rawSess.username && (!rawSess.expiresAt || Date.now() < rawSess.expiresAt)) {
          accountSession = rawSess;
        } else {
          accountSession = null;
        }
      } catch (_) {
        accountSession = null;
      }

      if (accountSession && accountSession.username) {
        const userKey = `${ACCOUNT_VAULT_PREFIX}${accountSession.username}`;
        let localUser = null;
        try {
          localUser = JSON.parse(localStorage.getItem(userKey) || localStorage.getItem(`${userKey}_backup`) || 'null');
        } catch (_) {}
        const idbUser = await readFromIDB(userKey);
        if (idbUser && (!localUser || (idbUser._updatedAt || 0) > (localUser._updatedAt || 0))) {
          localUser = idbUser;
        }

        const cloudUser = await pullStateFromSupabase(accountSession.username);
        let chosen = localUser;
        if (cloudUser && (!localUser || (cloudUser._updatedAt || 0) >= (localUser._updatedAt || 0))) {
          chosen = cloudUser;
        }

        appState = normalizeLoadedState(chosen || {});
        if (!appState.firstName && accountSession.firstName) appState.firstName = accountSession.firstName;
        if (!appState.lastName && accountSession.lastName) appState.lastName = accountSession.lastName;
        if (accountSession.gender && !chosen?.gender) appState.gender = accountSession.gender;

        if (!cloudUser && supabaseClient) {
          await saveState(true);
        }
      } else {
        let localGuest = null;
        try {
          localGuest = JSON.parse(localStorage.getItem(STORAGE_KEY) || localStorage.getItem(BACKUP_STORAGE_KEY) || 'null');
        } catch (_) {}
        const idbGuest = await readFromIDB(IDB_KEY);
        if (idbGuest && (!localGuest || (idbGuest._updatedAt || 0) > (localGuest._updatedAt || 0))) {
          localGuest = idbGuest;
        }
        appState = normalizeLoadedState(localGuest || {});
      }

      applyAccentTheme(appState.accent, false);
      updateAccountHeaderUI();
      isStateHydrated = true;
    }

    /* ==========================================================================
       3. DATE, THEME, ACCOUNT HEADER & TOAST UTILITIES
       ========================================================================== */
    function getTodayStr() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function parseLocalDate(dateStr) {
      const [y, m, d] = (dateStr || getTodayStr()).split('-').map(Number);
      return new Date(y, (m || 1) - 1, d || 1);
    }

    function toDateStr(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatHumanDate(dateStr) {
      const dt = parseLocalDate(dateStr);
      return dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById('toast');
      const txt = document.getElementById('toastMessage');
      if (!el || !txt) return;
      txt.textContent = msg;
      el.classList.remove('opacity-0', '-translate-y-2');
      el.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        el.classList.add('opacity-0', '-translate-y-2');
        el.classList.remove('opacity-100', 'translate-y-0');
      }, 2400);
    }
