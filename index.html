  <script>
    (function generateImmediateCadenceIcons() {
      try {
        const THEME_MAP = {
          blue: '#3B82F6',
          pink: '#FF4D94',
          lime: '#C6FF00',
          coral: '#FF5E3A',
          violet: '#A855F7',
          cyan: '#22D3EE'
        };
        let hex = THEME_MAP.blue;
        try {
          const saved = JSON.parse(localStorage.getItem('cadence_workout_tracker_v1') || 'null');
          if (saved && saved.accent && THEME_MAP[saved.accent]) hex = THEME_MAP[saved.accent];
        } catch (_) {}

        function buildIconDataUrl(size) {
          const canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#0A0A0C';
          ctx.fillRect(0, 0, size, size);

          const pad = Math.round(size * 0.21);
          const gap = Math.round(size * 0.08);
          const sq = Math.round((size - pad * 2 - gap) / 2);
          const r = Math.round(sq * 0.24);

          function drawSq(x, y, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + sq - r, y);
            ctx.quadraticCurveTo(x + sq, y, x + sq, y + r);
            ctx.lineTo(x + sq, y + sq - r);
            ctx.quadraticCurveTo(x + sq, y + sq, x + sq - r, y + sq);
            ctx.lineTo(x + r, y + sq);
            ctx.quadraticCurveTo(x, y + sq, x, y + sq - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
            ctx.fill();
          }

          drawSq(pad, pad, hex);
          drawSq(pad + sq + gap, pad, '#27272E');
          drawSq(pad, pad + sq + gap, '#27272E');
          drawSq(pad + sq + gap, pad + sq + gap, hex);
          return canvas.toDataURL('image/png');
        }

        const icon180 = buildIconDataUrl(180);
        const icon512 = buildIconDataUrl(512);
        document.getElementById('appleTouchIcon').href = icon180;
        document.getElementById('appleTouchIcon512').href = icon512;
        document.getElementById('faviconIcon').href = icon180;

        const manifestObj = {
          name: 'CADENCE — 365-Day Workout Tracker',
          short_name: 'CADENCE',
          start_url: './index.html',
          display: 'standalone',
          background_color: '#0A0A0C',
          theme_color: '#0A0A0C',
          icons: [
            { src: icon180, sizes: '180x180', type: 'image/png' },
            { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
          ]
        };
        const blob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
        document.getElementById('appManifest').href = URL.createObjectURL(blob);
      } catch (_) {}
    })();
  </script>

    /* ==========================================================================

    function getTodayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function parseDateStr(str) {
      const [y, m, d] = str.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    function formatDateStr(dateObj) {
      return `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')}`;
    }

    function formatHumanDate(dateStr) {
      const d = parseDateStr(dateStr);
      return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const msgEl = document.getElementById('toastMessage');
      if (!toast || !msgEl) return;
      msgEl.textContent = msg;
      toast.classList.remove('opacity-0', '-translate-y-2');
      toast.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-2');
        toast.classList.remove('opacity-100', 'translate-y-0');
      }, 2800);
    }

      return [...EXERCISE_CATALOG, ...(appState.customExercises || [])];
    }

    function getExerciseById(id) {
      return getAllExercises().find(e => e.id === id) || { id, name: id, muscle: 'General', equipment: 'Other' };
    }

    function parseCardioIntensity(val) {
      if (typeof val === 'number') return val;
      const match = String(val || '').match(/(\d+(?:\.\d+)?)/);
      return match ? parseFloat(match[1]) : 0;
    }

       ========================================================================== */
    function getSupabaseConfig() {
      try {
        const saved = JSON.parse(localStorage.getItem(SUPABASE_CONFIG_KEY) || 'null');
        if (saved && saved.url && saved.anonKey) {
          return { url: saved.url.trim().replace(/\/rest\/v1\/?$/, ''), anonKey: saved.anonKey.trim() };
        }
      } catch (_) {}
      if (DEFAULT_SUPABASE_URL && DEFAULT_SUPABASE_ANON_KEY) {
        return { url: DEFAULT_SUPABASE_URL.trim().replace(/\/rest\/v1\/?$/, ''), anonKey: DEFAULT_SUPABASE_ANON_KEY.trim() };
      }
      return null;
    }

    function initSupabaseClient() {
      const cfg = getSupabaseConfig();
      if (!cfg || !window.supabase || !window.supabase.createClient) {
        supabaseClient = null;
        return false;
      }
      try {
        supabaseClient = window.supabase.createClient(cfg.url.trim(), cfg.anonKey.trim());
        return true;
      } catch (_) {
        supabaseClient = null;
        return false;
      }
    }

    async function fetchStateFromSupabase(username) {
      if (!supabaseClient || !username) return null;
      try {
        const { data, error } = await supabaseClient
          .from('cadence_profiles')
          .select('username, pass_hash, state_json, updated_at')
          .eq('username', username)
          .maybeSingle();
        if (error) {
          lastCloudSyncError = error.message || 'Supabase read error';
          return null;
        }
        if (!data || !data.state_json) return null;
        lastCloudSyncError = '';
        const remote = data.state_json;
        if (data.pass_hash) remote._passHash = data.pass_hash;
        if (data.updated_at) remote._updatedAt = Math.max(remote._updatedAt || 0, new Date(data.updated_at).getTime());
        lastCloudSyncAt = Date.now();
        return remote;
      } catch (err) {
        lastCloudSyncError = err?.message || 'Network error';
        return null;
      }
    }

    async function pushStateToSupabase(username, payload) {
      if (!supabaseClient || !username) return false;
      try {
        const { error } = await supabaseClient
          .from('cadence_profiles')
          .upsert({
            username,
            pass_hash: payload._passHash || accountSession?.passHash || '',
            state_json: payload,
            updated_at: new Date().toISOString()
          }, { onConflict: 'username' });
        if (error) {
          lastCloudSyncError = error.message || 'Supabase write error';
          return false;
        }
        lastCloudSyncError = '';
        lastCloudSyncAt = Date.now();
        return true;
      } catch (err) {
        lastCloudSyncError = err?.message || 'Network error';
        return false;
      }
    }

    function openIDB() {
      return new Promise((resolve) => {
        if (!window.indexedDB) return resolve(null);
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
      });
    }

    async function readFromIDB(key = IDB_KEY) {
      const db = await openIDB();
      if (!db) return null;
      return new Promise((resolve) => {
        try {
          const tx = db.transaction(IDB_STORE, 'readonly');
          const req = tx.objectStore(IDB_STORE).get(key);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        } catch (_) {
          resolve(null);
        }
      });
    }

    function writeToIDB(data, key = IDB_KEY) {
      idbWriteQueue = idbWriteQueue.then(async () => {
        const db = await openIDB();
        if (!db) return;
        return new Promise((resolve) => {
          try {
            const tx = db.transaction(IDB_STORE, 'readwrite');
            tx.objectStore(IDB_STORE).put(JSON.parse(JSON.stringify(data)), key);
            tx.oncomplete = () => resolve();
            tx.onerror = () => resolve();
          } catch (_) {
            resolve();
          }
        });
      });
      return idbWriteQueue;
    }

    function getUserVaultKey(username) {
      return `${ACCOUNT_VAULT_PREFIX}${username.toLowerCase().trim()}`;
    }

    async function loadUserVault(username) {
      const key = getUserVaultKey(username);
      let lsData = null;
      try {
        lsData = JSON.parse(localStorage.getItem(key) || localStorage.getItem(`${key}_backup`) || 'null');
      } catch (_) {}
      const idbData = await readFromIDB(key);
      const localBest = (idbData && (!lsData || (idbData._updatedAt || 0) >= (lsData._updatedAt || 0)))
        ? idbData
        : lsData;

      const cloudData = await fetchStateFromSupabase(username);
      if (cloudData && (!localBest || (cloudData._updatedAt || 0) >= (localBest._updatedAt || 0))) {
        return cloudData;
      }
      return localBest || cloudData;
    }

    async function saveUserVault(username, stateObj) {
      const key = getUserVaultKey(username);
      const payload = JSON.parse(JSON.stringify(stateObj));
      try {
        const serialized = JSON.stringify(payload);
        localStorage.setItem(key, serialized);
        localStorage.setItem(`${key}_backup`, serialized);
      } catch (_) {}
      await Promise.all([
        writeToIDB(payload, key),
        pushStateToSupabase(username, payload)
      ]);
    }

    async function saveState(force = false) {
      if (!isStateHydrated && !force) return;
      appState._updatedAt = Date.now();
      if (accountSession && accountSession.username) {
        if (accountSession.passHash) appState._passHash = accountSession.passHash;
        if (accountSession.displayName) appState._displayName = accountSession.displayName;
        await saveUserVault(accountSession.username, appState);
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ accent: appState.accent }));
        } catch (_) {}
      } else {
        const guestPayload = JSON.parse(JSON.stringify(appState));
        delete guestPayload._passHash;
        delete guestPayload._displayName;
        try {
          const serialized = JSON.stringify(guestPayload);
          localStorage.setItem(STORAGE_KEY, serialized);
          localStorage.setItem(BACKUP_STORAGE_KEY, serialized);
        } catch (_) {}
        await writeToIDB(guestPayload, IDB_KEY);
      }
    }

    function mergeLoadedState(candidate) {
      if (!candidate || typeof candidate !== 'object') return;
      if (candidate.accent && THEMES[candidate.accent]) appState.accent = candidate.accent;
      if (typeof candidate.weeklyGoal === 'number' && candidate.weeklyGoal >= 1 && candidate.weeklyGoal <= 7) {
        appState.weeklyGoal = candidate.weeklyGoal;
      }
      if (typeof candidate.profilePhoto === 'string') {
        appState.profilePhoto = candidate.profilePhoto;
      }
      if (candidate.workouts && typeof candidate.workouts === 'object') appState.workouts = candidate.workouts;
      if (Array.isArray(candidate.measurements)) appState.measurements = candidate.measurements;
      if (Array.isArray(candidate.customExercises)) appState.customExercises = candidate.customExercises;
      if (Array.isArray(candidate.templates)) appState.templates = candidate.templates;
      if (candidate._updatedAt) appState._updatedAt = candidate._updatedAt;
      if (candidate._passHash) appState._passHash = candidate._passHash;
      if (candidate._displayName) appState._displayName = candidate._displayName;
    }

    async function hydrateStateFromVault() {
      initSupabaseClient();
      try {
        const savedSession = JSON.parse(localStorage.getItem(ACCOUNT_SESSION_KEY) || 'null');
        if (savedSession && savedSession.username) {
          const isExpired = savedSession.expiresAt && Date.now() >= savedSession.expiresAt;
          if (isExpired) {
            localStorage.removeItem(ACCOUNT_SESSION_KEY);
            accountSession = null;
          } else {
            if (!savedSession.expiresAt) {
              savedSession.expiresAt = Date.now() + SIXTY_DAYS_MS;
              localStorage.setItem(ACCOUNT_SESSION_KEY, JSON.stringify(savedSession));
            }
            accountSession = savedSession;
          }
        }
      } catch (_) {}

      if (accountSession && accountSession.username) {
        const userVault = await loadUserVault(accountSession.username);
        if (userVault) {
          mergeLoadedState(userVault);
        } else {
          appState = {
            accent: appState.accent || 'blue',
            weeklyGoal: 3,
            profilePhoto: '',
            workouts: {},
            measurements: [],
            customExercises: [],
            templates: JSON.parse(JSON.stringify(DEFAULT_TEMPLATES)),
            _updatedAt: Date.now(),
            _passHash: accountSession.passHash || '',
            _displayName: accountSession.displayName || accountSession.username
          };
        }
        if (accountSession.pendingMode) {
          delete accountSession.pendingMode;
          localStorage.setItem(ACCOUNT_SESSION_KEY, JSON.stringify(accountSession));
        }
        isStateHydrated = true;
        applyTheme(appState.accent, false);
        updateAccountHeaderUI();
        await saveState(true);
        return;
      }

      // Guest state
      let lsCandidate = null;
      try {
        const primary = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        const backup = JSON.parse(localStorage.getItem(BACKUP_STORAGE_KEY) || 'null');
        if (primary && backup) {
          lsCandidate = (backup._updatedAt || 0) > (primary._updatedAt || 0) ? backup : primary;
        } else {
          lsCandidate = primary || backup;
        }
      } catch (_) {}
      const idbCandidate = await readFromIDB(IDB_KEY);
      const best = (idbCandidate && (!lsCandidate || (idbCandidate._updatedAt || 0) >= (lsCandidate._updatedAt || 0)))
        ? idbCandidate
        : lsCandidate;
      if (best) mergeLoadedState(best);

      isStateHydrated = true;
      applyTheme(appState.accent, false);
      updateAccountHeaderUI();
      await saveState(true);
    }

    function updateAccountHeaderUI() {
      const label = document.getElementById('headerAccountLabel');
      const avatarBox = document.getElementById('headerAccountAvatar');
      if (!label || !avatarBox) return;

      if (accountSession && accountSession.username) {
        const uname = accountSession.username;
        label.textContent = uname.includes('@') ? uname : `@${uname}`;
        if (appState.profilePhoto) {
          avatarBox.innerHTML = `<img src="${appState.profilePhoto}" alt="Profile" class="w-full h-full object-cover" />`;
        } else {
          avatarBox.innerHTML = `<span class="w-2 h-2 rounded-full accent-bg"></span>`;
        }
      } else {
        label.textContent = 'Sign In';
        avatarBox.innerHTML = `<span class="w-2 h-2 rounded-full bg-mutedText"></span>`;
      }
    }

    /* ==========================================================================
       4. THEME & DYNAMIC APP ICON GENERATOR
       ========================================================================== */
    function updateDynamicAppIcons(hex) {
      try {
        const buildIcon = (size) => {
          const canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#0A0A0C';
          ctx.fillRect(0, 0, size, size);

          const pad = Math.round(size * 0.21);
          const gap = Math.round(size * 0.08);
          const sq = Math.round((size - pad * 2 - gap) / 2);
          const r = Math.round(sq * 0.24);

          const drawSq = (x, y, color) => {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + sq - r, y);
            ctx.quadraticCurveTo(x + sq, y, x + sq, y + r);
            ctx.lineTo(x + sq, y + sq - r);
            ctx.quadraticCurveTo(x + sq, y + sq, x + sq - r, y + sq);
            ctx.lineTo(x + r, y + sq);
            ctx.quadraticCurveTo(x, y + sq, x, y + sq - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
            ctx.fill();
          };

          drawSq(pad, pad, hex);
          drawSq(pad + sq + gap, pad, '#27272E');
          drawSq(pad, pad + sq + gap, '#27272E');
          drawSq(pad + sq + gap, pad + sq + gap, hex);
          return canvas.toDataURL('image/png');
        };

        const icon180 = buildIcon(180);
        const icon512 = buildIcon(512);
        const touchIcon = document.getElementById('appleTouchIcon');
        const touchIcon512 = document.getElementById('appleTouchIcon512');
        const favIcon = document.getElementById('faviconIcon');
        if (touchIcon) touchIcon.href = icon180;
        if (touchIcon512) touchIcon512.href = icon512;
        if (favIcon) favIcon.href = icon180;
      } catch (_) {}
    }

    function applyTheme(themeKey, persist = true) {
      const theme = THEMES[themeKey] ? themeKey : 'blue';
      appState.accent = theme;
      const t = THEMES[theme];
      document.documentElement.style.setProperty('--accent', t.hex);
      document.documentElement.style.setProperty('--accent-rgb', t.rgb);
      document.documentElement.style.setProperty('--accent-glow', t.glow);
      updateDynamicAppIcons(t.hex);
      if (persist) saveState();
      renderAll();
    }

    function openThemeModal() {

            <span class="flex items-center gap-3">

          </button>
        `;

      openModal('Theme Accent Color', `<div class="space-y-2">${items}</div>`);
    }

    /* ==========================================================================
       5. WEEKLY GOAL STREAK & WORKOUT METRICS
       ========================================================================== */
    function getWorkoutStats(workout) {
      if (!workout) return { volume: 0, cardioMins: 0, setCount: 0, intensityLevel: 0 };
      if (workout.quickCheckIn && (!workout.exercises || workout.exercises.length === 0)) {
        return { volume: 0, cardioMins: 0, setCount: 1, intensityLevel: 2 };
      }

      let volume = 0;
      let cardioMins = 0;
      let setCount = 0;

      (workout.exercises || []).forEach(ex => {
        const meta = getExerciseById(ex.exerciseId);
        (ex.sets || []).forEach(s => {
          const w = parseFloat(s.weight) || 0;
          const r = parseInt(s.reps, 10) || 0;
          if (meta.isCardio) {
            if (w > 0 || String(s.reps || '').trim()) {
              cardioMins += w;
              setCount += 1;
            }
          } else if (w > 0 || r > 0) {
            volume += (w > 0 ? w : 1) * (r > 0 ? r : 1);
            setCount += 1;
          }
        });
      });

      let intensityLevel = 1;
      if (volume >= 8000 || cardioMins >= 45 || setCount >= 16) intensityLevel = 4;
      else if (volume >= 4000 || cardioMins >= 25 || setCount >= 10) intensityLevel = 3;
      else if (volume > 0 || cardioMins > 0 || setCount >= 4) intensityLevel = 2;

      return { volume: Math.round(volume), cardioMins: Math.round(cardioMins), setCount, intensityLevel };
    }

    function calculateWeeklyStreak() {
      const goal = Math.max(1, Math.min(7, Number(appState.weeklyGoal) || 3));
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const getMondayOfWeek = (d) => {
        const copy = new Date(d);
        const day = copy.getDay();
        const diff = day === 0 ? -6 : 1 - day;
        copy.setDate(copy.getDate() + diff);
        copy.setHours(0, 0, 0, 0);
        return copy;
      };

      const countDaysInWeek = (mondayDate) => {
        let count = 0;
        for (let i = 0; i < 7; i++) {
          const d = new Date(mondayDate);
          d.setDate(mondayDate.getDate() + i);
          if (appState.workouts[formatDateStr(d)]) count++;
        }
        return count;
      };

      let cursorMonday = getMondayOfWeek(today);
      let streakWeeks = 0;

      // Current week: if goal already hit, count it immediately; otherwise check from last week backwards
      if (countDaysInWeek(cursorMonday) >= goal) {
        streakWeeks++;
      }
      cursorMonday.setDate(cursorMonday.getDate() - 7);

      for (let w = 0; w < 104; w++) {
        if (countDaysInWeek(cursorMonday) >= goal) {
          streakWeeks++;
          cursorMonday.setDate(cursorMonday.getDate() - 7);
        } else {
          break;
        }
      }

      return streakWeeks;
    }

    function getCompletedDaysLast365() {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      let count = 0;
      for (let i = 0; i < 365; i++) {
        const d = new Date(today);
        d.setDate(today.getDate() - i);
        if (appState.workouts[formatDateStr(d)]) count++;
      }
      return count;
    }

    /* ==========================================================================
       6. PROGRESSIVE OVERLOAD ENGINE
       ========================================================================== */
    function getExerciseBenchmarks(exerciseId, excludeDateStr) {
      const meta = getExerciseById(exerciseId);
      let maxWeight = 0;
      let maxVolume = 0;
      let maxIntensity = 0;
      let lastSessionSummary = null;

      const sortedDates = Object.keys(appState.workouts)
        .filter(d => d !== excludeDateStr && d < excludeDateStr)
        .sort();

      sortedDates.forEach(dateStr => {
        const w = appState.workouts[dateStr];
        (w.exercises || []).forEach(ex => {
          if (ex.exerciseId !== exerciseId) return;
          const validSets = (ex.sets || []).filter(s => (parseFloat(s.weight) || 0) > 0 || String(s.reps || '').trim() !== '');
          if (validSets.length === 0) return;

          let sessionMaxW = 0;
          let sessionVol = 0;
          let sessionMaxInt = 0;

          validSets.forEach(s => {
            const wt = parseFloat(s.weight) || 0;
            if (meta.isCardio) {
              const lvl = parseCardioIntensity(s.reps);
              if (wt > sessionMaxW) sessionMaxW = wt;
              if (lvl > sessionMaxInt) sessionMaxInt = lvl;
              sessionVol += wt;
            } else {
              const rp = parseInt(s.reps, 10) || 0;
              if (wt > sessionMaxW) sessionMaxW = wt;
              sessionVol += wt * rp;
            }
          });

          if (sessionMaxW > maxWeight) maxWeight = sessionMaxW;
          if (sessionVol > maxVolume) maxVolume = sessionVol;
          if (sessionMaxInt > maxIntensity) maxIntensity = sessionMaxInt;

          const topSet = validSets.reduce((best, cur) => ((parseFloat(cur.weight) || 0) >= (parseFloat(best.weight) || 0) ? cur : best), validSets[0]);
          lastSessionSummary = meta.isCardio
            ? `${topSet.weight || 0} min${topSet.reps ? ` @ ${topSet.reps}` : ''}`
            : `${topSet.weight || 0} × ${topSet.reps || 0}`;
        });
      });

      return { maxWeight, maxVolume, maxIntensity, lastSessionSummary };
    }

    function evaluateSetOverload(exerciseId, setObj, excludeDateStr) {
      const meta = getExerciseById(exerciseId);
      const wt = parseFloat(setObj.weight) || 0;
      const bench = getExerciseBenchmarks(exerciseId, excludeDateStr);

      if (meta.isCardio) {
        const lvl = parseCardioIntensity(setObj.reps);
        if (wt <= 0 && lvl <= 0) return { isPR: false, label: '' };
        if (bench.maxWeight > 0 && wt > bench.maxWeight) return { isPR: true, label: 'TIME PR' };
        if (bench.maxIntensity > 0 && lvl > bench.maxIntensity) return { isPR: true, label: 'LEVEL PR' };
        return { isPR: false, label: '' };
      }

      const rp = parseInt(setObj.reps, 10) || 0;
      if (wt <= 0 || rp <= 0) return { isPR: false, label: '' };
      if (bench.maxWeight > 0 && wt > bench.maxWeight) return { isPR: true, label: 'WEIGHT PR' };
      return { isPR: false, label: '' };
    }

    /* ==========================================================================
       7. HEADER WEEK STRIP & 365-DAY / MONTH YEAR GRID
       ========================================================================== */
    function renderWeekStrip() {
      const strip = document.getElementById('weekStrip');
      const streakBadge = document.getElementById('streakBadge');
      const yearCountEl = document.getElementById('headerYearCount');
      if (!strip) return;

      const streak = calculateWeeklyStreak();
      const goal = appState.weeklyGoal || 3;
      if (streakBadge) streakBadge.textContent = `🔥 ${streak}w Streak · ${goal}x/wk`;
      if (yearCountEl) yearCountEl.textContent = `${getCompletedDaysLast365()}/365d`;

      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const dayOfWeek = today.getDay();
      const mondayOffset = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
      const monday = new Date(today);
      monday.setDate(today.getDate() + mondayOffset);

      const dayLetters = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
      let html = '';

      for (let i = 0; i < 7; i++) {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        const dateStr = formatDateStr(d);
        const isToday = dateStr === getTodayStr();
        const isSelected = dateStr === selectedDate;
        const hasWorkout = Boolean(appState.workouts[dateStr]);

        html += `
          <button type="button" onclick="selectDateAndInspect('${dateStr}')"
            class="flex flex-col items-center justify-center py-1.5 rounded-2xl border transition ${
              isSelected ? 'bg-surfaceElevated accent-border' : 'bg-surface border-borderDark/80 hover:border-white/15'
            }">
            <span class="text-[10px] font-bold ${isToday ? 'accent-text' : 'text-mutedText'}">${dayLetters[i]}</span>
            <span class="text-xs font-extrabold mt-0.5 ${isSelected ? 'text-white' : 'text-[#E5E5EA]'}">${d.getDate()}</span>
            <span class="w-1.5 h-1.5 rounded-full mt-1 ${hasWorkout ? 'accent-bg' : 'bg-transparent'}"></span>
          </button>
        `;
      }
      strip.innerHTML = html;
    }

    function buildYearMatrixData() {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const todayStr = getTodayStr();

      const start = new Date(today);
      start.setDate(today.getDate() - 364);
      const startDow = start.getDay();
      const backToMonday = startDow === 0 ? 6 : startDow - 1;
      start.setDate(start.getDate() - backToMonday);

      const weeks = [];
      let cursor = new Date(start);
      while (cursor <= today || weeks.length < 53) {
        const col = [];
        for (let r = 0; r < 7; r++) {
          const cellDate = new Date(cursor);
          const dateStr = formatDateStr(cellDate);
          const inWindow = cellDate <= today && (today - cellDate) / 86400000 <= 364;
          col.push({
            dateStr,
            month: cellDate.getMonth(),
            inWindow,
            isToday: dateStr === todayStr,
            workout: inWindow ? appState.workouts[dateStr] || null : null
          });
          cursor.setDate(cursor.getDate() + 1);
        }
        weeks.push(col);
        if (cursor > today && weeks.length >= 52) break;
      }

      const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      const monthLabels = weeks.map((col) => {
        const counts = {};
        col.forEach(c => {
          if (c.inWindow) counts[c.month] = (counts[c.month] || 0) + 1;
        });
        let dominantMonth = null;
        let maxC = 0;
        Object.entries(counts).forEach(([m, cnt]) => {
          if (cnt > maxC) { maxC = cnt; dominantMonth = Number(m); }
        });
        return dominantMonth !== null && maxC >= 4 ? monthNames[dominantMonth] : '';
      });

      const dedupedMonths = monthLabels.map((lbl, idx) => {
        if (!lbl) return '';
        if (idx > 0 && monthLabels[idx - 1] === lbl) return '';
        return lbl;
      });

      return { weeks, monthLabels: dedupedMonths };
    }

    function render365GridHtml() {
      const { weeks, monthLabels } = buildYearMatrixData();
      const dayLabels = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];

      const monthHeaderHtml = monthLabels.map(lbl => `
        <div class="w-3 shrink-0 text-[9px] font-bold text-mutedText overflow-visible whitespace-nowrap">${lbl}</div>
      `).join('');

      const columnsHtml = weeks.map(col => {
        const cells = col.map(cell => {
          if (!cell.inWindow) {
            return `<div class="w-3 h-3 rounded-[3px] bg-transparent"></div>`;
          }
          const stats = getWorkoutStats(cell.workout);
          let bgStyle = 'background-color: #18181D; border: 1px solid #24242B;';
          if (cell.workout) {
            const opacities = [0, 0.42, 0.62, 0.82, 1];
            const op = opacities[stats.intensityLevel] || 0.7;
            bgStyle = `background-color: rgba(var(--accent-rgb), ${op}); border: 1px solid rgba(var(--accent-rgb), 0.9);`;
          }
          const todayRing = cell.isToday ? 'ring-1 ring-white ring-offset-1 ring-offset-surface' : '';
          return `
            <button type="button" onclick="inspectDayModal('${cell.dateStr}')" title="${cell.dateStr}"
              style="${bgStyle}"
              class="grid-sq w-3 h-3 rounded-[3px] block ${todayRing}"></button>
          `;
        }).join('');
        return `<div class="flex flex-col gap-1 shrink-0">${cells}</div>`;
      }).join('');

      return `
        <div class="w-full min-w-0 overflow-hidden">
          <div class="overflow-x-auto no-scrollbar pb-1" id="yearGridScrollContainer">
            <div class="inline-flex flex-col gap-1 min-w-max">

              </div>
            </div>

    function renderMonthCalendarHtml() {
      const base = new Date();
      base.setDate(1);
      base.setMonth(base.getMonth() + calendarMonthOffset);

      const year = base.getFullYear();
      const month = base.getMonth();
      const monthTitle = base.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

      const firstDow = new Date(year, month, 1).getDay();
      const leadingBlanks = firstDow === 0 ? 6 : firstDow - 1;
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const todayStr = getTodayStr();

      let cellsHtml = '';
      for (let b = 0; b < leadingBlanks; b++) {
        cellsHtml += `<div class="aspect-square rounded-xl bg-transparent"></div>`;
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const d = new Date(year, month, day);
        const dateStr = formatDateStr(d);
        const workout = appState.workouts[dateStr];
        const stats = getWorkoutStats(workout);
        const isToday = dateStr === todayStr;

        let style = 'background-color: #16161B; border: 1px solid #232329;';
        if (workout) {
          const ops = [0, 0.35, 0.55, 0.78, 0.96];
          style = `background-color: rgba(var(--accent-rgb), ${ops[stats.intensityLevel] || 0.7}); border: 1px solid var(--accent);`;
        }

        cellsHtml += `
          <button type="button" onclick="inspectDayModal('${dateStr}')" style="${style}"
            class="aspect-square rounded-xl flex flex-col items-center justify-center relative transition active:scale-90 ${isToday ? 'ring-1 ring-white' : ''}">
            <span class="text-xs font-extrabold ${workout ? 'text-obsidian' : 'text-[#E5E5EA]'}">${day}</span>
          </button>
        `;
      }

      return `
        <div class="space-y-3">
          <div class="flex items-center justify-between">
            <button type="button" onclick="calendarMonthOffset--; renderAll();" class="w-8 h-8 rounded-full bg-obsidian border border-borderDark text-xs font-bold text-white">‹</button>
            <span class="text-xs font-extrabold tracking-tight text-white">${monthTitle}</span>
            <button type="button" onclick="calendarMonthOffset++; renderAll();" class="w-8 h-8 rounded-full bg-obsidian border border-borderDark text-xs font-bold text-white">›</button>
          </div>
          <div class="grid grid-cols-7 gap-1.5 text-center text-[10px] font-bold text-mutedText">
            <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
          </div>
          <div class="grid grid-cols-7 gap-1.5">
            ${cellsHtml}
          </div>
        </div>
      `;
    }

    function quickCheckInToday() {
      const todayStr = getTodayStr();
      if (appState.workouts[todayStr]) {
        showToast('Today is already lit up on your Year Grid!');
        return;
      }
      appState.workouts[todayStr] = {
        date: todayStr,
        title: 'Daily Consistency Check-In',
        quickCheckIn: true,
        exercises: [],
        updatedAt: Date.now()
      };
      saveState();
      renderAll();
      showToast('Square lit up! Daily check-in saved.');
    }

    function inspectDayModal(dateStr) {
      closeFullScreenYearGrid();
      selectedDate = dateStr;
      renderWeekStrip();
      const workout = appState.workouts[dateStr];
      const human = formatHumanDate(dateStr);

      if (!workout) {
        openModal(`${human} · Rest Day`, `
          <div class="space-y-4 text-center py-2">
            <p class="text-xs text-mutedText">No session logged for this date yet.</p>
            <div class="grid grid-cols-2 gap-2.5">
              <button type="button" onclick="closeModal(); openWorkoutEditorForDate('${dateStr}');" class="py-3 rounded-2xl accent-bg text-obsidian font-extrabold text-xs">
                + Log Workout
              </button>
              <button type="button" onclick="logQuickCheckInForDate('${dateStr}'); closeModal();" class="py-3 rounded-2xl bg-obsidian border border-borderDark text-white font-extrabold text-xs">
                ✓ Quick Check-In
              </button>
            </div>
          </div>
        `);
        return;
      }

      const stats = getWorkoutStats(workout);
      const exListHtml = (workout.exercises || []).length === 0

        : (workout.exercises || []).map(ex => {
            const meta = getExerciseById(ex.exerciseId);
            const setsText = (ex.sets || []).map((s, idx) =>
              meta.isCardio
                ? `Interval ${idx + 1}: ${s.weight || 0} min${s.reps ? ` (${escapeHtml(s.reps)})` : ''}`
                : `Set ${idx + 1}: ${s.weight || 0} × ${s.reps || 0}`
            ).join(' · ');
            return `
              <div class="bg-obsidian border border-borderDark rounded-2xl p-3">
                <p class="text-xs font-extrabold text-white">${escapeHtml(meta.name)}</p>
                <p class="text-[11px] text-mutedText mt-1">${setsText || 'No sets recorded'}</p>
              </div>

        <div class="space-y-4">
          <div class="flex items-center justify-between bg-obsidian border border-borderDark rounded-2xl p-3.5">
            <div>
              <p class="text-sm font-extrabold text-white">${escapeHtml(workout.title || 'Workout')}</p>

        </div>
      `);

    function logQuickCheckInForDate(dateStr) {
      appState.workouts[dateStr] = {
        date: dateStr,
        title: 'Consistency Check-In',
        quickCheckIn: true,
        exercises: [],
        updatedAt: Date.now()
      };
      saveState();
      renderAll();
      showToast(`Lit up ${formatHumanDate(dateStr)}!`);
    }

    function deleteWorkoutForDate(dateStr) {
      delete appState.workouts[dateStr];
      if (activeDraft && activeDraft.date === dateStr) activeDraft = null;
      saveState();
      renderAll();
      showToast('Workout removed.');
    }

    function startOrResumeTodayWorkout() {
      openWorkoutEditorForDate(getTodayStr());

    function openWorkoutEditorForDate(dateStr) {
      selectedDate = dateStr;
      const existing = appState.workouts[dateStr];
      if (!activeDraft || activeDraft.date !== dateStr) {
        if (existing) {
          activeDraft = JSON.parse(JSON.stringify(existing));
        } else {
          activeDraft = {
            date: dateStr,
            title: 'Strength & Conditioning',
            exercises: []
          };
        }
      }
      switchTab('logger');

      const tpl = (appState.templates || []).find(t => t.id === templateId);
      if (!tpl) return;
      const todayStr = getTodayStr();
      selectedDate = todayStr;
      activeDraft = {
        date: todayStr,
        title: tpl.name,
        exercises: (tpl.exercises || []).map(exId => ({
          exerciseId: exId,
          sets: [
            { weight: '', reps: '' },
            { weight: '', reps: '' },
            { weight: '', reps: '' }
          ]
        }))
      };
      switchTab('logger');
      showToast(`Loaded "${tpl.name}"`);

    function updateDraftSet(exIdx, sIdx, field, val) {
      if (!activeDraft || !activeDraft.exercises[exIdx]) return;
      const setObj = activeDraft.exercises[exIdx].sets[sIdx];
      setObj[field] = val;

      // In-place DOM update so mobile keyboard never closes while typing numbers
      const exId = activeDraft.exercises[exIdx].exerciseId;
      const overload = evaluateSetOverload(exId, setObj, activeDraft.date);
      const rowEl = document.getElementById(`setRow_${exIdx}_${sIdx}`);
      const statusEl = document.getElementById(`setStatus_${exIdx}_${sIdx}`);
      if (rowEl) {
        rowEl.classList.toggle('accent-border', overload.isPR);
        rowEl.classList.toggle('border-borderDark', !overload.isPR);
      }
      if (statusEl) {
        statusEl.innerHTML = renderSetStatusHtml(exId, setObj, activeDraft.date);
      }
    }

    function addDraftSet(exIdx) {
      const sets = activeDraft.exercises[exIdx].sets;
      const prev = sets[sets.length - 1] || { weight: '', reps: '' };
      sets.push({ weight: prev.weight, reps: prev.reps });
      renderLoggerView();
    }

    function removeDraftSet(exIdx, sIdx) {
      activeDraft.exercises[exIdx].sets.splice(sIdx, 1);
      renderLoggerView();
    }

    function removeDraftExercise(exIdx) {
      activeDraft.exercises.splice(exIdx, 1);
      renderLoggerView();
    }

    async function saveActiveWorkout() {
      if (!activeDraft) return;
      const dateStr = activeDraft.date || getTodayStr();
      appState.workouts[dateStr] = {
        date: dateStr,
        title: (activeDraft.title || 'Workout Session').trim(),
        exercises: activeDraft.exercises,
        updatedAt: Date.now()
      };
      selectedDate = dateStr;
      await saveState();
      showToast(`Workout saved! ${formatHumanDate(dateStr)} lit up.`);
      switchTab('grid');
    }

    /* ==========================================================================

    function openExercisePicker(targetMode = 'draft') {
      pickerSelectedIds = targetMode === 'template'
        ? [...(routineBuilderDraft.exerciseIds || [])]
        : (activeDraft ? activeDraft.exercises.map(e => e.exerciseId) : []);

      const routineHeaderHtml = targetMode === 'template'
        ? `

        : `
          <div class="flex items-center justify-between bg-obsidian border border-borderDark rounded-2xl px-3.5 py-2.5 mb-3">
            <span id="pickerCountLabel" class="text-xs font-bold text-white">${pickerSelectedIds.length} selected</span>

          </div>

      openModal(targetMode === 'template' ? 'Build Routine & Select Exercises' : 'Select Exercises', `
        <div class="space-y-3">
          ${routineHeaderHtml}
          <input id="exerciseSearchInput" type="text" oninput="filterExercisePickerList('${targetMode}')"
            placeholder="Search or type a new custom exercise..."
            class="w-full bg-obsidian border border-borderDark rounded-2xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-white/30" />
          <div id="exercisePickerList" class="space-y-2 max-h-72 overflow-y-auto pr-0.5"></div>
        </div>
      `);

      filterExercisePickerList(targetMode);
    }

    function filterExercisePickerList(targetMode) {
      const q = (document.getElementById('exerciseSearchInput')?.value || '').trim();
      const qLower = q.toLowerCase();
      const listEl = document.getElementById('exercisePickerList');
      if (!listEl) return;

      const all = getAllExercises();
      const filtered = all.filter(ex =>
        ex.name.toLowerCase().includes(qLower) ||
        (ex.muscle || '').toLowerCase().includes(qLower)
      );

      let createBanner = '';
      const exactMatch = all.some(ex => ex.name.toLowerCase() === qLower);
      if (q.length >= 2 && !exactMatch) {
        createBanner = `
          <div class="bg-obsidian border accent-border rounded-2xl p-3 space-y-2">
            <p class="text-xs font-extrabold text-white">＋ Create "${escapeHtml(q)}"</p>
            <div class="grid grid-cols-2 gap-2">
              <button type="button" onclick="createCustomExerciseAndSelect('${escapeHtml(q)}', false, '${targetMode}')" class="py-2 rounded-xl accent-bg text-obsidian text-[11px] font-extrabold">
                + Strength Exercise
              </button>
              <button type="button" onclick="createCustomExerciseAndSelect('${escapeHtml(q)}', true, '${targetMode}')" class="py-2 rounded-xl bg-surface border border-borderDark text-white text-[11px] font-extrabold">
                + Cardio Machine
              </button>
            </div>
          </div>
        `;
      }

      const itemsHtml = filtered.map(ex => {
        const isAdded = pickerSelectedIds.includes(ex.id);
        return `
          <button type="button" onclick="toggleExerciseInPicker('${ex.id}', '${targetMode}')"
            class="w-full text-left p-3 rounded-2xl bg-obsidian border ${isAdded ? 'accent-border' : 'border-borderDark'} hover:border-white/25 flex items-center justify-between transition">
            <div>
              <p class="text-xs font-extrabold text-white">${escapeHtml(ex.name)}</p>
              <p class="text-[10px] text-mutedText mt-0.5">${escapeHtml(ex.muscle)} · ${escapeHtml(ex.equipment)}</p>
            </div>
            <span class="px-2.5 py-1 rounded-full text-[10px] font-extrabold ${isAdded ? 'accent-bg text-obsidian' : 'bg-surface border border-borderDark text-white'}">
              ${isAdded ? '✓ Added' : '+ Add'}
            </span>
          </button>
        `;
      }).join('');

      listEl.innerHTML = createBanner + (itemsHtml || `<p class="text-xs text-mutedText text-center py-4">No matching exercises.</p>`);
    }

    function toggleExerciseInPicker(exId, targetMode) {
      const idx = pickerSelectedIds.indexOf(exId);
      if (idx >= 0) {
        pickerSelectedIds.splice(idx, 1);
      } else {
        pickerSelectedIds.push(exId);
      }

      if (targetMode === 'template') {
        routineBuilderDraft.exerciseIds = [...pickerSelectedIds];
        const previewEl = document.getElementById('routineDraftExerciseList');
        if (previewEl) previewEl.innerHTML = renderRoutineDraftExerciseChips();
      } else if (activeDraft) {
        const alreadyInDraft = activeDraft.exercises.some(e => e.exerciseId === exId);
        if (!alreadyInDraft && pickerSelectedIds.includes(exId)) {
          activeDraft.exercises.push({
            exerciseId: exId,
            sets: [{ weight: '', reps: '' }, { weight: '', reps: '' }, { weight: '', reps: '' }]
          });
        } else if (alreadyInDraft && !pickerSelectedIds.includes(exId)) {
          activeDraft.exercises = activeDraft.exercises.filter(e => e.exerciseId !== exId);
        }
        renderLoggerView();
      }

      const countEl = document.getElementById('pickerCountLabel');
      if (countEl) {
        countEl.textContent = targetMode === 'template'
          ? `${pickerSelectedIds.length} exercises selected`
          : `${pickerSelectedIds.length} selected`;
      }
      filterExercisePickerList(targetMode);
    }

    function createCustomExerciseAndSelect(name, isCardio, targetMode) {
      const cleanName = name.trim();
      if (!cleanName) return;
      const newEx = {
        id: 'custom_' + Date.now(),
        name: cleanName,
        muscle: isCardio ? 'Cardio' : 'Custom',
        equipment: isCardio ? 'Machine' : 'Custom',
        isCardio: Boolean(isCardio)
      };
      appState.customExercises.push(newEx);
      saveState();

      const searchEl = document.getElementById('exerciseSearchInput');
      if (searchEl) searchEl.value = '';
      toggleExerciseInPicker(newEx.id, targetMode);
      showToast(`Created "${cleanName}"`);
    }

    /* ==========================================================================
       11. VIEW 3: PROGRESSIVE OVERLOAD CHARTS
       ========================================================================== */
    function renderOverloadView() {
      const main = document.getElementById('mainContent');
      const allEx = getAllExercises();
      const selectedEx = getExerciseById(selectedOverloadExerciseId);

      const points = [];
      Object.keys(appState.workouts).sort().forEach(dStr => {
        const w = appState.workouts[dStr];
        (w.exercises || []).forEach(ex => {
          if (ex.exerciseId !== selectedEx.id) return;
          const validSets = (ex.sets || []).filter(s => (parseFloat(s.weight) || 0) > 0 || String(s.reps || '').trim() !== '');
          if (validSets.length === 0) return;
          let topVal = 0;
          validSets.forEach(s => {
            const wt = parseFloat(s.weight) || 0;
            const lvl = parseCardioIntensity(s.reps);
            const score = selectedEx.isCardio ? (wt > 0 ? wt : lvl) : wt;
            if (score > topVal) topVal = score;
          });
          points.push({ date: dStr, val: topVal });
        });
      });

      const bestVal = points.reduce((m, p) => Math.max(m, p.val), 0);
      const latestVal = points.length > 0 ? points[points.length - 1].val : 0;

      const barsHtml = points.length === 0
        ? `<div class="py-10 text-center text-xs text-mutedText">Log sets for <span class="text-white font-bold">${escapeHtml(selectedEx.name)}</span> to visualize progression.</div>`
        : `<div class="flex items-end gap-2 h-40 pt-4 px-1">
            ${points.slice(-12).map(p => {
              const pct = bestVal > 0 ? Math.max(14, Math.round((p.val / bestVal) * 100)) : 20;
              return `
                <div class="flex-1 flex flex-col items-center gap-1.5 min-w-0">
                  <span class="text-[9px] font-extrabold text-white">${p.val}</span>
                  <div class="w-full rounded-t-lg accent-bg transition-all" style="height: ${pct}%;"></div>
                  <span class="text-[9px] text-mutedText truncate w-full text-center">${p.date.slice(5)}</span>
                </div>
              `;
            }).join('')}
          </div>`;

      main.innerHTML = `
        <section class="space-y-4">
          <div class="bg-surface border border-borderDark rounded-3xl p-4 space-y-3">
            <label class="text-[10px] font-extrabold uppercase tracking-wider text-mutedText block">Select Lift or Cardio Machine</label>
            <select onchange="selectedOverloadExerciseId = this.value; renderOverloadView();"
              class="w-full bg-obsidian border border-borderDark rounded-2xl px-3.5 py-3 text-xs font-extrabold text-white focus:outline-none">
              ${allEx.map(ex => `<option value="${ex.id}" ${ex.id === selectedEx.id ? 'selected' : ''}>${escapeHtml(ex.name)} (${escapeHtml(ex.muscle)})</option>`).join('')}
            </select>

            <div class="grid grid-cols-2 gap-2.5 pt-1">
              <div class="bg-obsidian border border-borderDark rounded-2xl p-3">
                <span class="text-[10px] font-bold uppercase text-mutedText">All-Time PR</span>
                <p class="text-lg font-extrabold accent-text mt-0.5">${bestVal} <span class="text-xs text-mutedText">${selectedEx.isCardio ? 'min/lvl' : 'wt'}</span></p>
              </div>
              <div class="bg-obsidian border border-borderDark rounded-2xl p-3">
                <span class="text-[10px] font-bold uppercase text-mutedText">Latest Top</span>
                <p class="text-lg font-extrabold text-white mt-0.5">${latestVal} <span class="text-xs text-mutedText">${selectedEx.isCardio ? 'min/lvl' : 'wt'}</span></p>
              </div>
            </div>
          </div>

          <div class="bg-surface border border-borderDark rounded-3xl p-4">
            <h3 class="text-xs font-extrabold uppercase tracking-wider text-mutedText mb-2">Progression Trend</h3>
            ${barsHtml}
          </div>
        </section>
      `;
    }

        if (parseFloat(diff) === 0) return '0.0';

    async function saveMeasurementEntry() {
      const entry = {
        date: document.getElementById('measDate')?.value || getTodayStr(),
        weight: (document.getElementById('measWeight')?.value || '').trim(),
        bodyFat: (document.getElementById('measBodyFat')?.value || '').trim(),
        waist: (document.getElementById('measWaist')?.value || '').trim(),
        glutes: (document.getElementById('measGlutes')?.value || '').trim(),
        chest: (document.getElementById('measChest')?.value || '').trim(),
        arms: (document.getElementById('measArms')?.value || '').trim(),
        thighs: (document.getElementById('measThighs')?.value || '').trim()
      };

      if (!entry.weight && !entry.bodyFat && !entry.waist && !entry.glutes && !entry.chest && !entry.arms && !entry.thighs) {
        showToast('Enter at least one measurement first.');
        return;
      }

      appState.measurements = (appState.measurements || []).filter(m => m.date !== entry.date);
      appState.measurements.push(entry);
      await saveState();
      renderBodyView();
      showToast('Body measurements saved!');
    }

    async function deleteMeasurement(sortedIdx) {
      const sorted = [...(appState.measurements || [])].sort((a, b) => b.date.localeCompare(a.date));
      const target = sorted[sortedIdx];
      if (!target) return;
      appState.measurements = (appState.measurements || []).filter(m => m !== target);
      await saveState();
      renderBodyView();
      showToast('Measurement removed.');
    }

    function renderRoutineDraftExerciseChips() {
      if (!routineBuilderDraft.exerciseIds || routineBuilderDraft.exerciseIds.length === 0) {
        return `<p class="text-xs text-mutedText text-center py-3">No exercises selected yet.</p>`;
      }
      return routineBuilderDraft.exerciseIds.map((id, i) => `
        <div class="flex items-center justify-between bg-obsidian border border-borderDark rounded-xl px-3 py-2">
          <span class="text-xs font-bold text-white">${i + 1}. ${escapeHtml(getExerciseById(id).name)}</span>
          <button type="button" onclick="routineBuilderDraft.exerciseIds.splice(${i}, 1); document.getElementById('routineDraftExerciseList').innerHTML = renderRoutineDraftExerciseChips();" class="text-xs text-mutedText hover:text-coralAccent">✕</button>
        </div>
      `).join('');
    }

    function openNewTemplateModal() {
      routineBuilderDraft = { name: '', tag: 'CUSTOM SPLIT', exerciseIds: [] };
      openModal('New Workout Routine', `
        <div class="space-y-3.5">
          <div>
            <label class="text-[10px] font-bold uppercase text-mutedText block mb-1">Routine Name</label>
            <input id="newTplNameInput" type="text" oninput="routineBuilderDraft.name = this.value" placeholder="e.g. Glute & Hamstring Focus" class="w-full bg-obsidian border border-borderDark rounded-2xl px-3.5 py-2.5 text-sm font-bold text-white" />
          </div>
          <div>
            <label class="text-[10px] font-bold uppercase text-mutedText block mb-1">Split Tag</label>
            <input id="newTplTagInput" type="text" value="CUSTOM SPLIT" oninput="routineBuilderDraft.tag = this.value" class="w-full bg-obsidian border border-borderDark rounded-2xl px-3.5 py-2.5 text-xs font-bold text-white uppercase" />
          </div>
          <div class="space-y-2">
            <div class="flex items-center justify-between">
              <span class="text-[10px] font-bold uppercase text-mutedText">Selected Exercises</span>
              <button type="button" onclick="openExercisePicker('template')" class="text-xs font-extrabold accent-text">+ Select Exercises</button>
            </div>
            <div id="routineDraftExerciseList" class="space-y-1.5 max-h-44 overflow-y-auto">
              ${renderRoutineDraftExerciseChips()}
            </div>
          </div>
          <button type="button" onclick="saveNewTemplate()" class="w-full py-3.5 rounded-2xl accent-bg text-obsidian font-extrabold text-xs shadow-lg">
            ✓ Save Routine
          </button>
        </div>
      `);
    }

    async function saveRoutineFromPicker() {
      const nameInput = document.getElementById('pickerRoutineName');
      const tagInput = document.getElementById('pickerRoutineTag');
      if (nameInput) routineBuilderDraft.name = nameInput.value;
      if (tagInput) routineBuilderDraft.tag = tagInput.value;
      routineBuilderDraft.exerciseIds = [...pickerSelectedIds];
      await saveNewTemplate();
    }

    async function saveNewTemplate() {
      const nameEl = document.getElementById('newTplNameInput');
      const tagEl = document.getElementById('newTplTagInput');
      const finalName = ((nameEl ? nameEl.value : routineBuilderDraft.name) || '').trim();
      const finalTag = ((tagEl ? tagEl.value : routineBuilderDraft.tag) || 'CUSTOM').trim().toUpperCase();

      if (!finalName) {
        showToast('Please enter a routine name.');
        return;
      }
      if (!routineBuilderDraft.exerciseIds || routineBuilderDraft.exerciseIds.length === 0) {
        showToast('Select at least 1 exercise.');
        return;
      }

      appState.templates.push({
        id: 'tpl_' + Date.now(),
        name: finalName,
        tag: finalTag,
        exercises: [...routineBuilderDraft.exerciseIds]
      });

      await saveState();
      closeModal();
      switchTab('templates');
      showToast(`Routine "${finalName}" saved!`);
    }

    async function deleteTemplate(idx) {
      appState.templates.splice(idx, 1);
      await saveState();
      renderTemplatesView();
      showToast('Routine deleted.');
    }

    /* ==========================================================================
       14. CLEAN PROFILE MODAL (PHOTO UPLOAD, WEEKLY GOAL, CLOUD SYNC, SIGN OUT)
       ========================================================================== */
    function openAccountModal() {
      if (accountSession && accountSession.username) {
        const uname = accountSession.username;
        const displayHandle = uname.includes('@') ? uname : `@${uname}`;
        const currentGoal = appState.weeklyGoal || 3;
        const goalButtons = [1, 2, 3, 4, 5, 6, 7].map(n => `
          <button type="button" onclick="setWeeklyGoal(${n})"
            class="py-2 rounded-xl text-xs font-extrabold border transition ${
              currentGoal === n ? 'accent-bg text-obsidian accent-border' : 'bg-obsidian border-borderDark text-white hover:border-white/25'
            }">
            ${n}d
          </button>
        `).join('');

        openModal('Profile & Goals', `
          <div class="space-y-4">
            <!-- Profile Avatar & Username -->
            <div class="flex items-center gap-3.5 bg-obsidian border border-borderDark rounded-2xl p-3.5">
              <label class="relative w-14 h-14 rounded-2xl bg-surface border border-borderDark overflow-hidden flex items-center justify-center cursor-pointer shrink-0 group">
                ${appState.profilePhoto
                  ? `<img src="${appState.profilePhoto}" alt="Profile" class="w-full h-full object-cover" />`
                  : `<span class="text-lg font-extrabold accent-text">${escapeHtml(uname.charAt(0).toUpperCase())}</span>`}
                <span class="absolute inset-x-0 bottom-0 bg-black/70 text-[9px] font-bold text-white text-center py-0.5">Edit</span>
                <input type="file" accept="image/*" onchange="handleProfilePhotoUpload(event)" class="hidden" />
              </label>
              <div class="min-w-0 flex-1">
                <p class="text-sm font-extrabold text-white truncate">${escapeHtml(displayHandle)}</p>
                <p class="text-[11px] text-mutedText mt-0.5">${getCompletedDaysLast365()} workouts logged this year</p>
              </div>
            </div>

            <!-- Weekly Workout Goal -->
            <div class="bg-obsidian border border-borderDark rounded-2xl p-3.5 space-y-2.5">
              <div class="flex items-center justify-between">
                <span class="text-xs font-extrabold text-white">Weekly Workout Goal</span>
                <span class="text-xs font-extrabold accent-text">${currentGoal}x / week</span>
              </div>
              <div class="grid grid-cols-7 gap-1.5">
                ${goalButtons}
              </div>
              <p class="text-[10px] text-mutedText">Your 🔥 weekly streak advances every week you hit ${currentGoal} workout${currentGoal > 1 ? 's' : ''}.</p>
            </div>

            <!-- Manual Cloud Sync Action -->
            <button type="button" id="manualSyncBtn" onclick="forceSyncNow()" class="w-full py-3 rounded-2xl bg-obsidian border border-borderDark hover:border-white/25 text-xs font-extrabold text-white transition">
              ↻ Sync Profile &amp; Routines to Cloud Now
            </button>

            <button type="button" onclick="signOutAccount()" class="w-full py-3 rounded-2xl bg-obsidian border border-coralAccent/40 text-coralAccent font-extrabold text-xs">
              Sign Out
            </button>
          </div>
        `);
        return;
      }

      openModal('Account', `
        <div class="space-y-3 text-center py-2">
          <p class="text-xs text-mutedText">Sign in or create an account to sync your workouts, routines, and measurements across devices.</p>
          <a href="./login.html" class="block w-full py-3.5 rounded-2xl accent-bg text-obsidian font-extrabold text-xs">
            Go to Sign In / Create Account →
          </a>
        </div>
      `);
    }

    async function setWeeklyGoal(days) {
      appState.weeklyGoal = days;
      await saveState();
      renderWeekStrip();
      openAccountModal();
      showToast(`Weekly goal updated to ${days}x / week`);
    }

    function handleProfilePhotoUpload(event) {
      const file = event.target?.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = async () => {
          const canvas = document.createElement('canvas');
          const maxDim = 200;
          const scale = Math.min(maxDim / img.width, maxDim / img.height, 1);
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          appState.profilePhoto = canvas.toDataURL('image/jpeg', 0.82);
          await saveState();
          updateAccountHeaderUI();
          openAccountModal();
          showToast('Profile photo updated!');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function forceSyncNow() {
      const btn = document.getElementById('manualSyncBtn');
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'Syncing...';
      }
      await saveState(true);
      if (btn) {
        btn.disabled = false;
        btn.textContent = lastCloudSyncError
          ? `⚠ Sync Error: ${lastCloudSyncError}`
          : `✓ Synced @${accountSession.username} to Cloud`;
      }
    }

    async function signOutAccount() {
      if (accountSession && accountSession.username) {
        await saveState(true);
      }
      localStorage.removeItem(ACCOUNT_SESSION_KEY);
      localStorage.removeItem(GUEST_MODE_KEY);
      accountSession = null;
      activeDraft = null;
      closeModal();
      if (window.location.protocol !== 'about:' && !window.location.href.startsWith('blob:')) {
        window.location.href = './login.html';
      } else {
        updateAccountHeaderUI();
        renderAll();
        showToast('Signed out.');
      }
    }

    /* ==========================================================================
       15. MODAL & NAVIGATION CONTROLLERS
       ========================================================================== */
    function openModal(title, bodyHtml) {
      const overlay = document.getElementById('modalOverlay');
      const titleEl = document.getElementById('modalTitle');
      const bodyEl = document.getElementById('modalBody');
      if (!overlay || !titleEl || !bodyEl) return;
      titleEl.textContent = title;
      bodyEl.innerHTML = bodyHtml;
      overlay.classList.remove('hidden');
    }

    function closeModal() {
      const overlay = document.getElementById('modalOverlay');
      if (overlay) overlay.classList.add('hidden');
    }

    document.getElementById('modalOverlay')?.addEventListener('click', (e) => {
      if (e.target.id === 'modalOverlay') closeModal();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeModal();
        closeFullScreenYearGrid();
      }
    });

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.nav-btn').forEach(btn => {
        const isActive = btn.getAttribute('data-tab') === tab;
        btn.classList.toggle('text-white', isActive);
        btn.classList.toggle('accent-text', isActive);
        btn.classList.toggle('text-mutedText', !isActive);
      });
      renderAll();
    }

    function renderAll() {
      renderWeekStrip();
      if (currentTab === 'grid') renderGridView();
      else if (currentTab === 'logger') renderLoggerView();
      else if (currentTab === 'overload') renderOverloadView();
      else if (currentTab === 'body') renderBodyView();
      else if (currentTab === 'templates') renderTemplatesView();
    }

    /* ==========================================================================
       16. INITIALIZATION & 60-DAY AUTH GATE
       ========================================================================== */
    window.addEventListener('DOMContentLoaded', async () => {
      // Redirect unauthenticated visitors to login.html on real web hosts (skip inside sandboxed preview)
      const isSandboxed = window.location.protocol === 'about:' || window.location.href.startsWith('blob:');
      if (!isSandboxed) {
        try {
          const sess = JSON.parse(localStorage.getItem(ACCOUNT_SESSION_KEY) || 'null');
          const isGuest = localStorage.getItem(GUEST_MODE_KEY) === 'true';
          const isValid = sess && sess.username && (!sess.expiresAt || Date.now() < sess.expiresAt);
          if (!isValid && !isGuest) {
            window.location.replace('./login.html');
            return;
          }
        } catch (_) {}
      }

      await hydrateStateFromVault();
      renderAll();
    });
  </script>
</body>
</html>
