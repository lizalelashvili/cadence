    function toLocalYMD(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function parseLocalYMD(ymd) {
      const [y, m, d] = (ymd || '').split('-').map(Number);
      if (!y || !m || !d) return new Date();
      return new Date(y, m - 1, d);
    }

    function getMondayStartOfWeek(dateObj) {
      const copy = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());
      const day = copy.getDay(); // 0=Sun..6=Sat
      const diff = (day + 6) % 7; // Mon=0..Sun=6
      copy.setDate(copy.getDate() - diff);
      return copy;
    }

    function writeUserToIDB(key, val) {
      return new Promise((resolve) => {
        if (!window.indexedDB) return resolve();
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
        };
        req.onsuccess = () => {
          try {
            const tx = req.result.transaction(IDB_STORE, 'readwrite');
            tx.objectStore(IDB_STORE).put(val, key);
            tx.oncomplete = () => resolve();
            tx.onerror = () => resolve();
          } catch (_) {
            resolve();
          }
        };
        req.onerror = () => resolve();
      });
    }

    function readUserFromIDB(key) {
      return new Promise((resolve) => {
        if (!window.indexedDB) return resolve(null);
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
        };
        req.onsuccess = () => {
          try {
            const tx = req.result.transaction(IDB_STORE, 'readonly');
            const g = tx.objectStore(IDB_STORE).get(key);
            g.onsuccess = () => resolve(g.result || null);
            g.onerror = () => resolve(null);
          } catch (_) {
            resolve(null);
          }
        };
        req.onerror = () => resolve(null);
      });
    }

      if (!incoming || typeof incoming !== 'object') return base;
      const baseTs = Number(base._updatedAt || 0);

      if (incTs < baseTs) return base;

      return {
        ...base,
        ...incoming,
        language: incoming.language || base.language || 'geo',
        bmrProfile: {
          ...(base.bmrProfile || {}),
          ...(incoming.bmrProfile || {})

        foodHistory: Array.isArray(incoming.foodHistory) ? incoming.foodHistory : (base.foodHistory || []),
        customFoods: Array.isArray(incoming.customFoods) ? incoming.customFoods : (base.customFoods || []),
        routines: Array.isArray(incoming.routines) && incoming.routines.length ? incoming.routines : base.routines,
        _updatedAt: Math.max(baseTs, incTs)
      };
    }

    async function hydrateStateFromVault() {
      const sess = getSessionInfo();
      const userKey = sess?.username ? `${ACCOUNT_VAULT_PREFIX}${sess.username}` : null;
      let merged = getDefaultState();

      try {
        const localMain = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        if (localMain) merged = mergeStateSnapshots(merged, localMain);
      } catch (_) {}

      if (userKey) {
        try {
          const localUser = JSON.parse(localStorage.getItem(userKey) || 'null');
          if (localUser) merged = mergeStateSnapshots(merged, localUser);
        } catch (_) {}

        const idbUser = await readUserFromIDB(userKey);
        if (idbUser) merged = mergeStateSnapshots(merged, idbUser);

        if (supabaseClient) {
          try {
            const { data } = await supabaseClient
              .from('cadence_profiles')
              .select('state_json')
              .eq('username', sess.username)
              .maybeSingle();
            if (data?.state_json) {
              merged = mergeStateSnapshots(merged, data.state_json);
            }
          } catch (_) {}
        }
      }

      if (sess) {
        if (sess.firstName && (!merged.firstName || merged.firstName === 'Alex')) {
          merged.firstName = sess.firstName;
        }
        if (sess.lastName && !merged.lastName) merged.lastName = sess.lastName;
        if (sess.gender && !merged.gender) merged.gender = sess.gender;
        if (sess.passHash) merged._passHash = sess.passHash;
      }

      const savedLang = localStorage.getItem('cadence_language_v1');
      if (savedLang === 'geo' || savedLang === 'eng') {
        merged.language = savedLang;
      }

      if (!merged.aiUsage || merged.aiUsage.date !== TODAY_STR) {
        merged.aiUsage = { date: TODAY_STR, count: 0 };
      }

      appState = merged;
      applyAccentCss(appState.accent);
    }

    function persistState(immediate = false) {
      appState._updatedAt = Date.now();
      const sess = getSessionInfo();
      const userKey = sess?.username ? `${ACCOUNT_VAULT_PREFIX}${sess.username}` : null;
      const snapshot = JSON.parse(JSON.stringify(appState));

      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot));
        localStorage.setItem('cadence_language_v1', snapshot.language || 'geo');
        if (userKey) {
          localStorage.setItem(userKey, JSON.stringify(snapshot));
          localStorage.setItem(`${userKey}_backup`, JSON.stringify(snapshot));
          writeUserToIDB(userKey, snapshot);
        }
      } catch (_) {}

      if (supabaseClient && sess?.username) {
        const pushCloud = async () => {
          try {
            await supabaseClient.from('cadence_profiles').upsert({
              username: sess.username,
              pass_hash: sess.passHash || snapshot._passHash || '',
              state_json: snapshot,
              updated_at: new Date().toISOString()
            }, { onConflict: 'username' });
          } catch (_) {}
        };
        if (immediate) {
          clearTimeout(persistTimer);
          pushCloud();
        } else {
          clearTimeout(persistTimer);
          persistTimer = setTimeout(pushCloud, 300);
        }
      }
    }

    function isDayCompleted(dateStr) {

    function getYearCompletionStats() {
      let count = 0;
      const start = new Date(CURRENT_YEAR, 0, 1);
      const end = new Date(CURRENT_YEAR, 11, 31);
      const totalDays = Math.round((end - start) / 86400000) + 1;
      for (const dStr of Object.keys(appState.workouts || {})) {
        if (dStr.startsWith(`${CURRENT_YEAR}-`) && isDayCompleted(dStr)) {
          count++;
        }
      }
      const pct = Math.round((count / totalDays) * 100);
      return { count, totalDays, pct };
    }

    function getWeeklyStreak() {
      let streak = 0;
      let cursor = getMondayStartOfWeek(TODAY_OBJ);
      for (let w = 0; w < 52; w++) {
        let weekHasWorkout = false;
        for (let d = 0; d < 7; d++) {
          const check = new Date(cursor.getFullYear(), cursor.getMonth(), cursor.getDate() + d);
          if (isDayCompleted(toLocalYMD(check))) {
            weekHasWorkout = true;
            break;
          }
        }
        if (weekHasWorkout) {
          streak++;
          cursor.setDate(cursor.getDate() - 7);
        } else if (w === 0) {
          cursor.setDate(cursor.getDate() - 7);
        } else {
          break;
        }
      }
      return streak;
    }

    function renderYearHeatmapHtml(isFullScreen = false) {
      const yearStart = new Date(CURRENT_YEAR, 0, 1);

      const gridStart = getMondayStartOfWeek(yearStart);
      const dayLetters = t('weeksShort');
      const monthsShort = t('monthsShort');

      const weeks = [];
      let cur = new Date(gridStart);
      while (cur <= yearEnd || weeks.length < 52) {
        const weekDays = [];
        for (let d = 0; d < 7; d++) {
          const cellDate = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate() + d);
          weekDays.push(cellDate);
        }
        weeks.push(weekDays);
        cur.setDate(cur.getDate() + 7);
        if (weeks.length > 54) break;
      }

      const monthMarkers = weeks.map((wk, idx) => {
        const firstInYear = wk.find(d => d.getFullYear() === CURRENT_YEAR && d.getDate() <= 7);
        if (firstInYear) {
          const prevWk = weeks[idx - 1];
          const prevHadSame = prevWk && prevWk.some(d => d.getFullYear() === CURRENT_YEAR && d.getMonth() === firstInYear.getMonth());
          if (!prevHadSame) return monthsShort[firstInYear.getMonth()];

        return '';

        return `
          <div class="w-full">
            <div class="grid gap-[2px] mb-1.5 pl-4" style="grid-template-columns: repeat(${weeks.length}, minmax(0, 1fr));">

                      const dStr = toLocalYMD(dObj);
                      const done = inYear && isDayCompleted(dStr);
                      const isToday = dStr === TODAY_STR;
                      if (!inYear) return `<div class="aspect-square rounded-[2px] bg-transparent"></div>`;
                      return `<button type="button" onclick="toggleQuickCheckIn('${dStr}')" title="${dStr}"
                        class="aspect-square rounded-[2px] transition ${done ? 'accent-bg' : 'bg-[#1D1D23]'} ${isToday ? 'ring-1 ring-white' : ''}"></button>`;
                    }).join('')}
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      }

      return `
        <div id="mainYearScroll" class="overflow-x-auto no-scrollbar pb-1">
          <div class="inline-block min-w-max">
            <div class="flex gap-1 mb-1.5 pl-5">

              </div>
              <div class="flex gap-1">
                ${weeks.map(wk => {
                  const hasToday = wk.some(d => toLocalYMD(d) === TODAY_STR);
                  return `
                    <div ${hasToday ? 'id="todayYearCol"' : ''} class="flex flex-col gap-1">
                      ${wk.map(dObj => {
                        const inYear = dObj.getFullYear() === CURRENT_YEAR;
                        const dStr = toLocalYMD(dObj);
                        const done = inYear && isDayCompleted(dStr);

      const entry = {
        id: `m_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
        name,
        kcal: Math.round(Number(kcal || 0)),
        p: Math.round(Number(p || 0) * 10) / 10
      };
      meals[bucket].push(entry);

      if (!appState.foodHistory) appState.foodHistory = [];
      appState.foodHistory = [
        { name, kcal: entry.kcal, p: entry.p, date: TODAY_STR },
        ...appState.foodHistory.filter(h => h.name !== name)
      ].slice(0, 40);

      persistState(true);

    function logCatalogFood(foodId) {

    // Smart Local + AI Estimator (3/day limit)
    function runAiCalorieEstimate() {
      if (!appState.aiUsage || appState.aiUsage.date !== TODAY_STR) {
        appState.aiUsage = { date: TODAY_STR, count: 0 };
      }
      if (appState.aiUsage.count >= 3) return;

      const text = (document.getElementById('aiMealInput')?.value || '').trim();
      if (!text) return;

      const lower = text.toLowerCase();
      let estKcal = 0;
      let estProt = 0;
      const tokens = lower.split(/[,+&\n]| და | with | and /g).map(s => s.trim()).filter(Boolean);

      tokens.forEach(chunk => {
        const numMatch = chunk.match(/(\d+(?:[.,]\d+)?)/);
        const qty = numMatch ? parseFloat(numMatch[1].replace(',', '.')) : 100;
        let unit = 'g';
        if (/tbsp|ს\/კ|სუფრის/.test(chunk)) unit = 'tbsp';
        else if (/tsp|ჩ\/კ|ჩაის/.test(chunk)) unit = 'tsp';
        else if (/ml|მლ/.test(chunk)) unit = 'ml';
        else if (/\bl\b|ლიტრ/.test(chunk)) unit = 'L';

        const cleanWords = chunk.replace(/\d+(?:[.,]\d+)?/g, '').replace(/(grams|gram|g|ml|tbsp|tsp|გ|გრ|მლ|ს\/კ|ჩ\/კ)/g, '').trim();
        const found = getAllFoods().find(f =>
          cleanWords && (f.name.toLowerCase().includes(cleanWords) || getFoodDisplayName(f).toLowerCase().includes(cleanWords))
        );

        if (found) {
          const m = computeFoodItemMacros(found, qty, unit);
          estKcal += m.kcal;
          estProt += m.p;
        } else {
          const grams = qty * (FOOD_UNITS[unit]?.factor || 1);
          estKcal += Math.round(grams * 1.65);
          estProt += Math.round(grams * 0.11);
        }
      });

      appState.aiUsage.count += 1;
      aiPendingResult = {
        name: text,
        kcal: Math.max(20, Math.round(estKcal)),
        p: Math.max(1, Math.round(estProt))
      };
      persistState(true);
      renderApp();
    }

    // =========================================================================
    // 9. BMR / TDEE CALCULATOR & PROFILE SETTINGS
    // =========================================================================
    function calculateBmrTdee() {
      const p = appState.bmrProfile || { weightKg: 62, heightCm: 170, age: 26, activity: 1.55, goalOffset: 0 };
      const w = Number(p.weightKg || 62);
      const h = Number(p.heightCm || 170);
      const a = Number(p.age || 26);
      const isMale = appState.gender === 'male';
      const bmr = isMale ? (10 * w + 6.25 * h - 5 * a + 5) : (10 * w + 6.25 * h - 5 * a - 161);
      const tdee = Math.round(bmr * Number(p.activity || 1.55));
      const target = Math.max(1200, tdee + Number(p.goalOffset || 0));
      const protein = Math.round(w * 2.0);
      return { bmr: Math.round(bmr), tdee, target, protein };
    }

    function updateBmrField(field, val) {
      if (!appState.bmrProfile) appState.bmrProfile = getDefaultState().bmrProfile;
      appState.bmrProfile[field] = Number(val);
      if (field === 'weightKg') {
        if (!appState.measurements) appState.measurements = {};
        appState.measurements.weight = Number(val);
      }
      const calc = calculateBmrTdee();
      appState.calorieTarget = calc.target;
      appState.proteinTarget = calc.protein;
      persistState(true);
      renderApp();
    }

    function updateMeasurementField(field, val) {
      if (!appState.measurements) appState.measurements = {};
      appState.measurements[field] = Number(val);
      if (field === 'weight') {
        if (!appState.bmrProfile) appState.bmrProfile = getDefaultState().bmrProfile;
        appState.bmrProfile.weightKg = Number(val);
        const calc = calculateBmrTdee();
        appState.calorieTarget = calc.target;
        appState.proteinTarget = calc.protein;
      }
      persistState(true);
      renderApp();
    }

    function addExerciseToToday(exId) {
      const found = EXERCISE_DB.find(e => e.id === exId) || EXERCISE_DB[0];
      if (!appState.workouts) appState.workouts = {};
      if (!appState.workouts[TODAY_STR]) {
        appState.workouts[TODAY_STR] = { completed: false, routineName: t('activeWorkout'), entries: [] };
      }
      appState.workouts[TODAY_STR].entries.push({
        id: `${found.id}_${Date.now()}`,
        exerciseId: found.id,
        name: found.name,
        muscle: found.muscle,
        cue: found.cue,
        sets: [{ weight: 20, reps: 10, done: false }]
      });
      persistState(true);
      renderApp();
    }

    function addSetToEntry(entryIdx) {
      const w = appState.workouts?.[TODAY_STR];
      if (!w || !w.entries[entryIdx]) return;
      const prev = w.entries[entryIdx].sets.slice(-1)[0] || { weight: 20, reps: 10 };
      w.entries[entryIdx].sets.push({ weight: prev.weight, reps: prev.reps, done: false });
      persistState(true);
      renderApp();
    }

    function updateWorkoutSet(entryIdx, setIdx, field, val) {
      const w = appState.workouts?.[TODAY_STR];
      if (!w || !w.entries[entryIdx] || !w.entries[entryIdx].sets[setIdx]) return;
      w.entries[entryIdx].sets[setIdx][field] = field === 'done' ? Boolean(val) : Number(val);
      persistState(true);
      if (field === 'done') renderApp();
    }

                <p class="text-[11px] accent-text font-bold">${aiPendingResult.kcal} kcal • ${aiPendingResult.p}g P</p>
              </div>
              <button type="button" onclick="logFoodItemDirect(aiPendingResult.name, aiPendingResult.kcal, aiPendingResult.p); aiPendingResult=null; renderApp();"
                class="px-3 py-1.5 rounded-xl accent-bg text-xs font-extrabold shrink-0">
                ${t('logFoodBtn')}
              </button>
            </div>
          ` : ''}
        </section>
      `;
    }

    function updateCatalogRowPreview(foodId) {
      const f = getAllFoods().find(x => x.id === foodId);
      const el = document.getElementById(`macro_${foodId}`);
      if (!f || !el) return;
      const qty = foodDraftAmounts[foodId] ?? 100;
      const unit = foodDraftUnits[foodId] ?? (f.defaultUnit || 'g');
      const m = computeFoodItemMacros(f, qty, unit);
      el.textContent = `${m.kcal} kcal • ${m.p}g P`;
    }

    function logFavoriteByIndex(idx) {
      const item = (appState.favoriteFoods || [])[idx];
      if (item) logFoodItemDirect(item.name, item.kcal, item.p);
    }

    function logHistoryByIndex(idx) {
      const item = (appState.foodHistory || [])[idx];
      if (item) logFoodItemDirect(item.name, item.kcal, item.p);
    }

    function renderPlanView() {
      const p = appState.bmrProfile || getDefaultState().bmrProfile;
      const m = appState.measurements || getDefaultState().measurements;
      const calc = calculateBmrTdee();

      return `
        <!-- Calorie Calculator -->
        <section class="bg-surface border border-borderDark rounded-3xl p-4 space-y-3">
          <div class="flex items-center justify-between">
            <h2 class="text-lg font-extrabold text-white">${t('calorieCalculator')}</h2>
            <span class="text-xs font-extrabold accent-text">${calc.target} kcal</span>
          </div>

          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="text-[10px] font-bold uppercase text-mutedText block mb-1">${t('weightKg')}</label>
              <input type="number" step="0.5" value="${p.weightKg}"
                onchange="updateBmrField('weightKg', this.value)"
                class="w-full bg-obsidian border border-borderDark rounded-xl px-3 py-2 text-xs font-extrabold text-white" />
            </div>
            <div>
              <label class="text-[10px] font-bold uppercase text-mutedText block mb-1">${t('heightCm')}</label>
              <input type="number" value="${p.heightCm}"
                onchange="updateBmrField('heightCm', this.value)"
                class="w-full bg-obsidian border border-borderDark rounded-xl px-3 py-2 text-xs font-extrabold text-white" />
            </div>
            <div>
              <label class="text-[10px] font-bold uppercase text-mutedText block mb-1">${t('ageYrs')}</label>
              <input type="number" value="${p.age}"
                onchange="updateBmrField('age', this.value)"
                class="w-full bg-obsidian border border-borderDark rounded-xl px-3 py-2 text-xs font-extrabold text-white" />
            </div>
          </div>

          <div>
            <label class="text-[10px] font-bold uppercase text-mutedText block mb-1">${t('goalLabel')}</label>
            <div class="grid grid-cols-3 gap-1.5">
              ${[
                { offset: -400, label: t('fatLoss') },
                { offset: 0, label: t('maintain') },
                { offset: 300, label: t('leanBulk') }
              ].map(g => `
                <button type="button" onclick="updateBmrField('goalOffset', ${g.offset})"
                  class="py-2 px-2 rounded-xl text-[11px] font-extrabold border transition ${Number(p.goalOffset) === g.offset ? 'accent-bg border-transparent' : 'bg-obsidian border-borderDark text-mutedText'}">
                  ${g.label}
                </button>
              `).join('')}
            </div>
          </div>

          <div class="bg-obsidian border border-borderDark rounded-2xl p-3 flex items-center justify-between text-xs">
            <span class="text-mutedText">BMR: <strong class="text-white">${calc.bmr}</strong> • TDEE: <strong class="text-white">${calc.tdee}</strong></span>
            <span class="font-extrabold accent-text">${calc.protein}g ${t('proteinLabel')}</span>
          </div>
        </section>

        <!-- Body Measurements -->
        <section class="bg-surface border border-borderDark rounded-3xl p-4 space-y-3">
          <h3 class="text-sm font-extrabold text-white">${t('bodyMeasurements')}</h3>
          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label class="text-[10px] font-bold uppercase text-mutedText block mb-1">${t('weightKg')}</label>
              <input type="number" step="0.5" value="${m.weight}"
                onchange="updateMeasurementField('weight', this.value)"
                class="w-full bg-obsidian border border-borderDark rounded-xl px-3 py-2 text-xs font-extrabold text-white" />
            </div>
            <div>
              <label class="text-[10px] font-bold uppercase text-mutedText block mb-1">${t('waistCm')}</label>
              <input type="number" step="0.5" value="${m.waist}"
                onchange="updateMeasurementField('waist', this.value)"
                class="w-full bg-obsidian border border-borderDark rounded-xl px-3 py-2 text-xs font-extrabold text-white" />
            </div>
            <div>
              <label class="text-[10px] font-bold uppercase text-mutedText block mb-1">${t('chestCm')}</label>
              <input type="number" step="0.5" value="${m.chest}"
                onchange="updateMeasurementField('chest', this.value)"
                class="w-full bg-obsidian border border-borderDark rounded-xl px-3 py-2 text-xs font-extrabold text-white" />
            </div>
            <div>
              <label class="text-[10px] font-bold uppercase text-mutedText block mb-1">${t('armsCm')}</label>
              <input type="number" step="0.5" value="${m.arms}"
                onchange="updateMeasurementField('arms', this.value)"
                class="w-full bg-obsidian border border-borderDark rounded-xl px-3 py-2 text-xs font-extrabold text-white" />
            </div>
          </div>
        </section>
      `;
    }

    function renderBottomNav() {
      const tabs = [
        {
          id: 'grid',
          label: t('navGrid'),
          icon: `<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M3 10h18M9 4v18M15 4v18"/></svg>`
        },
        {
          id: 'workouts',
          label: t('navWorkouts'),
          icon: `<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 9v6M21 9v6M6 12h12"/></svg>`
        },
        {
          id: 'calories',
          label: t('navCalories'),
          icon: `<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>`
        },
        {
          id: 'plan',
          label: t('navPlan'),
          icon: `<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>`
        }
      ];

      document.getElementById('bottomNav').innerHTML = `
        <div class="max-w-lg mx-auto grid grid-cols-4 pt-2 pb-1 px-2">
          ${tabs.map(tab => {
            const active = appState.activeTab === tab.id;
            return `
              <button type="button" onclick="appState.activeTab='${tab.id}'; renderApp();"
                class="flex flex-col items-center justify-center gap-1 py-1 transition ${active ? 'accent-text' : 'text-mutedText hover:text-white'}">
                ${tab.icon}
                <span class="text-[10px] font-extrabold">${tab.label}</span>
              </button>
            `;
          }).join('')}
        </div>
      `;
    }

    function syncHeaderSpacer() {
      const header = document.getElementById('appHeader');
      const main = document.getElementById('appMain');
      if (!header || !main) return;
      const h = Math.min(165, Math.max(96, Math.round(header.getBoundingClientRect().height)));
      main.style.paddingTop = `${h + 10}px`;
    }

    function renderApp() {
      applyAccentCss(appState.accent);
      renderFrozenHeader();
      renderBottomNav();

      const main = document.getElementById('appMain');
      if (appState.activeTab === 'workouts') {
        main.innerHTML = renderWorkoutsView();
      } else if (appState.activeTab === 'calories') {
        main.innerHTML = renderCaloriesView();
      } else if (appState.activeTab === 'plan') {
        main.innerHTML = renderPlanView();
      } else {
        main.innerHTML = renderGridView();
        requestAnimationFrame(scrollMainYearGridToToday);
      }

      syncHeaderSpacer();
      requestAnimationFrame(syncHeaderSpacer);
    }

    async function initApp() {
      enforceLoginGate();
      await hydrateStateFromVault();
      renderApp();

      if (window.ResizeObserver) {
        const ro = new ResizeObserver(() => syncHeaderSpacer());
        const hdr = document.getElementById('appHeader');
        if (hdr) ro.observe(hdr);
      }
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(syncHeaderSpacer);
      }
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
