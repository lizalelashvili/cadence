    function getSupabaseConfig() {
      try {
        const saved = JSON.parse(localStorage.getItem(SUPABASE_CONFIG_KEY) || 'null');
        if (saved && saved.url && saved.anonKey) {
          return { url: saved.url.trim().replace(/\/rest\/v1\/?$/, ''), anonKey: saved.anonKey.trim() };
        }
      } catch (_) {}
      if (DEFAULT_SUPABASE_URL && DEFAULT_SUPABASE_ANON_KEY) {
        return { url: DEFAULT_SUPABASE_URL.trim().replace(/\/rest\/v1\/?$/, ''), anonKey: DEFAULT_SUPABASE_ANON_KEY.trim() };
      }
      return null;
    }

    function initSupabase() {
      const cfg = getSupabaseConfig();
      if (!cfg || !window.supabase || !window.supabase.createClient) {
        supabaseClient = null;
        return;
      }
      try {
        supabaseClient = window.supabase.createClient(cfg.url, cfg.anonKey);
      } catch (_) {
        supabaseClient = null;
      }
    }

    function getActiveSession() {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const uParam = urlParams.get('u');
        const hParam = urlParams.get('h');
        if (uParam && hParam) {
          const cleanU = uParam.toLowerCase().trim().replace(/[^a-z0-9@._-]/g, '');
          const cleanH = hParam.trim();
          const existing = JSON.parse(localStorage.getItem(ACCOUNT_SESSION_KEY) || 'null');
          if (!existing || existing.username !== cleanU) {
            const hydratedSession = {
              username: cleanU,
              firstName: cleanU.split('@')[0],
              displayName: cleanU.split('@')[0],
              passHash: cleanH,
              expiresAt: Date.now() + SIXTY_DAYS_MS
            };
            localStorage.removeItem(GUEST_MODE_KEY);
            localStorage.setItem(ACCOUNT_SESSION_KEY, JSON.stringify(hydratedSession));
            return hydratedSession;
          }
        }
        const sess = JSON.parse(localStorage.getItem(ACCOUNT_SESSION_KEY) || 'null');
        if (sess && sess.username) {
          if (sess.expiresAt && Date.now() >= sess.expiresAt) {
            localStorage.removeItem(ACCOUNT_SESSION_KEY);
            return null;
          }
          return sess;
        }
      } catch (_) {}
      return null;
    }

    function enforceLoginGate() {
      initSupabase();
      const sess = getActiveSession();
      const isGuest = localStorage.getItem(GUEST_MODE_KEY) === 'true';
      if (!sess && !isGuest) {
        if (window.location.protocol !== 'about:' && !window.location.href.startsWith('blob:')) {
          window.location.href = './login.html';
          return false;
        }
      }
      return true;
    }

    function writeStateToIDB(key, val) {
      return new Promise((resolve) => {
        if (!window.indexedDB) return resolve();
        try {
          const req = indexedDB.open(IDB_NAME, 1);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
          };
          req.onsuccess = () => {
            try {
              const tx = req.result.transaction(IDB_STORE, 'readwrite');
              tx.objectStore(IDB_STORE).put(val, key);
              tx.oncomplete = () => resolve();
              tx.onerror = () => resolve();
            } catch (_) { resolve(); }
          };
          req.onerror = () => resolve();
        } catch (_) { resolve(); }
      });
    }

    function readStateFromIDB(key) {
      return new Promise((resolve) => {
        if (!window.indexedDB) return resolve(null);
        try {
          const req = indexedDB.open(IDB_NAME, 1);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
          };
          req.onsuccess = () => {
            try {
              const tx = req.result.transaction(IDB_STORE, 'readonly');
              const getReq = tx.objectStore(IDB_STORE).get(key);
              getReq.onsuccess = () => resolve(getReq.result || null);
              getReq.onerror = () => resolve(null);
            } catch (_) { resolve(null); }
          };
          req.onerror = () => resolve(null);
        } catch (_) { resolve(null); }
      });
    }

    function mergeStateSnapshots(base, incoming) {
      if (!incoming || typeof incoming !== 'object') return base;
      const baseTs = Number(base._updatedAt || 0);
      const incTs = Number(incoming._updatedAt || 0);
      const newer = incTs >= baseTs ? incoming : base;
      const older = incTs >= baseTs ? base : incoming;

      const mergedWorkouts = Object.assign({}, older.workouts || {}, newer.workouts || {});
      const mergedCalorieLogs = Object.assign({}, older.calorieLogs || {});
      Object.keys(newer.calorieLogs || {}).forEach(d => {
        const oldArr = Array.isArray(older.calorieLogs?.[d]) ? older.calorieLogs[d] : [];
        const newArr = Array.isArray(newer.calorieLogs?.[d]) ? newer.calorieLogs[d] : [];
        const byId = new Map();
        oldArr.forEach(item => { if (item && item.id) byId.set(item.id, item); });
        newArr.forEach(item => { if (item && item.id) byId.set(item.id, item); });
        mergedCalorieLogs[d] = Array.from(byId.values());
      });

      const favMap = new Map();
      (older.favoriteFoods || []).forEach(f => { if (f && f.name) favMap.set(f.name.toLowerCase(), f); });
      (newer.favoriteFoods || []).forEach(f => { if (f && f.name) favMap.set(f.name.toLowerCase(), f); });

      const customMap = new Map();
      (older.customExercises || []).forEach(e => { if (e && e.id) customMap.set(e.id, e); });
      (newer.customExercises || []).forEach(e => { if (e && e.id) customMap.set(e.id, e); });

      return Object.assign({}, older, newer, {
        workouts: mergedWorkouts,
        calorieLogs: mergedCalorieLogs,
        favoriteFoods: Array.from(favMap.values()),
        customExercises: Array.from(customMap.values()),
        _updatedAt: Math.max(baseTs, incTs)
      });
    }

    function persistState(immediateCloud = false) {
      appState._updatedAt = Date.now();
      const sess = getActiveSession();
      if (sess && sess.passHash) appState._passHash = sess.passHash;
      if (appState.firstName) appState._displayName = appState.firstName;

      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
        if (sess && sess.username) {
          const userKey = `${ACCOUNT_VAULT_PREFIX}${sess.username}`;
          localStorage.setItem(userKey, JSON.stringify(appState));
          localStorage.setItem(`${userKey}_backup`, JSON.stringify(appState));
          writeStateToIDB(userKey, appState);
        } else {
          writeStateToIDB(STORAGE_KEY, appState);
        }
      } catch (_) {}

      if (sess && sess.username && supabaseClient) {
        clearTimeout(cloudSyncTimer);
        if (immediateCloud) {
          pushStateToSupabase(sess);
        } else {
          cloudSyncTimer = setTimeout(() => pushStateToSupabase(sess), 450);
        }
      }
    }

    async function pushStateToSupabase(sess) {
      if (!sess || !sess.username || !supabaseClient) return;
      try {
        await supabaseClient.from('cadence_profiles').upsert({
          username: sess.username,
          pass_hash: sess.passHash || appState._passHash || '',
          state_json: appState,
          updated_at: new Date().toISOString()
        }, { onConflict: 'username' });
      } catch (_) {}
    }

    function flushSupabaseKeepalive() {
      const sess = getActiveSession();
      const cfg = getSupabaseConfig();
      if (!sess || !sess.username || !cfg) return;
      try {
        fetch(`${cfg.url}/rest/v1/cadence_profiles?on_conflict=username`, {
          method: 'POST',
          keepalive: true,
          headers: {
            'Content-Type': 'application/json',
            'apikey': cfg.anonKey,
            'Authorization': `Bearer ${cfg.anonKey}`,
            'Prefer': 'resolution=merge-duplicates'
          },
          body: JSON.stringify({
            username: sess.username,
            pass_hash: sess.passHash || appState._passHash || '',
            state_json: appState,
            updated_at: new Date().toISOString()
          })
        }).catch(() => {});
      } catch (_) {}
    }

    async function hydrateStateFromVault() {
      const sess = getActiveSession();
      let merged = getDefaultState();

      try {
        const localGlobal = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        if (localGlobal) merged = mergeStateSnapshots(merged, localGlobal);
      } catch (_) {}

      if (sess && sess.username) {
        const userKey = `${ACCOUNT_VAULT_PREFIX}${sess.username}`;
        try {
          const localUser = JSON.parse(localStorage.getItem(userKey) || localStorage.getItem(`${userKey}_backup`) || 'null');
          if (localUser) merged = mergeStateSnapshots(merged, localUser);
        } catch (_) {}

        const idbUser = await readStateFromIDB(userKey);
        if (idbUser) merged = mergeStateSnapshots(merged, idbUser);

        if (supabaseClient) {
          try {
            const { data } = await supabaseClient
              .from('cadence_profiles')
              .select('state_json')
              .eq('username', sess.username)
              .maybeSingle();
            if (data && data.state_json) {
              merged = mergeStateSnapshots(merged, data.state_json);
            }
          } catch (_) {}
        }

        if (sess.firstName && (!merged.firstName || merged.firstName === 'Athlete')) {
          merged.firstName = sess.firstName;
        }
        if (sess.lastName && !merged.lastName) merged.lastName = sess.lastName;
        if (sess.gender && !merged.gender) merged.gender = sess.gender;
      } else {
        const idbGlobal = await readStateFromIDB(STORAGE_KEY);
        if (idbGlobal) merged = mergeStateSnapshots(merged, idbGlobal);
      }

      if (!merged.aiCalorieUsage || merged.aiCalorieUsage.date !== TODAY_STR) {
        merged.aiCalorieUsage = { date: TODAY_STR, count: 0 };
      }
      if (!merged.accent || !THEME_MAP[merged.accent]) {
        merged.accent = 'blue';
      }

      appState = merged;
      updateHomeScreenManifest();
    }

    function updateHomeScreenManifest() {
      try {
        const theme = THEME_MAP[appState.accent] || THEME_MAP.blue;
        const hex = theme.hex;
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#0A0A0C';
        ctx.fillRect(0, 0, 512, 512);
        const pad = 108, gap = 40, sq = 128, r = 30;
        const drawSq = (x, y, c) => {
          ctx.fillStyle = c;
          ctx.beginPath();
          ctx.moveTo(x + r, y);
          ctx.lineTo(x + sq - r, y);
          ctx.quadraticCurveTo(x + sq, y, x + sq, y + r);
          ctx.lineTo(x + sq, y + sq - r);
          ctx.quadraticCurveTo(x + sq, y + sq, x + sq - r, y + sq);
          ctx.lineTo(x + r, y + sq);
          ctx.quadraticCurveTo(x, y + sq, x, y + sq - r);
          ctx.lineTo(x, y + r);
          ctx.quadraticCurveTo(x, y, x + r, y);
          ctx.closePath();
          ctx.fill();
        };
        drawSq(pad, pad, hex);
        drawSq(pad + sq + gap, pad, '#27272E');
        drawSq(pad, pad + sq + gap, '#27272E');
        drawSq(pad + sq + gap, pad + sq + gap, hex);

        const dataUrl = canvas.toDataURL('image/png');
        const ati = document.getElementById('appleTouchIcon');
        const ati512 = document.getElementById('appleTouchIcon512');
        const fav = document.getElementById('faviconIcon');
        if (ati) ati.href = dataUrl;
        if (ati512) ati512.href = dataUrl;
        if (fav) fav.href = dataUrl;

        const sess = getActiveSession();
        let startUrl = './index.html';
        if (sess && sess.username && sess.passHash) {
          startUrl = `./index.html?u=${encodeURIComponent(sess.username)}&h=${encodeURIComponent(sess.passHash)}`;
        }
        const manifestObj = {
          name: 'CADENCE — 365-Day Workout Tracker',
          short_name: 'CADENCE',
          start_url: startUrl,
          display: 'standalone',
          background_color: '#0A0A0C',
          theme_color: '#0A0A0C',
          icons: [{ src: dataUrl, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }]
        };
        const blob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
        const mEl = document.getElementById('appManifest');
        if (mEl) mEl.href = URL.createObjectURL(blob);
      } catch (_) {}
    }

    function applyTheme(accentKey) {
      const key = THEME_MAP[accentKey] ? accentKey : 'blue';
      const t = THEME_MAP[key];
      document.documentElement.style.setProperty('--accent', t.hex);
      document.documentElement.style.setProperty('--accent-soft', t.soft);
      document.documentElement.style.setProperty('--accent-border', t.border);
    }

    function cycleAccentColor() {
      const keys = Object.keys(THEME_MAP);
      const idx = keys.indexOf(appState.accent);
      const next = keys[(idx + 1) % keys.length];
      appState.accent = next;
      applyTheme(next);
      persistState(true);
      renderApp();
      showToast(`Accent: ${THEME_MAP[next].label}`);
    }

    function showToast(msg) {
      const el = document.getElementById('toastBanner');
      if (!el) return;
      el.textContent = msg;
      el.classList.remove('opacity-0');
      el.classList.add('opacity-100');
      clearTimeout(el._t);
      el._t = setTimeout(() => {
        el.classList.remove('opacity-100');
        el.classList.add('opacity-0');
      }, 2200);
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatDisplayDate(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      return dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

    function getCompletedDaysCurrentYear() {
      const yrPrefix = `${TODAY_OBJ.getFullYear()}-`;
      return Object.keys(appState.workouts || {}).filter(d => d.startsWith(yrPrefix) && appState.workouts[d]?.completed).length;
    }

    function getCurrentWeekStreak() {
      let streak = 0;
      const cur = new Date(TODAY_OBJ);
      const monOffset = (cur.getDay() + 6) % 7;
      cur.setDate(cur.getDate() - monOffset);

      for (let w = 0; w < 52; w++) {
        let weekHasWorkout = false;
        for (let d = 0; d < 7; d++) {
          const check = new Date(cur);
          check.setDate(cur.getDate() + d);
          const ds = toLocalDateStr(check);
          if (appState.workouts?.[ds]?.completed) {
            weekHasWorkout = true;
            break;
          }
        }
        if (weekHasWorkout) {
          streak++;
          cur.setDate(cur.getDate() - 7);
        } else if (w === 0) {
          cur.setDate(cur.getDate() - 7);
        } else {
          break;
        }
      }
      return streak;
    }

        skull_crusher: 'press',
        core: 'hinge',
        hanging_raise: 'pull',
        ab_wheel: 'press',
        twist: 'lateral',
        plank: 'press',
        treadmill: 'cardio',
        bike: 'cardio',
        erg_row: 'pull',
        jump_rope: 'cardio',
        swim: 'press',
        boxing: 'lateral'
      };

      const key = map[animType] ? animType : (aliasMap[animType] || 'squat');
      return `
        <div class="rounded-2xl bg-obsidian border border-borderDark p-2.5 flex flex-col items-center">
          ${map[key]}
          <span class="text-[10px] font-bold uppercase tracking-wider accent-text mt-0.5">Controlled Tempo · Full Range</span>
        </div>
      `;
    }

    function getExercisePrText(exId) {
      let bestWeight = 0;
      let bestReps = 0;
      Object.keys(appState.workouts || {}).forEach(ds => {
        const w = appState.workouts[ds];
        (w?.entries || []).forEach(ent => {
          if (ent.exerciseId === exId) {
            (ent.sets || []).forEach(s => {
              const wt = parseFloat(s.weight) || 0;
              const rp = parseInt(s.reps, 10) || 0;
              if (wt > bestWeight || (wt === bestWeight && rp > bestReps)) {
                bestWeight = wt;
                bestReps = rp;
              }
            });
          }
        });
      });
      return bestWeight > 0 ? `PR: ${bestWeight}kg × ${bestReps}` : 'No PR yet';
    }

    // =========================================================
    // 8. TAB 1: YEAR / MONTH GRID & CALORIE OVERVIEW
    // =========================================================
    function buildYearMatrix(year) {
      const jan1 = new Date(year, 0, 1);
      const dec31 = new Date(year, 11, 31);
      const startOffset = (jan1.getDay() + 6) % 7; // Monday = 0
      const startDate = new Date(year, 0, 1 - startOffset);

      const weeks = [];
      let cur = new Date(startDate);
      while (cur <= dec31 || weeks.length < 52) {
        const col = [];
        for (let r = 0; r < 7; r++) {
          const inYear = cur.getFullYear() === year;
          col.push({
            dateStr: toLocalDateStr(cur),
            inYear,
            month: cur.getMonth(),
            day: cur.getDate()
          });
          cur.setDate(cur.getDate() + 1);
        }
        weeks.push(col);
        if (cur.getFullYear() > year) break;
      }
      return weeks;
    }

    function getDayCalorieTotals(dateStr) {
      const items = Array.isArray(appState.calorieLogs?.[dateStr]) ? appState.calorieLogs[dateStr] : [];
      let cal = 0, p = 0;
      items.forEach(it => {
        cal += Number(it.cal || 0);
        p += Number(it.p || 0);
      });
      return { cal: Math.round(cal), p: Math.round(p), items };
    }

    function renderGridView() {
      const year = TODAY_OBJ.getFullYear();
      const weeks = buildYearMatrix(year);
      const completedCount = getCompletedDaysCurrentYear();
      const totalDaysYr = ((year % 4 === 0 && year % 100 !== 0) || year % 400 === 0) ? 366 : 365;
      const pct = Math.round((completedCount / totalDaysYr) * 100);
      const todayDone = Boolean(appState.workouts?.[TODAY_STR]?.completed);

      const calTotals = getDayCalorieTotals(TODAY_STR);
      const targetCal = Number(appState.calorieTarget || 2000);
      const targetP = Number(appState.proteinTarget || 130);
      const leftCal = Math.max(0, targetCal - calTotals.cal);
      const calPct = Math.min(100, Math.round((calTotals.cal / Math.max(1, targetCal)) * 100));

      const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      const dayLabels = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];

      let gridBodyHtml = '';
      if (gridMode === 'yearly') {
        let monthHeaderCols = '';
        let lastMonth = -1;
        weeks.forEach(col => {
          const firstInYear = col.find(c => c.inYear);
          if (firstInYear && firstInYear.month !== lastMonth) {
            lastMonth = firstInYear.month;
            monthHeaderCols += `<div class="w-3.5 text-[9px] font-bold text-mutedText shrink-0">${monthNames[lastMonth]}</div>`;
          } else {

          }

        let rowsHtml = '';
        for (let r = 0; r < 7; r++) {

            const cell = col[r];
            if (!cell.inYear) {
              rowCells += `<div class="w-3.5 h-3.5 rounded-[4px] bg-transparent shrink-0"></div>`;
            } else {
              const isDone = Boolean(appState.workouts?.[cell.dateStr]?.completed);
              const isToday = cell.dateStr === TODAY_STR;
              rowCells += `
                <button type="button" onclick="openDayInspector('${cell.dateStr}')" title="${cell.dateStr}"
                  class="w-3.5 h-3.5 rounded-[4px] shrink-0 transition active:scale-90 ${
                    isDone ? 'accent-bg' : 'bg-obsidian border border-borderDark/90 hover:border-white/30'
                  } ${isToday ? 'ring-1 ring-white' : ''}"></button>
              `;
            }
          });
          rowsHtml += `
            <div class="flex items-center gap-1">
              <span class="w-3 text-[9px] font-extrabold text-mutedText text-center shrink-0">${dayLabels[r]}</span>
              <div class="flex gap-1">${rowCells}</div>
            </div>
          `;
        }

        gridBodyHtml = `
          <div class="overflow-x-auto no-scrollbar pb-1" id="yearGridScrollContainer">
            <div class="inline-flex flex-col gap-1 min-w-max">
              <div class="flex items-center gap-1 pl-4">
                ${monthHeaderCols}
              </div>
              ${rowsHtml}
            </div>
          </div>
        `;
      } else {
        const mYear = selectedMonthCursor.getFullYear();
        const mIdx = selectedMonthCursor.getMonth();
        const mTitle = selectedMonthCursor.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
        const firstDay = new Date(mYear, mIdx, 1);
        const daysInMonth = new Date(mYear, mIdx + 1, 0).getDate();
        const leadBlanks = (firstDay.getDay() + 6) % 7;

        let cellsHtml = '';
        for (let b = 0; b < leadBlanks; b++) {
          cellsHtml += `<div class="h-9 rounded-xl bg-transparent"></div>`;
        }
        for (let d = 1; d <= daysInMonth; d++) {
          const ds = `${mYear}-${String(mIdx + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          const isDone = Boolean(appState.workouts?.[ds]?.completed);
          const isToday = ds === TODAY_STR;
          cellsHtml += `
            <button type="button" onclick="openDayInspector('${ds}')"
              class="h-9 rounded-xl text-xs font-extrabold flex items-center justify-center transition active:scale-95 ${
                isDone ? 'accent-bg' : 'bg-obsidian border border-borderDark text-white hover:border-white/30'
              } ${isToday ? 'ring-1 ring-white' : ''}">
              ${d}
            </button>
          `;
        }

        gridBodyHtml = `
          <div class="space-y-2.5">
            <div class="flex items-center justify-between">
              <button type="button" onclick="shiftMonthCursor(-1)" class="px-3 py-1.5 rounded-xl bg-obsidian border border-borderDark text-xs font-extrabold text-white">‹</button>
              <span class="text-xs font-extrabold text-white">${mTitle}</span>
              <button type="button" onclick="shiftMonthCursor(1)" class="px-3 py-1.5 rounded-xl bg-obsidian border border-borderDark text-xs font-extrabold text-white">›</button>
            </div>
            <div class="grid grid-cols-7 gap-1.5 text-center">
              ${dayLabels.map(l => `<span class="text-[10px] font-extrabold text-mutedText">${l}</span>`).join('')}
              ${cellsHtml}
            </div>
          </div>
        `;
      }

      return `
        <!-- Today's Calorie Summary Widget -->
        <section onclick="switchTab('calories')" class="bg-surface border border-borderDark rounded-3xl p-4 space-y-2.5 cursor-pointer hover:border-white/20 transition">
          <div class="flex items-baseline justify-between gap-2">
            <div>
              <span class="text-2xl font-extrabold text-white">${calTotals.cal}</span>
              <span class="text-xs font-bold text-mutedText"> / ${targetCal} kcal</span>
            </div>
            <span class="text-xs font-extrabold accent-text">${leftCal} kcal left</span>
          </div>
          <div class="w-full h-2 rounded-full bg-obsidian overflow-hidden">
            <div class="h-full rounded-full accent-bg transition-all duration-300" style="width: ${calPct}%;"></div>
          </div>
          <div class="flex items-center justify-between text-[11px] font-semibold text-mutedText">
            <span>Protein: ${calTotals.p}g / ${targetP}g</span>
            <span>${calPct}% of daily target</span>
          </div>
        </section>

        <!-- Primary 365-Day Consistency Card -->
        <section class="bg-surface border border-borderDark rounded-3xl p-4 space-y-3.5">
          <div class="flex items-center justify-between gap-2">
            <div>
              <p class="text-[10px] font-extrabold uppercase tracking-wider accent-text">Jan 1 – Dec 31 • ${year}</p>
              <h2 class="text-base font-extrabold text-white">${completedCount} / ${totalDaysYr} Days (${pct}%)</h2>
            </div>
            <div class="flex items-center gap-1.5">
              <div class="flex bg-obsidian border border-borderDark p-0.5 rounded-xl">
                <button type="button" onclick="gridMode='yearly'; renderApp();"
                  class="px-2.5 py-1 rounded-lg text-[10px] font-extrabold transition ${gridMode === 'yearly' ? 'accent-bg' : 'text-mutedText hover:text-white'}">
                  Yearly
                </button>
                <button type="button" onclick="gridMode='monthly'; renderApp();"
                  class="px-2.5 py-1 rounded-lg text-[10px] font-extrabold transition ${gridMode === 'monthly' ? 'accent-bg' : 'text-mutedText hover:text-white'}">
                  Monthly
                </button>
              </div>
              <button type="button" onclick="openFullScreenGrid()" title="Full Screen Grid"
                class="w-8 h-8 rounded-xl bg-obsidian border border-borderDark text-xs font-extrabold text-white flex items-center justify-center hover:border-white/30">
                ⤢
              </button>
            </div>
          </div>

          ${gridBodyHtml}

          <div class="grid grid-cols-2 gap-2 pt-1">
            <button type="button" onclick="toggleQuickCheckInToday()"
              class="py-3 rounded-2xl text-xs font-extrabold border transition active:scale-[0.98] ${todayDone ? 'accent-soft-bg accent-border accent-text' : 'bg-obsidian border-borderDark text-white'}">
              ${todayDone ? '✓ Checked In Today' : '✓ Quick Check-In'}
            </button>
            <button type="button" onclick="openQuickLogToday()"
              class="py-3 rounded-2xl text-xs font-extrabold accent-bg transition active:scale-[0.98]">
              + Log Today's Workout
            </button>
          </div>
        </section>

        <!-- Quick Start Routine Widget -->
        <section class="bg-surface border border-borderDark rounded-3xl p-4 space-y-3">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-[10px] font-extrabold uppercase tracking-wider accent-text">1-Tap Launch</p>

            <button type="button" onclick="switchTab('plan')" class="text-[11px] font-extrabold text-mutedText hover:text-white">Edit Splits →</button>
          </div>
          ${(appState.routines || []).length === 0 ? `
            <p class="text-xs text-mutedText">No routines saved yet. Create one in Body &amp; Plan.</p>
          ` : `
            <div class="space-y-2">
              ${(appState.routines || []).map(r => `
                <div class="flex items-center justify-between gap-2 p-3 rounded-2xl bg-obsidian border border-borderDark">
                  <div class="min-w-0">

                  </div>
                  <button type="button" onclick="selectedWorkoutDate=TODAY_STR; startRoutineToday('${r.id}'); switchTab('workouts');"

        </section>
      `;
    }

    function shiftMonthCursor(delta) {
      selectedMonthCursor = new Date(selectedMonthCursor.getFullYear(), selectedMonthCursor.getMonth() + delta, 1);

    function toggleQuickCheckInToday() {

    function openFullScreenGrid() {
      const overlay = document.getElementById('fullScreenGridOverlay');
      if (!overlay) return;
      const year = TODAY_OBJ.getFullYear();
      const weeks = buildYearMatrix(year);
      const dayLabels = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
      const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

      let rowsHtml = '';

        rowsHtml += `<div class="flex items-center gap-1.5"><span class="w-4 text-[10px] font-extrabold text-mutedText">${dayLabels[r]}</span><div class="flex gap-1.5">${rowCells}</div></div>`;
      }

      overlay.innerHTML = `
        <div class="flex items-center justify-between pb-4 border-b border-borderDark">

            <p class="text-[10px] font-extrabold uppercase tracking-wider accent-text">${year} Overview</p>

      overlay.classList.remove('hidden');

    function getAiRemainingCount() {
      if (!appState.aiCalorieUsage || appState.aiCalorieUsage.date !== TODAY_STR) {
        appState.aiCalorieUsage = { date: TODAY_STR, count: 0 };
      }
      return Math.max(0, 3 - Number(appState.aiCalorieUsage.count || 0));
    }

    function estimateMealLocallyFallback(rawText) {
      const text = rawText.toLowerCase();
      let totalCal = 0;
      let totalP = 0;
      const matchedNames = [];

      const rules = [
        { kw: ['chicken breast', 'chicken fillet', 'ქათმის ფილე'], cal: 165, p: 31, label: 'Chicken Breast (100g)' },
        { kw: ['chicken', 'ქათამი'], cal: 190, p: 27, label: 'Chicken' },
        { kw: ['brown rice', 'ყავისფერი ბრინჯი'], cal: 150, p: 3, label: 'Brown Rice' },
        { kw: ['rice', 'ბრინჯი'], cal: 180, p: 4, label: 'Rice' },
        { kw: ['egg', 'კვერცხი'], cal: 72, p: 6, label: 'Egg' },
        { kw: ['salmon', 'ორაგული'], cal: 210, p: 20, label: 'Salmon' },
        { kw: ['olive oil', 'oil', 'ზეითუნის', 'ზეთი'], cal: 60, p: 0, label: 'Cooking Oil (~0.5 tbsp)' },
        { kw: ['bread', 'პური'], cal: 120, p: 4, label: 'Bread' },
        { kw: ['cheese', 'sulguni', 'ყველი', 'სულგუნი'], cal: 135, p: 9, label: 'Cheese' },
        { kw: ['yogurt', 'matsoni', 'მაწონი', 'იოგურტი'], cal: 120, p: 12, label: 'Yogurt' },
        { kw: ['banana', 'ბანანი'], cal: 105, p: 1, label: 'Banana' },
        { kw: ['oats', 'oatmeal', 'შვრია'], cal: 190, p: 7, label: 'Oats' },
        { kw: ['khachapuri', 'ხაჭაპური'], cal: 420, p: 16, label: 'Khachapuri Slice' },
        { kw: ['khinkali', 'ხინკალი'], cal: 135, p: 7, label: 'Khinkali' },
        { kw: ['salad', 'tomato', 'cucumber', 'სალათი'], cal: 45, p: 2, label: 'Fresh Salad' }
      ];

      rules.forEach(r => {
        if (r.kw.some(k => text.includes(k))) {
          totalCal += r.cal;
          totalP += r.p;
          matchedNames.push(r.label);
        }
      });

      if (totalCal === 0) {
        totalCal = 340;
        totalP = 18;
      }

      return {
        name: rawText.trim().slice(0, 64),
        cal: Math.round(totalCal),
        p: Math.round(totalP),
        notes: matchedNames.length ? `Estimated from: ${matchedNames.join(', ')}` : 'Estimated balanced portion'
      };
    }

    function calculateMealWithAI() {
      const rem = getAiRemainingCount();
      if (rem <= 0) {
        showToast('Daily 3/3 AI limit reached · Resets at 00:00');
        return;
      }
      const query = (aiMealInputText || '').trim();
      if (!query) {
        showToast('Describe what you ate first');
        return;
      }

      const est = estimateMealLocallyFallback(query);
      appState.aiCalorieUsage = {
        date: TODAY_STR,
        count: Number(appState.aiCalorieUsage?.count || 0) + 1
      };
      appState.pendingAiResult = {
        name: est.name,
        cal: est.cal,
        p: est.p,
        notes: est.notes,
        meal: selectedMealBucket
      };
      persistState(true);
      flushSupabaseKeepalive();
      renderApp();
    }

      const res = appState.pendingAiResult;
      if (!res) return;
      logFoodItemDirect(res.name, res.cal, res.p, res.meal || selectedMealBucket);
      appState.pendingAiResult = null;
      aiMealInputText = '';

      showToast(`Logged ${res.name} (${res.cal} kcal)`);

    function getCurrentWeekMeals() {
      const list = [];
      const cur = new Date(TODAY_OBJ);
      const monDiff = (cur.getDay() + 6) % 7;
      cur.setDate(cur.getDate() - monDiff);
      for (let i = 0; i < 7; i++) {
        const dt = new Date(cur);
        dt.setDate(cur.getDate() + i);
        const ds = toLocalDateStr(dt);
        (appState.calorieLogs?.[ds] || []).forEach(m => {
          list.push(Object.assign({}, m, { dateStr: ds }));
        });
      }
      return list;
    }

            </button>

            ${pending ? `
              <div class="p-3 rounded-xl bg-surface border accent-border space-y-2">
                <div class="flex items-center justify-between gap-2">
                  <p class="text-xs font-extrabold text-white truncate">${escapeHtml(pending.name)}</p>
                  <span class="text-xs font-extrabold accent-text shrink-0">${pending.cal} kcal · ${pending.p}g P</span>
                </div>
                <p class="text-[10px] text-mutedText">${escapeHtml(pending.notes || '')}</p>
                <div class="grid grid-cols-2 gap-2">
                  <button type="button" onclick="savePendingAiToFavorites()" class="py-2 rounded-xl bg-obsidian border border-borderDark text-[11px] font-extrabold text-amber-400">★ Favorite</button>
                  <button type="button" onclick="logPendingAiMeal()" class="py-2 rounded-xl accent-bg text-[11px] font-extrabold">+ Add to ${selectedMealBucket}</button>
                </div>
              </div>
            ` : ''}
          </div>
        </section>

        <!-- Unified Daily Logs / Favorites / History Card -->
        ${renderUnifiedLogsFavoritesHistoryCardHtml()}

        <!-- Quick Food Database -->
        <section class="bg-surface border border-borderDark rounded-3xl p-4 space-y-3">
          <div class="flex items-center justify-between">
            <h3 class="text-sm font-extrabold text-white">Quick Food Library</h3>
            <span class="text-[10px] font-bold text-mutedText">Logs to ${selectedMealBucket}</span>
          </div>
          <input type="text" value="${escapeHtml(foodSearchQuery)}"
            oninput="foodSearchQuery=this.value; renderApp();"
            placeholder="Search foods (chicken, rice, khachapuri, eggs...)"
            class="w-full bg-obsidian border border-borderDark rounded-2xl px-3.5 py-2.5 text-xs text-white focus:outline-none" />
          <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-1">
            ${cats.map(c => `
              <button type="button" onclick="foodCategoryFilter='${c}'; renderApp();"
                class="px-2.5 py-1 rounded-xl text-[10px] font-extrabold shrink-0 ${foodCategoryFilter === c ? 'accent-bg' : 'bg-obsidian border border-borderDark text-mutedText'}">
                ${c}
              </button>
            `).join('')}
          </div>
          <div class="space-y-1.5 max-h-64 overflow-y-auto pr-1">
            ${foods.map(f => `
              <div class="flex items-center justify-between gap-2 p-2.5 rounded-2xl bg-obsidian border border-borderDark">
                <div class="min-w-0">
                  <p class="text-xs font-bold text-white truncate">${escapeHtml(f.name)}</p>
                  <p class="text-[10px] text-mutedText">${f.cal} kcal · ${f.p}g protein</p>
                </div>
                <div class="flex items-center gap-1.5 shrink-0">
                  <button type="button" onclick="toggleFavoriteByFoodId('${f.id}')" class="w-7 h-7 rounded-xl bg-surface border border-borderDark text-xs text-amber-400">★</button>
                  <button type="button" onclick="logFoodById('${f.id}')" class="px-3 py-1.5 rounded-xl accent-bg text-[11px] font-extrabold">+ Add</button>
                </div>
              </div>
            `).join('')}
          </div>
        </section>
      `;
    }

    // =========================================================
    // 12. TAB 4: BODY & PLAN (SPLITS, METABOLIC CALCULATOR, MEASUREMENTS)
    // =========================================================
    function calculateBmrAndTdee() {
      const bp = appState.bmrProfile || { age: 26, heightCm: 168, weightKg: 62, activity: 1.55, goalOffset: 0 };
      const w = Number(bp.weightKg || 62);
      const h = Number(bp.heightCm || 168);
      const a = Number(bp.age || 26);
      const base = (10 * w) + (6.25 * h) - (5 * a);
      const bmr = Math.round(appState.gender === 'male' ? base + 5 : base - 161);
      const tdee = Math.round(bmr * Number(bp.activity || 1.55));
      const target = Math.max(1100, tdee + Number(bp.goalOffset || 0));
      return { bmr, tdee, target };
    }

    function updateBmrField(field, val) {
      if (!appState.bmrProfile) appState.bmrProfile = { age: 26, heightCm: 168, weightKg: 62, activity: 1.55, goalOffset: 0 };
      appState.bmrProfile[field] = Number(val);
      persistState();
      renderApp();
    }

    function applyCalculatedCalorieTarget(kcal) {
      appState.calorieTarget = Number(kcal);
      const wt = Number(appState.bmrProfile?.weightKg || 62);
      appState.proteinTarget = Math.round(wt * 1.9);
      persistState(true);
      renderApp();
      showToast(`Daily target set to ${kcal} kcal (${appState.proteinTarget}g protein)`);
    }

    function createNewRoutine() {
      const id = `r_${Date.now()}`;
      appState.routines.push({
        id,
        name: `Training Split #${appState.routines.length + 1}`,
        exercises: []
      });
      persistState(true);
      renderApp();
    }

    function renameRoutine(id, name) {
      const r = (appState.routines || []).find(item => item.id === id);
      if (!r) return;
      r.name = name.trim() || 'Workout Split';
      persistState(true);
    }

    function renderPlanView() {
      const bp = appState.bmrProfile || { age: 26, heightCm: 168, weightKg: 62, activity: 1.55, goalOffset: 0 };
      const { bmr, tdee, target } = calculateBmrAndTdee();
      const m = appState.measurements || { unit: 'metric', weight: '62', waist: '68', hips: '96', chest: '88', arms: '28', thighs: '54' };
      const isImp = m.unit === 'imperial';

      return `
        <!-- Training Splits & Routines -->
        <section class="bg-surface border border-borderDark rounded-3xl p-4 space-y-3">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-[10px] font-extrabold uppercase tracking-wider accent-text">Workout Templates</p>
              <h2 class="text-base font-extrabold text-white">Saved Training Splits</h2>
            </div>
            <button type="button" onclick="createNewRoutine()" class="px-3 py-1.5 rounded-xl accent-bg text-xs font-extrabold">+ New Split</button>
          </div>

          <div class="space-y-3">
            ${(appState.routines || []).map(r => `
              <div class="p-3.5 rounded-2xl bg-obsidian border border-borderDark space-y-2.5">
                <input type="text" value="${escapeHtml(r.name)}"
                  onchange="renameRoutine('${r.id}', this.value)"
                  class="w-full bg-surface border border-borderDark rounded-xl px-3 py-2 text-xs font-extrabold text-white focus:outline-none" />
                <div class="space-y-1">
                  ${(r.exercises || []).map((exId, idx) => {
                    const ex = getExerciseById(exId);
                    return `<p class="text-[11px] text-mutedText">${idx + 1}. <span class="text-white font-semibold">${escapeHtml(ex.name)}</span></p>`;
                  }).join('')}
                </div>
                <button type="button" onclick="openExercisePicker('routine', '${r.id}')"
                  class="w-full py-2.5 rounded-xl bg-surface border border-borderDark text-[11px] font-extrabold text-white hover:border-white/30">
                  + Add / Edit Exercises in Routine
                </button>
              </div>
            `).join('')}
          </div>
        </section>

        <!-- Metabolic & Calorie Calculator -->
        <section class="bg-surface border border-borderDark rounded-3xl p-4 space-y-3.5">
          <div>
            <h2 class="text-base font-extrabold text-white">Metabolic &amp; Calorie Calculator</h2>
          </div>

          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="text-[10px] font-bold text-mutedText block mb-1">Age (yrs)</label>
              <input type="number" value="${bp.age}" onchange="updateBmrField('age', this.value)"
                class="w-full bg-obsidian border border-borderDark rounded-2xl px-3 py-2.5 text-xs font-extrabold text-white text-center" />
            </div>
            <div>
              <label class="text-[10px] font-bold text-mutedText block mb-1">Height (cm)</label>
              <input type="number" value="${bp.heightCm}" onchange="updateBmrField('heightCm', this.value)"
                class="w-full bg-obsidian border border-borderDark rounded-2xl px-3 py-2.5 text-xs font-extrabold text-white text-center" />
            </div>
            <div>
              <label class="text-[10px] font-bold text-mutedText block mb-1">Weight (kg)</label>
              <input type="number" value="${bp.weightKg}" onchange="updateBmrField('weightKg', this.value)"
                class="w-full bg-obsidian border border-borderDark rounded-2xl px-3 py-2.5 text-xs font-extrabold text-white text-center" />
            </div>
          </div>

          <div>
            <label class="text-[10px] font-bold text-mutedText block mb-1">Weekly Activity Level</label>
            <select onchange="updateBmrField('activity', this.value)"
              class="w-full bg-obsidian border border-borderDark rounded-2xl px-3.5 py-2.5 text-xs font-bold text-white focus:outline-none">
              <option value="1.2" ${bp.activity == 1.2 ? 'selected' : ''}>Sedentary (Desk job, minimal exercise)</option>
              <option value="1.375" ${bp.activity == 1.375 ? 'selected' : ''}>Lightly Active (1–2 workouts/week)</option>
              <option value="1.55" ${bp.activity == 1.55 ? 'selected' : ''}>Moderately Active (3–5 workouts/week)</option>
              <option value="1.725" ${bp.activity == 1.725 ? 'selected' : ''}>Very Active (6–7 workouts/week)</option>
            </select>
          </div>

          <div class="grid grid-cols-3 gap-2">
            ${[
              { label: 'Fat Loss (-400)', offset: -400 },
              { label: 'Maintain', offset: 0 },
              { label: 'Lean Bulk (+300)', offset: 300 }
            ].map(g => `
              <button type="button" onclick="updateBmrField('goalOffset', ${g.offset})"
                class="py-2.5 rounded-2xl text-[11px] font-extrabold border transition ${Number(bp.goalOffset) === g.offset ? 'accent-bg border-transparent' : 'bg-obsidian border-borderDark text-mutedText'}">
                ${g.label}
              </button>
            `).join('')}
          </div>

          <div class="grid grid-cols-3 gap-2 text-center">
            <div class="p-3 rounded-2xl bg-obsidian border border-borderDark">
              <p class="text-[9px] font-bold text-mutedText uppercase">BMR</p>
              <p class="text-sm font-extrabold text-white mt-0.5">${bmr}</p>
              <p class="text-[9px] text-mutedText">kcal/day</p>
            </div>
            <div class="p-3 rounded-2xl bg-obsidian border border-borderDark">
              <p class="text-[9px] font-bold text-mutedText uppercase">TDEE</p>
              <p class="text-sm font-extrabold text-white mt-0.5">${tdee}</p>
              <p class="text-[9px] text-mutedText">maintenance</p>
            </div>
            <div class="p-3 rounded-2xl bg-obsidian border accent-border">
              <p class="text-[9px] font-bold accent-text uppercase">TARGET</p>
              <p class="text-sm font-extrabold text-white mt-0.5">${target}</p>
              <p class="text-[9px] text-mutedText">kcal/day</p>
            </div>
          </div>

          <button type="button" onclick="applyCalculatedCalorieTarget(${target})"
            class="w-full py-3 rounded-2xl bg-obsidian border border-borderDark hover:border-white/30 text-xs font-extrabold text-white">
            ✓ Set ${target} kcal as Daily Target
          </button>
        </section>

        <!-- Body Measurements -->
        <section class="bg-surface border border-borderDark rounded-3xl p-4 space-y-3">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-[10px] font-extrabold uppercase tracking-wider accent-text">Progress Check-In</p>
              <h2 class="text-base font-extrabold text-white">Body Measurements</h2>
            </div>
            <div class="flex bg-obsidian border border-borderDark p-0.5 rounded-xl">
              <button type="button" onclick="appState.measurements.unit='metric'; persistState(); renderApp();"
                class="px-2.5 py-1 rounded-lg text-[10px] font-extrabold ${!isImp ? 'accent-bg' : 'text-mutedText'}">Metric</button>
              <button type="button" onclick="appState.measurements.unit='imperial'; persistState(); renderApp();"
                class="px-2.5 py-1 rounded-lg text-[10px] font-extrabold ${isImp ? 'accent-bg' : 'text-mutedText'}">Imperial</button>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2.5">
            ${[
              { key: 'weight', label: `Body Weight (${isImp ? 'lbs' : 'kg'})` },
              { key: 'waist', label: `Waist (${isImp ? 'in' : 'cm'})` },
              { key: 'hips', label: `Hips / Glutes (${isImp ? 'in' : 'cm'})` },
              { key: 'chest', label: `Chest (${isImp ? 'in' : 'cm'})` },
              { key: 'arms', label: `Arms (${isImp ? 'in' : 'cm'})` },
              { key: 'thighs', label: `Thighs (${isImp ? 'in' : 'cm'})` }
            ].map(item => `
              <div>
                <label class="text-[10px] font-bold text-mutedText block mb-1">${item.label}</label>
                <input type="number" step="0.1" value="${escapeHtml(m[item.key] || '')}"
                  onchange="appState.measurements['${item.key}']=this.value; persistState(true); showToast('Measurements saved');"
                  class="w-full bg-obsidian border border-borderDark rounded-2xl px-3.5 py-2.5 text-xs font-extrabold text-white" />
              </div>
            `).join('')}
          </div>
        </section>
      `;
    }

    // =========================================================
    // 13. OBSIDIAN DARK CALENDAR PICKER & PROFILE MODAL
    // =========================================================
    let darkPickerTarget = 'workout';
    let darkPickerCursor = new Date(TODAY_OBJ.getFullYear(), TODAY_OBJ.getMonth(), 1);

    function openDarkDatePicker(target) {
      darkPickerTarget = target;
      const baseStr = target === 'calorie' ? selectedCalorieDate : selectedWorkoutDate;
      const [y, m] = baseStr.split('-').map(Number);
      darkPickerCursor = new Date(y, m - 1, 1);
      renderDarkDatePickerModal();
      document.getElementById('modalOverlay').classList.remove('hidden');
    }

    function renderDarkDatePickerModal() {
      const card = document.getElementById('modalCard');
      const y = darkPickerCursor.getFullYear();
      const m = darkPickerCursor.getMonth();
      const monthTitle = darkPickerCursor.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
      const firstDay = new Date(y, m, 1);
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      const lead = (firstDay.getDay() + 6) % 7;
      const activeDs = darkPickerTarget === 'calorie' ? selectedCalorieDate : selectedWorkoutDate;
      const dayLabels = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];

      let gridHtml = '';
      for (let b = 0; b < lead; b++) gridHtml += `<div></div>`;
      for (let d = 1; d <= daysInMonth; d++) {
        const ds = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const isSel = ds === activeDs;
        gridHtml += `
          <button type="button" onclick="pickDarkDate('${ds}')"
            class="h-9 rounded-xl text-xs font-extrabold transition ${isSel ? 'accent-bg' : 'bg-obsidian border border-borderDark text-white hover:border-white/30'}">
            ${d}
          </button>
        `;
      }

      card.innerHTML = `
        <div class="flex items-center justify-between">
          <button type="button" onclick="darkPickerCursor=new Date(darkPickerCursor.getFullYear(), darkPickerCursor.getMonth()-1, 1); renderDarkDatePickerModal();"
            class="px-3 py-1.5 rounded-xl bg-obsidian border border-borderDark text-xs font-extrabold text-white">‹</button>
          <span class="text-sm font-extrabold text-white">${monthTitle}</span>
          <button type="button" onclick="darkPickerCursor=new Date(darkPickerCursor.getFullYear(), darkPickerCursor.getMonth()+1, 1); renderDarkDatePickerModal();"
            class="px-3 py-1.5 rounded-xl bg-obsidian border border-borderDark text-xs font-extrabold text-white">›</button>
        </div>
        <div class="grid grid-cols-7 gap-1.5 text-center">
          ${dayLabels.map(l => `<span class="text-[10px] font-extrabold text-mutedText">${l}</span>`).join('')}
          ${gridHtml}
        </div>
        <div class="flex justify-between pt-2">
          <button type="button" onclick="pickDarkDate(TODAY_STR)" class="px-4 py-2 rounded-xl bg-obsidian border border-borderDark text-xs font-extrabold accent-text">Today</button>
          <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-obsidian border border-borderDark text-xs font-extrabold text-mutedText">Close</button>
        </div>
      `;
    }

    function pickDarkDate(ds) {
      if (darkPickerTarget === 'calorie') selectedCalorieDate = ds;
      else selectedWorkoutDate = ds;
      closeModal();
      renderApp();
    }

    function openProfileModal() {
      const sess = getActiveSession();
      const card = document.getElementById('modalCard');
      card.innerHTML = `
        <div class="flex items-center justify-between">
          <div>
            <p class="text-[10px] font-extrabold uppercase tracking-wider accent-text">Profile &amp; Account</p>
            <h3 class="text-base font-extrabold text-white">${escapeHtml(appState.firstName || 'Athlete')}</h3>
          </div>
          <button type="button" onclick="closeModal()" class="w-8 h-8 rounded-full bg-obsidian border border-borderDark text-xs font-extrabold text-white">✕</button>
        </div>

        <div class="space-y-3">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[10px] font-bold text-mutedText block mb-1">First Name</label>
              <input id="profFirstName" type="text" value="${escapeHtml(appState.firstName || '')}"
                class="w-full bg-obsidian border border-borderDark rounded-2xl px-3.5 py-2.5 text-xs font-bold text-white" />
            </div>
            <div>
              <label class="text-[10px] font-bold text-mutedText block mb-1">Last Name</label>
              <input id="profLastName" type="text" value="${escapeHtml(appState.lastName || '')}"
                class="w-full bg-obsidian border border-borderDark rounded-2xl px-3.5 py-2.5 text-xs font-bold text-white" />
            </div>
          </div>

          ${sess ? `
            <div>
              <label class="text-[10px] font-bold text-mutedText block mb-1">Email / Account Username</label>
              <input id="profUsername" type="text" value="${escapeHtml(sess.username)}"
                class="w-full bg-obsidian border border-borderDark rounded-2xl px-3.5 py-2.5 text-xs font-bold text-white" />
            </div>
          ` : ''}

          <div>
            <label class="text-[10px] font-bold text-mutedText block mb-1">Accent Color</label>
            <div class="grid grid-cols-6 gap-2">
              ${Object.keys(THEME_MAP).map(k => `
                <button type="button" onclick="appState.accent='${k}'; applyTheme('${k}'); persistState(true); openProfileModal();"
                  class="h-9 rounded-xl border flex items-center justify-center ${appState.accent === k ? 'border-white' : 'border-borderDark'}">
                  <span class="w-5 h-5 rounded-full" style="background-color: ${THEME_MAP[k].hex};"></span>
                </button>
              `).join('')}
            </div>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2 pt-1">
          <button type="button" onclick="saveProfileSettings()" class="py-3 rounded-2xl accent-bg text-xs font-extrabold">Save Changes</button>
          <button type="button" onclick="signOutUser()" class="py-3 rounded-2xl bg-obsidian border border-borderDark text-xs font-extrabold text-coralAccent">Sign Out</button>
        </div>
      `;
      document.getElementById('modalOverlay').classList.remove('hidden');
    }

    async function saveProfileSettings() {
      const fName = (document.getElementById('profFirstName')?.value || '').trim();
      const lName = (document.getElementById('profLastName')?.value || '').trim();
      const newUserRaw = (document.getElementById('profUsername')?.value || '').toLowerCase().trim().replace(/[^a-z0-9@._-]/g, '');

      if (fName) appState.firstName = fName;
      appState.lastName = lName;

      const sess = getActiveSession();
      if (sess) {
        const oldUser = sess.username;
        sess.firstName = appState.firstName;
        sess.displayName = appState.firstName;
        if (newUserRaw && newUserRaw.length >= 3 && newUserRaw !== oldUser) {
          sess.username = newUserRaw;
          localStorage.setItem(`${ACCOUNT_VAULT_PREFIX}${newUserRaw}`, JSON.stringify(appState));
          writeStateToIDB(`${ACCOUNT_VAULT_PREFIX}${newUserRaw}`, appState);
          if (supabaseClient) {
            try {
              await supabaseClient.from('cadence_profiles').delete().eq('username', oldUser);
            } catch (_) {}
          }
        }
        localStorage.setItem(ACCOUNT_SESSION_KEY, JSON.stringify(sess));
      }

      persistState(true);
      updateHomeScreenManifest();
      closeModal();
      renderApp();
      showToast('Profile saved');
    }

    function signOutUser() {
      localStorage.removeItem(ACCOUNT_SESSION_KEY);
      localStorage.removeItem(GUEST_MODE_KEY);
      if (window.location.protocol !== 'about:' && !window.location.href.startsWith('blob:')) {
        window.location.href = './login.html';
      } else {
        closeModal();
        showToast('Signed out');
      }
    }

    function closeModal() {
      const ov = document.getElementById('modalOverlay');
      if (ov) ov.classList.add('hidden');
    }

    // =========================================================
    // 14. NAVIGATION, LIFECYCLE & MAIN RENDER LOOP
    // =========================================================
    function switchTab(tab) {
      currentTab = tab;
      renderApp();
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    function renderApp() {
      renderFrozenHeader();

      document.querySelectorAll('.nav-btn').forEach(btn => {
        const active = btn.getAttribute('data-tab') === currentTab;
        btn.classList.toggle('accent-text', active);
        btn.classList.toggle('text-mutedText', !active);
      });

      const main = document.getElementById('appMain');
      if (!main) return;
      if (currentTab === 'grid') main.innerHTML = renderGridView();
      else if (currentTab === 'workouts') main.innerHTML = renderWorkoutsView();
      else if (currentTab === 'calories') main.innerHTML = renderCaloriesView();
      else if (currentTab === 'plan') main.innerHTML = renderPlanView();

      syncHeaderSpacer();
    }

    window.addEventListener('resize', syncHeaderSpacer);
    window.addEventListener('pagehide', flushSupabaseKeepalive);
    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'hidden') {
        flushSupabaseKeepalive();
      } else if (document.visibilityState === 'visible') {
        const nowStr = toLocalDateStr(new Date());
        if (nowStr !== lastKnownCalendarDate) {
          TODAY_OBJ = new Date();
          TODAY_STR = nowStr;
          lastKnownCalendarDate = nowStr;
          selectedWorkoutDate = nowStr;
          selectedCalorieDate = nowStr;
        }
        await hydrateStateFromVault();
        applyTheme(appState.accent);
        renderApp();
      }
    });

    (async function initApp() {
      if (!enforceLoginGate()) return;
      syncHeaderSpacer();
      await hydrateStateFromVault();
      applyTheme(appState.accent);
      renderApp();
      syncHeaderSpacer();
    })();
  </script>
</body>
</html>
