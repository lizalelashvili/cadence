<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Sign In — CADENCE 365-Day Workout Tracker</title>

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CADENCE" />
  <meta name="theme-color" content="#0A0A0C" />

  <link id="appleTouchIcon" rel="apple-touch-icon" sizes="512x512" />
  <link id="faviconIcon" rel="icon" type="image/png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
          colors: {
            obsidian: '#0A0A0C',
            surface: '#141418',
            borderDark: '#232329',
            coralAccent: '#FF5E3A',
            mutedText: '#8E8E93',
          },
        },
      },
    };
  </script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    html, body {
      background-color: #0A0A0C;
      color: #F5F5F7;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body class="bg-obsidian text-[#F5F5F7] antialiased min-h-[100dvh] flex flex-col justify-center px-5 py-8">

  <main class="w-full max-w-sm mx-auto space-y-6">
    <!-- Brand Mark -->
    <div class="flex flex-col items-center text-center space-y-3">
      <div class="w-14 h-14 rounded-2xl bg-surface border border-borderDark flex items-center justify-center shadow-2xl">
        <div class="grid grid-cols-2 gap-1.5">
          <span id="brandSq1" class="w-3.5 h-3.5 rounded-[4px]" style="background-color: #FF4D94;"></span>
          <span class="w-3.5 h-3.5 rounded-[4px] bg-borderDark"></span>
          <span class="w-3.5 h-3.5 rounded-[4px] bg-borderDark"></span>
          <span id="brandSq2" class="w-3.5 h-3.5 rounded-[4px]" style="background-color: #FF4D94;"></span>
        </div>
      </div>
      <div>
        <h1 class="text-xl font-extrabold tracking-tight text-white">CADENCE</h1>
        <p class="text-xs text-mutedText mt-1">365-Day Workout &amp; Progressive Overload Tracker</p>
      </div>
    </div>

    <!-- Active Session Quick Resume Banner (if already signed in) -->
    <div id="existingSessionBanner" class="hidden bg-surface border border-borderDark rounded-2xl p-3.5 flex items-center justify-between gap-3">
      <div class="min-w-0">
        <p class="text-[10px] font-extrabold uppercase tracking-wider text-mutedText">Active Profile</p>
        <p id="existingSessionUser" class="text-xs font-extrabold text-white truncate">@user</p>
      </div>
      <button id="resumeBtn" type="button" onclick="goToMainApp()" class="px-3.5 py-2 rounded-xl text-xs font-extrabold text-obsidian shrink-0 transition active:scale-95" style="background-color: #FF4D94;">
        Open App →
      </button>
    </div>

    <!-- Auth Card -->
    <section class="bg-surface border border-borderDark rounded-3xl p-5 shadow-2xl space-y-4">
      <!-- Mode Switcher -->
      <div class="grid grid-cols-2 gap-1.5 bg-obsidian border border-borderDark p-1 rounded-2xl">
        <button id="tabSignIn" type="button" onclick="switchAuthMode('signin')" class="py-2 rounded-xl text-xs font-extrabold text-obsidian transition" style="background-color: #FF4D94;">
          Sign In
        </button>
        <button id="tabSignUp" type="button" onclick="switchAuthMode('signup')" class="py-2 rounded-xl text-xs font-extrabold text-mutedText hover:text-white transition">
          Create Account
        </button>
      </div>

      <form onsubmit="event.preventDefault(); submitLoginForm();" class="space-y-3.5">
        <div>
          <label class="text-[10px] font-bold uppercase tracking-wider text-mutedText block mb-1">Username</label>
          <input id="loginUsername" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="e.g. alexlifts" class="w-full bg-obsidian border border-borderDark rounded-2xl px-3.5 py-3 text-base sm:text-sm text-white focus:outline-none focus:border-white/40" />
        </div>

        <div>
          <label class="text-[10px] font-bold uppercase tracking-wider text-mutedText block mb-1">Password</label>
          <input id="loginPassword" type="password" autocomplete="current-password" placeholder="••••••••" class="w-full bg-obsidian border border-borderDark rounded-2xl px-3.5 py-3 text-base sm:text-sm text-white focus:outline-none focus:border-white/40" />
        </div>

        <div id="loginError" class="hidden text-xs font-semibold text-coralAccent bg-coralAccent/10 border border-coralAccent/30 rounded-xl px-3 py-2"></div>

        <button id="submitBtn" type="submit" class="w-full py-3.5 rounded-2xl text-xs font-extrabold text-obsidian shadow-lg active:scale-[0.98] transition" style="background-color: #FF4D94;">
          Sign In &amp; Open Tracker
        </button>
      </form>

      <!-- Supabase Server Config Toggle -->
      <div class="pt-1">
        <button type="button" onclick="toggleSupabaseBox()" class="w-full flex items-center justify-between text-[11px] font-bold text-mutedText hover:text-white py-1">
          <span class="flex items-center gap-1.5">
            <span id="sbStatusDot" class="w-2 h-2 rounded-full bg-mutedText"></span>
            <span id="sbStatusText">Supabase Cloud Sync (Optional)</span>
          </span>
          <span id="sbChevron">▾</span>
        </button>
        <div id="sbConfigBox" class="hidden mt-2 p-3 rounded-2xl bg-obsidian border border-borderDark space-y-2.5">
          <input id="loginSbUrl" type="url" placeholder="Supabase Project URL (https://...supabase.co)" class="w-full bg-surface border border-borderDark rounded-xl px-3 py-2 text-xs text-white focus:outline-none" />
          <input id="loginSbKey" type="text" placeholder="Supabase Anon Public Key" class="w-full bg-surface border border-borderDark rounded-xl px-3 py-2 text-xs text-white focus:outline-none" />
          <button type="button" onclick="saveLoginSupabaseConfig()" class="w-full py-2 rounded-xl bg-surface border border-borderDark text-[11px] font-extrabold text-white hover:border-white/20">
            Save Server Credentials
          </button>
        </div>
      </div>

      <div class="pt-2 border-t border-borderDark flex items-center justify-between text-[11px]">
        <span class="text-mutedText">Train without an account?</span>
        <a id="guestLink" href="./index.html" onclick="enterAsGuest(event)" class="font-bold hover:underline" style="color: #FF4D94;">Continue as Guest →</a>
      </div>
    </section>
  </main>

  <script>
    // Optional: Paste your Supabase Project URL & Anon Key here so all devices connect automatically
    const DEFAULT_SUPABASE_URL = '';
    const DEFAULT_SUPABASE_ANON_KEY = '';
    const SUPABASE_CONFIG_KEY = 'cadence_supabase_config_v1';

    const ACCOUNT_SESSION_KEY = 'cadence_account_session_v1';
    const GUEST_MODE_KEY = 'cadence_guest_mode_v1';
    const SIXTY_DAYS_MS = 60 * 24 * 60 * 60 * 1000;
    const ACCOUNT_VAULT_PREFIX = 'cadence_user_vault_v1_';
    const STORAGE_KEY = 'cadence_workout_tracker_v1';
    const IDB_NAME = 'CadenceVaultDB';
    const IDB_STORE = 'stateStore';
    const THEME_HEX = {
      pink: '#FF4D94',
      lime: '#C6FF00',
      coral: '#FF5E3A',
      violet: '#A855F7',
      cyan: '#22D3EE'
    };

    let currentMode = 'signin';
    let activeAccentHex = '#FF4D94';
    let supabaseClient = null;

    function getSupabaseConfig() {
      try {
        const saved = JSON.parse(localStorage.getItem(SUPABASE_CONFIG_KEY) || 'null');
        if (saved && saved.url && saved.anonKey) return saved;
      } catch (_) {}
      if (DEFAULT_SUPABASE_URL && DEFAULT_SUPABASE_ANON_KEY) {
        return { url: DEFAULT_SUPABASE_URL, anonKey: DEFAULT_SUPABASE_ANON_KEY };
      }
      return null;
    }

    function initLoginSupabase() {
      const cfg = getSupabaseConfig();
      const dot = document.getElementById('sbStatusDot');
      const txt = document.getElementById('sbStatusText');
      if (!cfg || !window.supabase || !window.supabase.createClient) {
        supabaseClient = null;
        if (dot) dot.className = 'w-2 h-2 rounded-full bg-mutedText';
        if (txt) txt.textContent = 'Supabase Cloud Sync (Optional)';
        return;
      }
      try {
        supabaseClient = window.supabase.createClient(cfg.url.trim(), cfg.anonKey.trim());
        if (dot) dot.className = 'w-2 h-2 rounded-full bg-emerald-400';
        if (txt) txt.textContent = 'Supabase Cloud Server Connected';
        const urlIn = document.getElementById('loginSbUrl');
        const keyIn = document.getElementById('loginSbKey');
        if (urlIn) urlIn.value = cfg.url;
        if (keyIn) keyIn.value = cfg.anonKey;
      } catch (_) {
        supabaseClient = null;
      }
    }

    function toggleSupabaseBox() {
      const box = document.getElementById('sbConfigBox');
      if (box) box.classList.toggle('hidden');
    }

    function saveLoginSupabaseConfig() {
      const url = (document.getElementById('loginSbUrl')?.value || '').trim();
      const anonKey = (document.getElementById('loginSbKey')?.value || '').trim();
      if (!url || !anonKey) return;
      localStorage.setItem(SUPABASE_CONFIG_KEY, JSON.stringify({ url, anonKey }));
      initLoginSupabase();
      toggleSupabaseBox();
    }

    try {
      const savedState = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      if (savedState && savedState.accent && THEME_HEX[savedState.accent]) {
        activeAccentHex = THEME_HEX[savedState.accent];
      }
      const existingSession = JSON.parse(localStorage.getItem(ACCOUNT_SESSION_KEY) || 'null');
      if (existingSession && existingSession.username) {
        const isExpired = existingSession.expiresAt && Date.now() >= existingSession.expiresAt;
        if (!isExpired) {
          if (!existingSession.expiresAt) {
            existingSession.expiresAt = Date.now() + SIXTY_DAYS_MS;
            localStorage.setItem(ACCOUNT_SESSION_KEY, JSON.stringify(existingSession));
          }
          if (window.location.protocol !== 'about:' && !window.location.href.startsWith('blob:')) {
            window.location.replace('./index.html');
          }
          const banner = document.getElementById('existingSessionBanner');
          const userLabel = document.getElementById('existingSessionUser');
          if (banner && userLabel) {
            userLabel.textContent = `@${existingSession.username}`;
            banner.classList.remove('hidden');
          }
        } else {
          localStorage.removeItem(ACCOUNT_SESSION_KEY);
        }
      }
    } catch (_) {}

    function applyAccentToLogin() {
      ['brandSq1', 'brandSq2', 'tabSignIn', 'submitBtn', 'resumeBtn'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.backgroundColor = activeAccentHex;
      });
      const guest = document.getElementById('guestLink');
      if (guest) guest.style.color = activeAccentHex;
    }

    applyAccentToLogin();
    initLoginSupabase();

    function switchAuthMode(mode) {
      currentMode = mode;
      const btnIn = document.getElementById('tabSignIn');
      const btnUp = document.getElementById('tabSignUp');
      const submitBtn = document.getElementById('submitBtn');
      const passInput = document.getElementById('loginPassword');
      const err = document.getElementById('loginError');
      if (err) err.classList.add('hidden');

      if (mode === 'signin') {
        btnIn.style.backgroundColor = activeAccentHex;
        btnIn.className = 'py-2 rounded-xl text-xs font-extrabold text-obsidian transition';
        btnUp.style.backgroundColor = 'transparent';
        btnUp.className = 'py-2 rounded-xl text-xs font-extrabold text-mutedText hover:text-white transition';
        submitBtn.textContent = 'Sign In & Open Tracker';
        if (passInput) passInput.setAttribute('autocomplete', 'current-password');
      } else {
        btnUp.style.backgroundColor = activeAccentHex;
        btnUp.className = 'py-2 rounded-xl text-xs font-extrabold text-obsidian transition';
        btnIn.style.backgroundColor = 'transparent';
        btnIn.className = 'py-2 rounded-xl text-xs font-extrabold text-mutedText hover:text-white transition';
        submitBtn.textContent = 'Create Account & Start';
        if (passInput) passInput.setAttribute('autocomplete', 'new-password');
      }
    }

    async function hashPassword(password, salt) {
      const raw = `${salt.toLowerCase().trim()}::${password}`;
      if (window.crypto && window.crypto.subtle) {
        const data = new TextEncoder().encode(raw);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
      }
      let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
      for (let i = 0; i < raw.length; i++) {
        const ch = raw.charCodeAt(i);
        h1 = Math.imul(h1 ^ ch, 2654435761);
        h2 = Math.imul(h2 ^ ch, 1597334677);
      }
      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
    }

    function readUserFromIDB(userKey) {
      return new Promise((resolve) => {
        if (!window.indexedDB) return resolve(null);
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
        };
        req.onsuccess = () => {
          try {
            const tx = req.result.transaction(IDB_STORE, 'readonly');
            const getReq = tx.objectStore(IDB_STORE).get(userKey);
            getReq.onsuccess = () => resolve(getReq.result || null);
            getReq.onerror = () => resolve(null);
          } catch (_) {
            resolve(null);
          }
        };
        req.onerror = () => resolve(null);
      });
    }

    function enterAsGuest(event) {
      try {
        localStorage.setItem(GUEST_MODE_KEY, 'true');
      } catch (_) {}
      if (window.location.protocol === 'about:' || window.location.href.startsWith('blob:')) {
        event.preventDefault();
        goToMainApp();
      }
    }

    function goToMainApp() {
      if (window.location.protocol === 'about:' || window.location.href.startsWith('blob:')) {
        const err = document.getElementById('loginError');
        if (err) {
          err.style.color = activeAccentHex;
          err.style.borderColor = activeAccentHex;
          err.style.backgroundColor = 'rgba(255,255,255,0.04)';
          err.textContent = 'Session saved! Switch to the index.html tab in the editor to open the main tracker.';
          err.classList.remove('hidden');
        }
        return;
      }
      window.location.href = './index.html';
    }

    async function submitLoginForm() {
      const rawUser = document.getElementById('loginUsername')?.value || '';
      const rawPass = document.getElementById('loginPassword')?.value || '';
      const err = document.getElementById('loginError');
      const username = rawUser.toLowerCase().trim().replace(/[^a-z0-9._-]/g, '');

      if (username.length < 3) {
        err.textContent = 'Username must be at least 3 characters.';
        err.classList.remove('hidden');
        return;
      }
      if (rawPass.length < 4) {
        err.textContent = 'Password must be at least 4 characters.';
        err.classList.remove('hidden');
        return;
      }

      const passHash = await hashPassword(rawPass, username);
      const userKey = `${ACCOUNT_VAULT_PREFIX}${username}`;

      let existingVault = null;
      try {
        existingVault = JSON.parse(localStorage.getItem(userKey) || localStorage.getItem(`${userKey}_backup`) || 'null');
      } catch (_) {}
      if (!existingVault) {
        existingVault = await readUserFromIDB(userKey);
      }

      // Check Supabase cloud vault if connected
      if (supabaseClient) {
        try {
          const { data } = await supabaseClient
            .from('cadence_profiles')
            .select('username, pass_hash, state_json')
            .eq('username', username)
            .maybeSingle();
          if (data && data.state_json) {
            existingVault = data.state_json;
            if (data.pass_hash) existingVault._passHash = data.pass_hash;
          }
        } catch (_) {}
      }

      if (currentMode === 'signup' && existingVault && existingVault._passHash) {
        err.textContent = 'Username already exists — switch to Sign In.';
        err.classList.remove('hidden');
        return;
      }

      if (currentMode === 'signin' && existingVault && existingVault._passHash && existingVault._passHash !== passHash) {
        err.textContent = `Incorrect password for @${username}.`;
        err.classList.remove('hidden');
        return;
      }

      localStorage.removeItem(GUEST_MODE_KEY);
      localStorage.setItem(ACCOUNT_SESSION_KEY, JSON.stringify({
        username,
        displayName: rawUser.trim(),
        passHash,
        expiresAt: Date.now() + SIXTY_DAYS_MS,
        pendingVerification: true,
        pendingMode: currentMode
      }));

      goToMainApp();
    }
  </script>
</body>
</html>
