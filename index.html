    /* Hide scrollbars cleanly on horizontal grid / tabs */

    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* CADENCE 365-Day Square Matrix */
    .year-grid-wrapper {
      display: grid;
      grid-template-rows: repeat(7, 11px);
      grid-auto-flow: column;
      grid-auto-columns: 11px;
      gap: 3.5px;
      width: max-content;
    }

    /* Full-Screen 365-Day Matrix (Preserves exact square aspect ratio & clean spacing) */
    .year-grid-fullscreen-scroll {
      display: grid;
      grid-template-rows: repeat(7, 15px);
      grid-auto-flow: column;
      grid-auto-columns: 15px;
      gap: 4.5px;
      width: max-content;
    }
    .year-grid-fullscreen-scroll .grid-sq-fs {
      width: 15px;
      height: 15px;
      border-radius: 3.5px;
      transition: transform 0.12s ease, background-color 0.2s ease;
    }
    .year-grid-fullscreen-scroll .grid-sq-fs:active {
      transform: scale(1.3);
    }

    .grid-sq {
      width: 11px;
      height: 11px;
      border-radius: 3px;
      transition: transform 0.12s ease, background-color 0.2s ease;
    }
    .grid-sq:active {
      transform: scale(1.35);

    .tier-2 { background-color: var(--tier-2); border: 1px solid rgba(255, 255, 255, 0.12); }
    .tier-3 { background-color: var(--tier-3); border: 1px solid rgba(255, 255, 255, 0.16); }

      padding-top: max(14px, env(safe-area-inset-top));
    }
    .safe-bottom {
      padding-bottom: max(14px, env(safe-area-inset-bottom));
    }

      from { transform: translateY(24px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-sheet {
      animation: slideUp 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    function getThemeObj(themeId) {
      return ACCENT_THEMES[themeId] || ACCENT_THEMES.pink;

    function getAccentHex() {
      return getThemeObj(appState.accent).hex;
    }

    function generate2x2AppIconPng(accentHex) {
      try {
        const size = 512;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#0A0A0C';
        ctx.fillRect(0, 0, size, size);

        const pad = 104;
        const gap = 36;
        const sqSize = (size - pad * 2 - gap) / 2;
        const radius = 34;

        function drawRoundedSquare(x, y, w, h, r, color) {
          ctx.beginPath();
          ctx.moveTo(x + r, y);
          ctx.arcTo(x + w, y, x + w, y + h, r);
          ctx.arcTo(x + w, y + h, x, y + h, r);
          ctx.arcTo(x, y + h, x, y, r);
          ctx.arcTo(x, y, x + w, y, r);
          ctx.closePath();
          ctx.fillStyle = color;
          ctx.fill();
        }

        // Top-Left (Accent), Top-Right (Dark), Bottom-Left (Dark), Bottom-Right (Accent)
        drawRoundedSquare(pad, pad, sqSize, sqSize, radius, accentHex);
        drawRoundedSquare(pad + sqSize + gap, pad, sqSize, sqSize, radius, '#232329');
        drawRoundedSquare(pad, pad + sqSize + gap, sqSize, sqSize, radius, '#232329');
        drawRoundedSquare(pad + sqSize + gap, pad + sqSize + gap, sqSize, sqSize, radius, accentHex);

        return canvas.toDataURL('image/png');
      } catch (e) {
        return '';
      }
    }

    function applyAccentTheme(themeId) {
      const theme = getThemeObj(themeId);
      const root = document.documentElement;
      root.style.setProperty('--accent', theme.hex);
      root.style.setProperty('--accent-soft', theme.soft);
      root.style.setProperty('--accent-border', theme.border);
      root.style.setProperty('--tier-1', theme.tiers[0]);
      root.style.setProperty('--tier-2', theme.tiers[1]);
      root.style.setProperty('--tier-3', theme.tiers[2]);
      root.style.setProperty('--tier-4', theme.tiers[3]);

      const pngDataUrl = generate2x2AppIconPng(theme.hex);
      if (pngDataUrl) {
        const appleIcon = document.getElementById('appleTouchIcon');
        const favIcon = document.getElementById('faviconIcon');
        if (appleIcon) appleIcon.href = pngDataUrl;
        if (favIcon) favIcon.href = pngDataUrl;

        const manifestObj = {
          name: 'CADENCE — Workout Tracker',
          short_name: 'CADENCE',
          start_url: './index.html',
          display: 'standalone',
          background_color: '#0A0A0C',
          theme_color: '#0A0A0C',
          orientation: 'portrait',
          icons: [{ src: pngDataUrl, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }]
        };
        const manifestEl = document.getElementById('pwaManifest');
        if (manifestEl) {
          manifestEl.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifestObj));
        }
      }
    }

    function isCardioExercise(exerciseId) {
      const found = [...DEFAULT_EXERCISES, ...(appState.customExercises || [])].find(e => e.id === exerciseId);

        if (typeof found.isCardio === 'boolean') return found.isCardio;
        const lowerName = found.name.toLowerCase();
        if (CARDIO_KEYWORDS.some(kw => lowerName.includes(kw))) return true;
      }
      return CARDIO_KEYWORDS.some(kw => String(exerciseId || '').toLowerCase().includes(kw));
    }

    function getCardioMetricLabel(exerciseId) {
      const found = [...DEFAULT_EXERCISES, ...(appState.customExercises || [])].find(e => e.id === exerciseId);
      if (found && found.metricLabel) return found.metricLabel;
      const name = (found ? found.name : String(exerciseId || '')).toLowerCase();
      if (name.includes('stair') || name.includes('stepmill')) return 'Lvl / Flr';
      if (name.includes('incline')) return 'Inc / Spd';
      if (name.includes('treadmill') || name.includes('run') || name.includes('jog')) return 'Km / Spd';
      if (name.includes('row') || name.includes('ski')) return 'Dist / Split';
      if (name.includes('assault') || name.includes('echo') || name.includes('airbike')) return 'Cal / Watts';
      if (name.includes('bike') || name.includes('cycle') || name.includes('elliptical')) return 'Res / RPM';

    /*************************************************************************
     * 3. DUAL-VAULT PERSISTENCE ENGINE (INDEXEDDB + LOCALSTORAGE + CLOUD)
     *************************************************************************/
    const STORAGE_KEY = 'cadence_workout_tracker_v1';
    const BACKUP_STORAGE_KEY = 'cadence_workout_tracker_backup_v1';
    const ACCOUNT_SESSION_KEY = 'cadence_account_session_v1';
    const IDB_NAME = 'CadenceVaultDB';
    const IDB_STORE = 'stateStore';
    const IDB_RECORD_KEY = 'primary_state';

    let appState = {
      unit: 'kg',
      accent: 'pink',
      workouts: {},
      templates: JSON.parse(JSON.stringify(DEFAULT_TEMPLATES)),
      customExercises: [],

      username: null,

      passHash: null

    let cloudApp = null;

    let currentTab = 'calendar';
    let calendarMode = 'year';
    let selectedMonthDate = new Date();
    let activeLoggerDate = null;
    let activeDraft = null;
    let selectedOverloadExId = 'hip-thrust';
    let isStateHydrated = false;
    let isSavingInProgress = false;

    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().catch(() => {});
    }

    function openVaultDB() {
      return new Promise((resolve) => {
        if (!window.indexedDB) {
          resolve(null);
          return;
        }
        try {
          const req = indexedDB.open(IDB_NAME, 1);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(IDB_STORE)) {
              db.createObjectStore(IDB_STORE);
            }
          };
          req.onsuccess = (e) => resolve(e.target.result);
          req.onerror = () => resolve(null);
        } catch (err) {
          resolve(null);
        }
      });
    }

    async function readFromVaultIDB() {
      const db = await openVaultDB();
      if (!db) return null;
      return new Promise((resolve) => {
        try {
          const tx = db.transaction(IDB_STORE, 'readonly');
          const store = tx.objectStore(IDB_STORE);
          const getReq = store.get(IDB_RECORD_KEY);
          getReq.onsuccess = () => resolve(getReq.result || null);
          getReq.onerror = () => resolve(null);
        } catch (e) {
          resolve(null);
        }
      });
    }

    async function writeToVaultIDB(dataObj) {
      const db = await openVaultDB();
      if (!db) return false;
      return new Promise((resolve) => {
        try {
          const tx = db.transaction(IDB_STORE, 'readwrite');
          const store = tx.objectStore(IDB_STORE);
          const putReq = store.put(dataObj, IDB_RECORD_KEY);
          putReq.onsuccess = () => resolve(true);
          putReq.onerror = () => resolve(false);
        } catch (e) {
          resolve(false);
        }
      });
    }

    function mergeLoadedState(parsed) {
      if (!parsed || typeof parsed !== 'object') return;
      appState = {
        unit: parsed.unit || 'kg',
        accent: parsed.accent || 'pink',
        workouts: parsed.workouts && typeof parsed.workouts === 'object' ? parsed.workouts : {},
        templates: Array.isArray(parsed.templates) ? parsed.templates : JSON.parse(JSON.stringify(DEFAULT_TEMPLATES)),
        customExercises: Array.isArray(parsed.customExercises) ? parsed.customExercises : [],
        _updatedAt: parsed._updatedAt || 0
      };
    }

    async function hydrateStateFromVault() {
      let bestCandidate = null;

      const idbData = await readFromVaultIDB();
      if (idbData && typeof idbData === 'object') {
        bestCandidate = idbData;
      }

      for (const key of [STORAGE_KEY, BACKUP_STORAGE_KEY]) {
        try {
          const raw = localStorage.getItem(key);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && typeof parsed === 'object') {
              const candidateTs = parsed._updatedAt || 0;
              const currentBestTs = bestCandidate?._updatedAt || 0;
              if (!bestCandidate || candidateTs >= currentBestTs) {
                bestCandidate = parsed;
              }
            }
          }
        } catch (e) {
          console.warn('LocalStorage read error:', e);
        }
      }

      if (bestCandidate) {
        mergeLoadedState(bestCandidate);
      }

      isStateHydrated = true;
      loadAccountSession();
      await saveState(true);
      applyAccentTheme(appState.accent);
      initCloudSyncEngine();
    }

    async function saveState(skipCloudPush = false) {
      if (!isStateHydrated) return;
      const snapshot = {
        ...appState,
        _updatedAt: Date.now()
      };
      const serialized = JSON.stringify(snapshot);

      try {
        localStorage.setItem(STORAGE_KEY, serialized);
        localStorage.setItem(BACKUP_STORAGE_KEY, serialized);
      } catch (e) {
        console.warn('LocalStorage write warning:', e);
      }

      if (!isSavingInProgress) {
        isSavingInProgress = true;
        await writeToVaultIDB(snapshot);
        isSavingInProgress = false;
      }

      if (!skipCloudPush && !isApplyingRemoteSnapshot && accountSession.username) {
        pushStateToCloud(snapshot);
      }
    }

    window.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') saveState();
    });
    window.addEventListener('pagehide', () => saveState());
    window.addEventListener('beforeunload', () => saveState());

    async function hashPassword(password, salt) {
      const raw = `${salt.toLowerCase().trim()}::${password}`;
      if (window.crypto && window.crypto.subtle) {
        const data = new TextEncoder().encode(raw);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
      }
      let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
      for (let i = 0; i < raw.length; i++) {
        const ch = raw.charCodeAt(i);
        h1 = Math.imul(h1 ^ ch, 2654435761);
        h2 = Math.imul(h2 ^ ch, 1597334677);
      }
      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
    }

    function normalizeUsername(raw) {
      return String(raw || '').toLowerCase().trim().replace(/[^a-z0-9._-]/g, '');
    }

    function getCloudAppId() {
      return typeof __app_id !== 'undefined' ? __app_id : 'cadence-workout-app';
    }

    function getAccountDocRef(username) {
      const sdk = window._cloudSDK;
      const appId = getCloudAppId();
      return sdk.doc(cloudDb, 'artifacts', appId, 'public', 'data', 'cadence_accounts', username);
    }

    async function initCloudSyncEngine() {
      if (!window._cloudSDK) {
        window.addEventListener('cloud-sdk-ready', initCloudSyncEngine, { once: true });
        return;
      }
      if (typeof __firebase_config === 'undefined' || !__firebase_config) {
        if (accountSession.pendingVerification) {
          delete accountSession.pendingVerification;
          delete accountSession.pendingMode;
          saveAccountSession();
        }
        cloudStatus = 'offline';
        renderHeaderAndStrip();
        return;
      }

      try {
        cloudStatus = 'connecting';
        renderHeaderAndStrip();
        const cfg = JSON.parse(__firebase_config);
        const sdk = window._cloudSDK;
        cloudApp = sdk.initializeApp(cfg);
        cloudAuth = sdk.getAuth(cloudApp);
        cloudDb = sdk.getFirestore(cloudApp);

        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await sdk.signInWithCustomToken(cloudAuth, __initial_auth_token);
        } else {
          await sdk.signInAnonymously(cloudAuth);
        }

        cloudAuthUser = cloudAuth.currentUser;
        if (accountSession.username && cloudAuthUser) {
          await verifyAndConnectAccount(accountSession.username);
        } else {
          cloudStatus = cloudAuthUser ? 'ready' : 'offline';
          renderHeaderAndStrip();
        }
      } catch (err) {
        console.warn('Cloud sync init error:', err);
        cloudStatus = 'offline';
        renderHeaderAndStrip();
      }
    }

    async function verifyAndConnectAccount(username) {
      const sdk = window._cloudSDK;
      const docRef = getAccountDocRef(username);
      const snap = await sdk.getDoc(docRef);

      if (accountSession.pendingVerification) {
        const mode = accountSession.pendingMode || 'signin';
        if (mode === 'signup') {
          if (snap.exists()) {
            signOutAccount();
            showToast('Username already taken — please choose another');
            openAccountModal('signup');
            return;
          }
          delete accountSession.pendingVerification;
          delete accountSession.pendingMode;
          saveAccountSession();
          const nowTs = Date.now();
          appState._updatedAt = nowTs;
          await pushStateToCloud({ ...appState, _updatedAt: nowTs });
          subscribeToAccountCloud(username);
          showToast(`Account @${username} created & synced!`);
          return;
        } else {
          if (!snap.exists()) {
            signOutAccount();
            showToast('Account not found — create an account first');
            openAccountModal('signup');
            return;
          }
          const data = snap.data();
          if (data.passHash !== accountSession.passHash) {
            signOutAccount();
            showToast('Incorrect password — please try again');
            openAccountModal('signin');
            return;
          }
          delete accountSession.pendingVerification;
          delete accountSession.pendingMode;
          saveAccountSession();
        }
      }

      if (snap.exists()) {
        const data = snap.data();
        if (data.passHash === accountSession.passHash && data.stateJson) {
          const remoteState = JSON.parse(data.stateJson);
          const mergedWorkouts = { ...(remoteState.workouts || {}), ...(appState.workouts || {}) };
          isApplyingRemoteSnapshot = true;
          mergeLoadedState(remoteState);
          appState.workouts = mergedWorkouts;
          appState._updatedAt = Date.now();
          applyAccentTheme(appState.accent);
          await saveState(true);
          isApplyingRemoteSnapshot = false;
          await pushStateToCloud({ ...appState, _updatedAt: appState._updatedAt });
          renderHeaderAndStrip();
          renderMainView();
        }
      }

      subscribeToAccountCloud(username);
    }

    function subscribeToAccountCloud(username) {
      if (!cloudDb || !cloudAuthUser || !username) return;
      if (cloudUnsubscribe) {
        cloudUnsubscribe();
        cloudUnsubscribe = null;
      }

      const sdk = window._cloudSDK;
      const docRef = getAccountDocRef(username);
      cloudStatus = 'connecting';
      renderHeaderAndStrip();

      cloudUnsubscribe = sdk.onSnapshot(
        docRef,
        async (snap) => {
          if (!snap.exists()) {
            cloudStatus = 'synced';
            renderHeaderAndStrip();
            return;
          }
          const remote = snap.data();
          if (remote && remote.stateJson) {
            try {
              const remoteState = JSON.parse(remote.stateJson);
              const localTs = appState._updatedAt || 0;
              const remoteTs = remote.updatedAt || remoteState._updatedAt || 0;
              if (remoteTs > localTs + 500) {
                isApplyingRemoteSnapshot = true;
                mergeLoadedState(remoteState);
                appState._updatedAt = remoteTs;
                applyAccentTheme(appState.accent);
                await saveState(true);
                isApplyingRemoteSnapshot = false;
                renderHeaderAndStrip();
                renderMainView();
              }
            } catch (parseErr) {
              console.warn('Remote state parse error:', parseErr);
            }
          }
          cloudStatus = 'synced';
          renderHeaderAndStrip();
        },
        () => {
          cloudStatus = 'offline';
          renderHeaderAndStrip();
        }
      );
    }

    async function pushStateToCloud(snapshot) {
      if (!cloudDb || !cloudAuthUser || !accountSession.username) return;
      try {
        const sdk = window._cloudSDK;
        const docRef = getAccountDocRef(accountSession.username);
        await sdk.setDoc(
          docRef,
          {
            username: accountSession.username,
            displayName: accountSession.displayName || accountSession.username,
            passHash: accountSession.passHash,
            updatedAt: snapshot._updatedAt || Date.now(),
            stateJson: JSON.stringify(snapshot)
          },
          { merge: true }
        );
        cloudStatus = 'synced';
        renderHeaderAndStrip();
      } catch (err) {
        cloudStatus = 'offline';
        renderHeaderAndStrip();
      }
    }

    async function handleAccountAuthSubmit(mode) {
      const rawUser = document.getElementById('authUsernameInput')?.value || '';
      const rawPass = document.getElementById('authPasswordInput')?.value || '';
      const username = normalizeUsername(rawUser);

      if (username.length < 3) {
        showToast('Username must be at least 3 characters (letters/numbers)');
        return;
      }
      if (rawPass.length < 4) {
        showToast('Password must be at least 4 characters');
        return;
      }

      const btn = document.getElementById('authSubmitBtn');
      if (btn) {
        btn.disabled = true;
        btn.textContent = mode === 'signup' ? 'Creating Account...' : 'Signing In...';
      }

      try {
        const passHash = await hashPassword(rawPass, username);

        if (cloudDb && cloudAuthUser) {
          const sdk = window._cloudSDK;
          const docRef = getAccountDocRef(username);
          const snap = await sdk.getDoc(docRef);

          if (mode === 'signup') {
            if (snap.exists()) {
              showToast('Username already taken — try signing in instead');
              if (btn) {
                btn.disabled = false;
                btn.textContent = 'Create Account & Sync';
              }
              return;
            }
            accountSession = { username, displayName: rawUser.trim(), passHash };
            saveAccountSession();
            const nowTs = Date.now();
            appState._updatedAt = nowTs;
            await pushStateToCloud({ ...appState, _updatedAt: nowTs });
            subscribeToAccountCloud(username);
            closeModal();
            renderHeaderAndStrip();
            renderMainView();
            showToast(`Account @${username} created & synced!`);
          } else {
            if (!snap.exists()) {
              showToast('Account not found — switch to Create Account');
              if (btn) {
                btn.disabled = false;
                btn.textContent = 'Sign In & Restore';
              }
              return;
            }
            const data = snap.data();
            if (data.passHash !== passHash) {
              showToast('Incorrect password');
              if (btn) {
                btn.disabled = false;
                btn.textContent = 'Sign In & Restore';
              }
              return;
            }

            accountSession = { username, displayName: data.displayName || rawUser.trim(), passHash };
            saveAccountSession();

            if (data.stateJson) {
              const remoteState = JSON.parse(data.stateJson);
              const mergedWorkouts = { ...(remoteState.workouts || {}), ...(appState.workouts || {}) };
              isApplyingRemoteSnapshot = true;
              mergeLoadedState(remoteState);
              appState.workouts = mergedWorkouts;
              appState._updatedAt = Date.now();
              applyAccentTheme(appState.accent);
              await saveState(true);
              isApplyingRemoteSnapshot = false;
              await pushStateToCloud({ ...appState, _updatedAt: appState._updatedAt });
            }

            subscribeToAccountCloud(username);
            closeModal();
            renderHeaderAndStrip();
            renderMainView();
            showToast(`Welcome back, @${username}!`);
          }
        } else {
          accountSession = { username, displayName: rawUser.trim(), passHash };
          saveAccountSession();
          await saveState(true);
          closeModal();
          renderHeaderAndStrip();
          renderMainView();
          showToast(`Signed in as @${username} (Local Profile)`);
        }
      } catch (err) {
        showToast('Could not complete sign-in');
        if (btn) {
          btn.disabled = false;
          btn.textContent = mode === 'signup' ? 'Create Account & Sync' : 'Sign In & Restore';
        }
      }
    }

    function signOutAccount() {
      if (cloudUnsubscribe) {

    /*************************************************************************
     * 5. DATE HELPERS, ANALYTICS & PROGRESSIVE OVERLOAD ENGINE
     *************************************************************************/
    function toDateStr(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function parseDateStr(str) {
      const [y, m, d] = str.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    function getTodayStr() {
      return toDateStr(new Date());
    }

    function formatDisplayDate(dateStr) {
      const d = parseDateStr(dateStr);
      return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    }

    function getExerciseName(id) {
      const found = [...DEFAULT_EXERCISES, ...appState.customExercises].find(e => e.id === id);
      return found ? found.name : id;
    }

    function getExerciseMuscle(id) {
      const found = [...DEFAULT_EXERCISES, ...appState.customExercises].find(e => e.id === id);
      return found ? found.muscle : 'Custom';
    }

    // Epley Estimated 1RM Formula (or Duration/Score for Cardio)
    function calcE1RM(weight, reps) {
      const w = parseFloat(weight) || 0;
      const r = parseInt(reps, 10) || 0;
      if (w <= 0 || r <= 0) return 0;
      if (r === 1) return w;
      return Math.round(w * (1 + r / 30) * 10) / 10;
    }

    function getWorkoutIntensity(workout) {
      if (!workout) return 0;
      if (workout.quickCheckIn && (!workout.exercises || workout.exercises.length === 0)) {
        return 2;
      }
      let totalSets = 0;
      let hasPR = false;
      (workout.exercises || []).forEach(ex => {
        (ex.sets || []).forEach(s => {
          if ((parseFloat(s.weight) || 0) > 0 || (parseInt(s.reps, 10) || 0) > 0) {
            totalSets++;
            if (s.isPR) hasPR = true;
          }
        });
      });
      if (totalSets === 0) return 1;
      if (hasPR || totalSets >= 14) return 4;
      if (totalSets >= 9) return 3;
      if (totalSets >= 4) return 2;
      return 1;
    }

    function calculateStats() {
      const allDates = Object.keys(appState.workouts).sort();
      const totalDays = allDates.length;
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      let daysLast365 = 0;
      const cutoff = new Date(today);
      cutoff.setDate(cutoff.getDate() - 364);
      allDates.forEach(dStr => {
        const d = parseDateStr(dStr);
        if (d >= cutoff && d <= today) daysLast365++;
      });

      // Active weekly streak (Mon-Sun weeks with >=1 workout)
      const getMondayKey = (dateObj) => {
        const d = new Date(dateObj);
        const day = d.getDay();
        const diff = d.getDate() - day + (day === 0 ? -6 : 1);
        d.setDate(diff);
        d.setHours(0, 0, 0, 0);
        return toDateStr(d);
      };

      const activeWeeks = new Set(allDates.map(dStr => getMondayKey(parseDateStr(dStr))));
      let weekStreak = 0;
      let cursor = new Date(today);
      const currentWeekKey = getMondayKey(cursor);
      if (!activeWeeks.has(currentWeekKey)) {
        cursor.setDate(cursor.getDate() - 7);
      }
      while (activeWeeks.has(getMondayKey(cursor))) {
        weekStreak++;
        cursor.setDate(cursor.getDate() - 7);
      }

      return { totalDays, daysLast365, weekStreak };
    }

    function getExerciseBenchmarks(exerciseId, excludeDateStr = null) {
      const dates = Object.keys(appState.workouts).sort();
      let lastSession = null;
      let bestWeight = 0;
      let bestE1RM = 0;
      let bestRepsAtMaxWeight = 0;

      dates.forEach(dStr => {
        if (excludeDateStr && dStr >= excludeDateStr) return;
        const w = appState.workouts[dStr];
        const ex = (w.exercises || []).find(item => item.exerciseId === exerciseId);
        if (ex && ex.sets && ex.sets.length > 0) {
          const validSets = ex.sets.filter(s => (parseFloat(s.weight) || 0) > 0 || (parseInt(s.reps, 10) || 0) > 0);
          if (validSets.length > 0) {
            lastSession = { date: dStr, sets: validSets };
            validSets.forEach(s => {
              const wt = parseFloat(s.weight) || 0;
              const rp = parseInt(s.reps, 10) || 0;
              const e1rm = calcE1RM(wt, rp);
              if (wt > bestWeight) {
                bestWeight = wt;
                bestRepsAtMaxWeight = rp;
              } else if (wt === bestWeight && rp > bestRepsAtMaxWeight) {
                bestRepsAtMaxWeight = rp;
              }
              if (e1rm > bestE1RM) bestE1RM = e1rm;
            });
          }
        }
      });

      return { lastSession, bestWeight, bestE1RM, bestRepsAtMaxWeight };
    }

    function evaluateSetOverload(exerciseId, weight, reps, excludeDateStr) {
      const wt = parseFloat(weight) || 0;
      const rp = parseInt(reps, 10) || 0;
      if (wt <= 0 && rp <= 0) return null;

      const isCardio = isCardioExercise(exerciseId);
      const bench = getExerciseBenchmarks(exerciseId, excludeDateStr);
      if (!bench.lastSession && bench.bestWeight === 0) return null;

      if (isCardio) {
        if (wt > bench.bestWeight && bench.bestWeight > 0) {
          return { type: 'pr', label: 'TIME PR 🏆' };
        }
        if (rp > bench.bestRepsAtMaxWeight && bench.bestRepsAtMaxWeight > 0) {
          return { type: 'pr', label: 'LEVEL PR 🏆' };
        }
        return null;
      }

      const e1rm = calcE1RM(wt, rp);
      if (wt > bench.bestWeight && bench.bestWeight > 0) {
        return { type: 'pr', label: 'WEIGHT PR 🏆' };
      }
      if (e1rm > bench.bestE1RM && bench.bestE1RM > 0) {
        return { type: 'pr', label: '1RM PR 🏆' };
      }
      if (bench.lastSession) {
        const lastMaxWt = Math.max(...bench.lastSession.sets.map(s => parseFloat(s.weight) || 0));
        const lastMaxRpAtWt = Math.max(0, ...bench.lastSession.sets.filter(s => (parseFloat(s.weight) || 0) === wt).map(s => parseInt(s.reps, 10) || 0));
        if (wt > lastMaxWt || (wt === lastMaxWt && rp > lastMaxRpAtWt && lastMaxRpAtWt > 0)) {
          return { type: 'overload', label: '+OVERLOAD ↑' };
        }
      }
      return null;
    }

    function buildYearMatrixData(squareClass) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const todayStr = toDateStr(today);

      // Start on the Monday of the week 52 weeks ago so all 7 rows align Mon -> Sun
      const start = new Date(today);
      const todayDow = today.getDay();
      const currentMonOffset = todayDow === 0 ? -6 : 1 - todayDow;
      start.setDate(today.getDate() + currentMonOffset - 52 * 7);

      const endSunday = new Date(today);
      endSunday.setDate(today.getDate() + currentMonOffset + 6);

      let squaresHtml = '';
      let monthMarkers = [];
      let cursor = new Date(start);
      let colIndex = 0;
      let lastMonth = -1;

      while (cursor <= endSunday) {
        if (cursor.getDay() === 1) {
          // Determine the dominant month of this week (using Thursday of that week)
          const thursday = new Date(cursor);
          thursday.setDate(cursor.getDate() + 3);
          const m = thursday.getMonth();
          if (m !== lastMonth) {
            // Only add label if it has at least 2 columns of clearance from the previous label
            const prevCol = monthMarkers.length > 0 ? monthMarkers[monthMarkers.length - 1].col : -99;
            if (colIndex - prevCol >= 3) {
              monthMarkers.push({
                col: colIndex,
                label: thursday.toLocaleDateString('en-US', { month: 'short' })
              });
            }
            lastMonth = m;
          }
          colIndex++;
        }

        const dStr = toDateStr(cursor);
        const isFuture = cursor > today;
        const isToday = dStr === todayStr;
        const workout = appState.workouts[dStr];
        const tier = isFuture ? 0 : getWorkoutIntensity(workout);

        squaresHtml += `
          <button
            ${isFuture ? 'disabled' : `onclick="${squareClass === 'grid-sq-fs' ? 'closeFullScreenYearGrid(); ' : ''}handleDayTap('${dStr}')"`}
            title="${dStr}${workout ? ' — ' + escapeHtml(workout.title) : ''}"

          </button>
        `;

        cursor.setDate(cursor.getDate() + 1);
      }

      return { squaresHtml, monthMarkers, colIndex };
    }

    function renderMonthGrid() {
      const target = document.getElementById('calendarMatrixContainer');
      if (!target) return;

      const year = selectedMonthDate.getFullYear();
      const month = selectedMonthDate.getMonth();
      const monthName = selectedMonthDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
      const todayStr = getTodayStr();
      const accentHex = getAccentHex();

      const firstDay = new Date(year, month, 1);
      const startOffset = (firstDay.getDay() + 6) % 7;
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      let cells = '';
      for (let i = 0; i < startOffset; i++) {
        cells += `<div class="h-10 rounded-xl bg-obsidian/40"></div>`;
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const workout = appState.workouts[dStr];
        const tier = getWorkoutIntensity(workout);
        const isToday = dStr === todayStr;

        cells += `
          <button onclick="handleDayTap('${dStr}')" class="h-10 rounded-xl flex flex-col items-center justify-center text-xs font-bold transition active:scale-95 tier-${tier} ${tier >= 3 ? 'text-obsidian' : 'text-white'} ${isToday ? 'ring-1 ring-white' : ''}">
            <span>${day}</span>
            ${workout ? `<span class="w-1 h-1 rounded-full mt-0.5 ${tier >= 3 ? 'bg-obsidian' : ''}" style="${tier >= 3 ? '' : `background-color: ${accentHex};`}"></span>` : ''}
          </button>
        `;
      }

      target.innerHTML = `
        <div class="space-y-2">
          <div class="flex items-center justify-between px-1">
            <button onclick="shiftMonth(-1)" class="p-1.5 rounded-lg bg-obsidian border border-borderDark text-xs text-mutedText hover:text-white">←</button>
            <span class="text-xs font-bold text-white">${monthName}</span>

          </div>
          <div class="grid grid-cols-7 gap-1.5 text-center text-[10px] font-bold text-mutedText">
            <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>

          <div class="grid grid-cols-7 gap-1.5">

      selectedMonthDate = new Date(selectedMonthDate.getFullYear(), selectedMonthDate.getMonth() + delta, 1);

    function renderRecentSessionsList() {
      const dates = Object.keys(appState.workouts).sort().reverse().slice(0, 6);
      const accentHex = getAccentHex();
      if (dates.length === 0) {
        return `<div class="bg-surface border border-borderDark rounded-2xl p-6 text-center text-xs text-mutedText">No workouts logged yet. Tap "+ Log Today's Workout" above to light up your first square!</div>`;
      }

      return dates.map(dStr => {
        const w = appState.workouts[dStr];
        const exList = w.exercises || [];
        let prCount = 0;
        let totalVolume = 0;
        exList.forEach(ex => {
          const cardio = isCardioExercise(ex.exerciseId);
          (ex.sets || []).forEach(s => {
            if (s.isPR) prCount++;
            if (!cardio) {

        return `

    function initDraftForDate(dateStr, templateId = null) {
      activeLoggerDate = dateStr;
      const existing = appState.workouts[dateStr];

      if (existing && !templateId) {
        activeDraft = JSON.parse(JSON.stringify(existing));
        if (!activeDraft.exercises) activeDraft.exercises = [];
        return;
      }

      if (templateId) {
        const tpl = appState.templates.find(t => t.id === templateId);
        if (tpl) {
          activeDraft = {
            title: tpl.name,
            notes: '',
            exercises: tpl.exerciseIds.map(exId => {
              const bench = getExerciseBenchmarks(exId, dateStr);
              const cardio = isCardioExercise(exId);
              const defaultSets = bench.lastSession
                ? bench.lastSession.sets.map(s => ({ weight: s.weight, reps: s.reps, done: false }))
                : (cardio
                    ? [{ weight: '', reps: '', done: false }]
                    : [{ weight: '', reps: '', done: false }, { weight: '', reps: '', done: false }, { weight: '', reps: '', done: false }]);
              return { exerciseId: exId, sets: defaultSets };
            })
          };
          return;
        }
      }

      activeDraft = {
        title: 'Custom Workout',
        notes: '',
        exercises: []
      };
    }

    function openLoggerForDate(dateStr, templateId = null) {
      initDraftForDate(dateStr, templateId);
      switchTab('logger');
    }

    function startWorkoutFromTemplate(templateId) {
      openLoggerForDate(getTodayStr(), templateId);
    }

      const todayStr = getTodayStr();
      if (appState.workouts[todayStr]) {
        handleDayTap(todayStr);

      appState.workouts[todayStr] = {
        title: 'Active Training Day',
        quickCheckIn: true,
        notes: 'Logged via 1-Tap Check-In',
        exercises: []
      };
      saveState();
      renderHeaderAndStrip();
      renderMainView();
      showToast('Day Checked In! Year Grid updated');
    }

    function renderExerciseCard(ex, exIdx) {
      const bench = getExerciseBenchmarks(ex.exerciseId, activeLoggerDate);
      const isCardio = isCardioExercise(ex.exerciseId);
      const metricHeader = isCardio ? getCardioMetricLabel(ex.exerciseId) : 'Reps';
      const weightHeader = isCardio ? 'Minutes' : `Weight (${appState.unit})`;
      const accentHex = getAccentHex();

      let benchmarkBadge = `<span class="text-[10px] text-mutedText">First time logging — sets your baseline!</span>`;
      if (bench.lastSession) {
        const lastStr = isCardio
          ? bench.lastSession.sets.map(s => `${s.weight}m${s.reps ? ` @ ${s.reps}` : ''}`).join(', ')
          : bench.lastSession.sets.map(s => `${s.weight}${appState.unit}×${s.reps}`).join(', ');
        const bestStr = isCardio
          ? `${bench.bestWeight} min`
          : `${bench.bestWeight}${appState.unit} (e1RM ${bench.bestE1RM}${appState.unit})`;
        benchmarkBadge = `
          <div class="flex flex-wrap items-center gap-x-2 gap-y-0.5 text-[10px]">
            <span class="text-mutedText">Last: <strong class="text-white/90">${escapeHtml(lastStr)}</strong></span>
            <span style="color: ${accentHex};">• Best: <strong>${escapeHtml(bestStr)}</strong></span>
          </div>
        `;
      }

      return `
        <div class="bg-surface border border-borderDark rounded-3xl p-4 space-y-3">
          <div class="flex items-start justify-between gap-2">
            <div>
              <h3 class="text-sm font-extrabold text-white">${escapeHtml(getExerciseName(ex.exerciseId))}</h3>
              <div class="mt-0.5">${benchmarkBadge}</div>
            </div>
            <button onclick="removeExerciseFromDraft(${exIdx})" class="text-xs text-mutedText hover:text-coralAccent px-2 py-1 rounded-lg bg-obsidian border border-borderDark">
              ✕
            </button>
          </div>

          <!-- Sets Table Header -->
          <div class="grid grid-cols-12 gap-1.5 text-[10px] font-bold uppercase tracking-wider text-mutedText px-1">
            <div class="col-span-2">${isCardio ? 'Int' : 'Set'}</div>
            <div class="col-span-4">${weightHeader}</div>
            <div class="col-span-3">${metricHeader}</div>
            <div class="col-span-3 text-right">Status</div>
          </div>

          <!-- Set Rows -->
          <div class="space-y-1.5">
            ${ex.sets.map((s, setIdx) => {
              const overload = evaluateSetOverload(ex.exerciseId, s.weight, s.reps, activeLoggerDate);
              return `
                <div class="grid grid-cols-12 gap-1.5 items-center bg-obsidian border ${overload ? 'border-coralAccent/50' : 'border-borderDark'} rounded-xl px-2 py-1.5">
                  <div class="col-span-2 flex items-center gap-1">
                    <span class="text-xs font-extrabold text-mutedText">${setIdx + 1}</span>
                    ${ex.sets.length > 1 ? `<button onclick="removeSetFromExercise(${exIdx}, ${setIdx})" class="text-[10px] text-mutedText hover:text-coralAccent">×</button>` : ''}
                  </div>
                  <div class="col-span-4">
                    <input
                      type="number"
                      step="any"
                      inputmode="decimal"
                      value="${s.weight}"
                      placeholder="${isCardio ? '25' : (bench.lastSession?.sets[setIdx]?.weight || '0')}"
                      oninput="updateDraftSet(${exIdx}, ${setIdx}, 'weight', this.value)"
                      class="w-full bg-surface border border-borderDark rounded-lg px-2 py-1.5 text-xs font-bold text-white text-center focus:outline-none"
                    />
                  </div>
                  <div class="col-span-3">
                    <input
                      type="${isCardio ? 'text' : 'number'}"
                      inputmode="${isCardio ? 'text' : 'numeric'}"
                      value="${s.reps}"
                      placeholder="${isCardio ? 'Lvl 8' : (bench.lastSession?.sets[setIdx]?.reps || '0')}"
                      oninput="updateDraftSet(${exIdx}, ${setIdx}, 'reps', this.value)"
                      class="w-full bg-surface border border-borderDark rounded-lg px-2 py-1.5 text-xs font-bold text-white text-center focus:outline-none"
                    />
                  </div>
                  <div class="col-span-3 flex justify-end">
                    ${overload
                      ? `<span class="text-[9px] font-extrabold px-1.5 py-1 rounded-md ${overload.type === 'pr' ? 'bg-coralAccent/20 text-coralAccent' : ''}" style="${overload.type === 'pr' ? '' : `background-color: var(--accent-soft); color: ${accentHex};`}">${overload.label}</span>`
                      : `<button onclick="toggleSetDone(${exIdx}, ${setIdx})" class="px-2.5 py-1 rounded-lg text-[11px] font-bold transition ${s.done ? 'text-obsidian' : 'bg-surface border border-borderDark text-mutedText'}" style="${s.done ? `background-color: ${accentHex};` : ''}">✓</button>`
                    }
                  </div>
                </div>
              `;
            }).join('')}
          </div>

          <button onclick="addSetToExercise(${exIdx})" class="w-full py-1.5 rounded-xl bg-obsidian hover:bg-surfaceHover border border-borderDark text-[11px] font-semibold text-mutedText hover:text-white transition">
            ${isCardio ? '+ Add Interval' : '+ Add Set'}
          </button>
        </div>
      `;
    }

    function updateDraftSet(exIdx, setIdx, field, val) {
      activeDraft.exercises[exIdx].sets[setIdx][field] = val;
      const ex = activeDraft.exercises[exIdx];
      const setObj = ex.sets[setIdx];
      const overload = evaluateSetOverload(ex.exerciseId, setObj.weight, setObj.reps, activeLoggerDate);
      setObj.isPR = Boolean(overload && overload.type === 'pr');
      if (parseFloat(setObj.weight) > 0 || (isCardioExercise(ex.exerciseId) ? String(setObj.reps).trim().length > 0 : parseInt(setObj.reps, 10) > 0)) {
        setObj.done = true;
      }
      renderLoggerView(document.getElementById('mainContent'));
    }

    function toggleSetDone(exIdx, setIdx) {
      const s = activeDraft.exercises[exIdx].sets[setIdx];
      s.done = !s.done;
      renderLoggerView(document.getElementById('mainContent'));
    }

    function addSetToExercise(exIdx) {
      const sets = activeDraft.exercises[exIdx].sets;
      const prev = sets[sets.length - 1] || { weight: '', reps: '' };
      sets.push({ weight: prev.weight, reps: prev.reps, done: false });
      renderLoggerView(document.getElementById('mainContent'));
    }

    function removeSetFromExercise(exIdx, setIdx) {
      activeDraft.exercises[exIdx].sets.splice(setIdx, 1);
      renderLoggerView(document.getElementById('mainContent'));
    }

    function removeExerciseFromDraft(exIdx) {
      activeDraft.exercises.splice(exIdx, 1);
      renderLoggerView(document.getElementById('mainContent'));
    }

    function saveActiveWorkout() {
      const cleanedExercises = (activeDraft.exercises || [])
        .map(ex => {
          const cardio = isCardioExercise(ex.exerciseId);
          return {
            exerciseId: ex.exerciseId,
            sets: (ex.sets || [])
              .filter(s => (parseFloat(s.weight) || 0) > 0 || (cardio ? String(s.reps || '').trim().length > 0 : (parseInt(s.reps, 10) || 0) > 0))
              .map(s => {
                const overload = evaluateSetOverload(ex.exerciseId, s.weight, s.reps, activeLoggerDate);
                return {
                  weight: parseFloat(s.weight) || 0,

      appState.workouts[activeLoggerDate] = {

      if (cleanedExercises.length > 0) {

    /*************************************************************************

     *************************************************************************/
    function renderOverloadView(container) {
      const loggedExIds = new Set();
      Object.values(appState.workouts).forEach(w => {
        (w.exercises || []).forEach(ex => loggedExIds.add(ex.exerciseId));
      });
      const allExOptions = [...DEFAULT_EXERCISES, ...appState.customExercises];
      const availableExercises = allExOptions.filter(e => loggedExIds.has(e.id));
      const dropdownList = availableExercises.length > 0 ? availableExercises : allExOptions.slice(0, 12);

      if (!dropdownList.some(e => e.id === selectedOverloadExId)) {
        selectedOverloadExId = dropdownList[0].id;
      }

      const history = [];
      Object.keys(appState.workouts).sort().forEach(dStr => {
        const w = appState.workouts[dStr];
        const ex = (w.exercises || []).find(item => item.exerciseId === selectedOverloadExId);
        if (ex && ex.sets && ex.sets.length > 0) {
          let maxWt = 0;
          let maxE1RM = 0;
          let vol = 0;
          ex.sets.forEach(s => {
            const wt = parseFloat(s.weight) || 0;
            const rp = parseInt(s.reps, 10) || 0;
            const e1rm = calcE1RM(wt, rp);
            if (wt > maxWt) maxWt = wt;
            if (e1rm > maxE1RM) maxE1RM = e1rm;
            vol += wt * rp;
          });
          if (maxWt > 0) {
            history.push({ date: dStr, maxWt, maxE1RM, vol, sets: ex.sets });
          }
        }
      });

      const allTimeMaxWt = history.length ? Math.max(...history.map(h => h.maxWt)) : 0;
      const allTimeE1RM = history.length ? Math.max(...history.map(h => h.maxE1RM)) : 0;
      const firstWt = history.length ? history[0].maxWt : 0;
      const latestWt = history.length ? history[history.length - 1].maxWt : 0;
      const deltaWt = Math.round((latestWt - firstWt) * 10) / 10;
      const isCardio = isCardioExercise(selectedOverloadExId);

      const accentHex = getAccentHex();

      container.innerHTML = `

              </div>
              <div class="bg-obsidian border border-borderDark rounded-2xl p-2.5">
                <span class="text-[10px] text-mutedText font-semibold block">${isCardio ? 'Sessions' : 'Peak Est. 1RM'}</span>
                <span class="text-sm font-extrabold mt-0.5 block" style="color: ${accentHex};">${isCardio ? history.length : `${allTimeE1RM} ${unitLabel}`}</span>

              <div class="bg-obsidian border border-borderDark rounded-2xl p-2.5">
                <span class="text-[10px] text-mutedText font-semibold block">Total Logged</span>

              </div>
            </div>

            <div class="bg-obsidian border border-borderDark rounded-2xl p-3">
              ${renderOverloadSVGChart(history, unitLabel)}
            </div>
          </section>

          <section class="space-y-2">
            <h3 class="text-xs font-extrabold uppercase tracking-wider text-mutedText px-1">Progression Log</h3>
            ${history.length === 0 ? `
              <div class="bg-surface border border-borderDark rounded-2xl p-5 text-center text-xs text-mutedText">
                No sessions logged for this exercise yet.
              </div>
            ` : [...history].reverse().map(item => `
              <div class="bg-surface border border-borderDark rounded-2xl p-3.5 flex items-center justify-between">
                <div>
                  <span class="text-[11px] font-bold" style="color: ${accentHex};">${formatDisplayDate(item.date)}</span>
                  <div class="text-xs font-bold text-white mt-0.5">
                    ${item.sets.map(s => isCardio ? `${s.weight}m${s.reps ? ` @ ${s.reps}` : ''}` : `${s.weight}${appState.unit} × ${s.reps}`).join('  •  ')}
                  </div>
                </div>
                <div class="text-right">
                  <span class="text-xs font-extrabold text-white block">${item.maxWt} ${unitLabel}</span>
                  ${isCardio ? '' : `<span class="text-[10px] text-mutedText">e1RM ${item.maxE1RM}</span>`}
                </div>
              </div>
            `).join('')}
          </section>
        </div>
      `;
    }

    function renderOverloadSVGChart(history, unitLabel = appState.unit) {
      const accentHex = getAccentHex();
      if (history.length < 2) {
        return `<div class="h-32 flex items-center justify-center text-xs text-mutedText text-center px-4">Log at least 2 sessions of this exercise to unlock your progressive overload curve.</div>`;
      }

      const width = 320;
      const height = 130;
      const padX = 24;
      const padY = 20;

      const values = history.map(h => h.maxWt);
      const minVal = Math.min(...values) * 0.92;
      const maxVal = Math.max(...values) * 1.05 || 10;
      const range = maxVal - minVal || 1;

      const points = history.map((h, idx) => {
        const x = padX + (idx / (history.length - 1)) * (width - padX * 2);
        const y = height - padY - ((h.maxWt - minVal) / range) * (height - padY * 2);
        return { x, y, val: h.maxWt, date: h.date };
      });

      const polylineStr = points.map(p => `${p.x},${p.y}`).join(' ');
      const areaStr = `${points[0].x},${height - padY} ${polylineStr} ${points[points.length - 1].x},${height - padY}`;

      return `
        <svg viewBox="0 0 ${width} ${height}" class="w-full h-36 overflow-visible">
          <defs>
            <linearGradient id="overloadGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="${accentHex}" stop-opacity="0.32" />
              <stop offset="100%" stop-color="${accentHex}" stop-opacity="0.0" />
            </linearGradient>
          </defs>
          <polygon points="${areaStr}" fill="url(#overloadGrad)" />
          <polyline fill="none" stroke="${accentHex}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="${polylineStr}" />
          ${points.map(p => `
            <circle cx="${p.x}" cy="${p.y}" r="4" fill="#0A0A0C" stroke="${accentHex}" stroke-width="2.5" />
            <text x="${p.x}" y="${p.y - 8}" text-anchor="middle" fill="#F5F5F7" font-size="9" font-weight="700">${p.val}${unitLabel}</text>
          `).join('')}
        </svg>
      `;
    }

      const accentHex = getAccentHex();

      listEl.innerHTML = filtered.length === 0
        ? `<div class="text-center py-6 text-xs text-mutedText">No matching exercises. Create it below!</div>`
        : filtered.map(ex => `
            <button onclick="addExerciseToDraft('${ex.id}')" class="w-full bg-obsidian hover:bg-surfaceHover border border-borderDark rounded-2xl px-3.5 py-2.5 flex items-center justify-between text-left transition">
              <div>
                <div class="text-xs font-bold text-white">${escapeHtml(ex.name)}</div>
                <div class="text-[10px] text-mutedText">${escapeHtml(ex.muscle)}${isCardioExercise(ex.id) ? ' • Minutes & Machine' : ''}</div>
              </div>
              <span class="text-xs font-bold" style="color: ${accentHex};">+ Add</span>
            </button>
          `).join('');
    }

    function addExerciseToDraft(exerciseId) {
      const bench = getExerciseBenchmarks(exerciseId, activeLoggerDate);
      const cardio = isCardioExercise(exerciseId);
      const defaultSets = bench.lastSession
        ? bench.lastSession.sets.map(s => ({ weight: s.weight, reps: s.reps, done: false }))
        : (cardio
            ? [{ weight: '', reps: '', done: false }]
            : [{ weight: '', reps: '', done: false }, { weight: '', reps: '', done: false }, { weight: '', reps: '', done: false }]);

      activeDraft.exercises.push({ exerciseId, sets: defaultSets });
      closeModal();
      renderLoggerView(document.getElementById('mainContent'));
    }

    function createAndSelectCustomExercise() {
      const input = document.getElementById('customExInput');
      const name = (input?.value || '').trim();
      if (!name) return;
      const id = 'custom-' + Date.now();
      const cardio = CARDIO_KEYWORDS.some(kw => name.toLowerCase().includes(kw));
      appState.customExercises.push({
        id,
        name,
        muscle: cardio ? 'Core & Cardio' : 'Custom',
        isCardio: cardio
      });
      saveState();
      addExerciseToDraft(id);
      showToast(`Added "${name}"`);
    }

    function openTemplateQuickLoadModal() {
      const accentHex = getAccentHex();
      openModal(`
        <div class="space-y-3">
          <div class="flex items-center justify-between">
            <h3 class="text-base font-extrabold text-white">Load Saved Routine</h3>
            <button onclick="closeModal()" class="p-1.5 rounded-xl bg-obsidian text-mutedText hover:text-white">✕</button>
          </div>
          <div class="space-y-2">
            ${appState.templates.map(tpl => `
              <button onclick="closeModal(); openLoggerForDate('${activeLoggerDate}', '${tpl.id}');" class="w-full bg-obsidian hover:bg-surfaceHover border border-borderDark rounded-2xl p-3.5 text-left">
                <div class="text-xs font-bold text-white">${escapeHtml(tpl.name)}</div>
                <div class="text-[11px] text-mutedText mt-0.5">${tpl.exerciseIds.map(id => escapeHtml(getExerciseName(id))).join(' • ')}</div>
              </button>
            `).join('')}
          </div>
          <button onclick="closeModal(); openCreateRoutineModal();" class="w-full py-2.5 rounded-2xl text-xs font-bold text-obsidian" style="background-color: ${accentHex};">
            ＋ Create New Routine
          </button>
        </div>
      `);
    }

    // New Workout Routine Modal
    let routineCreatorSelectedIds = [];
    let routineCreatorMuscleFilter = 'All';

    function openCreateRoutineModal() {
      routineCreatorSelectedIds = [];
      routineCreatorMuscleFilter = 'All';
      const accentHex = getAccentHex();
      const muscles = ['All', 'Glutes / Lower', 'Back', 'Chest', 'Shoulders', 'Arms', 'Core & Cardio', 'Full Body'];

      openModal(`
        <div class="space-y-3">
          <div class="flex items-center justify-between">
            <h3 class="text-base font-extrabold text-white">New Workout Routine</h3>
            <button onclick="closeModal()" class="p-1.5 rounded-xl bg-obsidian text-mutedText hover:text-white">✕</button>
          </div>

          <input id="newTplName" type="text" placeholder="Routine Name (e.g., Push Day / Glute Focus)" class="w-full bg-obsidian border border-borderDark rounded-xl px-3.5 py-2.5 text-xs font-bold text-white focus:outline-none" />

          <div class="flex gap-2">
            <input id="newTplTag" type="text" placeholder="Tag (e.g., UPPER)" class="w-1/3 bg-obsidian border border-borderDark rounded-xl px-3 py-2 text-xs text-white focus:outline-none" />
            <input id="routineExSearch" type="text" oninput="filterRoutineCreatorList()" placeholder="Search 160+ exercises..." class="flex-1 bg-obsidian border border-borderDark rounded-xl px-3 py-2 text-xs text-white focus:outline-none" />
          </div>

          <div id="routineMusclePills" class="flex gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
            ${muscles.map(m => {
              const active = routineCreatorMuscleFilter === m;
              return `
                <button onclick="setRoutineMuscleFilter('${m}')" class="px-2.5 py-1 rounded-xl text-[10px] font-bold whitespace-nowrap border transition ${active ? 'text-obsidian border-transparent' : 'bg-obsidian border-borderDark text-mutedText'}" style="${active ? `background-color: ${accentHex};` : ''}">
                  ${m}
                </button>
              `;
            }).join('')}
          </div>

          <div id="routineCreatorExList" class="max-h-52 overflow-y-auto space-y-1.5 pr-1"></div>

          <div class="flex gap-2 pt-1 border-t border-borderDark">
            <input id="routineCustomExInput" type="text" placeholder="Or add custom lift / machine..." class="flex-1 bg-obsidian border border-borderDark rounded-xl px-3 py-2 text-xs text-white focus:outline-none" />
            <button onclick="addCustomExerciseInRoutineModal()" class="px-3 py-2 rounded-xl bg-obsidian border border-borderDark text-xs font-bold text-white hover:border-white/30">
              + Add
            </button>
          </div>

          <button onclick="saveNewTemplate()" id="saveRoutineBtn" class="w-full py-3 rounded-2xl text-xs font-extrabold text-obsidian" style="background-color: ${accentHex};">
            Save Routine (0 exercises)
          </button>
        </div>
      `);

      filterRoutineCreatorList();
    }

    function setRoutineMuscleFilter(muscle) {
      routineCreatorMuscleFilter = muscle;
      const accentHex = getAccentHex();
      const muscles = ['All', 'Glutes / Lower', 'Back', 'Chest', 'Shoulders', 'Arms', 'Core & Cardio', 'Full Body'];
      const pillsEl = document.getElementById('routineMusclePills');
      if (pillsEl) {
        pillsEl.innerHTML = muscles.map(m => {
          const active = routineCreatorMuscleFilter === m;
          return `
            <button onclick="setRoutineMuscleFilter('${m}')" class="px-2.5 py-1 rounded-xl text-[10px] font-bold whitespace-nowrap border transition ${active ? 'text-obsidian border-transparent' : 'bg-obsidian border-borderDark text-mutedText'}" style="${active ? `background-color: ${accentHex};` : ''}">
              ${m}
            </button>
          `;
        }).join('');
      }
      filterRoutineCreatorList();
    }

    function filterRoutineCreatorList() {
      const listEl = document.getElementById('routineCreatorExList');
      if (!listEl) return;
      const search = (document.getElementById('routineExSearch')?.value || '').toLowerCase().trim();
      const allEx = [...DEFAULT_EXERCISES, ...appState.customExercises];
      const filtered = allEx.filter(ex => {
        const matchesSearch = !search || ex.name.toLowerCase().includes(search) || ex.muscle.toLowerCase().includes(search);
        const matchesMuscle = routineCreatorMuscleFilter === 'All' || ex.muscle === routineCreatorMuscleFilter;
        return matchesSearch && matchesMuscle;
      });
      const accentHex = getAccentHex();

      listEl.innerHTML = filtered.length === 0
        ? `<div class="text-center py-5 text-xs text-mutedText">No exercises found. Add it as a custom lift below!</div>`
        : filtered.map(ex => {
            const checked = routineCreatorSelectedIds.includes(ex.id);
            return `
              <button onclick="toggleRoutineExSelection('${ex.id}')" class="w-full flex items-center justify-between bg-obsidian border ${checked ? 'border-white/40' : 'border-borderDark'} rounded-xl px-3 py-2 text-left transition">
                <div class="min-w-0 pr-2">
                  <div class="text-xs font-semibold text-white truncate">${escapeHtml(ex.name)}</div>
                  <div class="text-[10px] text-mutedText">${escapeHtml(ex.muscle)}${isCardioExercise(ex.id) ? ' • Minutes' : ''}</div>
                </div>
                <span class="w-5 h-5 rounded-md flex items-center justify-center text-[11px] font-extrabold shrink-0 ${checked ? 'text-obsidian' : 'bg-surface border border-borderDark text-transparent'}" style="${checked ? `background-color: ${accentHex};` : ''}">
                  ✓
                </span>
              </button>
            `;
          }).join('');
    }

    function toggleRoutineExSelection(exId) {
      const idx = routineCreatorSelectedIds.indexOf(exId);
      if (idx === -1) routineCreatorSelectedIds.push(exId);
      else routineCreatorSelectedIds.splice(idx, 1);

      const saveBtn = document.getElementById('saveRoutineBtn');
      if (saveBtn) {
        saveBtn.textContent = `Save Routine (${routineCreatorSelectedIds.length} exercise${routineCreatorSelectedIds.length === 1 ? '' : 's'})`;
      }
      filterRoutineCreatorList();
    }

    function addCustomExerciseInRoutineModal() {
      const input = document.getElementById('routineCustomExInput');
      const name = (input?.value || '').trim();
      if (!name) return;
      const id = 'custom-' + Date.now();
      const cardio = CARDIO_KEYWORDS.some(kw => name.toLowerCase().includes(kw));
      appState.customExercises.push({
        id,
        name,
        muscle: cardio ? 'Core & Cardio' : 'Custom',
        isCardio: cardio
      });
      routineCreatorSelectedIds.push(id);
      input.value = '';
      saveState();

      const saveBtn = document.getElementById('saveRoutineBtn');
      if (saveBtn) {
        saveBtn.textContent = `Save Routine (${routineCreatorSelectedIds.length} exercise${routineCreatorSelectedIds.length === 1 ? '' : 's'})`;
      }
      filterRoutineCreatorList();
      showToast(`Added "${name}"`);
    }

    function saveNewTemplate() {
      const name = (document.getElementById('newTplName')?.value || '').trim();
      const tag = (document.getElementById('newTplTag')?.value || '').trim().toUpperCase() || 'CUSTOM';
      if (!name || routineCreatorSelectedIds.length === 0) {
        showToast('Enter a name and select at least 1 exercise');
        return;
      }

      appState.templates.push({
        id: 'tpl-' + Date.now(),
        name,
        tag,
        exerciseIds: [...routineCreatorSelectedIds]
      });
      saveState();
      closeModal();
      renderMainView();
      showToast('Routine saved!');
    }

    // Theme Picker Modal
    function openThemePickerModal() {
      const accentHex = getAccentHex();
      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <h3 class="text-base font-extrabold text-white">App Color Theme</h3>
              <p class="text-xs text-mutedText">Choose your Year Grid &amp; accent color</p>
            </div>
            <button onclick="closeModal()" class="p-2 rounded-xl bg-obsidian text-mutedText hover:text-white">✕</button>
          </div>
          <div class="space-y-2">
            ${Object.values(ACCENT_THEMES).map(t => {
              const active = appState.accent === t.id;
              return `
                <button onclick="setAccent('${t.id}'); closeModal();" class="w-full flex items-center justify-between bg-obsidian border ${active ? 'border-white' : 'border-borderDark'} rounded-2xl p-3.5 transition">
                  <div class="flex items-center gap-3">
                    <span class="w-6 h-6 rounded-full" style="background-color: ${t.hex};"></span>
                    <span class="text-xs font-bold text-white">${t.name}</span>
                  </div>
                  <div class="flex items-center gap-1">
                    ${t.tiers.map(c => `<span class="w-3 h-3 rounded-[3px]" style="background-color:${c};"></span>`).join('')}
                  </div>
                </button>
              `;
            }).join('')}
          </div>
          <button onclick="closeModal()" class="w-full py-3 rounded-2xl text-xs font-extrabold text-obsidian" style="background-color: ${accentHex};">
            Done
          </button>
        </div>
      `);
    }

    // Account Sign In / Sign Up Modal
    function openAccountModal(defaultMode = 'signin') {
      const accentHex = getAccentHex();

      if (accountSession.username) {
        const stats = calculateStats();
        openModal(`
          <div class="space-y-4">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-2xl bg-obsidian border border-borderDark flex items-center justify-center text-base font-extrabold" style="color: ${accentHex};">
                  ${escapeHtml(accountSession.username.slice(0, 2).toUpperCase())}
                </div>
                <div>
                  <h3 class="text-base font-extrabold text-white">@${escapeHtml(accountSession.username)}</h3>
                  <p class="text-[11px] font-semibold flex items-center gap-1.5" style="color: ${cloudStatus === 'synced' ? accentHex : '#F59E0B'};">
                    <span class="w-2 h-2 rounded-full inline-block" style="background-color: ${cloudStatus === 'synced' ? accentHex : '#F59E0B'};"></span>
                    ${cloudStatus === 'synced' ? 'Cloud Sync Active' : 'Local Profile Active'}
                  </p>
                </div>
              </div>
              <button onclick="closeModal()" class="p-2 rounded-xl bg-obsidian text-mutedText hover:text-white">✕</button>
            </div>

            <div class="bg-obsidian border border-borderDark rounded-2xl p-3.5 grid grid-cols-3 gap-2 text-center">
              <div>
                <span class="text-[10px] text-mutedText uppercase font-semibold block">Workouts</span>
                <span class="text-sm font-extrabold text-white">${stats.totalDays}</span>
              </div>
              <div>
                <span class="text-[10px] text-mutedText uppercase font-semibold block">Routines</span>
                <span class="text-sm font-extrabold text-white">${appState.templates.length}</span>
              </div>
              <div>
                <span class="text-[10px] text-mutedText uppercase font-semibold block">Streak</span>
                <span class="text-sm font-extrabold" style="color: ${accentHex};">${stats.weekStreak}w</span>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2.5 pt-1">
              <button onclick="signOutAccount()" class="py-3 rounded-2xl bg-coralAccent/15 border border-coralAccent/30 text-coralAccent text-xs font-extrabold">
                Sign Out
              </button>
              <button onclick="forceManualCloudSync()" class="py-3 rounded-2xl text-xs font-extrabold text-obsidian" style="background-color: ${accentHex};">
                Sync Now
              </button>
            </div>
          </div>
        `);
        return;
      }

      const isSignup = defaultMode === 'signup';
      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <h3 class="text-base font-extrabold text-white">${isSignup ? 'Create Account' : 'Sign In to CADENCE'}</h3>
              <p class="text-xs text-mutedText">Save &amp; sync your workouts across devices</p>
            </div>
            <button onclick="closeModal()" class="p-2 rounded-xl bg-obsidian text-mutedText hover:text-white">✕</button>
          </div>

          <div class="grid grid-cols-2 gap-1.5 bg-obsidian border border-borderDark p-1 rounded-2xl">
            <button onclick="openAccountModal('signin')" class="py-2 rounded-xl text-xs font-extrabold transition ${!isSignup ? 'text-obsidian' : 'text-mutedText hover:text-white'}" style="${!isSignup ? `background-color: ${accentHex};` : ''}">
              Sign In
            </button>
            <button onclick="openAccountModal('signup')" class="py-2 rounded-xl text-xs font-extrabold transition ${isSignup ? 'text-obsidian' : 'text-mutedText hover:text-white'}" style="${isSignup ? `background-color: ${accentHex};` : ''}">
              Create Account
            </button>
          </div>

          <form onsubmit="event.preventDefault(); handleAccountAuthSubmit('${isSignup ? 'signup' : 'signin'}');" class="space-y-3">
            <div>
              <label class="text-[11px] font-bold text-mutedText uppercase tracking-wider block mb-1">Username</label>
              <input id="authUsernameInput" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="e.g. alexlifts" class="w-full bg-obsidian border border-borderDark rounded-2xl px-3.5 py-3 text-sm text-white focus:outline-none" />
            </div>
            <div>
              <label class="text-[11px] font-bold text-mutedText uppercase tracking-wider block mb-1">Password</label>
              <input id="authPasswordInput" type="password" autocomplete="${isSignup ? 'new-password' : 'current-password'}" placeholder="••••••••" class="w-full bg-obsidian border border-borderDark rounded-2xl px-3.5 py-3 text-sm text-white focus:outline-none" />
            </div>

            <button id="authSubmitBtn" type="submit" class="w-full py-3.5 rounded-2xl text-xs font-extrabold text-obsidian transition active:scale-[0.98]" style="background-color: ${accentHex};">
              ${isSignup ? 'Create Account & Sync' : 'Sign In & Restore'}
            </button>
          </form>
        </div>
      `);
    }

    // Add to Home Screen Guide Modal
    function openInstallShortcutModal() {
      const accentHex = getAccentHex();
      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-base font-extrabold text-white">Add CADENCE to Home Screen</h3>
            <button onclick="closeModal()" class="p-1.5 rounded-xl bg-obsidian text-mutedText hover:text-white">✕</button>
          </div>

          <div class="space-y-3 text-xs text-mutedText leading-relaxed">
            <div class="bg-obsidian border border-borderDark rounded-2xl p-3.5 space-y-1">
              <div class="font-bold text-white">🍎 iPhone (Safari)</div>
              <p>1. Open your GitHub Pages URL in <strong class="text-white">Safari</strong>.</p>
              <p>2. Tap the <strong class="text-white">Share button</strong> at the bottom of Safari.</p>
              <p>3. Scroll down and tap <strong style="color: ${accentHex};">Add to Home Screen</strong>.</p>
            </div>

            <div class="bg-obsidian border border-borderDark rounded-2xl p-3.5 space-y-1">
              <div class="font-bold text-white">🤖 Android (Chrome)</div>
              <p>1. Open your GitHub Pages URL in <strong class="text-white">Chrome</strong>.</p>
              <p>2. Tap the <strong class="text-white">⋮ menu</strong> in the top-right corner.</p>
              <p>3. Tap <strong style="color: ${accentHex};">Add to Home screen</strong> or <strong style="color: ${accentHex};">Install App</strong>.</p>
            </div>
          </div>

          <button onclick="closeModal()" class="w-full py-3 rounded-2xl text-xs font-extrabold text-obsidian" style="background-color: ${accentHex};">
            Got It
          </button>
        </div>
      `);
    }

    /*************************************************************************
     * 13. UTILITIES & INITIALIZATION
     *************************************************************************/
    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    let toastTimer = null;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const inner = document.getElementById('toastInner');
      const accentHex = getAccentHex();
      inner.style.borderColor = 'var(--accent-border)';
      inner.style.color = accentHex;
      inner.innerHTML = `<span>●</span><span>${escapeHtml(msg)}</span>`;
      toast.classList.remove('opacity-0');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('opacity-0');
      }, 2400);
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (window.location.hash === '#login') {
        setTimeout(() => openAccountModal('signin'), 250);
      } else if (window.location.hash === '#signup') {
        setTimeout(() => openAccountModal('signup'), 250);
      }
    });

    (async function bootCadenceApp() {
      applyAccentTheme(appState.accent);
      renderHeaderAndStrip();
      updateNavHighlight();
      renderMainView();

      await hydrateStateFromVault();
      renderHeaderAndStrip();
      updateNavHighlight();
      renderMainView();
    })();
  </script>
</body>
</html>
